  id-31be9bc0b80e4be4b2df2d8e0000dc6f:
    type: ValueStream
    name: Verdistrømmer og prosesser
    documentation: "Verdistrøm representerer en sekvens av aktiviteter som skaper\
      \ et samlet resultat for en kunde, interessent eller sluttbruker.\n\nNasjonal\
      \ arkitektur skal være kunnskaps- og datadrevet, og skal inneholde informasjon\
      \ som skal kunne gjenbrukes i ulike verdistrømmer. Den skal inneholde viktige\
      \ kapabiliteter og rammer for samhandling i felles økosystem, og den skal inneholde\
      \ oversikt over hvilke løsninger og ressurser som kan benyttes for å dekke behov.\
      \  \n\nDet kan være ulike verdistrømmer for ulike brukergrupper og for ulike\
      \ behov.\n* Operasjonelle verdistrømmer, der Nasjonal arkitektur inngår som\
      \ en verktøykasse for daglige oppgaver. F.eks. tjenesteutvikling og produktutvikling.\n\
      Målgruppe: Utførere, planleggere\n* Strategiske verdistrømmer, der Nasjonal\
      \ arkitektur bidrar til at man tar valg for fremtiden\nMålgruppe: Beslutningstagere,\
      \ planleggere"
    properties: {}
    folder_path: *id001
  id-a601bb3d7b11478185903149965f7842:
    type: Capability
    name: Anvendelse av veiledning
    documentation: 'Evne til å tolke og benytte veiledere i prosjekter og tiltak.


      ### Begrunnelse (Hvorfor)

      Kapabiliteten sikrer at veiledningsmateriell faktisk blir brukt til å forstå
      og anvende felles anbefalinger, prinsipper, standarder og beste praksis i egne
      prosjekter og tiltak. Den løser behovet for å omsette veiledning fra generell
      kunnskap til praktiske valg i tjenesteutvikling, arkitekturarbeid og digital
      samhandling.


      ### Hva det innebærer (Omfang)

      - **Juridisk (Middels vekt):** Bruke veiledning til å forstå hvordan relevant
      regelverk, føringer og krav bør anvendes i konkrete prosjekter og tiltak.

      - **Organisatorisk (Høy vekt):** Innarbeide bruk av veiledere i prosjektmetodikk,
      beslutningsprosesser, kvalitetssikring og gevinstarbeid, slik at anbefalingene
      faktisk påvirker gjennomføring.

      - **Semantisk (Middels vekt):** Tolke begreper, prinsipper, modeller og beskrivelser
      i veiledningsmateriellet likt, slik at prosjekter legger samme forståelse til
      grunn.

      - **Teknisk (Middels vekt):** Bruke tekniske veiledere, referansearkitekturer,
      standarder og samhandlingsmønstre som grunnlag for løsningsvalg, integrasjoner
      og teknisk utforming.


      ### Bidrag til sammenhengende tjenester og felles økosystem

      Anvendelse av veiledning bidrar til at prosjekter og tiltak bygger på samme
      kunnskapsgrunnlag og følger felles anbefalinger. Når veiledningsmateriell brukes
      aktivt i egne prosjekter, reduseres lokale avvik, ulik praksis og risikoen for
      løsninger som ikke passer inn i felles økosystem.


      Kapabiliteten styrker sammenhengende tjenester ved å gjøre det enklere for virksomheter
      å utvikle løsninger som følger felles prinsipper, standarder og samhandlingsmønstre.
      For sluttbrukeren gir dette mer konsistente og helhetlige digitale tjenester
      på tvers av virksomheter.


      '
    properties: {}
    folder_path: &id002
    - Strategy
    - Kapabiliteter i NA
  id-dabf94e621f644ffa53ebb44dcc9ff79:
    type: Capability
    name: Arkitekturstyring
    documentation: "Evne til å etablere, forvalte og styre en helhetlig nasjonal digital\
      \ arkitektur som et felles, forpliktende rammeverk, for å sikre samhandling,\
      \ gjenbruk og strategisk retning i et nasjonalt digitalt økosystem.\n\n### Begrunnelse\
      \ (Hvorfor)\nUten felles arkitekturstyring risikerer offentlige virksomheter\
      \ å utvikle løsninger, informasjonsmodeller, grensesnitt og tekniske komponenter\
      \ som er optimalisert lokalt, men som ikke fungerer godt sammen nasjonalt. Dette\
      \ gir fragmenterte brukeropplevelser, svakere datadeling, økt teknisk gjeld,\
      \ høyere integrasjonskostnader og redusert evne til å realisere sammenhengende\
      \ tjenester.\nKapabiliteten skal sikre at sentrale aktører bygger på felles\
      \ arkitekturprinsipper, referansearkitekturer, standarder, begreper og byggeklosser.\
      \ Den gir grunnlag for å se nasjonale digitale ressurser i sammenheng, vurdere\
      \ om de dekker nåværende og fremtidige behov, og prioritere forbedringer som\
      \ styrker det samlede digitale økosystemet.\nDet er også behov for å opprettholde\
      \ en helhetlig og kontinuerlig oversikt over de sentrale byggeklossene/løsningene,\
      \ arkitekturproduktene og ressursene i det nasjonale digitale økosystemet.\n\
      Den gir offentlig sektor et felles språk, felles rammer og felles beslutningsgrunnlag.\
      \ Det gjør det enklere å avdekke avhengigheter, prioritere felles investeringer,\
      \ unngå dobbeltutvikling og sikre at nye løsninger passer inn i det nasjonale\
      \ digitale økosystemet.\n\n### Hva det innebærer (Omfang)\n- **Juridisk (Middels\
      \ vekt):** Oppfølging av arkitekturkrav i Digitaliseringsrundskrivet. Forankring\
      \ av felles arkitekturretningslinjer i tildelingsbrev og samarbeidsavtaler.\
      \ Håndtering av regulatoriske pålegg knyttet til åpne standarder.\n- **Organisatorisk\
      \ (Svært høy vekt):** Etablering av nasjonale og tverrgående arkitekturråd.\
      \ Definering av roller og ansvar for arkitekturstyring i store samhandlingstiltak.\
      \ Å kunne evaluere nåværende modenhetsnivåer for kapabiliteter og bidra til\
      \ prioritering av forbedringer.\n- **Semantisk (Høy vekt):** Forvaltning av\
      \ felles metamodeller og standardiserte arkitekturbegreper. Sikring av at kapabilitetsmodeller,\
      \ tjenestekataloger og referansemodeller tolkes likt av alle virksomheter.\n\
      - **Teknisk (Høy vekt):** Praktisk bruk av felles repositorier og modelleringsverktøy\
      \ (f.eks. ArchiMate). Teknisk oppfølging og etterlevelse av nasjonale referansearkitekturer\
      \ for API-er, feilhåndtering og meldingsutveksling.\n\n### Bidrag til sammenhengende\
      \ tjenester og felles økosystem\nKapabiliteten sikrer at de digitale byggeklossene\
      \ fra ulike virksomheter faktisk passer sammen. Dette gjør det vesentlig enklere\
      \ å koble sammen uavhengige tjenester. \nNasjonal arkitekturstyring bidrar til\
      \ sammenhengende tjenester ved å sikre at virksomheter utvikler løsninger innenfor\
      \ felles prinsipper, standarder, begreper, referansearkitekturer og byggeklosser.\
      \ Kapabiliteten reduserer fragmentering, styrker gjenbruk og gjør det mulig\
      \ å styre det nasjonale digitale økosystemet som en helhet."
    properties: {}
    folder_path: *id002
  id-ec0afaac123d4f9e83889d9022a198c3:
    type: Capability
    name: Autentisering
    documentation: 'Evne til å på en sikker og entydig måte verifisere den digitale
      identiteten til brukere og systemer.


      ### Begrunnelse (Hvorfor)

      Kapabiliteten sikrer at digitale tjenester kan vite hvem eller hvilket system
      som forsøker å få tilgang. Den løser behovet for trygg innlogging, entydig verifisering
      av digital identitet og riktig sikkerhetsnivå i tjenester som inngår i felles
      økosystem.


      Autentisering skal samtidig være tilgjengelig og brukervennlig. Det innebærer
      å tilby sikre, tilgjengelige og moderne innloggingsmekanismer, for eksempel
      biometri, passordfrie løsninger, app og web, på ulike sikkerhetsnivåer.


      ### Hva det innebærer (Omfang)

      - **Juridisk (Høy vekt):** Sikre at autentisering skjer i tråd med krav til
      eID, personvern, sikkerhet, sporbarhet og regelverk for digitale tillitstjenester.

      - **Organisatorisk (Høy vekt):** Etablere rutiner for å risikovurdere og tilpasse
      eID-nivået i samarbeid med tjenesteeiere, slik at terskelen for bruk ikke blir
      unødvendig høy.

      - **Semantisk (Middels vekt):** Sikre felles forståelse av begreper som digital
      identitet, autentiseringsnivå, eID-nivå, bruker, system, innloggingsmekanisme
      og tillitsnivå.

      - **Teknisk (Svært høy vekt):** Tilby sikre, tilgjengelige og moderne innloggingsmekanismer
      på ulike sikkerhetsnivåer, med støtte for biometri, passordfrie løsninger, app
      og web, samt tekniske mekanismer for token, sesjonshåndtering, logging og integrasjon
      mot felles autentiseringstjenester.


      ### Bidrag til sammenhengende tjenester og felles økosystem

      Autentisering gjør det mulig å etablere tillit til hvem som bruker en digital
      tjeneste, enten det er en person, virksomhet eller et system. Når autentisering
      skjer på en sikker og standardisert måte, kan tjenester på tvers av virksomheter
      bygge på samme tillitsgrunnlag.


      Kapabiliteten styrker sammenhengende tjenester ved at brukeren kan bevege seg
      tryggere mellom tjenester uten unødvendige innloggingsbarrierer. For det felles
      økosystemet gir autentisering et nødvendig grunnlag for tilgangsstyring, tilgangskontroll,
      representasjon, sporbarhet og sikker datadeling.'
    properties: {}
    folder_path: *id002
  id-84629318a3b84213ac3a83bdb6a1aad9:
    type: Capability
    name: Bruke data fra andre
    documentation: 'Evne til å gjenbruke data fra andre i egne tjenester og prosesser.


      ### Begrunnelse (Hvorfor)

      Kapabiliteten gjør at virksomheter ikke skal behøve å samle inn den samme informasjonen
      på nytt. Den løser problemet med dobbeltinnsamling, manuelle avklaringer og
      fragmenterte tjenesteløp ved å gjøre data fra andre aktører tilgjengelige for
      lovlig, sikker og effektiv gjenbruk i egne tjenester og prosesser.


      ### Hva det innebærer (Omfang)

      - **Juridisk (Middels vekt):** Avklare behandlingsgrunnlag, formål, tilgangsrettigheter
      og eventuelle krav til taushetsplikt, personvern og viderebruk før data fra
      andre tas i bruk.

      - **Organisatorisk (Svært høy vekt):** Etablere rutiner for å identifisere databehov,
      inngå nødvendige avtaler med datatilbydere og innarbeide gjenbrukte data i egne
      arbeidsprosesser.

      - **Semantisk (Middels vekt):** Sikre at begreper, metadata, informasjonsmodeller
      og datakvalitet forstås likt, slik at data fra andre tolkes riktig i egen kontekst.

      - **Teknisk (Høy vekt):** Bruke grensesnitt basert på API, f.eks. REST, GraphQL
      eller andre klare, standardiserte og gjenbrukbare grensesnitt, med nødvendig
      autentisering, autorisering, logging og feilhåndtering.


      ### Bidrag til sammenhengende tjenester og felles økosystem

      Kapabiliteten gjør at data kan følge brukerens behov på tvers av virksomheter,
      i stedet for at brukeren selv må oppgi samme informasjon flere ganger. Når virksomheter
      kan bruke data fra andre på en kontrollert og standardisert måte, blir tjenestene
      mer sammenhengende, raskere og mer treffsikre. Dette styrker det felles økosystemet
      ved å øke gjenbruk av data, redusere dobbeltarbeid og gjøre det enklere å bygge
      tjenester på tvers av organisatoriske grenser.'
    properties: {}
    folder_path: *id002
  id-98df6c2b4df340c7a3a3ad32d99ca37e:
    type: Capability
    name: Datadrevet
    documentation: 'Evne til å systematisk bruke data som en strategisk ressurs for
      å skape innsikt, informere beslutninger og utvikle bedre, mer treffsikre og
      effektive tjenester.


      ### Begrunnelse (Hvorfor)

      Kapabiliteten skal sikre at forvaltningen systematisk bruker data som en strategisk
      ressurs i prosesser, beslutningstaking og tjenesteutvikling for å levere bedre
      og mer effektive tjenester til innbyggere og næringsliv. Den forutsetter åpenhet,
      deling av data og evne til å hente ut verdi fra data gjennom blant annet analyse,
      automatisering og bruk av kunstig intelligens.


      ### Hva det innebærer (Omfang)

      - **Juridisk (Høy vekt):** Etisk og ansvarlig datautnyttelse krever at all bruk
      av data skjer på en sikker, lovlig og etisk forsvarlig måte som ivaretar personvern
      og rettssikkerhet.

      - **Organisatorisk (Høy vekt):** Virksomhetene må etablere styring, kompetanse,
      prosesser og ansvar som gjør data til en aktiv del av beslutninger, tjenesteutvikling
      og forbedringsarbeid.

      - **Semantisk (Høy vekt):** Felles begreper, metadata, informasjonsmodeller
      og datakvalitet må sikre at data kan forstås og brukes riktig på tvers av virksomheter.

      - **Teknisk (Høy vekt):** Analyseplattformer, automatisering, KI-verktøy, datadeling
      og sikker teknisk infrastruktur må gjøre det mulig å hente ut verdi fra data
      i praksis.


      ### Bidrag til sammenhengende tjenester og felles økosystem

      Kapabiliteten gjør det mulig å bruke data til å forstå behov, forutse hendelser
      og utvikle mer treffsikre tjenester på tvers av virksomheter. Når data brukes
      systematisk og ansvarlig, kan offentlig sektor gå fra reaktiv saksbehandling
      til mer proaktive, personaliserte og effektive tjenesteløp. Dette styrker det
      felles økosystemet ved å gjøre data til et felles grunnlag for innsikt, prioritering,
      automatisering og kontinuerlig forbedring.'
    properties: {}
    folder_path: *id002
  id-d7aa97e6319a492d8a1345bcaa8e154a:
    type: Capability
    name: Datakilder
    documentation: 'Evne til å tilgjengeliggjøre og forvalte data som en nasjonal
      fellesressurs, slik at de kan oppdages, forstås og gjenbrukes på en sikker og
      standardisert måte.


      ### Begrunnelse (Hvorfor)

      Kapabiliteten sikrer at data kan behandles som en nasjonal fellesressurs, ikke
      bare som lokale informasjonsbeholdninger i enkeltvirksomheter. Den gjør det
      mulig å oppdage, forstå og gjenbruke data på en sikker og standardisert måte
      på tvers av virksomheter, sektorer og forvaltningsnivåer.


      Kapabiliteten omfatter også å organisere og styre data innenfor definerte tematiske
      domener. Dette sikrer helhetlig forvaltning og strategisk utvikling av dataressurser
      innenfor kritiske samfunnsområder.


      ### Hva det innebærer (Omfang)

      - **Juridisk (Høy vekt):** Overordnede rettslige rammer må sikre at datakilder
      kan tilgjengeliggjøres og gjenbrukes innenfor krav til personvern, taushetsplikt,
      sikkerhet og lovlig viderebruk.

      - **Organisatorisk (Svært høy vekt):** Felles styringsmodeller, domeneorganisering
      og tydelig dataansvar må sikre helhetlig forvaltning og strategisk utvikling
      av dataressurser.

      - **Semantisk (Svært høy vekt):** Nasjonale metadata, begreper, informasjonsmodeller
      og kvalitetsbeskrivelser må gjøre datakildene finnbare, forståelige og vurderbare
      for gjenbruk.

      - **Teknisk (Høy vekt):** Standardiserte kataloger, API-er, tilgangsmekanismer
      og teknisk infrastruktur må gjøre datakilder tilgjengelige på en sikker, stabil
      og maskinlesbar måte.


      ### Bidrag til sammenhengende tjenester og felles økosystem

      Datakilder er et grunnlag for sammenhengende tjenester fordi de gjør relevante
      data tilgjengelige for gjenbruk på tvers av virksomheter. Når data kan oppdages,
      forstås og brukes sikkert fra autoritative eller godt forvaltede kilder, slipper
      brukeren å levere samme informasjon flere ganger.


      Kapabiliteten styrker det felles økosystemet ved å gjøre data til en felles
      ressurs for tjenesteutvikling, analyse, automatisering og samhandling. Domeneorganisering
      gir bedre oversikt, ansvar og strategisk utvikling av data innenfor viktige
      samfunnsområder, og gjør det enklere å bygge tjenester som henger sammen på
      tvers av organisatoriske grenser.



      '
    properties: {}
    folder_path: *id002
  id-5852d070415849fab42749cb488d984a:
    type: Capability
    name: Datastyring
    documentation: 'Evne til å sikre enhetlig og ansvarlig forvaltning av dataressurser
      gjennom felles rammeverk, klar ansvarsplassering og systematisk kvalitetsarbeid.


      ### Begrunnelse (Hvorfor)

      Datastyring er rammeverket av roller, ansvar, prosesser og standarder som sikrer
      effektiv og forsvarlig forvaltning av data som en strategisk ressurs gjennom
      hele livssyklusen. Kapabiliteten løser behovet for tydelig ansvar, felles praksis
      og systematisk kvalitetsarbeid, slik at data kan deles, forstås og brukes trygt
      på tvers av virksomheter.


      ### Hva det innebærer (Omfang)

      - **Juridisk (Høy vekt):** Sikre at data forvaltes i tråd med krav til personvern,
      taushetsplikt, arkivering, innsyn, behandlingsgrunnlag og ansvar for datadeling.

      - **Organisatorisk (Svært høy vekt):** Etablere roller, ansvar, styringsprosesser
      og beslutningsstrukturer for dataeierskap, datakvalitet, tilgang, deling og
      livssyklusforvaltning.

      - **Semantisk (Høy vekt):** Forvalte felles begreper, metadata, kvalitetskrav,
      informasjonsmodeller og klassifikasjoner som sikrer at data forstås likt og
      kan gjenbrukes.

      - **Teknisk (Middels vekt):** Bruke kataloger, dataplattformer, tilgangsmekanismer,
      kvalitetsverktøy og sporbarhetsløsninger som støtter praktisk styring og kontroll
      av dataressurser.


      ### Bidrag til sammenhengende tjenester og felles økosystem

      Datastyring gir grunnlaget for at data kan brukes som en pålitelig ressurs i
      sammenhengende tjenester. Når ansvar, kvalitet, metadata og tilgang er avklart,
      kan virksomheter tryggere dele og gjenbruke data i tjenestekjeder.


      Kapabiliteten styrker det felles økosystemet ved å gjøre data mer forutsigbare,
      etterprøvbare og gjenbrukbare. For sluttbrukeren betyr dette bedre datakvalitet,
      færre feil, mindre behov for gjentatt dokumentasjon og mer helhetlige tjenester
      på tvers av virksomheter.'
    properties: {}
    folder_path: *id002
  id-ad6f81e892a74590840828b6aabb270d:
    type: Capability
    name: Datautveksling og integrasjon
    documentation: 'Evne til å sikkert, effektivt og standardisert utveksle data mellom
      aktører i økosystemet.


      ### Begrunnelse (Hvorfor)

      Kapabiliteten gjør det mulig for aktører i økosystemet å utveksle data på en
      sikker, effektiv og standardisert måte. Den fungerer som en strategisk paraply
      for deling, gjenbruk, integrasjon, meldingsutveksling, hendelsesdrevet samhandling
      og digital lommebok. Uten denne kapabiliteten blir tjenester avhengige av manuelle
      prosesser, særskilte punkt-til-punkt-integrasjoner og gjentatt innsamling av
      informasjon.


      ### Hva det innebærer (Omfang)

      - **Juridisk (Middels vekt):** Overordnede rettslige rammer må sikre behandlingsgrunnlag,
      ansvar, tilgang og etterlevelse ved datautveksling mellom selvstendige aktører.

      - **Organisatorisk (Høy vekt):** Felles samhandlingsmodeller, avtaler, roller
      og forvaltningsprosesser må sikre at aktørene kan dele og bruke data på en forutsigbar
      måte.

      - **Semantisk (Høy vekt):** Felles begreper, informasjonsmodeller, metadata
      og standardiserte beskrivelser må sikre at data forstås likt på tvers av virksomheter.

      - **Teknisk (Svært høy vekt):** Standardiserte API-er, meldingsutveksling, hendelsesstrømmer,
      sikkerhetsmekanismer og felles infrastruktur må gjøre systemer i stand til å
      utveksle data kontrollert og skalerbart.


      ### Bidrag til sammenhengende tjenester og felles økosystem

      Kapabiliteten gjør at data kan flyte sikkert og strukturert mellom virksomheter
      i en tjenestekjede. Den reduserer behovet for at brukeren selv må hente, dokumentere
      eller formidle informasjon mellom offentlige aktører. Når datautveksling og
      integrasjon skjer etter felles rammer, blir det enklere å utvikle sammenhengende
      tjenester, gjenbruke eksisterende data og koble uavhengige løsninger sammen
      i et mer effektivt felles økosystem.'
    properties: {}
    folder_path: *id002
  id-fa54a429cbd84db09da1b2b2165fc352:
    type: Capability
    name: Dataanalyse
    documentation: 'Evne til å transformere rådata til meningsfull innsikt og bygge
      prediktive modeller.


      ### Begrunnelse (Hvorfor)

      KI er ikke bare en forlengelse av dataanalyse; det er en kapabilitet som muliggjør
      helt nye måter å jobbe på. Kapabiliteten gir bedre beslutningsgrunnlag ved å
      analysere komplekse datasett og avdekke innsikter og sammenhenger som er vanskelige
      for mennesker å oppdage.


      Dataanalyse og KI kan gi radikal effektivisering ved å automatisere kognitive
      oppgaver som tidligere krevde menneskelig vurdering. Dette kan frigjøre ressurser
      fra rutinemessig saksbehandling til mer komplekse og verdifulle oppgaver.


      Kapabiliteten muliggjør mer intelligente og treffsikre tjenester. KI-modeller
      kan vurdere et komplekst sett av variabler for å gi innbyggere og virksomheter
      skreddersydde råd eller proaktive tjenester som er mer treffsikre enn generelle
      regler.


      Kapabiliteten øker også innovasjonsevnen. Den kan brukes til å løse problemer
      som tidligere var vanskelige å håndtere, for eksempel analyse av medisinske
      bilder, overvåking av miljøendringer via satellittdata eller optimalisering
      av trafikkflyt i sanntid.


      ### Hva det innebærer (Omfang)

      - **Juridisk (Høy vekt):** Etablere og følge strenge retningslinjer som sikrer
      at dataanalyse og KI-modeller er rettferdige, transparente, forklarbare og ikke-diskriminerende,
      og at bruken er i tråd med personvernregelverket.

      - **Organisatorisk (Høy vekt):** Bygge kompetanse, rutiner og ansvar for utvikling,
      validering, bruk og oppfølging av analyser og prediktive modeller i konkrete
      tjeneste- og saksbehandlingsprosesser.

      - **Semantisk (Høy vekt):** Sikre at rådata, treningsdata, variabler, klassifikasjoner
      og resultater forstås riktig, slik at modeller og analyser bygger på korrekt
      betydning og kontekst.

      - **Teknisk (Svært høy vekt):** Utvikle, trene og validere maskinlæringsmodeller
      for klassifisering, prediksjon og mønstergjenkjenning. Bruke KI-teknikker, særlig
      språkmodeller (NLP), til å tolke, sortere og hente ut informasjon fra ustrukturert
      tekst som søknader, høringsinnspill og e-poster. Etablere MLOps for produksjonssetting,
      overvåking og kontinuerlig forbedring av KI-modeller over tid.


      ### Bidrag til sammenhengende tjenester og felles økosystem

      Dataanalyse styrker sammenhengende tjenester ved å gjøre det mulig å bruke data
      på tvers til innsikt, prediksjon, automatisering og mer treffsikker oppfølging.
      Prediktive modeller kan forutse fremtidige hendelser, behov eller risiko, for
      eksempel hvilke innbyggere som har høyest risiko for å falle utenfor, eller
      hvor det oppstår vedlikeholdsbehov på infrastruktur.


      Kapabiliteten bidrar til et mer effektivt felles økosystem ved å gjøre data
      til et aktivt beslutningsgrunnlag for tjenesteutvikling, prioritering og styring.
      Når aktørene kan analysere felles datagrunnlag og bruke KI på en ansvarlig måte,
      blir det enklere å utvikle proaktive, personaliserte og mer helhetlige tjenester
      for innbyggere og næringsliv.'
    properties: {}
    folder_path: *id002
  id-efe1a2676c124eeab946802af96a1ab7:
    type: Capability
    name: Dele data med andre
    documentation: 'Evne til å tilgjengeliggjøre egne data som veldokumenterte og
      sikre API-er, slik at andre aktører med lovlig grunnlag enkelt kan oppdage og
      gjenbruke dem.


      ### Begrunnelse (Hvorfor)

      Kapabiliteten gjør det mulig for andre aktører med lovlig grunnlag å oppdage,
      forstå og gjenbruke data i egne tjenester og prosesser. Den løser problemet
      med at verdifulle data forblir låst i enkeltvirksomheter, og legger til rette
      for at informasjon kan brukes på tvers uten unødvendige manuelle henvendelser,
      særskilte integrasjoner eller ny innsamling.


      ### Hva det innebærer (Omfang)

      - **Juridisk (Middels vekt):** Avklare behandlingsgrunnlag, formål, tilgangsrettigheter,
      taushetsplikt og vilkår for viderebruk før data gjøres tilgjengelig for andre.

      - **Organisatorisk (Svært høy vekt):** Etablere rutiner for eierskap, forvaltning,
      publisering, kvalitetssikring og oppfølging av datatilbudet overfor konsumenter.

      - **Semantisk (Middels vekt):** Publisere og dokumentere dataene i Felles datakatalog,
      slik at de blir lette å finne, forstå og vurdere for gjenbruk.

      - **Teknisk (Høy vekt):** Etablere og forvalte sikre API-er etter nasjonale
      standarder, med robuste systemer for tilgangsstyring som sikrer at data kun
      deles med de som har lov til det, f.eks. via Maskinporten.


      ### Bidrag til sammenhengende tjenester og felles økosystem

      Kapabiliteten gjør at andre virksomheter kan bygge tjenester på data som allerede
      finnes, i stedet for å hente inn samme informasjon på nytt. Når data deles gjennom
      sikre, standardiserte og godt dokumenterte grensesnitt, kan tjenestekjeder kobles
      sammen på en mer forutsigbar måte. For sluttbrukeren betyr dette færre gjentakelser,
      mindre dokumentasjonsbyrde og mer sømløse tjenester på tvers av virksomheter.
      For økosystemet gir det økt gjenbruk, bedre datakvalitet og mer effektiv ressursutnyttelse.


      '
    properties: {}
    folder_path: *id002
  id-697145d3768b40d39f9463667b78f749:
    type: Capability
    name: EU standarder
    documentation: 'Evne til å forstå og ta i bruk EU-standarder i økosystemet


      ### Begrunnelse (Hvorfor)

      Kapabiliteten sikrer at nasjonal arkitektur kan bygge på relevante europeiske
      standarder, spesifikasjoner og referansearkitekturer. Den løser behovet for
      at norske digitale tjenester kan samhandle bedre med europeiske løsninger, regelverk
      og dataområder, og at nasjonale valg ikke utvikles isolert fra europeisk digitaliseringspolitikk.


      ### Hva det innebærer (Omfang)

      - **Juridisk (Middels vekt):** Avklare hvilke EU-standarder, forordninger og
      harmoniserte krav som er relevante for norsk forvaltning og hvordan de skal
      innarbeides i nasjonale rammer.

      - **Organisatorisk (Høy vekt):** Etablere prosesser for å følge med på, vurdere,
      prioritere og ta i bruk relevante EU-standarder i nasjonale tiltak, veiledning
      og arkitekturstyring.

      - **Semantisk (Høy vekt):** Sikre at europeiske begreper, informasjonsmodeller,
      metadata og klassifikasjoner forstås og mappes riktig til norske begreper og
      nasjonale modeller.

      - **Teknisk (Høy vekt):** Ta i bruk tekniske spesifikasjoner, referansearkitekturer,
      API-standarder, sikkerhetskrav og interoperabilitetsprofiler fra EU der de er
      relevante for norske fellesløsninger og digital samhandling.


      ### Bidrag til sammenhengende tjenester og felles økosystem

      EU-standarder bidrar til at norske digitale tjenester kan utvikles i samsvar
      med europeiske krav og samhandlingsmønstre. Når relevante standarder forstås
      og tas i bruk, blir det enklere å bygge løsninger som fungerer både nasjonalt
      og på tvers av landegrenser.


      Kapabiliteten styrker det felles økosystemet ved å redusere særnorske avvik,
      øke gjenbruk av europeiske spesifikasjoner og gjøre nasjonal arkitektur mer
      robust mot endringer i europeisk regelverk og teknologiutvikling. For sluttbrukeren
      kan dette gi mer sømløse tjenester når rettigheter, data og digitale løsninger
      må fungere på tvers av sektorer og landegrenser.

      '
    properties: {}
    folder_path: *id002
  id-ecdde89168314bfb94b6a6ac70a55bc7:
    type: Capability
    name: Finansiering
    documentation: 'Evne til å etablere, anvende og forvalte finansielle virkemidler
      for å styre digitalisering i tråd med nasjonale mål.


      ### Begrunnelse (Hvorfor)

      Tradisjonelle finansieringsmodeller følger i stor grad den enkelte virksomhets
      budsjettrammer. Dette skaper store utfordringer for tverrgående digitale tiltak.
      Ofte må én enkelt virksomhet ta hele utviklingskostnaden, mens gevinstene hentes
      ut av andre aktører eller av samfunnet som helhet. Det skal sikre langsiktige
      og forutsigbare økonomiske rammer for felles digital infrastruktur og tverrgående
      digitale tjenester.


      ### Hva det innebærer (Omfang)

      - **Organisatorisk (Svært høy vekt):** Konkrete prosesser for søknad om statlig
      medfinansiering. Etablering av bindende avtaler om kostnadsdeling mellom samhandlende
      virksomheter. Utarbeidelse av forretningsmodeller og rutiner for tverrgående
      gevinstrealisering.


      ### Bidrag til sammenhengende tjenester og felles økosystem

      Kapabiliteten bidrar til sammenhengende tjenester ved å redusere de økonomiske
      barrierene som ofte bremser tverrgående digitaliseringstiltak. Når finansiering
      av utvikling, drift, forvaltning og videreutvikling er avklart, får virksomhetene
      bedre forutsetninger for å samarbeide langsiktig og forpliktende.

      Finansielle virkemidler gjør det mulig å prioritere tiltak som gir størst samlet
      nytte, selv om gevinsten ikke realiseres hos den virksomheten som bærer kostnaden.
      Dette er særlig viktig for felles digital infrastruktur og tjenester som går
      på tvers av sektorer, forvaltningsnivåer og livshendelser.

      Kapabiliteten styrker også det felles digitale økosystemet ved å legge til rette
      for gjenbruk, samfinansiering og mer helhetlig porteføljestyring. Den bidrar
      til at kritiske byggeklosser og fellesløsninger ikke svekkes av lokale budsjettprioriteringer,
      men forvaltes som nasjonale ressurser med langsiktig verdi.

      For sluttbrukeren betyr dette mer stabile, helhetlige og sammenhengende tjenester,
      der tjenestekvaliteten i mindre grad påvirkes av interne budsjettgrenser og
      økonomiske ansvarsforhold i forvaltningen.

      '
    properties: {}
    folder_path: *id002
  id-b99fcd8160d24e5f8ea3c17b15072f7a:
    type: Capability
    name: Forvaltningsstandarder
    documentation: 'Evne til å implementere og ta i bruk nasjonale standarder.


      ### Begrunnelse (Hvorfor)

      Kapabiliteten sikrer at virksomheter faktisk implementerer og tar i bruk nasjonale
      standarder i tjenester, løsninger, anskaffelser og samhandlingsprosesser. Den
      løser behovet for felles praksis som gjør at data, tjenester og tekniske grensesnitt
      fungerer sammen på tvers av offentlig sektor.


      Kapabiliteten inkluderer også EU-harmoniserte standarder som er vedtatt i norsk
      forvaltning.


      ### Hva det innebærer (Omfang)

      - **Juridisk (Middels vekt):** Etterleve krav og føringer knyttet til nasjonale
      forvaltningsstandarder og EU-harmoniserte standarder som er vedtatt i norsk
      forvaltning.

      - **Organisatorisk (Høy vekt):** Etablere rutiner for å vurdere, innføre, følge
      opp og dokumentere bruk av relevante standarder i prosjekter, anskaffelser og
      forvaltning.

      - **Semantisk (Høy vekt):** Bruke standardiserte begreper, metadata, informasjonsmodeller
      og beskrivelser som sikrer lik forståelse av data og tjenester på tvers av virksomheter.

      - **Teknisk (Høy vekt):** Implementere standardiserte formater, protokoller,
      API-spesifikasjoner, sikkerhetsmekanismer og tekniske grensesnitt som gjør løsninger
      interoperable og gjenbrukbare.


      ### Bidrag til sammenhengende tjenester og felles økosystem

      Forvaltningsstandarder gjør det mulig å bygge tjenester og løsninger som følger
      samme regler, formater og samhandlingsmønstre. Når virksomheter implementerer
      og bruker de samme standardene, blir det enklere å dele data, koble systemer
      sammen og gjenbruke løsninger på tvers av sektorer og forvaltningsnivåer.


      Kapabiliteten styrker det felles økosystemet ved å redusere lokale avvik, særtilpasninger
      og kostbare integrasjoner. For sluttbrukeren betyr dette mer stabile og sammenhengende
      tjenester, der digitale løsninger fungerer bedre sammen uavhengig av hvilken
      virksomhet som leverer dem.

      '
    properties: {}
    folder_path: *id002
  id-f696350f5d844a96854deadb83bc3c81:
    type: Capability
    name: Gjenbrukbare tjenester
    documentation: "Evne til å utvikle og benytte tjenester som kan brukes i nye sammenhenger\
      \ på tvers av offentlig forvaltning og næringsliv. \n\n### Begrunnelse (Hvorfor)\n\
      Gjenbrukbare tjenester leverer forretningsmessig verdi ved å løse funksjonelle\
      \ problemer som er felles for flere virksomheter. Det er en kritisk nyanse her:\
      \ Et system kan være teknisk integrerbart (ha et API) uten å være gjenbrukbart,\
      \ dersom forretningslogikken er for spesifikk eller låst til én kontekst. Kapabiliteten\
      \ løser problemet med at virksomheter kaster bort ressurser på å duplisere og\
      \ kode den samme forretningslogikken hver for seg i isolerte siloer.\n\n###\
      \ Hva det innebærer (Omfang)\n- **Organisatorisk (Svært høy vekt):** Rutiner\
      \ for å identifisere generiske forretningsbehov som deles av flere aktører i\
      \ økosystemet. Etablering av felles forvaltningsmodeller og insentiver som oppmuntrer\
      \ virksomheter til å gjenbruke andres tjenester fremfor å bygge egne.\n- **Semantisk\
      \ (Middels vekt):** Omforente definisjoner av funksjonelle tjenester og forretningsregler\
      \ i felles katalog. Standardisering av tjenestetaksonomier for å sikre lik forståelse\
      \ av hva en delt tjeneste faktisk utfører.\n- **Teknisk (Middels vekt):** Utvikling\
      \ av modulær forretningslogikk som er frikoblet fra spesifikke, proprietære\
      \ fagsystemer. Anvendelse av arkitekturmønstre som sikrer at tjenestekomponenten\
      \ enkelt kan plugges inn i helt nye sammenhenger.\n\n### Bidrag til sammenhengende\
      \ tjenester og felles økosystem\nNår virksomheter gjenbruker de samme funksjonelle\
      \ tjenestene og forretningsreglene, harmoniseres prosessene i bakgrunnen automatisk.\
      \ Dette gjør det langt enklere å sy sammen tverrgående tjenestekjeder for de\
      \ prioriterte livshendelsene. For sluttbrukeren betyr dette en mer forutsigbar\
      \ og gjenkjennelig digital reise, fordi forvaltningen opptrer med lik logikk\
      \ og adferd uavhengig av hvilken etat brukeren samhandler med."
    properties: {}
    folder_path: *id002
  id-3dbd3a9115cb4c54876490cbf02b0c58:
    type: Capability
    name: Grunndata
    documentation: 'Evne til å identifisere og formelt anerkjenne autoritative datakilder
      basert på en systematisk vurdering av deres verdi.


      ### Begrunnelse (Hvorfor)

      Kapabiliteten sikrer at økosystemet har felles, autoritative datakilder som
      kan legges til grunn for tjenester, prosesser og beslutninger på tvers av virksomheter.
      Den løser problemet med at ulike aktører bruker ulike kopier, tolkninger eller
      kvalitetsnivåer av sentrale data, noe som kan gi feil, dobbeltarbeid og sviktende
      tillit i tjenestekjeder.


      ### Hva det innebærer (Omfang)

      - **Juridisk (Høy vekt):** Avklare rettslig status, behandlingsgrunnlag, tilgangsregler,
      ansvar og plikter for autoritative datakilder som Folkeregisteret, Enhetsregisteret,
      Matrikkelen og Arbeidsgiver- og arbeidstakerregisteret.

      - **Organisatorisk (Høy vekt):** Etablere tydelig forvaltningsansvar, kvalitetsrutiner
      og prosesser for å identifisere, vurdere og formelt anerkjenne nasjonale grunndata.

      - **Semantisk (Svært høy vekt):** Sikre felles begreper, datadefinisjoner, metadata
      og informasjonsmodeller for nøkkelregistre, slik at dataene forstås likt på
      tvers av tjenester og sektorer.

      - **Teknisk (Høy vekt):** Tilgjengeliggjøre grunndata gjennom sikre, stabile
      og standardiserte grensesnitt, med mekanismer for oppdatering, logging, tilgangskontroll
      og sporbarhet.


      ### Bidrag til sammenhengende tjenester og felles økosystem

      Grunndata gjør det mulig å bygge tjenester på felles autoritative opplysninger
      i stedet for lokale kopier eller manuell dokumentasjon. Eksempler på kandidater
      til nasjonale grunndata er Folkeregisteret, Enhetsregisteret, Matrikkelen, Arbeidsgiver-
      og arbeidstakerregisteret og geografiske grunndata forvaltet av Kartverket.


      Når slike datakilder er identifisert, anerkjent og gjort tilgjengelige, kan
      virksomheter gjenbruke samme grunnlag for identitet, virksomheter, eiendom,
      adresser, arbeidsforhold og geografi. For sluttbrukeren betyr dette færre krav
      om dokumentasjon, mindre feil og mer sammenhengende tjenester. For økosystemet
      gir det bedre datakvalitet, økt tillit og mer effektiv samhandling på tvers
      av virksomheter.'
    properties: {}
    folder_path: *id002
  id-64811e71d98647e5a678a0a2e79ae617:
    type: Capability
    name: Hendelsesdrevet
    documentation: 'Evne til å publisere og reagere på digitale hendelser og kontinuerlige
      datastrømmer når de inntreffer.


      ### Begrunnelse (Hvorfor)

      Hendelsesdrevet arkitektur gjør det mulig å utveksle informasjon mellom distribuerte
      løsninger uten komplekse og tett koblede integrasjoner. Når en relevant hendelse
      oppstår, kan andre tjenester reagere automatisk uten at avsender må kjenne alle
      mottakere eller deres interne prosesser. Dette gjør det enklere å knytte tjenester
      sammen i tjenestekjeder, monitorere og analysere datastrømmer, og tilby proaktive
      tjenester basert på hendelser og analyser.


      ### Hva det innebærer (Omfang)

      - **Juridisk (Middels vekt):** Avklarer behandlingsgrunnlag, ansvar, formål,
      dataminimering og tilgang til hendelser som kan inneholde personopplysninger
      eller annen beskyttet informasjon.

      - **Organisatorisk (Svært høy vekt):** Etablerer roller, ansvar og rutiner for
      publisering, abonnement, forvaltning, endring og oppfølging av hendelser på
      tvers av tjenesteeiere og konsumenter.

      - **Semantisk (Høy vekt):** Sikrer felles forståelse av hendelsestyper, hendelsesnavn,
      tilstander, begreper, metadata og informasjonsinnhold i hendelser.

      - **Teknisk (Svært høy vekt):** Forvalter tekniske mekanismer for hendelsespublisering,
      abonnement, ruting, filtrering, sikkerhet, overvåking, feilhåndtering og leveransegarantier.


      ### Bidrag til sammenhengende tjenester og felles økosystem

      Hendelsesdrevet arkitektur bidrar til sammenhengende tjenester ved at virksomheter
      kan reagere på relevante endringer når de skjer, i stedet for å basere seg på
      manuelle avklaringer, periodiske oppslag eller tette integrasjoner. Dette gjør
      tjenestekjeder mer responsive og legger til rette for proaktive tjenester der
      brukeren får hjelp før vedkommende selv må ta initiativ.

      Kapabiliteten styrker det felles digitale økosystemet ved å redusere avhengigheter
      mellom systemer og virksomheter. En hendelse kan publiseres én gang og brukes
      av flere aktører, uten at avsender må bygge egne integrasjoner mot hver enkelt
      mottaker. Dette gir bedre skalerbarhet, mer gjenbruk og større fleksibilitet
      i utviklingen av nye digitale tjenester.

      Hendelsesdrevet samhandling gjør det også enklere å analysere data- og hendelsesstrømmer
      på tvers av løsninger, for eksempel innen IoT, sensordata, saksbehandling, varsling
      og automatisert oppfølging. Dermed kan offentlig sektor utvikle mer dynamiske,
      datadrevne og brukerorienterte tjenester.


      '
    properties: {}
    folder_path: *id002
  id-4b66bbf964834654b5f0c61e955b91b1:
    type: Capability
    name: Identifisering
    documentation: 'Evne til entydig å fastslå og registrere identiteter (personer,
      virksomheter eller systemer) gjennom pålitelige metoder og kilder.


      ### Begrunnelse (Hvorfor)

      Kapabiliteten sikrer at personer, virksomheter og systemer kan fastslås og registreres
      entydig gjennom pålitelige metoder og kilder. Dette gjør at identitetene senere
      kan gjenkjennes og skilles fra andre, uavhengig av kontekst.


      Kapabiliteten legger til rette for sikker tilgangskontroll, sporbarhet og tillit
      i digitale tjenester. Den omfatter håndtering av digitale identiteter gjennom
      hele livsløpet, fra opprettelse og endring til avvikling.


      Kapabiliteten inkluderer også evnen til å identifisere utenlandske brukere og
      sårbare grupper som mangler ordinært fødsels- eller D-nummer.


      ### Hva det innebærer (Omfang)

      - **Juridisk (Høy vekt):** Sikre at identiteter etableres og brukes i tråd med
      regelverk for identitet, personvern, eID, representasjon, tilgang og behandling
      av person- og virksomhetsopplysninger.

      - **Organisatorisk (Høy vekt):** Etablere rutiner for registrering, kvalitetssikring,
      endring, samordning og avvikling av identiteter gjennom hele livsløpet.

      - **Semantisk (Høy vekt):** Sikre felles forståelse av identitet, identifikatorer,
      person, virksomhet, system, fødselsnummer, D-nummer og andre identitetsattributter.

      - **Teknisk (Høy vekt):** Bruke autoritative kilder, identifikatorer, registre
      og tekniske mekanismer som gjør det mulig å fastslå, slå opp, validere og gjenkjenne
      identiteter på tvers av tjenester og systemer.


      ### Bidrag til sammenhengende tjenester og felles økosystem

      Identifisering gjør det mulig å vite hvem eller hva en digital tjeneste samhandler
      med. Når personer, virksomheter og systemer kan identifiseres entydig og gjenkjennes
      på tvers av kontekster, blir det enklere å tilby sikre og sammenhengende tjenester.


      Kapabiliteten styrker det felles økosystemet ved å legge grunnlaget for autentisering,
      tilgangsstyring, representasjon, sporbarhet og tillit. For sluttbrukeren betyr
      dette at tjenester kan kjenne igjen riktig bruker, håndtere riktige roller og
      gi mer presis, trygg og sammenhengende oppfølging på tvers av virksomheter.'
    properties: {}
    folder_path: *id002
  id-5c6c20d50b6a4b168524901372f0ca6e:
    type: Capability
    name: Informasjonsarkitektur
    documentation: 'Evne til å strukturere og modellere informasjon på en standardisert
      måte, slik at data og innhold blir finnbart, forståelig og gjenbrukbart for
      både mennesker og maskiner på tvers av hele økosystemet.


      ### Begrunnelse (Hvorfor)

      Kapabiliteten sikrer at informasjon kan beskrives, struktureres og modelleres
      på en måte som gjør den forståelig og gjenbrukbar på tvers av virksomheter,
      systemer og tjenestekjeder. Den løser problemet med at data og innhold ofte
      blir låst til lokale begreper, formater og systemforståelser.


      Informasjonsarkitektur innebærer arkitekturbeskrivelse gjennom et sett av krav,
      prinsipper og modeller som er nødvendig for fleksibel deling og utveksling av
      informasjon for å oppnå endringsdyktighet.


      ### Hva det innebærer (Omfang)

      - **Juridisk (Middels vekt):** Informasjonsarkitekturen må støtte krav til personvern,
      taushetsplikt, arkivering, innsyn og etterlevelse ved deling og gjenbruk av
      informasjon.

      - **Organisatorisk (Høy vekt):** Etablere roller, ansvar og arbeidsprosesser
      for å utvikle, forvalte og bruke felles informasjonsmodeller, begrepsmodeller
      og metadata på tvers av virksomheter.

      - **Semantisk (Svært høy vekt):** Strukturere begreper, informasjonsmodeller,
      datadefinisjoner, relasjoner og metadata slik at informasjon kan forstås likt
      av både mennesker og maskiner.

      - **Teknisk (Høy vekt):** Bruke standardiserte modellformater, kataloger, API-beskrivelser
      og maskinlesbare metadata som gjør informasjon finnbart, delbart og integrerbart
      i digitale tjenester.


      ### Bidrag til sammenhengende tjenester og felles økosystem

      Informasjonsarkitektur gjør det mulig å dele og gjenbruke informasjon på tvers
      uten at betydning, struktur og kontekst går tapt. Når data og innhold er modellert
      og beskrevet på en standardisert måte, blir det enklere å koble sammen tjenester,
      bygge felles datagrunnlag og automatisere informasjonsflyt.


      Kapabiliteten styrker det felles økosystemet ved å gi virksomhetene et felles
      grunnlag for datadeling, tjenesteutvikling, analyse og styring. For sluttbrukeren
      betyr dette mer sammenhengende tjenester, færre misforståelser og mindre behov
      for å forklare eller dokumentere samme informasjon flere ganger.'
    properties: {}
    folder_path: *id002
  id-896e4c1434604caa891b94bcce964720:
    type: Capability
    name: Informasjonsforvaltning
    documentation: "Evne til å ha et felles rammeverk og styringsmodell for informasjonsforvaltning,\
      \ slik at offentlige virksomheter kan utveksle og dele data og beskrivelser.\
      \ \n\n### Begrunnelse (Hvorfor)\nKapabiliteten sikrer at offentlige virksomheter\
      \ kan utveksle og dele data og beskrivelser innenfor et felles rammeverk og\
      \ en felles styringsmodell. Den løser behovet for enhetlig praksis for hvordan\
      \ informasjon beskrives, forvaltes, kvalitetssikres og gjøres tilgjengelig på\
      \ tvers av virksomheter.\n\n### Hva det innebærer (Omfang)\n- **Juridisk (Middels\
      \ vekt):** Informasjonsforvaltningen må støtte etterlevelse av krav til personvern,\
      \ taushetsplikt, arkivering, innsyn, behandlingsgrunnlag og lovlig deling av\
      \ data.\n- **Organisatorisk (Svært høy vekt):** Etablere felles rammeverk, styringsmodell,\
      \ roller, ansvar og prosesser for forvaltning av data, begreper, informasjonsmodeller\
      \ og metadata.\n- **Semantisk (Svært høy vekt):** Sikre felles beskrivelser,\
      \ begreper, metadata, informasjonsmodeller og kvalitetskrav, slik at data og\
      \ beskrivelser kan forstås og gjenbrukes på tvers.\n- **Teknisk (Høy vekt):**\
      \ Bruke kataloger, modellverktøy, dataplattformer, API-beskrivelser og maskinlesbare\
      \ metadata som gjør informasjon finnbart, delbart og teknisk tilgjengelig.\n\
      \n### Bidrag til sammenhengende tjenester og felles økosystem\nInformasjonsforvaltning\
      \ gir grunnlaget for at virksomheter kan dele og bruke data med felles forståelse\
      \ av innhold, kvalitet og ansvar. Når data, begreper og beskrivelser forvaltes\
      \ etter felles rammer, blir det enklere å bygge tjenester som henger sammen\
      \ på tvers av virksomheter.\n\nKapabiliteten styrker det felles økosystemet\
      \ ved å gjøre informasjon mer finnbart, forståelig, pålitelig og gjenbrukbart.\
      \ For sluttbrukeren betyr dette mindre behov for å oppgi samme informasjon flere\
      \ ganger, færre feil og mer helhetlige digitale tjenester."
    properties: {}
    folder_path: *id002
  id-48c9873ae59341a49c2dca27379fab55:
    type: Capability
    name: Informasjonssikkerhet
    documentation: "Evne til å ha tilstrekkelig sikkerhet i tjenester og løsninger\
      \ som benyttes i felles økosystem. \n\n### Begrunnelse (Hvorfor)\nKapabiliteten\
      \ sikrer at tjenester og løsninger i felles økosystem har et tilstrekkelig sikkerhetsnivå\
      \ til å beskytte informasjon, opprettholde tillit og muliggjøre trygg digital\
      \ samhandling. Den er sterkt knyttet til kapabiliteten \"Tillit\", fordi sikkerhet\
      \ er en grunnleggende forutsetning for autentisering, autorisasjon, datadeling,\
      \ sporbarhet og sammenhengende tjenester.\n\n### Hva det innebærer (Omfang)\n\
      - **Juridisk (Høy vekt):** Overordnede krav til informasjonssikkerhet, personvern,\
      \ taushetsplikt, internkontroll og risikostyring må sikre at tjenester og løsninger\
      \ etterlever gjeldende regelverk.\n- **Organisatorisk (Høy vekt):** Felles styring,\
      \ roller, ansvar, risikovurderinger og sikkerhetsprosesser må sikre at aktørene\
      \ i økosystemet håndterer sikkerhet på en koordinert og etterprøvbar måte.\n\
      - **Semantisk (Middels vekt):** Felles begreper for risiko, sikkerhetsnivå,\
      \ beskyttelsesbehov, trusler, sårbarheter og sikkerhetstiltak må sikre lik forståelse\
      \ på tvers av virksomheter.\n- **Teknisk (Høy vekt):** Felles sikkerhetsarkitektur,\
      \ tilgangsmekanismer, kryptering, logging, overvåking, hendelseshåndtering og\
      \ tekniske sikkerhetstiltak må beskytte tjenester og løsninger i økosystemet.\n\
      \n### Bidrag til sammenhengende tjenester og felles økosystem\nInformasjonssikkerhet\
      \ gjør det mulig å koble tjenester, data og løsninger sammen uten å svekke konfidensialitet,\
      \ integritet eller tilgjengelighet. Når aktørene har tillit til at informasjon\
      \ håndteres sikkert, blir det enklere å dele data, bruke fellesløsninger og\
      \ bygge tjenestekjeder på tvers av virksomheter.\n\nKapabiliteten styrker det\
      \ felles økosystemet ved å redusere risiko, øke robusthet og etablere et felles\
      \ sikkerhetsnivå for digital samhandling. For sluttbrukeren betyr dette tryggere\
      \ og mer stabile tjenester, der opplysninger kan brukes på tvers uten at sikkerhet\
      \ og tillit svekkes."
    properties: {}
    folder_path: *id002
  id-60827614648541ef8520df87fa25d100:
    type: Capability
    name: Integrerbare tjenester
    documentation: 'Evne til å designe, utvikle og eksponere data og funksjonalitet
      som selvstendige, standardiserte og maskinlesbare tjenester (API-er), slik at
      de enkelt kan oppdages, forstås og integreres i nye, tverrgående prosesser og
      løsninger.


      ### Begrunnelse (Hvorfor)

      Tradisjonell systemutvikling låser ofte data og funksjonalitet til spesifikke
      brukerapplikasjoner eller lukkede fagsystemer. Dette tvinger eksterne virksomheter
      til å bygge kostbare, skreddersydde og tette integrasjoner for hvert nye behov.
      Underkapabiliteten løser problemet med fragmentert arkitektur og teknisk gjeld
      ved å frikoble forretningslogikk og gjøre den universelt tilgjengelig via standardiserte,
      pluggbare grensesnitt.


      ### Hva det innebærer (Omfang)

      - **Organisatorisk (Middels vekt):** Operasjonalisering av en robust livssyklusforvaltning
      for digitale byggeklosser. Etablering av klare rutiner for versjonering, kontinuerlig
      vedlikehold og forutsigbar utfasing av tjenester for å sikre varig stabilitet
      for konsumentene.

      - **Semantisk (Middels vekt):** Dokumentasjon og publisering av funksjonalitet
      i felles kataloger. Sikring av at tekniske grensesnitt og tilhørende datafelter
      utformes standardisert, slik at de er enkle å oppdage og tolke korrekt av eksterne
      utviklere.

      - **Teknisk (Svært høy vekt):** Konkret anvendelse av "API-først"-metodikk der
      det maskinlesbare grensesnittet utvikles som det primære produktet, uavhengig
      av spesifikke applikasjoner. Teknisk implementering av innebygd sikkerhet og
      kontrollert tilgangsstyring i grensesnittet, slik at data kun utveksles ved
      lovlig grunnlag og legitimt behov.


      ### Bidrag til sammenhengende tjenester og felles økosystem

      Når virksomheter eksponerer sine kjernefunksjoner som integrerbare, frittstående
      API-er, fjernes den tekniske friksjonen mellom uavhengige systemer. Dette gjør
      det mulig for samarbeidende etater å hente og oppdatere nødvendig informasjon
      i sanntid. For sluttbrukeren betyr dette en mer sammenhengende brukerreise uten,
      der forvaltningens underliggende systemgrenser blir skjult.'
    properties: {}
    folder_path: *id002
  id-299fc063873a4f278a1d3c0ac9480467:
    type: Capability
    name: Juridisk samhandling
    documentation: 'Evne til å etablere, forvalte og formidle et helhetlig juridisk
      rammeverk som muliggjør og regulerer sikker og effektiv digital samhandling.


      ### 1. Begrunnelse (Hvorfor)

      Digital samhandling og datadeling på tvers av uavhengige virksomheter krever
      en trygg og felles juridisk grunnmur. Uten denne kapabiliteten vil uklarheter
      rundt lovlighet, personvern og deling av opplysninger skape usikkerhet, føre
      til unødig lange utredningsprosesser og i verste fall stanse utviklingen av
      tverrgående digitale tjenester fordi aktørene ikke har avklart om de har lov
      til å samhandle.


      ### 2. Hva det innebærer (Omfang)

      - **Juridisk (Svært høy vekt):** Dette utgjør selve kjernen i kapabiliteten.
      Det innebærer å foreslå, koordinere og harmonisere endringer i regelverket (regelverksutvikling)
      samt å tilby felles, autoritative tolkninger av eksisterende regelverk (regelverkstolkning).
      Det sikrer at det rettslige hjemmelsgrunnlaget for deling av data er på plass
      og i tråd med nasjonale lover og europeiske forordninger (som GDPR og eIDAS).

      - **Organisatorisk (Høy vekt):** Etablere tverrgående samarbeidsarenaer og nettverk
      mellom jurister, departementer og etater for å samordne forvaltningspraksis.
      Dette sikrer en koordinert tilnærming til rettslige problemstillinger og fjerner
      silobaserte tolkninger som hindrer samhandling.

      - **Semantisk (Middels vekt):** Oversette komplekse juridiske begreper, vilkår
      og lovtekster til en omforent forståelse, slik at lovens intensjon tolkes likt
      av saksbehandlere og virksomheter i hele økosystemet.

      - **Teknisk (Lav vekt):** Underbygge prinsippet om digitaliseringsvennlig regelverk,
      der lover og forskrifter utformes med tanke på at rettslige regler, plikter
      og rettigheter senere skal kunne omsettes til maskinlesbar logikk og automatiserte
      saksbehandlingsprosesser.


      ### 3. Bidrag til sammenhengende tjenester og felles økosystem

      Kapabiliteten rydder bort juridiske gråsoner og hindringer bak fasaden, slik
      at data lovlig kan flyte mellom uavhengige aktører i en tjenestekjede. For sluttbrukeren
      betyr dette en sømløs opplevelse der det offentlige kan samhandle på tvers av
      etater uten at brukeren selv må fungere som budbringer av attester, vedtak eller
      dokumentasjon.

      '
    properties: {}
    folder_path: *id002
  id-ba60560a9ed64b4d87b2fd4fa6b32937:
    type: Capability
    name: Nasjonal arkitektur for samhandling
    documentation: "Evne til å sikre samhandling, gjenbruk og strategisk retning i\
      \ et nasjonalt digitalt økosystem.\n\n\nFelles økosystem skal bidra til økt\
      \ deling av data og gjenbruk av løsninger, slik at vi utnytter ressursene på\
      \ en effektiv måte og skaper økte verdier for samfunnet.\nDet betyr at i felles\
      \ økosystem samarbeider aktørene om å utvikle fellesløsninger som bidrar til\
      \ en effektiv forvaltning med gode brukervennlige tjenester. Dette inkluderer\
      \ hvordan vi styrer og forvalter løsninger og tjenester, samt hvordan vi øker\
      \ samhandlingen mellom aktørene. \nMed samhandling mener vi evnen til å tilby\
      \ tjenester, utveksle informasjon og ivareta både de organisatoriske, juridiske,\
      \ semantiske og tekniske aspektene ved dette.\n\n"
    properties: {}
    folder_path: *id002
  id-9ea8fbaeb19243fa971013c57c3e96f9:
    type: Capability
    name: Organisatorisk samhandling
    documentation: "Evne til å effektivisere forretningsprosesser og verdikjeder på\
      \ tvers av organisatoriske grenser. \n\n### Begrunnelse (Hvorfor)\nFor å lage\
      \ sammenhengende tjenester må uavhengige etater og virksomheter fungere som\
      \ ett lag. Denne hovedkapabiliteten sikrer tverrgående styring og finansiering\
      \ nasjonalt. Det skal bidra til å minske at virksomheter prioriterer egne, interne\
      \ oppgaver framfor helhetlige brukerreiser som krever samarbeid.\n\n### Hva\
      \ det innebærer (Omfang)\n- **Juridisk (Middels vekt):** Overordnede rammeverk\
      \ for samarbeidsavtaler og nasjonale føringer, som Digitaliseringsrundskrivet,\
      \ regulerer plikten til å samhandle og dele data.\n- **Organisatorisk (Svært\
      \ høy vekt):** Nasjonale styringsmodeller, samstyring, finansieringsordninger\
      \ og porteføljestyring avklarer strategisk ansvar, prioriteringer og spilleregler\
      \ for samarbeid.\n- **Semantisk (Middels vekt):** Felles forståelse av organisatoriske\
      \ roller, ansvar, eierskap og tjenestekjeder gjør det tydelig hvem som har ansvar\
      \ på tvers av sektorer og livshendelser.\n\n### Bidrag til sammenhengende tjenester\
      \ og felles økosystem\nKapabiliteten bygger bro mellom organisatoriske siloer\
      \ og sikrer bredere enighet om prioriteringer, ansvar og økonomi på forhånd.\
      \ Dette gir operative team mandatet de trenger for å utvikle sømløse tjenester\
      \ på tvers av virksomheter. For sluttbrukeren betyr det at offentlig sektor\
      \ i større grad kan opptre som én samordnet aktør, selv om tjenestene leveres\
      \ av flere uavhengige virksomheter.\n\n"
    properties: {}
    folder_path: *id002
  id-718d8e94a9b847a485fc6518b4f2588d:
    type: Capability
    name: 'Oversikt over API '
    documentation: 'Evne til å understøtte datadeling og tjenesteintegrasjon ved å
      oppdage, forstå og koble seg til tilgjengelige data via en standardisert oversikt
      over maskinlesbare grensesnitt (API-er).


      ### Begrunnelse (Hvorfor)

      Kapabiliteten gjør det mulig for virksomheter å finne, forstå og ta i bruk tilgjengelige
      API-er for datadeling og tjenesteintegrasjon. Den løser problemet med at maskinlesbare
      grensesnitt ofte er spredt, ulikt dokumentert eller vanskelige å oppdage, noe
      som hindrer gjenbruk og fører til unødvendige spesialintegrasjoner.


      ### Hva det innebærer (Omfang)

      - **Juridisk (Middels vekt):** API-beskrivelser må synliggjøre tilgangsvilkår,
      behandlingsgrunnlag, bruksbegrensninger, ansvar og eventuelle krav til avtaler
      eller godkjenning.

      - **Organisatorisk (Høy vekt):** Etablere rutiner for å registrere, kvalitetssikre,
      publisere og vedlikeholde API-beskrivelser, med tydelig ansvar hos API-eier
      og tjenesteeier.

      - **Semantisk (Høy vekt):** Beskrive API-er med standardiserte metadata, begreper,
      formål, datainnhold, endepunkter, status, versjoner og relasjoner til datasett,
      tjenester og hendelser.

      - **Teknisk (Svært høy vekt):** Tilgjengeliggjøre API-oversikten gjennom kataloger,
      søkefunksjoner og maskinlesbare spesifikasjoner, for eksempel OpenAPI, slik
      at utviklere og systemer kan koble seg til på en standardisert måte.


      ### Bidrag til sammenhengende tjenester og felles økosystem

      Kapabiliteten bidrar til sammenhengende tjenester ved å gjøre det enklere å
      finne og bruke eksisterende grensesnitt for datadeling og integrasjon. Når API-er
      er dokumentert og tilgjengelige i en standardisert oversikt, kan virksomheter
      raskere koble tjenester sammen uten å bygge nye punkt-til-punkt-integrasjoner.


      For det felles økosystemet gir kapabiliteten bedre gjenbruk, lavere integrasjonskostnader
      og mer forutsigbar teknisk samhandling. Dette gjør det enklere å utvikle tjenester
      som bygger på data og funksjonalitet fra flere virksomheter, og som oppleves
      mer sømløse for sluttbrukeren.'
    properties: {}
    folder_path: *id002
  id-dc38d2667240445db35f7f0f38fc1e15:
    type: Capability
    name: Oversikt over begreper
    documentation: 'Evne til å etablere en omforent begrepsforståelse ved å definere,
      dele og gjenbruke begreper på tvers av virksomheter, for å sikre entydig kommunikasjon
      og semantisk samhandlingsevne.


      ### Begrunnelse (Hvorfor)

      Kapabiliteten sikrer at virksomheter bruker og forstår sentrale begreper på
      samme måte når de utvikler tjenester, deler data og samhandler digitalt. Den
      løser problemet med at samme ord kan ha ulik betydning i ulike sektorer, systemer
      eller regelverk, noe som kan føre til misforståelser, feil databruk og svakere
      samhandling.


      ### Hva det innebærer (Omfang)

      - **Juridisk (Middels vekt):** Avklare begreper som har rettslig betydning,
      slik at vilkår, rettigheter, plikter og hjemler forstås likt på tvers av virksomheter.

      - **Organisatorisk (Høy vekt):** Etablere rutiner for å definere, kvalitetssikre,
      publisere, forvalte og gjenbruke begreper på tvers av fagmiljøer og virksomheter.

      - **Semantisk (Svært høy vekt):** Beskrive begreper, definisjoner, relasjoner,
      kontekst og bruksområder på en standardisert måte som støtter felles forståelse
      og semantisk samhandling.

      - **Teknisk (Middels vekt):** Tilgjengeliggjøre begreper i felles kataloger
      og maskinlesbare formater, slik at de kan kobles til datasett, informasjonsmodeller,
      API-er og tjenester.


      ### Bidrag til sammenhengende tjenester og felles økosystem

      Kapabiliteten bidrar til sammenhengende tjenester ved å sikre at aktørene i
      en tjenestekjede forstår informasjonen de utveksler på samme måte. Når begreper
      er definert, delt og gjenbrukt, blir det enklere å utvikle tjenester som bygger
      på samme meningsinnhold på tvers av virksomheter.


      For det felles økosystemet gir kapabiliteten bedre semantisk samhandling, høyere
      datakvalitet og mindre risiko for feilfortolkning. Dette gjør det enklere å
      dele data, gjenbruke informasjonsmodeller og utvikle digitale tjenester som
      fremstår helhetlige for sluttbrukeren.'
    properties: {}
    folder_path: *id002
  id-3c6f94ba791a4aa298809ef3f46bdc87:
    type: Capability
    name: Oversikt over datasett
    documentation: 'Evne til å systematisk oppdage, vurdere og gjenbruke data på tvers
      av offentlig sektor gjennom en sentral, standardisert oversikt over tilgjengelige
      datasett.


      ### Begrunnelse (Hvorfor)

      Kapabiliteten gjør det mulig å finne, forstå og vurdere tilgjengelige datasett
      på tvers av offentlig sektor. Den løser problemet med at data ofte er spredt,
      ufullstendig dokumentert eller vanskelig å oppdage, noe som hindrer gjenbruk,
      datadeling og utvikling av sammenhengende tjenester.


      ### Hva det innebærer (Omfang)

      - **Juridisk (Middels vekt):** Oversikten må synliggjøre relevante bruksbetingelser,
      tilgangsregler, behandlingsgrunnlag, lisenser, personvern og eventuelle begrensninger
      for viderebruk.

      - **Organisatorisk (Høy vekt):** Etablere rutiner for å registrere, kvalitetssikre,
      publisere og vedlikeholde beskrivelser av datasett, med tydelig ansvar hos dataeier
      og datatilbyder.

      - **Semantisk (Svært høy vekt):** Beskrive datasett med standardiserte metadata,
      begreper, klassifikasjoner, formål, kvalitet, oppdateringsfrekvens og relasjoner
      til andre datasett.

      - **Teknisk (Høy vekt):** Tilgjengeliggjøre oversikten gjennom kataloger, søkefunksjoner
      og maskinlesbare grensesnitt, slik at datasett kan oppdages, vurderes og kobles
      til relevante API-er eller nedlastingsløsninger.


      ### Bidrag til sammenhengende tjenester og felles økosystem

      Kapabiliteten bidrar til sammenhengende tjenester ved å gjøre det enklere for
      virksomheter å finne og gjenbruke data som allerede finnes i offentlig sektor.
      Når datasett er beskrevet på en standardisert måte, kan aktører raskere vurdere
      om dataene er relevante, lovlige og egnet for bruk i egne tjenester og prosesser.


      For det felles økosystemet gir kapabiliteten bedre oversikt over tilgjengelige
      dataressurser, økt gjenbruk og mindre dobbeltinnsamling. Dette styrker datadeling,
      analyse, tjenesteutvikling og mer effektiv samhandling på tvers av virksomheter.'
    properties: {}
    folder_path: *id002
  id-e5a55d4bacd14740a656bc896d25497a:
    type: Capability
    name: Oversikt over hendelser
    documentation: 'Evne til å få oversikt over hvilke hendelser som utløser eller
      utløses av en tjeneste.


      ### Begrunnelse (Hvorfor)

      Kapabiliteten gjør det mulig å forstå hvilke digitale hendelser som påvirker
      en tjeneste, og hvilke hendelser tjenesten selv produserer. Den løser problemet
      med manglende oversikt over avhengigheter, triggere og konsekvenser i hendelsesdrevne
      tjenestekjeder.


      ### Hva det innebærer (Omfang)

      - **Juridisk (Middels vekt):** Avklare om hendelser inneholder personopplysninger
      eller annen beskyttet informasjon, og synliggjøre relevante krav til behandlingsgrunnlag,
      tilgang, ansvar og formål.

      - **Organisatorisk (Høy vekt):** Etablere rutiner for å registrere, beskrive,
      forvalte og vedlikeholde oversikt over hendelser, med tydelig ansvar hos tjenesteeier
      og hendelsestilbyder.

      - **Semantisk (Svært høy vekt):** Beskrive hendelsestyper, hendelsesnavn, triggere,
      tilstander, metadata, begreper og relasjoner til tjenester på en standardisert
      måte.

      - **Teknisk (Høy vekt):** Tilgjengeliggjøre hendelsesoversikter i kataloger,
      grensesnitt eller meldingsinfrastruktur slik at systemer kan oppdage, abonnere
      på og reagere på relevante hendelser.


      ### Bidrag til sammenhengende tjenester og felles økosystem

      Kapabiliteten bidrar til sammenhengende tjenester ved å gjøre det tydelig hvilke
      hendelser som kan starte, endre eller avslutte en tjenesteprosess. Når aktørene
      har oversikt over hendelser og avhengigheter, blir det enklere å bygge proaktive
      og hendelsesdrevne tjenestekjeder på tvers av virksomheter.


      For det felles økosystemet gir kapabiliteten bedre gjenbruk av hendelser, færre
      skjulte avhengigheter og mer forutsigbar samhandling. Dette gjør det mulig å
      reagere raskere på endringer og utvikle tjenester som oppleves mer sømløse for
      sluttbrukeren.

      '
    properties: {}
    folder_path: *id002
  id-a40bf39259434db48f358cc543428c8a:
    type: Capability
    name: Oversikt over informasjonsmodeller
    documentation: 'Evne til å gi oversikt over informasjonsmodeller for å kunne gi
      en felles forståelse av datastrukturer, slik at data kan tolkes korrekt og meningsfullt.


      ### Begrunnelse (Hvorfor)

      Kapabiliteten gjør det mulig å finne, forstå og gjenbruke informasjonsmodeller
      på tvers av virksomheter. Den løser problemet med at datastrukturer ofte beskrives
      lokalt, uensartet eller utilgjengelig, noe som gjør det vanskelig å tolke data
      korrekt i tverrgående tjenester og integrasjoner.


      ### Hva det innebærer (Omfang)

      - **Juridisk (Middels vekt):** Informasjonsmodeller må støtte krav til behandlingsgrunnlag,
      personvern, taushetsplikt, arkivering og etterlevelse når modellene beskriver
      data som brukes i offentlige tjenester.

      - **Organisatorisk (Høy vekt):** Etablere rutiner for å registrere, kvalitetssikre,
      forvalte og publisere informasjonsmodeller i felles oversikter, med tydelig
      ansvar for modellene.

      - **Semantisk (Svært høy vekt):** Beskrive datastrukturer, begreper, relasjoner,
      kardinalitet, datatyper og betydning på en standardisert måte, slik at data
      kan tolkes korrekt og meningsfullt.

      - **Teknisk (Høy vekt):** Tilgjengeliggjøre informasjonsmodeller i maskinlesbare
      og standardiserte formater, gjennom kataloger, modellverktøy og grensesnitt
      som gjør dem søkbare og gjenbrukbare.


      ### Bidrag til sammenhengende tjenester og felles økosystem

      Kapabiliteten bidrar til sammenhengende tjenester ved å sikre at aktørene forstår
      datastrukturer på samme måte når informasjon deles, gjenbrukes eller integreres
      i tjenestekjeder. Når informasjonsmodeller er tilgjengelige og standardiserte,
      blir det enklere å bygge tjenester som tolker data korrekt på tvers av systemer
      og virksomheter.


      For det felles økosystemet gir kapabiliteten bedre gjenbruk av modeller, mer
      presis datadeling og lavere risiko for feilfortolkning. Dette styrker semantisk
      samhandling og gjør det enklere å utvikle felles løsninger som bygger på samme
      forståelse av informasjon.'
    properties: {}
    folder_path: *id002
  id-d9374751da7d4b36bb0b3be609ff7d28:
    type: Capability
    name: Oversikt over tjenester
    documentation: 'Evne til å gi oversikt over og oppdage tjenester som tilbys av
      eller på vegne av offentlig sektor.


      ### Begrunnelse (Hvorfor)

      Kapabiliteten gjør det mulig å finne, forstå og vurdere tjenester som tilbys
      av eller på vegne av offentlig sektor. Den løser problemet med at tjenester
      ofte beskrives ulikt, ligger spredt eller er vanskelige å oppdage for innbyggere,
      næringsliv, virksomheter og andre tjenestekonsumenter.


      ### Hva det innebærer (Omfang)

      - **Juridisk (Middels vekt):** Tjenestebeskrivelser må synliggjøre relevante
      rettigheter, plikter, vilkår, ansvar og eventuelle rettslige grunnlag knyttet
      til tjenesten.

      - **Organisatorisk (Høy vekt):** Etablere rutiner for å registrere, kvalitetssikre,
      publisere og vedlikeholde oversikt over tjenester, med tydelig ansvar for tjenesteeier
      og forvaltning.

      - **Semantisk (Svært høy vekt):** Beskrive tjenester med felles begreper, metadata,
      målgrupper, livshendelser, tjenestetyper og relasjoner til andre tjenester,
      slik at de kan forstås og sammenlignes på tvers.

      - **Teknisk (Middels vekt):** Tilgjengeliggjøre tjenesteoversikter i kataloger,
      portaler og maskinlesbare grensesnitt, slik at tjenester kan søkes opp, kobles
      til og gjenbrukes i digitale tjenestekjeder.


      ### Bidrag til sammenhengende tjenester og felles økosystem

      Kapabiliteten bidrar til sammenhengende tjenester ved å gjøre det lettere å
      se hvilke tjenester som finnes, hvem som tilbyr dem, og hvordan de henger sammen
      med andre tjenester. Når tjenester kan oppdages og beskrives på en standardisert
      måte, blir det enklere å sette dem sammen til helhetlige brukerreiser på tvers
      av virksomheter.


      For det felles økosystemet gir kapabiliteten bedre oversikt, mer gjenbruk og
      mindre dobbeltutvikling. Den gjør det enklere for aktører å finne relevante
      tjenester, bygge videre på eksisterende tilbud og utvikle løsninger som fremstår
      mer helhetlige for sluttbrukeren.'
    properties: {}
    folder_path: *id002
  id-9bc3012bcd154e27aa094ac36bf391be:
    type: Capability
    name: Proaktive tjenester
    documentation: 'Evne til å, basert på registrerte hendelser og delte data, automatisk
      identifisere en brukers behov for offentlige tjenester og proaktivt tilby relevant
      informasjon, veiledning eller starte en tjenesteprosess på vegne av brukeren.


      ### Begrunnelse (Hvorfor)

      Uten proaktivitet forblir selv de beste digitale tjenestene passive verktøy
      som krever at brukeren selv har kunnskapen, initiativet og overskuddet til å
      finne frem. Mange innbyggere og virksomheter kjenner ikke til alle støtteordninger,
      frister eller rettigheter de faktisk har. Kapabiliteten løser det spesifikke
      funksjonelle problemet med informasjonskløfter og sosial ulikhet, og fjerner
      unødvendig tidsbruk og saksbehandling ved å snu offentlig tjenesteyting fra
      passiv til aktiv.


      ### Hva det innebærer (Omfang)

      - **Juridisk (Middels vekt):** Rettslig forankring av automatiserte forretningsregler
      som kobler spesifikke tjenester til rettigheter og plikter. Sikring av juridisk
      hjemmel for proaktiv varsling og behandling av delte data uten forutgående søknad.

      - **Organisatorisk (Svært høy vekt):** Etablering av operative rutiner for personalisert
      og kanal-uavhengig varsling via brukerens foretrukne digitale kanal. Utforming
      av nye arbeidsprosesser for å igangsette forhåndsutfylte tjenester og proaktiv
      veiledning som avlaster kommunikasjonssentre.

      - **Semantisk (Middels vekt):** Standardisering av logiske forretningsregler
      og relevanskriterier på tvers av sektorer. Harmonisering av datastrukturer og
      begreper knyttet til viktige tjenester for å sikre treffsikker og intelligent
      regelstyring.

      - **Teknisk (Svært høy vekt):** Bruk av hendelsesdrevet arkitektur for å lytte
      etter endringer i autoritative datakilder som Folkeregisteret og Enhetsregisteret.
      Implementering av tekniske integrasjoner for utsendelse av sikre, betimelige
      varsler og automatisert generering av forhåndsutfylte søknadsskjemaer.


      ### Bidrag til sammenhengende tjenester og felles økosystem

      Kapabiliteten representerer et paradigmeskifte der offentlig sektor oppleves
      som en hjelpende hånd og en partner fremfor en byråkratisk motpart. Ved å varsle
      brukeren om rettigheter, plikter og muligheter før de selv har etterspurt det,
      bindes uavhengige etaters tjenester sammen til en flytende og uavbrutt reise.
      Dette sikrer at velferdsstatens goder når effektivt frem, og at det blir enklere
      for næringsliv og innbyggere å overholde plikter. For det felles økosystemet
      gir dette radikal effektivisering og frigjør enorme ressurser fra rutinemessig
      saksbehandling, samtidig som det bygger dyp samfunnstillit.


      '
    properties: {}
    folder_path: *id002
  id-0209483504444508a40415aa6e3fc39c:
    type: Capability
    name: Regelverkstolkning
    documentation: 'Evne til å tilby felles, autoritative tolkninger av relevant regelverk.


      ### Begrunnelse (Hvorfor)

      Når flere uavhengige virksomheter skal samarbeide om å levere en sammenhengende
      tjeneste, oppstår det ofte usikkerhet om hvordan lovverket skal forstås. Hvis
      hver virksomhet gjør sine egne isolerte og silobaserte tolkninger, fører det
      til unødig risikoaversjon, lange utredningsprosesser og barrierer for datadeling.
      Denne kapabiliteten løser problemet ved å etablere en felles rettslig forutsigbarhet
      på tvers av organisasjonsgrensene.


      ### Hva det innebærer (Omfang)

      - **Juridisk (Svært høy vekt):** Operasjonalisering av tverrgående lover og
      forordninger (som Forvaltningsloven, Offentleglova, Personopplysningsloven/GDPR
      og eIDAS) til konkrete, felles rettslige fortolkninger. Dette innebærer å avklare
      det spesifikke handlingsrommet for datadeling, gjenbruk av opplysninger og digital
      saksbehandling i konkrete samhandlingstiltak.

      - **Organisatorisk (Høy vekt):** Etablering av konkrete tverrgående juristnettverk,
      faste samarbeidsrutiner og eskaleringsprosesser for å løse tolkningsavvik mellom
      etater. Det omfatter også operasjonell utarbeidelse og formidling av felles
      veiledere som saksbehandlere i de ulike virksomhetene kan støtte seg på i hverdagen.

      - **Semantisk (Middels vekt):** Presisering og harmonisering av spesifikke juridiske
      kjernebegreper, rettslige vilkår og skjønsmessige vurderinger (f.eks. nøyaktig
      hva som utgjør "saklig behov" eller "gyldig samtykke" i en gitt kontekst), slik
      at de tolkes identisk av alle parter.

      - **Teknisk (Middels vekt):** Tilgjengeliggjøring av de autoritative tolkningene
      og rettskildene i felles nasjonale kunnskapsbaser eller portaler (f.eks. Samarbeidsportalen),
      samt strukturering av tolkningene på en måte som gjør at de funksjonelt kan
      omsettes til maskinlesbare forretningsregler og logikk i saksbehandlingssystemene.


      ### Bidrag til sammenhengende tjenester og felles økosystem

      Kapabiliteten gir virksomhetene den nødvendige juridiske tryggheten til å koble
      sine prosesser og data sammen med andre aktører. For sluttbrukeren betyr dette
      kortere saksbehandlingstid og mer proaktive tjenester, fordi etatene bak kulissene
      allerede er enige om de rettslige spillereglene og slipper å stoppe opp "stafetten"
      for å utrede juss på nytt.'
    properties: {}
    folder_path: *id002
  id-0119029984674da59dbbfdc3a8ca3e95:
    type: Capability
    name: Regelverksutvikling
    documentation: 'Evne til å foreslå og koordinere endringer i regelverket for å
      tilpasse det til teknologisk utvikling og nye behov.


      ### Begrunnelse (Hvorfor)

      I arbeidet med sammenhengende digitale tjenester viser det seg ofte at det ikke
      er teknologien, men gårsdagens lovverk som setter rammene for hva som er mulig
      å få til. For å kunne tilby sømløse tjenester på tvers av sektorer må det regulatoriske
      rammeverket utvikle seg i takt med teknologien og samfunnets behov. Denne kapabiliteten
      løser problemet med fragmentert lovgivning som utilsiktet blokkerer for datadeling
      og digital samhandling.


      ### Hva det innebærer (Omfang)

      - **Juridisk (Svært høy vekt):** Dette utgjør kjernen i kapabiliteten og innebærer
      å foreslå og koordinere endringer i regelverket for å tilpasse det til teknologisk
      utvikling og nye behov. Det inkluderer eine systematisk tilnærming til å identifisere
      motstridende regelverk der harmonisering er nødvendig, og fremme endringer for
      å tilpasse lovverket til en digital virkelighet.

      - **Organisatorisk (Høy vekt):** Etablere tverrgående prosesser og samarbeidsarenaer
      mellom departementer, etater og lovgivere for å koordinere lovarbeid. Dette
      sikrer at endringsforslag ikke utformes i isolerte siloer, men tar høyde for
      tverrsektorielle behov og felles nasjonale mål.

      - **Semantisk (Middels vekt):** Sikre at juridiske begreper, definisjoner og
      hjemler i nye lover utformes på en måte som er entydig og harmonisert på tvers
      av sektorer, slik at de understøtter felles begrepsforståelse og automatisert
      saksbehandling.

      - **Teknisk (Lav vekt):** Legge til rette for digitaliseringsvennlig regelverk,
      der lover og forskrifter utformes med tanke på at de senere skal kunne omsettes
      til maskinlesbar logikk, kode og automatiserte forretningsregler i økosystemet.


      ### Bidrag til sammenhengende tjenester og felles økosystem

      Kapabiliteten rydder bort de juridiske hindringene og harmoniserer motstridende
      regelverk, slik at data lovlig kan flyte mellom uavhengige virksomheter i en
      tjenestekjede. Dette gjør det mulig å fjerne manuelle dokumentasjonskrav for
      innbyggere og næringsliv, og baner vei for helautomatiserte og proaktive brukeropplevelser.

      '
    properties: {}
    folder_path: *id002
  id-b2aafe1f4c534db6b92c40b1eef605f2:
    type: Capability
    name: Representasjon
    documentation: "Evne til å kunne opptre eller utføre handlinger digitalt på vegne\
      \ av andre. \n\n### Begrunnelse (Hvorfor)\nKapabiliteten gjør det mulig å etablere,\
      \ validere, forvalte og dokumentere representasjonsforhold mellom en representant\
      \ og en representert, slik at rettigheter og myndighet kan utøves på vegne av\
      \ andre i henhold til lovverk, fullmakter eller vedtak.\n\nRepresentasjon betyr\
      \ at en person eller virksomhet har rett til å handle på vegne av en annen person\
      \ eller virksomhet på en slik måte at den representerte blir bundet av handlingen.\
      \ Kapabiliteten løser behovet for trygg, sporbar og digital håndtering av slike\
      \ forhold i tjenester og prosesser. Representasjon inkluderer bl.a.\n- Fullmakt\
      \ (avtaleregulert representasjonsforhold), som innebærer kunne gi en viljeserklæringvder\
      \ den som gir fullmakt tildeler en person eller en virksomhet (fullmektigen)\
      \ myndighet til å opptre eller gjøre noe på sine vegne.\n- Vergemål (lovregulert\
      \ representasjonsforhold)\n- Foreldreansvar (lovregulert representasjonsforhold)\n\
      \n### Hva det innebærer (Omfang)\n- **Juridisk (Svært høy vekt):** Håndtere\
      \ representasjonsforhold som følger av lovverk, fullmakter eller vedtak, herunder\
      \ fullmakt, vergemål og foreldreansvar.\n- **Organisatorisk (Høy vekt):** Etablere\
      \ rutiner for å opprette, delegere, administrere, validere, dokumentere og tilbakekalle\
      \ representasjonsforhold og digitale fullmakter.\n- **Semantisk (Høy vekt):**\
      \ Skille tydelig mellom representant, representert, fullmektig, fullmaktsgiver,\
      \ verge, foreldreansvar og andre roller, slik at myndighet og ansvar forstås\
      \ likt på tvers av tjenester.\n- **Teknisk (Høy vekt):** Sikre integrasjon med\
      \ autoritative kilder for representasjon, for eksempel Enhetsregisteret, vergemålsinformasjon\
      \ og foreldreansvar, samt mekanismer for tilgangskontroll, sporbarhet og oversikt.\n\
      \n### Bidrag til sammenhengende tjenester og felles økosystem\nRepresentasjon\
      \ gjør det mulig for innbyggere og virksomheter å få hjelp, delegere myndighet\
      \ og opptre digitalt på vegne av andre på en kontrollert måte. Dette er nødvendig\
      \ i mange sammenhengende tjenester der en bruker ikke alltid handler som privatperson,\
      \ men som verge, forelder, ansatt, daglig leder, regnskapsfører eller annen\
      \ representant.\n\nKapabiliteten styrker det felles økosystemet ved å gi felles\
      \ mekanismer for å dokumentere hvem som kan opptre på vegne av hvem. Det gir\
      \ bedre sporbarhet, økt tillit og mer helhetlige tjenester der rettigheter kan\
      \ utøves på tvers av virksomheter uten manuelle fullmaktsprosesser.\n\n"
    properties: {}
    folder_path: *id002
  id-e67a4f2983ce40f9823ec34ba460055a:
    type: Capability
    name: Samarbeid
    documentation: 'Evne til å samarbeid og samhandling på tvers av offentlig og privat
      forvaltning.


      ### Begrunnelse (Hvorfor)

      Sammenhengende tjenester kan ikke bygges i isolasjon. Aktørene i økosystemet
      må fungere som ett lag for å løse felles utfordringer, unngå dobbeltarbeid og
      bryte ned silotenking. Denne overordnede pilaren eksisterer for å sikre helhetlig
      samfunnsverdi og felles strategisk retning. Den løser problemet med at virksomheter
      prioriterer interne oppgaver fremfor tverrgående brukerreiser.


      ### Hva det innebærer (Omfang)

      - **Organisatorisk (Svært høy vekt):** Overordnede styringsmodeller, samstyring
      og finansiering koordinerer samhandlingsmodeller og avtaler for å tilpasse tjenestekjeder
      og prosesser.


      ### Bidrag til sammenhengende tjenester og felles økosystem

      Kapabiliteten bygger bro mellom organisatoriske siloer og sikrer overordnet
      strategisk koordinering. Når man er enige om prioriteringer, økonomi og spilleregler
      på forhånd, sikres et tydelig mandat for samarbeid. Dette gir de operative teamene
      fundamentet de trenger for å binde tjenester sammen til en uavbrutt og guidet
      reise, slik at sluttbrukeren opplever forvaltningen som én samordnet aktør.



      '
    properties: {}
    folder_path: *id002
  id-b4a86e2e430c472b9f74bedb7f66fd74:
    type: Capability
    name: Samarbeidsarenaer og nettverk
    documentation: 'Evne til å effektivisere, etablere, forvalte og fasilitere arenaer,
      nettverk og prosesser som fremmer kunnskapsdeling, dialog og samordning på tvers
      av virksomheter i økosystemet.


      ### Begrunnelse (Hvorfor)

      Sammenhengende tjenester kan ikke bygges i isolasjon. Aktørene i økosystemet
      må møtes for å dele erfaringer, løse felles utfordringer og samordne planer.
      Denne kapabiliteten sikrer velfungerende møteplasser som reduserer dobbeltarbeid,
      motvirker silotenking og gjør det mulig å koordinere utvikling på tvers av virksomheter.


      ### Hva det innebærer (Omfang)

      - **Organisatorisk (Svært høy vekt):** Sette opp og drifte konkrete nettverk,
      faggrupper og forum. Avklare roller, mandater og spilleregler for deltakelse,
      samt sikre at arbeidet er forankret hos ledelsen i virksomhetene.

      - **Semantisk (Middels vekt):** Bruke arenaene til å bygge felles kultur, terminologi
      og forståelse mellom arkitekter, jurister, utviklere og fagmiljøer fra ulike
      sektorer.


      ### Bidrag til sammenhengende tjenester og felles økosystem

      Når fagfolk møtes på tvers av organisasjoner, blir det lettere å oppdage hvor
      tjenester berører hverandre. Arenaene bidrar til å identifisere nye tverrgående
      brukerreiser, dele erfaringer og koordinere endringer i økosystemet. Dette gir
      bedre grunnlag for sammenhengende tjenester og gjør at virksomhetene kan utvikle
      løsninger som henger bedre sammen for sluttbrukeren.


      '
    properties: {}
    folder_path: *id002
  id-0aa7eced8c5c460f8bc64b77bd6a16c4:
    type: Capability
    name: Sammenhengende tjenester
    documentation: 'Evne til å levere en digital brukerorienterte tjenester som fremstår
      som en logisk og uavbrutt prosess for brukeren, selv når den involverer og koordinerer
      handlinger og tjenester fra flere, uavhengige virksomheter.


      ### Begrunnelse (Hvorfor)

      Når digitale tjenester er splittet opp mellom ulike uavhengige etater, blir
      brukeren ofte stående som en manuell budbringer av egne data mellom systemene.
      Denne underkapabiliteten løser det funksjonelle problemet med fragmenterte brukeropplevelser,
      brutte digitale reiser og silobaserte prosesser. Den sikrer at den bakenforliggende
      kompleksiteten i forvaltningen skjules helt, slik at brukeren opplever en helhetlig
      offentlig sektor.


      ### Hva det innebærer (Omfang)

      - **Juridisk (Middels vekt):** Harmoniserte avklaringsprosesser under forvaltningsloven
      og personopplysningsloven sikrer det rettslige fundamentet for tverretatlig
      datadeling.

      - **Organisatorisk (Svært høy vekt):** Utforming av tverrgående arbeidsprosesser
      understøtter en uavbrutt og guidet reise der brukeren ledes steg-for-steg uten
      å måtte forholde seg til statlige eller kommunale grenser.

      - **Semantisk (Middels vekt):** Operasjonalisering av "kun én gang"-prinsippet
      sikrer at oppgitte data gjenbrukes via felles informasjonsmodeller.

      - **Teknisk (Høy vekt):** Teknisk integrasjon via standardiserte grensesnitt
      (API-er) og fellesløsninger sikrer at data deles og gjenbrukes.


      ### Bidrag til sammenhengende tjenester og felles økosystem

      Kapabiliteten er selve nøkkelen til at innbyggere og næringsliv skal oppleve
      forvaltningen som én samordnet aktør. Ved å binde uavhengige tjenester sammen
      til flytende kjeder, elimineres behovet for at brukeren må gjenta informasjon
      eller lete etter neste saksbehandlingssteg. Dette reduserer tidsbruk og feil,
      noe som gir et vesentlig mer ressurseffektivt felles økosystem.'
    properties: {}
    folder_path: *id002
  id-7e3d1d3396914d65a177c9d5346d6feb:
    type: Capability
    name: Sammenstilling av data
    documentation: 'Evne til å hente, kombinere og foredle data fra ulike kilder for
      å skape ny innsikt, et helhetlig beslutningsgrunnlag, eller sammenhengende tjenester
      for brukeren.


      ### Begrunnelse (Hvorfor)

      Kapabiliteten gjør det mulig å skape ny verdi ved å kombinere data fra flere
      kilder. Den løser problemet med at beslutninger, analyser og tjenester ofte
      bygger på fragmenterte datagrunnlag som ikke gir et helhetlig bilde av brukerens
      situasjon, virksomhetens behov eller en tverrgående tjenestekjede.


      ### Hva det innebærer (Omfang)

      - **Juridisk (Middels vekt):** Avklare behandlingsgrunnlag, formål, tilgangsrettigheter,
      dataminimering og ansvar når data fra ulike kilder kombineres.

      - **Organisatorisk (Høy vekt):** Etablere rutiner for å identifisere relevante
      datakilder, avklare eierskap, sikre kvalitet og bruke sammenstilte data i beslutninger,
      analyser og tjenesteprosesser.

      - **Semantisk (Svært høy vekt):** Harmonisere begreper, metadata, klassifikasjoner,
      informasjonsmodeller og datakvalitet slik at data fra ulike kilder kan tolkes
      korrekt samlet.

      - **Teknisk (Høy vekt):** Bruke standardiserte grensesnitt, dataplattformer,
      integrasjonsmønstre og behandlingsløp for å hente, koble, transformere og foredle
      data på en sikker og sporbar måte.


      ### Bidrag til sammenhengende tjenester og felles økosystem

      Kapabiliteten gjør det mulig å bygge tjenester og beslutningsgrunnlag på et
      helhetlig databilde, ikke bare på opplysninger fra én virksomhet eller ett system.
      Når data kan hentes, kombineres og foredles på tvers, blir det enklere å forstå
      brukerens situasjon, forutse behov og tilby mer treffsikre tjenester. For det
      felles økosystemet bidrar kapabiliteten til bedre datadrevet styring, mer gjenbruk
      av eksisterende data og mer sammenhengende tjenestekjeder.'
    properties: {}
    folder_path: *id002
  id-034543e002414306a8fbecc8c9d8e496:
    type: Capability
    name: Samordning
    documentation: 'Evne til å harmonisere og koordinere strategisk retning, beslutninger
      og ressursbruk på tvers av virksomheter, for å realisere felles samfunnsmål
      og sammenhengende tjenester.


      ### Begrunnelse (Hvorfor)

      For å lykkes med sammenhengende digitale tjenester kan ikke virksomheter lenger
      optimalisere kun for seg selv. Kapabiliteten krever en tydelig styring eller
      et mandat som forplikter uavhengige aktører til å tilpasse seg hverandre, slik
      at offentlig sektor kan opptre koordinert og effektivt.


      ### Hva det innebærer (Omfang)

      - **Juridisk:** Å sørge for at juss og forvaltningspraksis i ulike virksomheter
      er kompatible, slik at det rettslige hjemmelsgrunnlaget for deling av data er
      på plass (f.eks. mellom Skatteetaten og NAV).

      - **Organisatorisk:** Å sørge for felles arbeidsprosesser og en tydelig ansvarsfordeling
      mellom de samhandlende virksomhetene for å definere stegene i en tjenestekjede.

      - **Semantisk:** Å sørge for en omforent og felles forståelse av hva dataene
      betyr (f.eks. at begrepet "ansatt" betyr det samme i to ulike systemer), slik
      at maskiner kan forstå hverandre.

      - **Teknisk:** Å sørge for at felles standarder og nasjonale fellesløsninger
      blir tatt i bruk, fremfor at virksomheter bygger egne, proprietære løsninger.


      ### Bidrag til sammenhengende tjenester og felles økosystem

      Samordning kobler strategi, arkitektur, beslutninger og ressurser på tvers,
      slik at offentlig sektor kan levere helhetlige tjenester rundt brukerens behov.

      '
    properties: {}
    folder_path: *id002
  id-809f454dc4024d56ab54079252fdfe29:
    type: Capability
    name: Samtykke
    documentation: 'Evne til å akseptere, godkjenne eller gi tillatelse til at en
      handling kan foretas på vegne av seg selv eller andre, der det foreligger et
      representasjonsforhold.


      ### Begrunnelse (Hvorfor)

      Kapabiliteten gjør det mulig å innhente, administrere og dokumentere gyldige,
      frivillige og informerte samtykker fra personer for behandling og deling av
      deres opplysninger. Den sikrer at samtykker kan gis, spores og enkelt trekkes
      tilbake.


      Et samtykke er en aktiv, frivillig og informert viljeserklæring fra en person
      som gir en annen part tillatelse til å utføre en bestemt handling som berører
      dem eller deres data. Samtykke er i utgangspunktet ikke en formell form for
      representasjon, men det kan oppstå situasjoner der en representant må gi et
      samtykke på vegne av den de representerer.

      Eksempler:

      - Jeg gir noen lov til å gjøre noe overfor meg eller med mine data. Handlingen
      er rettet mot meg selv eller min sfære.

      - Jeg gir Altinn (tjenesteyter) lov til å hente mine skattedata. Altinn handler
      ikke på mine vegne, de utfører en handling jeg har gitt dem tillatelse til.

      Det kan oppstå situasjoner der en representant må gi et samtykke på vegne av
      den de representerer.

      Eksempel: En verge (representant) gir samtykke til en medisinsk behandling for
      et barn (den representerte).

      I dette tilfellet ser vi hvordan konseptene virker sammen: Vergen utøver sin
      representasjonsrett til å avgi et samtykke på vegne av barnet. Men selve samtykket
      og representasjonen er fortsatt to distinkte juridiske handlinger.


      ### Hva det innebærer (Omfang)

      - **Juridisk (Svært høy vekt):** Sikre at samtykker er gyldige, frivillige,
      informerte, dokumenterte og mulige å trekke tilbake, i tråd med personvernregelverket
      og relevante regler for representasjon.

      - **Organisatorisk (Høy vekt):** Etablere rutiner for innhenting, administrasjon,
      kontroll, tilbaketrekking og dokumentasjon av samtykker i tjenesteprosesser.

      - **Semantisk (Høy vekt):** Skille tydelig mellom samtykke, representasjon,
      fullmakt, tillatelse og godkjenning, slik at aktørene forstår hvilken juridisk
      handling som faktisk utføres.

      - **Teknisk (Høy vekt):** Tilby mekanismer for digital innhenting, lagring,
      validering, logging, oppslag og tilbaketrekking av samtykker, med sporbarhet
      og kobling til relevante tjenester, data og representasjonsforhold.


      ### Bidrag til sammenhengende tjenester og felles økosystem

      Samtykke gjør det mulig å dele og bruke opplysninger på en kontrollert måte
      når brukeren selv gir tillatelse til en handling som berører dem eller deres
      data. For eksempel kan en person gi en tjenesteyter lov til å hente skattedata
      uten at tjenesteyteren handler på personens vegne.


      Kapabiliteten styrker sammenhengende tjenester ved å gjøre det mulig å dokumentere
      og etterprøve at data brukes med riktig tillatelse. Den støtter også situasjoner
      der en representant, for eksempel en verge, gir samtykke på vegne av den representerte.
      For det felles økosystemet gir dette bedre tillit, sporbarhet og mer forutsigbar
      samhandling på tvers av virksomheter.'
    properties: {}
    folder_path: *id002
  id-711390c3ddaa4b67914ccbcc2f1831aa:
    type: Capability
    name: Sanntidsdata
    documentation: 'Evne til å sikkert prosessere og distribuere kontinuerlige datastrømmer
      for å muliggjøre sanntidsinnsikt, automatisering og umiddelbar respons.


      ### Begrunnelse (Hvorfor)

      Kapabiliteten gjør det mulig å bruke data mens de oppstår, ikke først etter
      at de er samlet inn, lagret og analysert i etterkant. Den løser behovet for
      umiddelbar innsikt, automatisering og rask respons i tjenester og prosesser
      som er avhengige av kontinuerlige datastrømmer fra sensorer, tingenes internett
      (IoT) og andre hendelseskilder.


      ### Hva det innebærer (Omfang)

      - **Juridisk (Middels vekt):** Avklare behandlingsgrunnlag, formål, tilgang,
      lagringstid og ansvar når sanntidsdata inneholder personopplysninger, sikkerhetskritisk
      informasjon eller andre beskyttede data.

      - **Organisatorisk (Høy vekt):** Etablere rutiner for overvåking, varsling,
      hendelseshåndtering og operativ oppfølging når sanntidsdata brukes i tjenester,
      beslutninger og automatiserte prosesser.

      - **Semantisk (Høy vekt):** Sikre felles forståelse av datastrømmer, måleverdier,
      hendelser, tidsstempler, lokasjon, kvalitet og metadata, slik at sanntidsdata
      tolkes korrekt på tvers av systemer og virksomheter.

      - **Teknisk (Svært høy vekt):** Tilby data fra sensorer, tingenes internett
      (IoT) og andre hendelseskilder gjennom skalerbar infrastruktur for strømming,
      prosessering, filtrering, sikker distribusjon, overvåking og feilhåndtering.


      ### Bidrag til sammenhengende tjenester og felles økosystem

      Sanntidsdata gjør det mulig å reagere på endringer idet de skjer. Det gir grunnlag
      for automatiserte varsler, dynamisk ressursstyring, løpende situasjonsforståelse
      og tjenester som tilpasser seg brukerens eller samfunnets behov i øyeblikket.


      Kapabiliteten styrker sammenhengende tjenester ved at flere aktører kan bygge
      på samme oppdaterte situasjonsbilde. For sluttbrukeren kan dette gi raskere
      respons, mer presis veiledning og tjenester som oppleves mer relevante og proaktive.
      For det felles økosystemet gir det bedre datadrevet styring, mer effektiv samhandling
      og økt evne til å håndtere hendelser på tvers av virksomheter.'
    properties: {}
    folder_path: *id002
  id-f5214c3db8de4738ab03abb7b7e553ed:
    type: Capability
    name: Signering
    documentation: 'Evne til juridisk bindende signerering av dokumenter eller transaksjoner.


      ### Begrunnelse (Hvorfor)

      Kapabiliteten sikrer at digitale signaturer er juridisk gyldige, ikke bare i
      dag, men også i fremtiden. Den løser behovet for å binde en person eller virksomhet
      rettslig til et dokument eller en transaksjon på en måte som kan dokumenteres
      og etterprøves over tid.


      Signering gir juridisk forpliktelse ved at en person eller virksomhet bindes
      til et dokument eller en transaksjon på rettslig grunnlag. Kapabiliteten skal
      også sikre langvarig bevisverdi, slik at det i ettertid kan bevises at signaturen
      var gyldig da den ble avlagt, selv om for eksempel personens eID-sertifikat
      senere har utløpt.


      ### Hva det innebærer (Omfang)

      - **Juridisk (Svært høy vekt):** Sikre juridisk bindende signering av dokumenter
      og transaksjoner i tråd med relevant regelverk, inkludert eIDAS-krav til elektroniske
      signaturer og signeringsnære tillitstjenester.

      - **Organisatorisk (Middels vekt):** Etablere rutiner for bruk, forvaltning
      og kontroll av elektronisk signering i tjenesteprosesser, inkludert ansvar for
      dokumentasjon, arkivering og etterprøvbarhet.

      - **Semantisk (Middels vekt):** Sikre felles forståelse av begreper som signatur,
      juridisk forpliktelse, kvalifisert tidsstempling, sertifikat, uavviselighet
      og langsiktig bevisverdi.

      - **Teknisk (Høy vekt):** Forvalte fellesløsninger for elektronisk signatur,
      inkludert kvalifisert tidsstempling, sertifikathåndtering og mekanismer for
      Long-Term Validation (LTV). Systemet må låse signaturen med et offisielt tidsstempel
      slik at gyldighet kan dokumenteres også etter at sertifikater er utløpt eller
      trukket tilbake.


      ### Bidrag til sammenhengende tjenester og felles økosystem

      Signering gjør det mulig å gjennomføre rettslig bindende handlinger digitalt
      på tvers av virksomheter og tjenestekjeder. Når dokumenter og transaksjoner
      kan signeres med langvarig bevisverdi, kan tjenester fullføres digitalt uten
      papirbaserte prosesser eller manuell etterkontroll.


      Kapabiliteten styrker det felles økosystemet ved å gi felles mekanismer for
      uavviselighet, sporbarhet og juridisk bevisverdi. For sluttbrukeren betyr dette
      tryggere og mer effektive digitale tjenester der avtaler, søknader, vedtak og
      andre rettslige handlinger kan gjennomføres sømløst på tvers av offentlige og
      private aktører.'
    properties: {}
    folder_path: *id002
  id-34d3d64b3afe4327a29ee6c2f7f74dff:
    type: Capability
    name: Sikring av informasjonsflyt og datautveksling
    documentation: "Evne til å sikre at informasjon som utveksles mellom virksomheter\
      \ er beskyttet mot innsyn og manipulering, og at dataflyten er kontrollert gjennom\
      \ nødvendige tekniske og organisatoriske tiltak.\n\nDette innebærer:\n* Det\
      \ offentlige skal kunne garantere at dataene er trygge når de sendes fra ett\
      \ system til et annet.\n* Konfidensialitet: Informasjonen krypteres og sikres\
      \ slik at uvedkommende ikke kan lese dataene. \n* Integritet: Det brukes tekniske\
      \ mekanismer som oppdager og hindrer at dataene blir endret, slettet eller manipulert\
      \ på veien fra avsender til mottaker.\n* Trafikkstyring: Virksomhetene har kontroll\
      \ på nøyaktig hvor dataene sendes, hvem som har lov til å motta dem\n\n### Begrunnelse\
      \ (Hvorfor)\nKapabiliteten sikrer at det offentlige kan garantere at dataene\
      \ er trygge når de sendes fra ett system til et annet. Den løser behovet for\
      \ kontrollert og sikker informasjonsflyt mellom virksomheter, slik at data ikke\
      \ blir lest, endret, slettet eller manipulert av uvedkommende under utveksling.\n\
      \nKapabiliteten er nødvendig for å opprettholde tillit til digital samhandling,\
      \ særlig når informasjon deles på tvers av virksomheter, sektorer og tjenestekjeder.\n\
      \n### Hva det innebærer (Omfang)\n- **Juridisk (Høy vekt):** Sikre at informasjonsutveksling\
      \ skjer i tråd med krav til personvern, taushetsplikt, informasjonssikkerhet,\
      \ behandlingsgrunnlag, ansvar og lovlig deling av data.\n- **Organisatorisk\
      \ (Høy vekt):** Etablere rutiner, ansvar og kontrollmekanismer for sikker dataflyt,\
      \ inkludert avklaringer om hvem som kan sende, motta og behandle informasjon.\n\
      - **Semantisk (Middels vekt):** Bruke klassifisering, metadata og felles forståelse\
      \ av beskyttelsesbehov, slik at aktørene vet hvilke sikkerhetskrav som gjelder\
      \ for informasjonen som utveksles.\n- **Teknisk (Svært høy vekt):** Sikre konfidensialitet\
      \ gjennom kryptering og beskyttelse mot uautorisert innsyn. Sikre integritet\
      \ gjennom tekniske mekanismer som oppdager og hindrer at data blir endret, slettet\
      \ eller manipulert på vei fra avsender til mottaker. Sikre trafikkstyring slik\
      \ at virksomhetene har kontroll på hvor data sendes og hvem som har lov til\
      \ å motta dem.\n\n### Bidrag til sammenhengende tjenester og felles økosystem\n\
      Sikring av informasjonsflyt og datautveksling gjør det mulig å dele data på\
      \ tvers av virksomheter uten å svekke konfidensialitet, integritet eller kontroll.\
      \ Når informasjon kan utveksles trygt, kan flere aktører inngå i samme tjenestekjede\
      \ og bruke hverandres data med nødvendig tillit.\n\nKapabiliteten styrker det\
      \ felles økosystemet ved å redusere risiko ved datadeling og gjøre sikker samhandling\
      \ mer forutsigbar. For sluttbrukeren betyr dette tryggere og mer sammenhengende\
      \ tjenester, der opplysninger kan flyte mellom relevante aktører uten at brukeren\
      \ selv må bære informasjonen mellom dem.\n"
    properties: {}
    folder_path: *id002
  id-1be148b57796458993c3f7f5f24815ca:
    type: Capability
    name: Sluttbrukertjenester
    documentation: 'Evne til å tilby en sammenhengende digital brukeropplevelse gjennom
      et økosystem av standardiserte og integrerbare tjenester.


      ### Begrunnelse (Hvorfor)

      Kapabiliteten sikrer at innbyggere, næringsliv og andre sluttbrukere møter offentlige
      digitale tjenester som en helhetlig brukeropplevelse, selv om tjenestene leveres
      av flere uavhengige virksomheter. Den fungerer som en strategisk paraply for
      brukerorienterte, sammenhengende og proaktive tjenester som bygger på felles
      data, integrerbare tjenester og standardiserte samhandlingsmønstre.


      ### Hva det innebærer (Omfang)

      - **Juridisk (Middels vekt):** Overordnede rammer for rettigheter, plikter,
      personvern, universell utforming og digital kommunikasjon må sikre at sluttbrukertjenester
      kan tilbys trygt og lovlig på tvers av virksomheter.

      - **Organisatorisk (Svært høy vekt):** Felles styring, tjenesteeierskap, brukerorienterte
      arbeidsprosesser og tverrgående ansvar må sikre at tjenestene oppleves helhetlige
      fra brukerens ståsted.

      - **Semantisk (Høy vekt):** Felles begreper, tjenestebeskrivelser, informasjonsmodeller
      og brukerrettet språk må sikre at innhold og veiledning forstås likt på tvers
      av tjenestene.

      - **Teknisk (Høy vekt):** Standardiserte og integrerbare tjenester, API-er,
      fellesløsninger og sikre digitale kanaler må gjøre det mulig å bygge en sammenhengende
      brukeropplevelse på tvers av systemer.


      ### Bidrag til sammenhengende tjenester og felles økosystem

      Kapabiliteten gjør sluttbrukerens behov til utgangspunktet for hvordan tjenester
      settes sammen i økosystemet. Når offentlige tjenester bygger på standardiserte
      og integrerbare byggeklosser, kan brukeren få en mer sømløs reise der informasjon,
      veiledning og handlinger henger sammen på tvers av virksomheter. Dette styrker
      det felles økosystemet ved å fremme gjenbruk, redusere fragmentering og gjøre
      det enklere å utvikle tjenester som oppleves som én samlet offentlig sektor.'
    properties: {}
    folder_path: *id002
  id-2dfe07b3eae740b9a292e0a4a42d22db:
    type: Capability
    name: Sporbarhet og innsyn
    documentation: 'Evne til dokumentasjon og logging av oppysninger for bruk i innsyn,
      forvaltning og kontroll av tillitstjenester.


      ### Begrunnelse (Hvorfor)

      Kapabiliteten sikrer at opplysninger, digitale hendelser og transaksjoner kan
      dokumenteres, logges og etterprøves for å støtte innsyn, kontroll og juridisk
      etterredelighet. Den løser behovet for at innbyggere, virksomheter og kontrollorganer
      kan se hvem som gjorde hva, når det skjedde, og at tillitstjenestene ble brukt
      på riktig måte.


      ### Hva det innebærer (Omfang)

      - **Juridisk (Høy vekt):** Sikre juridisk etterprøvbarhet, innsyn, dokumentasjon
      og kontroll i tråd med krav til personvern, arkivering, sporbarhet, bevisverdi
      og ansvarlig bruk av tillitstjenester.

      - **Organisatorisk (Høy vekt):** Etablere rutiner for logging, kontroll, revisjon,
      innsynshåndtering og oppfølging av avvik i bruk av opplysninger, digitale hendelser
      og transaksjoner.

      - **Semantisk (Middels vekt):** Sikre felles forståelse av logghendelser, transaksjoner,
      oppslag, aktører, tidspunkt, formål og behandlingskontekst, slik at sporbarheten
      kan tolkes korrekt.

      - **Teknisk (Svært høy vekt):** Etablere uforanderlige transaksjonslogger der
      alle hendelser, oppslag og transaksjoner loggføres automatisk på en måte som
      hindrer sletting eller manipulering i ettertid.


      ### Bidrag til sammenhengende tjenester og felles økosystem

      Sporbarhet og innsyn gir tillit til at data, rettigheter og tillitstjenester
      brukes korrekt på tvers av virksomheter. Når bruk av opplysninger og digitale
      handlinger kan dokumenteres og etterprøves, blir det tryggere å koble tjenester
      sammen i felles tjenestekjeder.


      Kapabiliteten styrker det felles økosystemet ved å gjøre samhandling mer transparent,
      kontrollerbar og etterrettelig. For sluttbrukeren betyr dette bedre innsyn i
      egne data og handlinger, og større trygghet for at digitale tjenester brukes
      i tråd med regelverk, formål og forventninger.'
    properties: {}
    folder_path: *id002
  id-c3f87c86b19547359c677a333b16f03b:
    type: Capability
    name: Standardisering
    documentation: 'Evne til å identifisere, vedta, forvalte og fremme bruk av omforente
      standarder og spesifikasjoner som sikrer interoperabilitet og gjenbruk på tvers
      av sektorer og landegrenser.


      ### Begrunnelse (Hvorfor)

      Kapabiliteten sikrer at virksomheter i økosystemet bygger tjenester, løsninger
      og informasjonsutveksling på omforente standarder og spesifikasjoner. Den reduserer
      lokale avvik, særtilpasninger og teknisk fragmentering, og gjør det mulig å
      oppnå interoperabilitet og gjenbruk på tvers av sektorer og landegrenser.


      ### Hva det innebærer (Omfang)

      - **Juridisk (Middels vekt):** Nasjonale føringer, forskrifter og EU-harmoniserte
      standarder må gi forutsigbare rammer for hvilke standarder som skal eller bør
      brukes.

      - **Organisatorisk (Svært høy vekt):** Livssyklusforvaltning må sikre prosesser
      for å vurdere nye standarder, vedlikeholde eksisterende og fase ut foreldede
      standarder i takt med teknologisk utvikling.

      - **Semantisk (Høy vekt):** Harmonisering må sikre at nasjonale standarder er
      i samsvar med internasjonale standarder, slik at begreper, data og tjenester
      kan forstås på tvers.

      - **Teknisk (Høy vekt):** Standarder og spesifikasjoner må gjøre det mulig å
      bygge tekniske grensesnitt, formater og løsninger som fungerer sammen og kan
      gjenbrukes.


      ### Bidrag til sammenhengende tjenester og felles økosystem

      Standardisering gjør det enklere å utvikle tjenester og løsninger som passer
      sammen på tvers av virksomheter, sektorer og landegrenser. Veiledning gjør standardene
      tilgjengelige og forståelige, slik at de enklere kan implementeres i tjenester
      og løsninger.


      Kapabiliteten styrker det felles økosystemet ved å legge til rette for etterlevelse,
      slik at fellesløsninger og virksomheter faktisk tar i bruk vedtatte forvaltningsstandarder
      i anskaffelser og utviklingsløp. For sluttbrukeren betyr dette mer stabile,
      forutsigbare og sammenhengende tjenester, der digitale løsninger følger samme
      samhandlingsmønstre og lettere kan kobles sammen.'
    properties: {}
    folder_path: *id002
  id-682d96a51e604ed2a00e1f4824023bab:
    type: Capability
    name: Strategisk styring
    documentation: 'Evne til å sette retning for nasjonal arkitektur og realisere
      strategiske mål.


      ### Begrunnelse (Hvorfor)

      Digitalisering på tvers av sektorer krever felles koordinering og en overordnet
      retning. Uten strategisk styring blir offentlige tiltak fragmenterte, silobaserte
      og suboptimalt koordinert. Denne hovedkapabiliteten fungerer som en felles paraply
      for finansiering, samordning og nasjonal arkitekturstyring. Den sikrer sterkere
      styring for å realisere nasjonale mål. Den løser problemet med at uavhengige
      virksomheter optimaliserer for seg selv fremfor tverrgående helhet.


      ### Hva det innebærer (Omfang)

      - **Juridisk (Middels vekt):** Overordnede regulatoriske rammeverk, nasjonale
      digitaliseringsstrategier og føringer som forplikter aktører til samhandling.

      - **Organisatorisk (Svært høy vekt):** Etablering av overordnede nasjonale styringsmodeller
      (governance), samstyringsstrukturer, finansieringsordninger og tverrgående porteføljestyring.

      - **Semantisk (Middels vekt):** Harmonisering av strategiske mål, felles prinsipper
      og nasjonale referansemodeller for en omforent forståelse i økosystemet.

      - **Teknisk (Middels vekt):** Overordnet plattformstrategi og nasjonale veikart
      som sikrer en produktstrategisk retning for felles teknologisk infrastruktur.


      ### Bidrag til sammenhengende tjenester og felles økosystem

      Kapabiliteten samordner strategiske beslutninger og ressursbruk på tvers av
      uavhengige virksomheter og forvaltningsnivåer. Den sikrer at nasjonale fellesløsninger,
      standarder og investeringer trekker i samme retning. Dette gir det nødvendige
      mandatet for å utvikle og binde sammen digitale tjenestekjeder. For sluttbrukeren
      betyr dette en koordinert offentlig sektor som tilbyr en helhetlig og sømløs
      brukeropplevelse.'
    properties: {}
    folder_path: *id002
  id-980043f78fa94eec8ecf46338a5b9c6b:
    type: Capability
    name: Styringssystem
    documentation: 'Evne til å evaluere, forbedre, fornye styringssystem for informasjonssikkerhet.


      ### Begrunnelse (Hvorfor)

      Kapabiliteten sikrer at virksomheten systematisk vurderer hvordan det nåværende
      sikkerhetsstyringssystemet fungerer, identifiserer forbedringsområder og tilpasser
      eller oppdaterer systemet for å møte nye trusler, sårbarheter og endringer i
      virksomhetens behov eller omgivelser.


      Den løser behovet for kontinuerlig forbedring av informasjonssikkerheten, slik
      at sikkerhetstiltak ikke blir statiske, utdaterte eller utilstrekkelige i møte
      med endringer i risiko, teknologi, regelverk og tjenestekjeder.


      ### Hva det innebærer (Omfang)

      - **Juridisk (Høy vekt):** Sikre at styringssystemet understøtter etterlevelse
      av krav til informasjonssikkerhet, personvern, internkontroll, risikostyring,
      dokumentasjon og ansvar.

      - **Organisatorisk (Svært høy vekt):** Gjennomføre regelmessige risikovurderinger,
      kontrollere om sikkerhetstiltak er effektive og implementere tiltak for å lukke
      identifiserte sikkerhetsgap.

      - **Semantisk (Middels vekt):** Sikre felles forståelse av risiko, trusler,
      sårbarheter, sikkerhetstiltak, avvik, kontrollmål og modenhetsnivå, slik at
      vurderinger og rapportering kan sammenlignes på tvers.

      - **Teknisk (Høy vekt):** Bruke verktøy og mekanismer for risikoregistrering,
      avvikshåndtering, kontrolloppfølging, måling av sikkerhetstilstand, dokumentasjon
      og overvåking av tekniske sikkerhetstiltak.


      ### Bidrag til sammenhengende tjenester og felles økosystem

      Et velfungerende styringssystem for informasjonssikkerhet gir virksomheter bedre
      kontroll på risiko og sikkerhetstiltak når de inngår i felles tjenestekjeder.
      Når sikkerhet vurderes, forbedres og dokumenteres systematisk, blir det tryggere
      å dele data, bruke fellesløsninger og koble tjenester sammen på tvers av virksomheter.


      Kapabiliteten styrker det felles økosystemet ved å øke tilliten til at aktørene
      håndterer informasjonssikkerhet på en strukturert og etterprøvbar måte. For
      sluttbrukeren betyr dette tryggere og mer stabile digitale tjenester, der informasjon
      beskyttes også når den flyter mellom flere aktører.'
    properties: {}
    folder_path: *id002
  id-68ec332ee94c483e878a3a2ae903863f:
    type: Capability
    name: Testdata
    documentation: 'Evne til å generere og tilgjengeliggjøre representative og personvernsikre
      datasett.


      ### Begrunnelse (Hvorfor)

      Kapabiliteten sikrer at virksomheter kan operere med datasett som speiler kompleksiteten
      og de statistiske egenskapene til reelle produksjonsdata, uten at dette medfører
      risiko for personvernet eller krav om omfattende sikkerhetsklareringer. Dette
      muliggjør effektiv systemutvikling, kvalitetssikring og innsiktsarbeid i lukkede
      miljøer.


      I en nasjonal sammenheng er kapabiliteten kritisk for å kunne drive tverrsektoriell
      tjenesteutvikling. Når ulike virksomheter skal samhandle, er tilgang på gode
      testdata ofte en stor flaskehals. Ved å mestre denne kapabiliteten kan man teste
      sammenhengende tjenester uten å utveksle faktiske data mellom systemer i testfasen.


      ### Hva det innebærer (Omfang)

      - **Juridisk (Høy vekt):** Sikre at testdata kan brukes til analyse- og testformål
      uten å eksponere reelle personer eller virksomheter, og at anonymisering, pseudonymisering
      og maskering skjer i tråd med personvernregelverket.

      - **Organisatorisk (Høy vekt):** Etablere rutiner for å bestille, produsere,
      kvalitetssikre, tilgjengeliggjøre og forvalte representative testdatasett for
      utviklings-, test- og analysemiljøer.

      - **Semantisk (Høy vekt):** Sikre at testdata speiler relevante begreper, relasjoner,
      statistiske egenskaper og variasjon i reelle produksjonsdata, slik at tjenestekjeder
      kan testes på en meningsfull måte.

      - **Teknisk (Høy vekt):** Generere og tilgjengeliggjøre ulike typer test- og
      analysedata, for eksempel syntetiske data, anonymiserte data og pseudonymiserte
      eller maskerte data. Dette krever sikre testmiljøer, verktøy for datagenerering
      og mekanismer som hindrer kobling til virkelige personer eller virksomheter.


      ### Bidrag til sammenhengende tjenester og felles økosystem

      Testdata gjør det mulig å utvikle, kvalitetssikre og teste sammenhengende tjenester
      på tvers av virksomheter uten å bruke faktiske produksjonsdata. Dette reduserer
      personvernrisiko, senker terskelen for samarbeid og gjør det enklere å teste
      informasjonsflyt, integrasjoner og tjenestekjeder før de settes i produksjon.


      Kapabiliteten styrker det felles økosystemet ved å gi virksomheter et tryggere
      og mer effektivt grunnlag for felles utvikling, analyse og kvalitetssikring.
      Når representative og personvernsikre datasett er tilgjengelige, kan aktørene
      avdekke feil tidligere, teste samhandling mer realistisk og levere mer robuste
      tjenester til sluttbrukeren.



      '
    properties: {}
    folder_path: *id002
  id-a8a1eb0181f04006ba7d3b5ab2fa9ca8:
    type: Capability
    name: Tilgangskontroll
    documentation: 'Evne til å kontrollere at en bruker har rettighet til å benytte
      angitt ressurs eller tjeneste på vegne av andre eller seg selv.


      ### Begrunnelse (Hvorfor)

      Tilgangskontroll er den operative og tekniske evnen til å verifisere og håndheve
      en brukers rettigheter i sanntid når de forsøker å utføre en handling. Kapabiliteten
      løser behovet for å sikre at bare brukere, representanter, virksomheter eller
      systemer med gyldig rettighet får benytte en angitt ressurs eller tjeneste.


      Tilgangskontroll er den tekniske håndhevelsen av tilgangsstyringen. Tilgangsstyring
      er forutsetningen for god tilgangskontroll.


      ### Hva det innebærer (Omfang)

      - **Juridisk (Høy vekt):** Håndheve rettigheter, fullmakter, roller og tilgangsgrunnlag
      i tråd med gjeldende regelverk, avtaler, behandlingsgrunnlag og krav til personvern
      og taushetsplikt.

      - **Organisatorisk (Høy vekt):** Etablere rutiner for tilgangsforespørsler,
      godkjenning, kontroll, revisjon og tilbakekalling av tilganger, samt avklare
      ansvar mellom tjenesteeier, ressursforvalter og tilgangsforvalter.

      - **Semantisk (Middels vekt):** Sikre felles forståelse av begreper som bruker,
      ressurs, tjeneste, rettighet, rolle, representasjon, delegasjon og kontekst.

      - **Teknisk (Svært høy vekt):** Verifisere og håndheve rettigheter i sanntid
      gjennom autorisasjonsmekanismer, policyregler, tokenvalidering, logging, sporbarhet
      og integrasjon med felles mekanismer for identitet, representasjon og tilgangsstyring.


      ### Bidrag til sammenhengende tjenester og felles økosystem

      Tilgangskontroll gjør det mulig å dele data og funksjonalitet på tvers uten
      å miste kontroll over hvem som kan gjøre hva. Når rettigheter håndheves konsekvent
      i sanntid, kan virksomheter tilby tjenester og API-er til andre aktører på en
      trygg og forutsigbar måte.


      Kapabiliteten styrker sammenhengende tjenester ved å sikre at brukeren, representanten
      eller systemet får riktig tilgang i riktig kontekst, uavhengig av hvilken virksomhet
      som eier ressursen. For sluttbrukeren gir dette tryggere, mer sømløse tjenester
      der tilganger fungerer på tvers av tjenestekjeder uten unødvendige manuelle
      kontroller.'
    properties: {}
    folder_path: *id002
  id-b440252bc3de42dea8468be54e54b1fa:
    type: Capability
    name: Tilgangsstyring
    documentation: 'Evne til å styre og gi tilgang til hvem som har rettighet til
      å benytte en ressurs (tjeneste, system, API, opplysning) på vegne av seg selv,
      andre personer eller virksomheter.


      ### Begrunnelse (Hvorfor)

      Kapabiliteten omfatter hele livssyklusen til en rettighet. Den sikrer at personer,
      virksomheter og systemer får riktig tilgang til riktige ressurser, og at tilgangene
      kan defineres, delegeres, forvaltes, kontrolleres og trekkes tilbake.


      Tilgangsstyring er autorisering. Den er forutsetningen for god tilgangskontroll
      og gjør det mulig å styre hvem som har rett til å benytte en ressurs, tjeneste,
      system, API eller opplysning på vegne av seg selv, andre personer eller virksomheter.


      ### Hva det innebærer (Omfang)

      - **Juridisk (Høy vekt):** Sikre at rettigheter, roller, fullmakter, representasjon
      og tilgangsgrunnlag følger regelverk, avtaler, behandlingsgrunnlag og krav til
      personvern og taushetsplikt.

      - **Organisatorisk (Høy vekt):** Etablere prosesser for å definere roller, delegere
      tilgang, forvalte representasjon, opprettholde oversikt, revidere tilganger
      og trekke dem tilbake ved behov.

      - **Semantisk (Middels vekt):** Sikre felles forståelse av roller, rettigheter,
      delegasjon, representasjon, kontekst og tilgang til ressurser på individnivå,
      virksomhetsnivå og systemnivå.

      - **Teknisk (Svært høy vekt):** Omfatte styring og kontroll av tilganger basert
      på roller, rettigheter og kontekst, for eksempel om bruker opptrer som privatperson
      eller ansatt. Dette dekker også system-til-system-samhandling gjennom nasjonale
      fellesmekanismer for API-sikring og tokenforvaltning, for eksempel Maskinporten.


      ### Bidrag til sammenhengende tjenester og felles økosystem

      Tilgangsstyring gjør det mulig å dele data, tjenester og API-er på tvers av
      virksomheter uten å miste kontroll over hvem som har rett til hva. Når roller,
      rettigheter og representasjon kan styres på en felles og etterprøvbar måte,
      kan flere aktører samhandle tryggere i samme tjenestekjede.


      Kapabiliteten styrker det felles økosystemet ved å gi felles mekanismer for
      autorisering på tvers av personer, virksomheter og systemer. For sluttbrukeren
      betyr dette at tjenester kan fungere sømløst på tvers av virksomheter, samtidig
      som tilganger er korrekte, sporbare og mulige å trekke tilbake.'
    properties: {}
    folder_path: *id002
  id-d503cf06faa1417b8acd4b26a5c0741e:
    type: Capability
    name: Tillit
    documentation: 'Evne å tilby tillitstjenester som muliggjører autentisering og
      autorisasjon på tvers av tjenestekjeder, og støtte en distribuert arkitektur
      og føderering mellom ulike domener og tjeneste.


      ### Begrunnelse (Hvorfor)

      Kapabiliteten gir et felles tillitsgrunnlag for digital samhandling på tvers
      av virksomheter, domener og tjenestekjeder. Den fungerer som en strategisk paraply
      for identifisering, autentisering, tilgangsstyring, tilgangskontroll, representasjon,
      samtykke, signering, sporbarhet og innsyn.


      Uten felles tillitstjenester må hver virksomhet etablere egne mekanismer for
      identitet, autorisasjon og sporbarhet. Det gir fragmenterte løsninger, svakere
      sikkerhet, lavere gjenbruk og mer krevende integrasjon mellom tjenester.


      ### Hva det innebærer (Omfang)

      - **Juridisk (Høy vekt):** Overordnede rettslige rammer for eID, autorisasjon,
      representasjon, samtykke, signering, personvern og digitale tillitstjenester
      må sikre at samhandling kan skje lovlig og etterprøvbart.

      - **Organisatorisk (Høy vekt):** Felles forvaltningsmodeller, roller, ansvar
      og avtaler må sikre at tillitstjenester kan brukes og videreutvikles på tvers
      av virksomheter og sektorer.

      - **Semantisk (Middels vekt):** Felles begreper for identitet, rettighet, representasjon,
      samtykke, tillitsnivå, autentisering og autorisasjon må sikre lik forståelse
      i økosystemet.

      - **Teknisk (Svært høy vekt):** Fødererte tillitstjenester, felles autentiserings-
      og autorisasjonsmekanismer, tokenforvaltning, logging, signering og sporbarhet
      må gjøre det mulig å etablere tillit på tvers av distribuerte tjenester.


      ### Bidrag til sammenhengende tjenester og felles økosystem

      Tillit gjør det mulig å koble tjenester sammen på tvers av virksomheter uten
      at hver aktør må etablere egne løsninger for identitet, tilgang, representasjon
      og sporbarhet. Når tillitstjenester fungerer på tvers, kan brukere og systemer
      bevege seg tryggere gjennom en tjenestekjede der rettigheter, fullmakter og
      handlinger kan verifiseres.


      Kapabiliteten styrker det felles økosystemet ved å gi felles mekanismer for
      sikker samhandling, juridisk etterprøvbarhet og teknisk føderering mellom domener.
      For sluttbrukeren betyr dette mer sømløse, sikre og tillitvekkende tjenester
      der offentlige og private aktører kan samhandle uten at brukeren må håndtere
      kompleksiteten bak.


      '
    properties: {}
    folder_path: *id002
  id-379e167f7b9c4fbea9c6969425ba7f6c:
    type: Capability
    name: Tjenestedesign
    documentation: 'Evne til å sette brukerens behov, livssituasjon og helhetlige
      reise som utgangspunkt for utvikling av sammenhengende tjenester.


      ### Begrunnelse (Hvorfor)

      Digitale tjenester utvikles ofte basert på den enkelte virksomhets interne struktur
      og systemer fremfor brukernes faktiske hverdag. Dette skaper fragmenterte opplevelser
      der brukeren selv må koordinere kontakten med ulike offentlige etater. Kapabiliteten
      løser problemet med digitalt utenforskap og silobaserte tjenester ved å sikre
      at innsikt om brukerens adferd og utfordringer styrer utviklingen.


      ### Hva det innebærer (Omfang)

      - **Juridisk (Middels vekt):** Sikring av rettighetene til sårbare grupper i
      tråd med Likestillings- og diskrimineringsloven. Etterlevelse av forskrift om
      universell utforming av IKT-løsninger (WCAG-standarden) for å hindre diskriminering.

      - **Organisatorisk (Svært høy vekt):** Systematisk innhenting av brukerinnsikt
      for å kartlegge tverrsektorielle brukerreiser som dekker hele behovet fra start
      til slutt. Etablering av samarbeidsrutiner på tvers av forvaltningsnivåer for
      å fjerne manuelle steg i brukerreisen og motvirke digitalt utenforskap.

      - **Semantisk (Middels vekt):** Harmonisering av brukernes naturlige språk og
      terminologi med forvaltningens interne fagbegreper. Sikring av at tjenestebeskrivelser,
      skjemaer og veiledninger utformes slik at innholdet er umiddelbart forståelig
      for innbyggere og næringsliv.


      ### Bidrag til sammenhengende tjenester og felles økosystem

      Kapabiliteten gjør at komplekse prosesser bak fasaden skjules for brukeren,
      slik at opplevelsen fremstår som én uavbrutt og guidet reise. Ved å designe
      tjenester på tvers av organisatoriske grenser slipper innbyggeren å oppgi samme
      informasjon flere ganger eller strande i "døde ender". Sluttbrukeren opplever
      i stedet en helhetlig offentlig sektor som proaktivt støtter dem i deres gitte
      livssituasjon.




      '
    properties: {}
    folder_path: *id002
  id-3f59d920995e4d488e56f61356dcf97a:
    type: Capability
    name: Tjenesteforvaltning
    documentation: 'Evne til å formalisere samarbeid gjennom tydelig definerte roller,
      ansvar og avtaler for å sikre forutsigbar og effektiv felles styring mellom
      samhandlende virksomheter.


      ### Begrunnelse (Hvorfor)

      Når tjenester settes sammen av bidrag fra flere ulike virksomheter, oppstår
      det nye og komplekse styringsutfordringer. Kapabiliteten handler om å designe
      og implementere styringsmodeller tilpasset tverrgående tjenestekjeder og digitale
      økosystemer. Den løser behovet for forutsigbar felles styring, tydelig ansvarsplassering
      og avklarte avtaler mellom samhandlende virksomheter.


      ### Hva det innebærer (Omfang)

      - **Juridisk (Høy vekt):** Inngåelse av formelle avtaler mellom virksomhetene,
      inkludert samforståelsesmemorandum som sikrer rettslig forankring og gjensidig
      forpliktelse.

      - **Organisatorisk (Svært høy vekt):** Etablering av klare roller, ansvar og
      avtalefesting gjennom SLA og governance i tjenestekjeder. Tydelig plassering
      av ansvar for hele kjeden fra ende til ende, slik at hver virksomhet vet hva
      som forventes av dem i samarbeidet.

      - **Teknisk (Middels vekt):** Operasjonalisering og oppfølging av tjenestenivåavtaler
      gjennom teknisk måling og felles monitorering av tjenestekjedene.


      ### Bidrag til sammenhengende tjenester og felles økosystem

      Kapabiliteten plasserer ansvaret for at den helhetlige tjenestekjeden fungerer
      fra ende til ende. Ved å avklare spilleregler, roller, ansvar og økonomi på
      forhånd, unngår man at digitale samhandlingstiltak stopper opp i interne prioriteringer.
      For sluttbrukeren betyr dette en mer stabil og forutsigbar leveranse der offentlig
      og privat sektor kan fremstå som én samordnet aktør.

      '
    properties: {}
    folder_path: *id002
  id-825b1ea1217b4eedb6caae165aeb8e41:
    type: Capability
    name: Tjenestekjeder
    documentation: 'Evne til å dynamisk sette sammen, koordinere og automatisere flyten
      av informasjon og prosesser på tvers av uavhengige, integrerbare tjenester for
      å levere en komplett ende-til-ende-tjeneste for brukeren.


      ### Begrunnelse (Hvorfor)

      Selv om enkeltvirksomheter tilbyr digitale tjenester med gode tekniske grensesnitt,
      mangler det ofte en tverrgående koordinering og automatisering av informasjonsflyten
      mellom dem. Dette fører til at prosesser stopper opp, krever manuelle overganger
      og hindrer sanntidsrespons. Underkapabiliteten løser det spesifikke funksjonelle
      problemet med rigide integrasjoner ved å muliggjøre en løst koblet, dynamisk
      og automatisert sammensetning av tjenester på tvers av uavhengige virksomheter.


      ### Hva det innebærer (Omfang)

      - **Juridisk (Middels vekt):** Operasjonalisering av tverrgående samarbeidsavtaler
      og rettslige rammer sikrer lovlig automatisert informasjonsflyt mellom selvstendige
      tjenesteeiere.

      - **Organisatorisk (Svært høy vekt):** Avtalefesting av operasjonelt ansvar
      (SLA) og etablering av tverrgående arbeidsprosesser definerer stegene i tjenestekjeden.

      - **Semantisk (Middels vekt):** Anvendelse av spesifikke informasjonsmodeller
      og standardiserte dataformater sikrer korrekt tolking av data som utveksles
      mellom tjenestene.

      - **Teknisk (Svært høy vekt):** Implementering av tekniske grensesnitt (API-er)
      og hendelsesdrevet arkitektur kobler distribuerte løsninger sammen uten tette
      koblinger.


      ### Bidrag til sammenhengende tjenester og felles økosystem

      Kapabiliteten fungerer som selve motoren som knytter uavhengige og distribuerte
      applikasjoner sammen til en komplett ende-til-ende-tjeneste for brukeren. Ved
      å bruke hendelsesdrevet arkitektur kan systemene publisere og reagere på digitale
      hendelser i tilnærmet sanntid. Dette fjerner behovet for komplekse og sårbare
      punkt-til-punkt-integrasjoner, noe som skaper et langt mer fleksibelt, robust
      og skalerbart felles økosystem. For sluttbrukeren betyr dette en fullstendig
      automatisert opplevelse uten unødige forsinkelser eller manuelle avbrudd i den
      digitale reisen.

      '
    properties: {}
    folder_path: *id002
  id-cd3b6a8989a448a2b4dfbf430a41bad4:
    type: Capability
    name: Tjenesteutvikling
    documentation: 'Evne til å utvikle sammenhengende digitale tjenester.


      ### Begrunnelse (Hvorfor)

      Offentlig og privat sektor må øke digitaliseringstakten for å løse felles samfunnsutfordringer
      og unngå fragmenterte løsninger. Denne hovedkapabiliteten eksisterer som en
      strategisk paraply for å styrke den felles prosess- og kompetanseevnen på tvers
      av økosystemet. Den løser problemet med silobasert og isolert systemutvikling
      ved å samordne innsatsen rundt helhetlig metodikk, design, koding og samarbeid.


      ### Hva det innebærer (Omfang)

      - **Organisatorisk (Svært høy vekt):** Felles smidige metodikker, brukerorienterte
      designdrevne prosesser og tverrgående samarbeidsmodeller sikrer helhetlig produktutvikling.

      - **Semantisk (Middels vekt):** Nasjonale referansemodeller og omforent begrepsforståelse
      legges systematisk til grunn under modellering av nye tjenestegrensesnitt.

      - **Teknisk (Høy vekt):** Overordnede plattformstrategier for standardiserte
      byggeklosser, integrerbare API-er og felles kjøretidsmiljøer sikrer teknologisk
      samsvar.


      ### Bidrag til sammenhengende tjenester og felles økosystem

      Hovedkapabiliteten gir det strategiske fundamentet som kreves for at uavhengige
      virksomheter skal kunne bygge løsninger som fungerer sømløst sammen. Ved å harmonisere
      kompetansen innen design, koding og gjenbruk på et overordnet nivå, elimineres
      metodiske ulikheter før utviklingen starter. For sluttbrukeren betyr dette at
      nye tverrgående tjenestekjeder kan etableres raskere, slik at de oppleves helhetlig
      og uavbrutt.'
    properties: {}
    folder_path: *id002
  id-08d657e690c046019dbf6d52b1ed4d63:
    type: Capability
    name: Ustrukturerte data
    documentation: 'Evne til å tilgjengeliggjøre og forvalte data som ikke er påført
      en forhåndsdefinert struktur.


      ### Begrunnelse (Hvorfor)

      Kapabiliteten gjør det mulig å lagre, organisere, finne, forstå og bruke data
      som ikke passer i tradisjonelle strukturer. Dette gjelder for eksempel fritekst-dokumenter,
      e-poster, bilder, lydopptak, video og råe loggfiler.


      Ustrukturerte data er ofte i sin opprinnelige form. Kapabiliteten løser behovet
      for å gjøre slike data tilgjengelige og forvaltbare, slik at de kan brukes til
      innsikt, saksbehandling, automatisering, analyse og utvikling av mer sammenhengende
      tjenester.


      ### Hva det innebærer (Omfang)

      - **Juridisk (Høy vekt):** Avklare behandlingsgrunnlag, lagringstid, tilgang,
      taushetsplikt, personvern og arkivkrav når ustrukturerte data inneholder personopplysninger,
      saksinformasjon eller annen beskyttet informasjon.

      - **Organisatorisk (Høy vekt):** Etablere rutiner for innsamling, klassifisering,
      kvalitetssikring, tilgangsstyring, bevaring, sletting og bruk av ustrukturerte
      data i arbeidsprosesser.

      - **Semantisk (Høy vekt):** Bruke metadata, klassifikasjoner, emneord, begreper
      og kontekstbeskrivelser som gjør ustrukturerte data finnbare, forståelige og
      gjenbrukbare.

      - **Teknisk (Høy vekt):** Tilby kapasitet til å lagre, indeksere, søke i og
      prosessere ustrukturerte data som fritekst-dokumenter, e-poster, bilder, lydopptak,
      video og råe loggfiler. Dette krever sikre lagringsløsninger, søketeknologi,
      tilgangskontroll og verktøy for analyse og maskinell behandling.


      ### Bidrag til sammenhengende tjenester og felles økosystem

      Ustrukturerte data gjør det mulig å utnytte informasjon som ellers ville blitt
      liggende utilgjengelig i dokumenter, e-poster, logger, bilder eller andre frie
      formater. Når slike data kan forvaltes, beskrives og brukes på en sikker og
      strukturert måte, får virksomhetene et rikere grunnlag for saksbehandling, analyse
      og tjenesteutvikling.


      Kapabiliteten styrker sammenhengende tjenester ved å gjøre relevant informasjon
      lettere å finne og bruke på tvers av prosesser og virksomheter. For sluttbrukeren
      kan dette gi bedre veiledning, raskere behandling og mer helhetlig oppfølging.
      For det felles økosystemet gir det bedre kunnskapsutnyttelse og økt verdi fra
      data som tidligere var vanskelig å dele og gjenbruke.

      '
    properties: {}
    folder_path: *id002
  id-0bfa29018e7144578b2184e70414b7e8:
    type: Capability
    name: Utvikling og formidling av veiledning
    documentation: 'Evne til å utarbeide, kvalitetssikre og tilgjengeliggjøre veiledning.


      ### Begrunnelse (Hvorfor)

      Kapabiliteten sikrer at politikk, juss og teknologisk beste praksis kan omsettes
      til forståelige og distribuerte verktøy som kan brukes av virksomheter i økosystemet.
      Den løser behovet for felles veiledning som gjør det enklere å forstå hvordan
      regelverk, prinsipper, standarder, referansearkitekturer og samhandlingsmønstre
      skal anvendes i praksis.


      ### Hva det innebærer (Omfang)

      - **Juridisk (Middels vekt):** Utarbeide veiledning som forklarer hvordan relevant
      regelverk skal forstås og anvendes i digital samhandling, uten å erstatte formelle
      rettskilder eller myndighetsansvar.

      - **Organisatorisk (Høy vekt):** Etablere rutiner for å utarbeide, kvalitetssikre,
      godkjenne, publisere, forvalte og oppdatere veiledning i samarbeid med relevante
      fagmiljøer.

      - **Semantisk (Høy vekt):** Bruke omforente begreper, tydelige beskrivelser,
      felles maler og konsistent terminologi, slik at veiledningen forstås likt på
      tvers av virksomheter.

      - **Teknisk (Middels vekt):** Tilgjengeliggjøre veiledning i digitale kanaler,
      kataloger, repositorier eller kunnskapsbaser, med versjonering, lenking og struktur
      som gjør innholdet lett å finne og gjenbruke.


      ### Bidrag til sammenhengende tjenester og felles økosystem

      Kapabiliteten bidrar til sammenhengende tjenester ved å gjøre det enklere for
      virksomheter å bygge løsninger etter felles prinsipper, referansearkitekturer,
      standarder, samhandlingsmønstre og beskrivelser av beste praksis. Når veiledning
      er kvalitetssikret og tilgjengelig, reduseres lokale tolkninger og ulik praksis.


      For det felles økosystemet gir kapabiliteten bedre etterlevelse, mer gjenbruk
      og raskere innføring av felles arkitektur og standarder. For sluttbrukeren betyr
      dette mer konsistente og sammenhengende digitale tjenester, fordi virksomhetene
      utvikler og forvalter løsninger etter samme kunnskapsgrunnlag.'
    properties: {}
    folder_path: *id002
  id-ce84b9b6943f4789bca153c0ed15245a:
    type: Capability
    name: Utviklings- og kjøretidsmiljø
    documentation: 'Evne til å tilby og forvalte en felles, skalerbar teknisk plattform
      og en tilhørende verktøykasse med standardiserte byggeklosser, verktøy og utviklingsmiljøe
      som forenkler og akselererer utviklingen av digitale tjenester.


      ### Begrunnelse (Hvorfor)

      Tjenesteutvikling foregår i stor grad i sektorene og den enkelte virksomhet.
      Det vil allikevel være behov for å tilby felles utviklings- og kjøretidsmiljø
      for hele offentlig sektor eller for spesifikke domener og enkeltsektorer. Kapabiliteten
      løser behovet for felles teknisk plattform, standardiserte byggeklosser og verktøystøtte
      som forenkler og akselererer utviklingen av digitale tjenester.


      ### Hva det innebærer (Omfang)

      - **Juridisk (Lav vekt):** Inngåelse og oppfølging av databehandleravtaler for
      sky- og plattformtjenester. Sikring av at kjøretidsmiljøene etterlever spesifikke
      krav.

      - **Organisatorisk (Middels vekt):** Konkrete arbeidsprosesser for onboarding
      av utviklingsteam til felles plattformer. Definering av operative roller, supportrutiner
      og tjenestenivåavtaler (SLA) som regulerer oppetid og plattformforvaltning.

      - **Teknisk (Svært høy vekt):** Operasjonell drift av skalerbar skyinfrastruktur,
      container-teknologi og automatiserte prosesser for kontinuerlig integrasjon
      og leveranse (CI/CD). Tilgjengeliggjøring av standardiserte verktøykasser, kodebiblioteker
      og felleskomponenter for applikasjonsutvikling og sanntidsovervåking.


      ### Bidrag til sammenhengende tjenester og felles økosystem

      Når uavhengige virksomheter benytter harmoniserte verktøy og kjøretidsmiljøer,
      fjernes store teknologiske ulikheter i bunn. Dette gjør det vesentlig enklere
      å koble uavhengige applikasjoner sammen til tverrgående tjenestekjeder. For
      sluttbrukeren betyr dette en stabil digital reise der feil rettes raskere, og
      nye sammenhengende funksjoner kan rulles ut fortløpende uten avbrudd i tjenestene.
      Kapabiliteten styrker det felles økosystemet ved å legge til rette for gjenbruk,
      standardisering og mer effektiv utvikling på tvers av virksomheter.


      '
    properties: {}
    folder_path: *id002
  id-c0547226c598467a942dced879d0c18b:
    type: Capability
    name: Veiledning
    documentation: 'Evne til å sikre at veiledninger for digital samhandling utarbeides,
      formidles og benyttes.


      Dette innebærer:

      * Beskrivelser av beste praksis

      * Omforente prinsipper, mønstre og standarder for hvordan løsninger skal bygges
      for å fungere optimalt, sikkert og sammenhengende i det nasjonale økosystemet.

      * Referansearkitekturer


      * hva som er god faglig praksis

      * hvordan relevant regelverk skal tolkes

      * hvilke prioriteringer som er i samsvar med vedtatt politikk


      Veiledere kan ha ulik grad av styrke:

      * Bør benyttes: en sterk anbefaling/råd som vil gjelde de aller fleste. Denne
      er så klart faglig forankret at det sjelden er forsvarlig ikke å gjøre som anbefalt

      * Kan eller foreslår: en svak anbefaling/råd der ulike valg kan være riktig.



      '
    properties: {}
    folder_path: *id002
  id-8914d57f4f1442b1b562252a3630a686:
    type: Capability
    name: Visualisering
    documentation: 'Evne til å omforme komplekse data til visuelle fremstillinger
      som gjør innsikt lett tilgjengelig, forståelig og anvendbar.


      ### Begrunnelse (Hvorfor)

      Visualisering er kapabiliteten som gjør at vi kan "se" historien dataene forteller.
      I et felles digitalt økosystem er dette kritisk for å drive datadrevet historiefortelling,
      slik at fakta presenteres på en måte som gjør det enkelt å kommunisere komplekse
      budskap til andre og skape felles situasjonsforståelse på tvers av virksomheter.


      ### Hva det innebærer (Omfang)

      - **Organisatorisk (Høy vekt):** Etablere rutiner og metoder for datadrevet
      historiefortelling og jevnlig oppdatering av visuelle dashboards for ledelse
      og saksbehandling. Sikre kompetanse hos ansatte til å tolke komplekse data,
      designe gode visuelle fremstillinger og bruke dashboards som beslutningsstøtte.

      - **Semantisk (Høy vekt):** Strukturere komplekse datasett, sanntidsdata og
      geografiske data slik at visualiseringene gir korrekt mening og kan forstås
      likt på tvers av virksomheter.

      - **Teknisk (Høy vekt):** Bruke verktøystøtte for dashboards som oppdaterer
      seg selv i sanntid, samt tekniske løsninger for geografisk fremstilling, for
      eksempel kartkobling, for å visualisere stedbundne hendelser.


      ### Bidrag til sammenhengende tjenester og felles økosystem

      Kapabiliteten sikrer beslutningsstøtte i sanntid, slik at aktører som samarbeider
      om en sammenhengende tjeneste kan ta umiddelbare og koordinerte valg basert
      på hvordan situasjonen i økosystemet er akkurat nå. Visualisering gjør innsikt
      lettere å dele mellom virksomheter, gir felles situasjonsforståelse og bidrar
      til at komplekse data kan brukes aktivt i styring, tjenesteutvikling og operativ
      oppfølging.


      '
    properties: {}
    folder_path: *id002
  id-db4f30a87ae84561a4058d4d264177b1:
    type: Capability
    name: Åpne data
    documentation: 'Evne til å tilgjengeliggjøre åpne data slik at den kan leses og
      tolkes av både maskiner og mennesker, og som alle kan få tilgang til, bruke
      og dele.


      ### Begrunnelse (Hvorfor)

      Kapabiliteten utvider verdien av offentlige data utover forvaltningens egne
      grenser og gir avkastning i hele samfunnet. Åpne data styrker demokrati og åpenhet
      ved å gi innbyggere, journalister og interessegrupper mulighet til innsyn i
      forvaltningens arbeid og beslutningsgrunnlag. Dette øker transparensen og legger
      til rette for en mer informert offentlig debatt.


      Åpne data er også et råstoff for næringsutvikling og innovasjon. Offentlige
      data representerer en stor ressurs som kan gi næringslivet grunnlag for å skape
      nye produkter, tjenester og arbeidsplasser som det offentlige ikke ville utviklet
      selv.


      Kapabiliteten forbedrer forskning og faktabasert politikkutforming ved å gi
      forskere tilgang til rike datasett som kan brukes til å analysere samfunnstrender,
      evaluere politikk og løse komplekse samfunnsutfordringer.


      ### Hva det innebærer (Omfang)

      - **Juridisk (Høy vekt):** Sikre at data kan gjøres tilgjengelig for fri bruk
      og viderebruk innenfor gjeldende regelverk, lisenser, personvern, taushetsplikt
      og krav til offentlighet.

      - **Organisatorisk (Høy vekt):** Etablere rutiner for å identifisere, prioritere,
      publisere, vedlikeholde og følge opp åpne datasett over tid, slik at andre kan
      stole på tilgjengelighet og pålitelighet.

      - **Semantisk (Høy vekt):** Sørge for at åpne data er godt dokumenterte, sporbare
      tilbake til kilden og beskrevet med metadata som gjør dem lette å oppdage, vurdere,
      forstå, dele og diskutere.

      - **Teknisk (Høy vekt):** Tilgjengeliggjøre data i maskinleselige, standardiserte
      og strukturerte formater som kan bearbeides av både mennesker og maskiner, og
      som kan lenkes til og brukes på tvers av løsninger.


      ### Bidrag til sammenhengende tjenester og felles økosystem

      Åpne data styrker det felles økosystemet ved å gjøre offentlige data tilgjengelige
      som en felles ressurs for forvaltning, næringsliv, forskning, sivilsamfunn og
      innbyggere. Når data er godt dokumenterte, maskinleselige, sporbare og pålitelige
      over tid, kan de brukes som byggeklosser i nye tjenester, analyser og beslutningsgrunnlag.


      Kapabiliteten bidrar til sammenhengende tjenester ved at aktører utenfor den
      opprinnelige datakilden kan bygge videre på samme informasjonsgrunnlag. Dette
      gir mer åpenhet, økt innovasjon, bedre faktagrunnlag og mer effektiv gjenbruk
      av data på tvers av virksomheter og sektorer.'
    properties: {}
    folder_path: *id002
  id-c447ce23ba0c49a9bf0f8c8820c29234:
    type: Capability
    name: Meldingsutveksling
    documentation: 'Evne til å utveksle strukturert informasjon som meldinger mellom
      aktører, basert på avtalte prosesser, standarder, informasjonsmodeller, sikkerhetskrav
      og kvitterings-/avviksmekanismer.


      ### Begrunnelse (Hvorfor)

      Meldingsutveksling gjør det mulig for virksomheter å samhandle digitalt uten
      at alle aktører må etablere egne punkt-til-punkt-integrasjoner. Kapabiliteten
      reduserer fragmentering, legger til rette for standardisert informasjonsflyt
      og sikrer at meldinger kan forstås, behandles og følges opp på tvers av uavhengige
      virksomheter. Dette er særlig viktig for sammenhengende tjenester der flere
      aktører inngår i samme tjenestekjede.


      ### Hva det innebærer (Omfang)

      - **Juridisk (Høy vekt):** Sikrer at meldinger kan utveksles med nødvendig behandlingsgrunnlag,
      avklarte ansvar, krav til taushetsplikt, personvern, journalføring og arkivering.

      - **Organisatorisk (Svært høy vekt):** Etablerer felles samhandlingsprosesser,
      roller, ansvar, avtaler og forventninger mellom avsender, mottaker og eventuelle
      felles tjenesteeiere.

      - **Semantisk (Svært høy vekt):** Sikrer felles forståelse av meldingstyper,
      begreper, informasjonsmodeller, statusverdier, kvitteringer og avvik.

      - **Teknisk (Høy vekt):** Bygger på felles standarder, grensesnitt, sikkerhetsmekanismer
      og infrastruktur som gjør systemer i stand til å sende, motta og behandle meldinger,
      f.eks. en meldingsformidler



      ### Bidrag til sammenhengende tjenester og felles økosystem

      Meldingsutveksling bidrar til sammenhengende tjenester ved å sikre at nødvendig
      informasjon kan flyte strukturert og pålitelig mellom virksomheter i en tjenestekjede.
      Brukeren slipper å være bærer av informasjon mellom aktørene, og virksomhetene
      kan behandle saker mer helhetlig og effektivt.

      Kapabiliteten styrker det felles digitale økosystemet ved å redusere behovet
      for særskilte integrasjoner, øke gjenbruk av standarder og legge til rette for
      mer forutsigbar samhandling mellom offentlige og private aktører.

      '
    properties: {}
