  id-980043f78fa94eec8ecf46338a5b9c6b:
    type: Capability
    name: Styringssystem
    documentation: 'Evne til å evaluere, forbedre, fornye styringssystem for informasjonssikkerhet.


      Dette innebærer:

      Innebærer at en virksomhet systematisk vurderer hvordan deres nåværende sikkerhetsstyringssystem
      fungerer, identifiserer forbedringsområder, og tilpasser eller oppdaterer systemet
      for å møte nye trusler, sårbarheter og endringer i virksomhetens behov eller
      omgivelsene. Dette inkluderer regelmessige risikovurderinger, kontroll av om
      sikkerhetstiltak er effektive, og implementering av tiltak for å lukke eventuelle
      sikkerhetsgap'
    properties: {}
    folder_path: *id001
  id-34d3d64b3afe4327a29ee6c2f7f74dff:
    type: Capability
    name: Sikring av informasjonsflyt og datautveksling
    documentation: Kapabiliteten omfatter de tekniske og organisatoriske tiltakene
      som sikrer at informasjon som utveksles mellom virksomheter er beskyttet mot
      innsyn og manipulering, og at dataflyten er kontrollert.
    properties: {}
