  id-cd3b6a8989a448a2b4dfbf430a41bad4:
    type: Capability
    name: Tjenesteutvikling
    documentation: 'Evne til å utvikle sammenhengende digitale tjenester.


      Dette er knyttet til prosess- og kompetanse-kapabilitet. Det innebærer å utvikle
      tjenester basert på metodikk, design, koding og samarbeid.'
    properties: {}
    folder_path: *id001
  id-0aa7eced8c5c460f8bc64b77bd6a16c4:
    type: Capability
    name: Sammenhengende tjenester
    documentation: 'Evne til å levere en digital brukerorienterte tjenester som fremstår
      som en logisk og uavbrutt prosess for brukeren, selv når den involverer og koordinerer
      handlinger og tjenester fra flere, uavhengige virksomheter.


      Dette oppleves av brukeren som:


      En guidet reise: Brukeren blir ledet steg-for-steg gjennom en prosess fra start
      til slutt, uten å måtte lete etter neste skritt eller lure på hva som skjer
      nå. Tjenesten forteller proaktivt hva som er gjort, og hva som er neste steg.


      "Kun én gang"-prinsippet: Brukeren oppgir informasjon kun én gang. Denne informasjonen
      gjenbrukes intelligent i alle senere steg i prosessen, uavhengig av hvilken
      etat som trenger den.


      Ingen "døde ender": Brukeren blir aldri stående fast med beskjeden "Nå må du
      gå til X-etatens nettsider for å fortsette". Systemet sender brukeren, eller
      dataene, videre til neste ledd i kjeden på en kontrollert og sømløs måte.


      Skjult kompleksitet: Brukeren trenger ikke å kjenne til, eller forholde seg
      til, hvilke etater eller forvaltningsnivåer (statlig, kommunal) som er involvert.
      Opplevelsen er at man forholder seg til "Det Offentlige".'
    properties: {}
    folder_path: *id001
  id-1be148b57796458993c3f7f5f24815ca:
    type: Capability
    name: Sluttbrukertjenester
    documentation: 'Evne til å tilby en sammenhengende digital brukeropplevelse gjennom
      et økosystem av standardiserte og integrerbare tjenester.

      '
    properties: {}
    folder_path: *id001
  id-f696350f5d844a96854deadb83bc3c81:
    type: Capability
    name: Gjenbrukbare tjenester
    documentation: "Evne til å utvikle og benytte tjenester som kan brukes i nye sammenhenger\
      \ på tvers av offentlig forvaltning og næringsliv. \n\nDette er en forretningsmessig\
      \ verdi, som betyr at en tjeneste løser et problem som flere har, og at den\
      \ er utviklet slik at den kan brukes av andre.\n\nMerk at knytningen til \"\
      Integrerbare\" er at \nDu kan ha et system som er teknisk integrerbart (har\
      \ et API), men som ikke er gjenbrukbart (fordi forretningslogikken er for spesifikk/låst).\
      \ Derfor bør de holdes adskilt."
    properties: {}
    folder_path: *id001
  id-60827614648541ef8520df87fa25d100:
    type: Capability
    name: Integrerbare tjenester
    documentation: 'Evne til å designe, utvikle og eksponere data og funksjonalitet
      som selvstendige, standardiserte og maskinlesbare tjenester (API-er), slik at
      de enkelt kan oppdages, forstås og integreres i nye, tverrgående prosesser og
      løsninger.


      Dette innebærer:

      "API-først"-metodikk: Å utvikle tjenestene med det maskinlesbare grensesnittet
      (API-et) som det primære produktet, uavhengig av en spesifikk sluttbruker-applikasjon.
      API-et er designet for å være en robust og gjenbrukbar byggekloss.

      Sikkerhet: Å bygge inn sikkerhet og kontrollert tilgangsstyring som en fundamental
      del av tjenesten, slik at data kun deles med de som har lovlig grunnlag og legitimt
      behov.

      Robust livssyklusforvaltning: Å ha klare rutiner for versjonering, vedlikehold
      og en forutsigbar utfasing av tjenester, slik at de som bruker dem kan stole
      på at de er stabile over tid.



      '
    properties: {}
    folder_path: *id001
  id-d7aa97e6319a492d8a1345bcaa8e154a:
    type: Capability
    name: Datakilder
    documentation: 'Evne til å tilgjengeliggjøre og forvalte data som en nasjonal
      fellesressurs, slik at de kan oppdages, forstås og gjenbrukes på en sikker og
      standardisert måte.


      Dette innebærer også:

      Å organisere og styre data innenfor definerte tematiske domener, for å sikre
      helhetlig forvaltning og strategisk utvikling av dataressurser innenfor kritiske
      samfunnsområder.



      '
    properties: {}
    folder_path: *id001
  id-825b1ea1217b4eedb6caae165aeb8e41:
    type: Capability
    name: Tjenestekjeder
    documentation: 'Evne til å dynamisk sette sammen, koordinere og automatisere flyten
      av informasjon og prosesser på tvers av uavhengige, integrerbare tjenester for
      å levere en komplett ende-til-ende-tjeneste for brukeren.

      '
    properties: {}
    folder_path: *id001
  id-fa54a429cbd84db09da1b2b2165fc352:
    type: Capability
    name: Dataanalyse
    documentation: 'Evnen til å transformere rådata til meningsfull innsikt og bygge
      prediktive modeller.


      Herunder ligger bruk av KI-teknikker:

      Dette innebærer:


      Utvikling og trening av modeller: Å ha kompetanse og verktøy til å bygge, trene
      og validere maskinlæringsmodeller for spesifikke formål, som for eksempel klassifisering,
      prediksjon eller mønstergjenkjenning.


      Automatisering av kunnskapsarbeid: Å anvende KI, spesielt språkmodeller (NLP),
      til å tolke, sortere og hente ut informasjon fra ustrukturert tekst (som søknader,
      høringsinnspill eller e-poster) for å effektivisere saksbehandling.


      Prediksjon og prognoser: Å bruke prediktive modeller til å forutse fremtidige
      hendelser, behov eller risiko. For eksempel å identifisere hvilke innbyggere
      som har høyest risiko for å falle utenfor, eller å forutsi vedlikeholdsbehov
      på infrastruktur.


      Etisk og juridisk rammeverk: Å etablere og følge strenge retningslinjer for
      å sikre at KI-modeller er rettferdige, transparente, forklarbare og ikke-diskriminerende,
      og at bruken er i tråd med personvernregelverket.


      Operasjonalisering og forvaltning (MLOps): Å ha prosesser og systemer for å
      effektivt kunne produksjonssette, overvåke og kontinuerlig forbedre KI-modeller
      over tid.


      Begrunnelse for relevans

      KI er ikke bare en forlengelse av dataanalyse; det er en kapabilitet som muliggjør
      helt nye måter å jobbe på.


      Radikal effektivisering: KI kan automatisere kognitive oppgaver som tidligere
      krevde menneskelig vurdering. Dette kan frigjøre enorme ressurser fra rutinemessig
      saksbehandling til mer komplekse og verdifulle oppgaver.


      Mer intelligente og treffsikre tjenester: KI er selve motoren bak avansert personalisering
      og proaktivitet. En KI-modell kan vurdere et komplekst sett av variabler for
      å gi en innbygger et skreddersydd råd eller en proaktiv tjeneste som er langt
      mer treffsikkert enn generelle regler kan klare.


      Bedre beslutningsgrunnlag: KI kan analysere komplekse datasett og avdekke innsikter
      og sammenhenger som er umulige for mennesker å oppdage. Dette gir ledere og
      beslutningstakere et dypere og mer nøyaktig grunnlag for å utforme politikk
      og strategi.


      Økt innovasjonsevne: KI åpner opp for å løse problemer som tidligere var uløselige.
      Det kan for eksempel brukes til å analysere medisinske bilder, overvåke miljøendringer
      via satellittdata eller optimalisere trafikkflyt i en by i sanntid.'
    properties: {}
    folder_path: *id001
  id-7e3d1d3396914d65a177c9d5346d6feb:
    type: Capability
    name: Sammenstilling av data
    documentation: Evne til å hente, kombinere og foredle data fra ulike kilder for
