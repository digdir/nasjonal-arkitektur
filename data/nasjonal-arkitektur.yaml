    properties: {}
    folder_path: *id001
  id-299fc063873a4f278a1d3c0ac9480467:
    type: Capability
    name: Juridisk samhandling
    documentation: 'Evne til å etablere, forvalte og formidle et helhetlig juridisk
      rammeverk som muliggjør og regulerer sikker og effektiv digital samhandling.


      Dette innebærer:

      Harmonisering: Å identifisere og håndtere motstridende eller overlappende lovverk
      og forskrifter som hindrer samhandling og datadeling.

      Fortolkning og veiledning: Å tilby felles, autoritative tolkninger av relevant
      regelverk (f.eks. GDPR, forvaltningsloven, eIDAS, EU lovverk) og utarbeide praktiske
      veiledere for virksomhetene.

      Regelverksutvikling: Å foreslå og koordinere endringer i regelverket for å tilpasse
      det til teknologisk utvikling og nye behov i økosystemet.

      Risikovurdering: Å etablere felles metoder og standarder for juridisk risikovurdering
      knyttet til datadeling og utvikling av nye, tverrgående tjenester.


      '
    properties: {}
    folder_path: *id001
  id-896e4c1434604caa891b94bcce964720:
    type: Capability
    name: Informasjonsforvaltning
    documentation: 'Evne til å ha et felles rammeverk og styringsmodell for informasjonsforvaltning,
      slik at offentlige virksomheter kan utveksle og dele data og beskrivelser. '
    properties: {}
    folder_path: *id001
  id-5c6c20d50b6a4b168524901372f0ca6e:
    type: Capability
    name: Informasjonsarkitektur
    documentation: 'Evne til å strukturere og modellere informasjon på en standardisert
      måte, slik at data og innhold blir finnbart, forståelig og gjenbrukbart for
      både mennesker og maskiner på tvers av hele økosystemet.



      Dette betyr:

      Arkitekturbeskrivelse gjennom et sett av krav, prinsipper og modeller, som er
      nødvendig for fleksibel deling og utveksling av informasjon for å oppnå endringsdyktighet'
    properties: {}
    folder_path: *id001
  id-48c9873ae59341a49c2dca27379fab55:
    type: Capability
    name: Informasjonssikkerhet
    documentation: "Evne til å ha tilstrekkelig sikkerhet i tjenester og løsninger\
      \ som benyttes i felles økosystem. \nMerk: Er sterkt knyttet til kapabilitet\
      \ \"Tillit\""
    properties: {}
    folder_path: *id001
  id-d503cf06faa1417b8acd4b26a5c0741e:
    type: Capability
    name: Tillit
    documentation: Evne å tilby tillitstjenester som muliggjører autentisering og
      autorisasjon på tvers av tjenestekjeder, og støtte en distribuert arkitektur
      og føderering mellom ulike domener og tjeneste
    properties: {}
    folder_path: *id001
  id-b2aafe1f4c534db6b92c40b1eef605f2:
    type: Capability
    name: Representasjon
    documentation: "Evne til å kunne opptre eller utføre handlinger digitalt på vegne\
      \ av andre. \n\nDette innebærer:\nÅ kunne etablere, validere, forvalte og dokumentere\
      \ representasjonsforhold mellom en representant og en representert, slik at\
      \ rettigheter og myndighet kan utøves på vegne av andre i henhold til lovverk,\
      \ fullmakter eller vedtak.\nDet må kunne være sporbart og ha tilstrekkelig oversikt\
      \ for involverte parter.\n\nRepresentasjon betyr at en person (representanten)\
      \ har rett til å handle på vegne av en annen person eller en virksomhet (den\
      \ representerte) på en slik måte at den representerte blir bundet av handlingen.\n\
      \nRepresentasjon inkluderer bl.a. følgende:\n* Fullmakt (avtaleregulert representasjonsforhold):\
      \ Innebærer kunne gi en viljeserklæring, der den som gir fullmakt tildeler en\
      \ person eller en virksomhet (fullmektigen) myndighet til å opptre eller gjøre\
      \ noe på sine vegne.\n* Vergemål (lovregulert representasjonsforhold)\n* Foreldreansvar\
      \ (lovregulert representasjonsforhold)\n\n"
    properties: {}
    folder_path: *id001
  id-b440252bc3de42dea8468be54e54b1fa:
    type: Capability
    name: Tilgangsstyring
    documentation: 'Evne til å styre og gi tilgang til hvem som har rettighet til
      å benytte en ressurs (tjeneste, system, API, opplysning) på vegne av seg selv,
      andre personer eller virksomheter. Autorisering.


      Dette er en overordnet kapabilitet som omfatter hele livssyklusen til en rettighet.
      I praksis betyr det å ha systemer og prosesser for å:

      Definere roller: Sette opp roller med forhåndsdefinerte sett av rettigheter
      (f.eks., "regnskapsfører" eller "daglig leder").

      Delegere tilgang: Gi virksomheter og personer mulighet til å tildele disse rollene
      og enkeltrettigheter til andre, for eksempel en ansatt eller en regnskapsfører.

      Forvalte representasjon: Håndtere hvem som kan handle på vegne av en virksomhet
      eller en annen person.

      Opprettholde oversikt: Sikre oversikt over hvem som har tilgang til hva, slik
      at det er mulig å revidere og trekke tilbake tilganger ved behov.'
    properties: {}
    folder_path: *id001
  id-4b66bbf964834654b5f0c61e955b91b1:
    type: Capability
    name: Identifisering
    documentation: 'Evne til entydig å fastslå og registrere identiteter (personer,
      virksomheter eller systemer) gjennom pålitelige metoder og kilder.


      Dette betyr videre at disse identitetene senere kan gjenkjennes og skilles fra
      andre, uavhengig av kontekst, og som legger til rette for sikker tilgangskontroll,
      sporbarhet og tillit'
    properties: {}
    folder_path: *id001
  id-809f454dc4024d56ab54079252fdfe29:
    type: Capability
    name: Samtykke
    documentation: 'Evne til å akseptere, godkjenne eller gi tillatelse til at en
      handling kan foretas på vegne av seg selv eller andre, der det foreligger et
      representasjonsforhold.


      Dette innebærer å kunne innhente, administrere og dokumentere gyldige, frivillige
      og informerte samtykker fra personer for behandling og deling av deres opplysninger
      og sikre at samtykker kan gis, spores, og enkelt trekkes tilbake.

      Et samtykke er en aktiv, frivillig og informert viljeserklæring fra en person
      som gir en annen part tillatelse til å utføre en bestemt handling som berører
      dem eller deres data.

      Merk at: Samtykke er i utgangspunktet ikke en formell form for representasjon.


      Eksempel:

      Samtykke: Jeg gir noen lov til å gjøre noe overfor meg eller med mine data.
      Handlingen er rettet mot meg selv eller min sfære.

      Eksempel: Jeg gir Altinn (tjenesteyter) lov til å hente mine skattedata. Altinn
      handler ikke på mine vegne, de utfører en handling jeg har gitt dem tillatelse
      til.


      Det kan oppstå situasjoner der en representant må gi et samtykke på vegne av
      den de representerer.

      Eksempel: En verge (representant) gir samtykke til en medisinsk behandling for
      et barn (den representerte).

      I dette tilfellet ser vi hvordan konseptene virker sammen: Vergen utøver sin
      representasjonsrett til å avgi et samtykke på vegne av barnet. Men selve samtykket
      og representasjonen er fortsatt to distinkte juridiske handlinger.

      '
    properties: {}
    folder_path: *id001
  id-a8a1eb0181f04006ba7d3b5ab2fa9ca8:
    type: Capability
    name: Tilgangskontroll
    documentation: 'Evne til å kontrollere at en bruker har rettighet til å benytte
      angitt ressurs eller tjeneste på vegne av andre eller seg selv.


      Tilgangskontroll er den operative og tekniske evnen til å verifisere og håndheve
      en brukers rettigheter i sanntid når de forsøker å utføre en handling.

      Det er den tekniske håndhevelsen av tilgangsstyringen.


      Tilgangsstyring er forutsetningen for god tilgangskontroll.'
    properties: {}
    folder_path: *id001
  id-2dfe07b3eae740b9a292e0a4a42d22db:
    type: Capability
    name: Sporbarhet og innsyn
    documentation: Evne til dokumentasjon og logging av oppysninger for bruk i innsyn,
