  id-3f59d920995e4d488e56f61356dcf97a:
    type: Capability
    name: Tjenesteforvaltning
    documentation: 'Evne til å formalisere samarbeid gjennom tydelig definerte roller,
      ansvar og avtaler for å sikre forutsigbar og effektiv felles styring mellom
      samhandlende virksomheter.

      Avtalefesting av ansvar (SLA, governance) i tjenestekjeder.


      Når tjenester settes sammen av bidrag fra flere ulike virksomheter, oppstår
      det nye og komplekse styringsutfordringer. Denne kapabiliteten handler om å
      designe og implementere styringsmodeller som er tilpasset slike tverrgående
      tjenestekjeder og digitale økosystemer. Dette innebærer å tydelig definere roller
      og ansvar for hele kjeden, fra ende-til-ende, og plassere ansvaret for at helheten
      fungerer. For de prioriterte livshendelsene i digitaliseringsstrategien, vil
      slike styringsmodeller være avgjørende for å sikre at brukeren opplever en sømløs
      tjeneste, uavhengig av hvordan forvaltningen er organisert "bak fasaden"


      Dette innebærer:

      Etablere klare roller og ansvar: Hver virksomhet må vite nøyaktig hva som forventes
      av dem i samarbeidet.

      Formalisere samarbeid: Inngåelse av formelle avtaler som samforståelsesmemorandum
      (MoU) og tjenestenivåavtaler (SLA) for å sikre forpliktelse og forutsigbarhet
      i leveransene.

      Felles forvaltningsmodeller: Enighet om hvordan felles løsninger og tjenester
      skal styres, vedlikeholdes og videreutvikles over tid.


      '
    properties: {}
    folder_path: *id001
  id-9ea8fbaeb19243fa971013c57c3e96f9:
    type: Capability
    name: Organisatorisk samhandling
    documentation: "Evnen til å effektivisere forretningsprosesser og verdikjeder\
      \ på tvers av organisatoriske grenser. \n\nDette er en operativ og strukturell\
      \ evne.\nDette innebære:\nA kunne utvikle tjenester med utgangspunkt i brukerens\
      \ behov og livssituasjon uavhengig av organisatoriske grenser og strukturer.\n\
      Eksempel:\nScenario A: Dere har gode samarbeidsarenaer (møter, fagforum), men\
      \ arbeidsprosessene (selve samhandlingen) kan fortsatt være manuelle, tungvinte\
      \ og ikke samkjørte.\n\n\n"
    properties: {}
    folder_path: *id001
  id-b4a86e2e430c472b9f74bedb7f66fd74:
    type: Capability
    name: Samarbeidsarenaer og nettverk
    documentation: "Evne til å effektivisere, etablere, forvalte og fasilitere arenaer,\
      \ nettverk og prosesser som fremmer kunnskapsdeling, dialog og samordning på\
      \ tvers av virksomheter i økosystemet.\n\nDette innebærer:\nEtablering av samhandlingsarenaer:\
      \ Å skape og drifte møteplasser, både fysiske og digitale (f.eks. fagforum,\
      \ workshops, partnersamlinger), hvor aktører kan utveksle erfaringer, diskutere\
      \ felles utfordringer, utforske samarbeidsmuligheter og være rådgivende. \n\n\
      Nettverksbygging: Å aktivt koble sammen fagpersoner, prosjekter og virksomheter\
      \ som har felles interesser eller overlappende behov, for å stimulere til nye\
      \ samarbeidskonstellasjoner.\n\nSystematisk kunnskapsdeling: Å etablere kanaler\
      \ og rutiner for å dele innsikt, \"beste praksis\", veiledere og lærdom fra\
      \ vellykkede og mislykkede initiativer, slik at hele økosystemet lærer og utvikler\
      \ seg raskere.\n\nFasilitering og prosessledelse: Å tilby nøytral møte- og prosessledelse\
      \ for å hjelpe grupper med å oppnå felles forståelse, bygge konsensus og utvikle\
      \ felles løsninger, uten å ha formell beslutningsmyndighet.\n\nRådgivning om\
      \ samarbeidsmodeller: Å gi råd og veiledning til virksomheter om egnede modeller\
      \ for samarbeid, som felles prosjekter, partnerskap eller mer uformelle nettverk."
    properties: {}
    folder_path: *id001
  id-dabf94e621f644ffa53ebb44dcc9ff79:
    type: Capability
    name: Arkitekturstyring
    documentation: "Evne til å etablere, forvalte og styre en helhetlig nasjonal digital\
      \ arkitektur som et felles, forpliktende rammeverk, for å sikre samhandling,\
      \ gjenbruk og strategisk retning i et nasjonalt digitalt økosystem\n\nDette\
      \ innebærer:\n* Å sørger for at \"alle drar i samme retning\". Uten den vil\
      \ digitaliseringen fortsette å være fragmentert, silobasert og suboptimal, der\
      \ hver virksomhet optimaliserer for seg selv. Alle de andre kapabilitetene vi\
      \ har definert – fra datadeling og integrasjon til sammenhengende tjenester\
      \ – er resultater av at denne styringskapabiliteten fungerer. \n* Å kunne benytte\
      \ både myke og mer normerende virkemidler for å sikre etterlevelse og tatt i\
      \ bruk.\n* Å opprettholde en helhetlig og kontinuerlig oversikt over de sentrale\
      \ byggeklossene, arkitekturproduktene og ressursene i det nasjonale digitale\
      \ økosystemet.  \nOversikt må omfatte nasjonale fellesløsninger (som ID-porten\
      \ og Altinn), felles datakilder (grunndata), felles plattformer (som KS sin\
      \ FIKS-plattform) og kritiske tverrgående dataflyter. \nEn slik oversikt er\
      \ fundamental for å kunne identifisere muligheter for gjenbruk, unngå kostbar\
      \ duplisering av funksjonalitet, og styre livssyklusen til felleskomponentene\
      \ på en strategisk måte. Porteføljeforvaltningen gir beslutningstakere det nødvendige\
      \ grunnlaget for å vurdere hvilke nye fellesløsninger som bør utvikles og hvilke\
      \ eksisterende som eventuelt bør fases ut.\n\nEtablering av rammeverk: Å utvikle\
      \ og forvalte de sentrale komponentene i arkitekturen: Felles prinsipper, referansearkitekturer,\
      \ obligatoriske standarder og en portefølje av nasjonale fellesløsninger.\n\n\
      * Å jevnlig og systematisk vurdere modenhetsnivået for de nasjonale samhandlingskapabilitetene.\n\
      Dette betyr å evaluere nåværende modenhetsnivåer for kapabiliteter og sette\
      \ realistiske mål for forbedring. Dette kan gjøres gjennom ulike vurderingsmetoder,\
      \ som selvvurderinger, lederes vurderinger og ekspertvurderinger, for å identifisere\
      \ gap mellom nåværende og ønsket kapabilitetsnivå. \nEt eksempel på en kjent\
      \ metode er CMMI (Capability Maturity Model Integration).\nDet innebærer også\
      \ å kunne vurdere nasjonale ressurser slik at de dekker fremtidens behov og\
      \ deres egnethet til å realisere ønskede kapabiliteter."
    properties: {}
    folder_path: *id001
  id-5852d070415849fab42749cb488d984a:
    type: Capability
    name: Datastyring
    documentation: 'Evne til å sikre enhetlig og ansvarlig forvaltning av dataressurser
      gjennom felles rammeverk, klar ansvarsplassering og systematisk kvalitetsarbeid.


      Datastyring (Data Governance) er rammeverket av roller, ansvar, prosesser og
      standarder som sikrer effektiv og forsvarlig forvaltning av data som en strategisk
      ressurs gjennom hele livssyklusen.'
    properties: {}
    folder_path: *id001
  id-ce84b9b6943f4789bca153c0ed15245a:
    type: Capability
    name: Utviklings- og kjøretidsmiljø
    documentation: "Evne til å tilby og forvalte en felles, skalerbar teknisk plattform\
      \ og en tilhørende verktøykasse med standardiserte byggeklosser, verktøy og\
      \ utviklingsmiljøe som forenkler og akselererer utviklingen av digitale tjenester.\n\
      \nDette innebærer:\nTjenesteutvikling foregår i stor grad i sektorene og den\
      \ enkelte virksomhet. Det vil allikevel være behov for å tilby felles utviklings-\
      \ og kjøretidsmiljø for hele offentlig sektor eller for enkeltsektorer. \n"
    properties: {}
    folder_path: *id001
  id-034543e002414306a8fbecc8c9d8e496:
    type: Capability
    name: Samordning
    documentation: "Evnen til å harmonisere og koordinere strategisk retning, beslutninger\
      \ og ressursbruk på tvers av virksomheter, for å realisere felles samfunnsmål\
      \ og sammenhengende tjenester.\n\nDette innebærer:\nEn tydelig styring eller\
      \ mandat som krever at aktørene tilpasser hverandre. \n\nSamordning på ulike\
      \ nivåer (Juridisk, Organisatorisk Semantisk, Teknisk):\n* Juridisk samordning:\
      \ Å sørge for at juss og forvaltningspraksis i ulike virksomheter er kompatible.\n\
      \tEksempel: At Skatteetaten og NAV tolker \"inntekt\" likt nok til at data kan\
      \ flyte automatisk, eller at hjemmelsgrunnlaget for deling er på plass.\n* Organisatorisk\
      \ samordning: Å sørge for felles arbeidsprosesser og ansvarsfordeling.\n\tEksempel:\
      \ Hvem \"eier\" brukeren i livshendelsen \"Få barn\"? Er det sykehuset, Folkeregisteret\
      \ eller NAV? Å samordne betyr å definere denne stafetten.\n* Semantisk samordning:\
      \ Å sørge for at felles forståelse på hva dataene betyr.\n\tEksempel: At begrepet\
      \ \"ansatt\" betyr det samme i to systemer, slik at maskiner kan forstå hverandre.\n\
      * Teknisk samordning: Å sørge for at felles standarder og fellesløsninger blir\
      \ tatt i bruk.\n\tHandlingen: Å velge gjenbrukbare nasjonale løsninger fremfor\
      \ å bygge egne, proprietære løsninger.\n\n\n"
    properties: {}
    folder_path: *id001
