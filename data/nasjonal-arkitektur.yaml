  id-04fef6c083b449dba91c876ae2e3715f:
    type: Principle
    name: Prinsipp
    documentation: "En overordnet og veiledende regel eller retningslinje som er ment\
      \ å være varig og styrende for alle relevante beslutninger. \nPrinsipper er\
      \ generelle regler og retningslinjer, ment å være varige og sjelden endres,\
      \ som informerer og støtter måten en organisasjon går i gang med å oppfylle\
      \ sitt oppdrag.\nSe overordnete arkitekturprinsipper: https://www.digdir.no/digital-samhandling/overordnede-arkitekturprinsipper/1065\n\
      \nEksempel: \"Data skal kun lagres én gang\".\n\nEU ELAP: Det europeiske biblioteket\
      \ for arkitekturprinsipper (ELAP) etablerer prinsipper og rammeverk for å sikre\
      \ interoperabilitet på europeisk nivå , inkludert det europeiske interoperabilitetsrammeverket\
      \ (EIF), EU-lovgivning, tilgjengelighet, «Once Only» og mer. Dette biblioteket\
      \ er et kvalitetssikringsverktøy som også etablerer krav og forretningsprosesser\
      \ for å muliggjøre interoperabilitet mellom digitale offentlige tjenester.\n\
      Se:  https://joinup.ec.europa.eu/collection/common-assessment-method-standards-and-specifications-camss/solution/elap\n\
      \nTogaf definisjon og beste-praksis beskrivelse og definisjon av Arkitekturprinsipper:\n\
      https://pubs.opengroup.org/architecture/togaf9-doc/arch/chap20.html\n"
    properties: {}
    folder_path: *id005
  id-d7a27706ca3240468e16d88afbcd4a3e:
    type: Assessment
    name: Nasjonal arkitektur analyse dekningsgrad
    documentation: "Identifiserer svakheter i dagens arkitektur (ressurser og kapabiliteter).\
      \ Er en faglig analyse som forklarer hvorfor gapet finnes.\n\nKapabiliteter\
      \ og grad av nåsituasjon og måloppnåelse \n- målverdi\n- dagens verdi\n= Finner\
      \ Gap og modenhet:\nRødt (Gap > 2): Kapabiliteter der avstanden mellom nåsituasjon\
      \ og mål er kritisk stor. Her må Tiltak (Work Packages) prioriteres.\nGult (Gap\
      \ = 1): Kapabiliteter som er i rute, men krever vedlikehold eller mindre justeringer.\n\
      Grønt (Gap = 0): Kapabiliteten har nådd sin målverdi.\nEn kapabilitet kan realisere\
      \ både mål og prinsipper, altså beskrive hvordan organisasjonen faktisk implementerer,\
      \ oppfyller eller tolker hensikten bak prinsippet i praksis.\nModenhetsmodell,\
      \ som CMMI (Capability Maturity Model Integration):\n* Måling av kapabilitetsmodenhet\
      \ (Capability Maturity) hjelper deg å prioritere hvor innsatsen bør settes inn\
      \ ved å synliggjøre gapet mellom \"hvor gode vi er\" (As-Is) og \"hvor gode\
      \ vi må være\" (To-Be).\n* Modenheten til en kapabilitet vurderes basert på\
      \ tilstanden til de underliggende ressursene.\n\nRessurser og måling:\n* Kan\
      \ vises som en heatmap med indikatorer for:\n- Dekningsgrad kapabilitet (1-5)\
      \ for å indikere i hvilken grad en ressurs faktisk er tilgjengelig eller moden\
      \ nok til å støtte ønsket kapabilitet.\n- egnethet (Funksjonelt egnet)\n- Teknisk\
      \ egnet\n- Livssyklus status\n\nMan kan også benytte POTI modell som vurdering\
      \ på tilstanden til ressursene:\n* People (Organisasjon): Roller og kompetanse.\n\
      * Process (Prosess): Arbeidsflyter og prosedyrer.\n* Technology (Teknologi):\
      \ IT-systemer og infrastruktur.\n* Information (Informasjon): Datakvalitet og\
      \ flyt\n\nSe også:\nDe konkrete resultatene av å bruke kapabilitetene.\nSe på\
