  id-897fd3d0f5fd4c2891e824a371d5e69b:
    type: Goal
    name: Et velfungerende felles digitalt økosystem for samhandling og tjenesteutvikling
      i offentlig sektor
    documentation: "Offentlig sektor må øke digitaliseringstakten. Skal vi kunne utnytte\
      \ de mulighetene teknologien gir, og bidra til en mer effektiv og bærekraftig\
      \ digital utvikling, trenger vi en nasjonal arkitektur for samhandling. Arkitekturen\
      \ bør beskrive nødvendige ressurser for samhandling, som fellesløsninger, infrastruktur\
      \ for deling av data og standarder, og standardiserte grensesnitt (API-er).\
      \ Gjennom en nasjonal arkitektur tydeliggjøres sammenhenger og ansvar, og det\
      \ blir enklere å identifisere behov for tiltak.\n\nRegjeringen vil sikre sterkere\
      \ styring og samordning av digitaliseringen på tvers av sektorer og forvaltningsnivåer.\
      \ Nasjonal arkitektur er et av flere viktige virkemidler for å realisere målet\
      \ og beskriver blant annet nødvendige ressurser for digital samhandling - inkludert\
      \ fellesløsninger, infrastruktur for datautveksling og felles standarder. Ved\
      \ å tydeliggjøre sammenhenger, ansvar og tiltak blir det enklere å identifisere\
      \ behov og koordinere innsatsen på tvers av sektorer og forvaltningsnivåer.\
      \ Utvikling, forvaltning og prioritering av nasjonal arkitektur bidrar til å\
      \ gjøre digitaliseringen robust, skalerbar og målrettet, samtidig som det reduserer\
      \ unødvendig dobbeltarbeid og forenkler brukeropplevelsen. \nSammen med teamet\
      \ som jobber med Nasjonalt veikart vil vi aktivt bidra opp under målet ved at\
      \ vi styrker nasjonal arkitekturstyring og lager kunnskapsgrunnlag for felles\
      \ prioritering. Vi vil i tillegg samarbeide med andre team som arbeider med\
      \ organisatoriske, økonomiske og juridiske virkemidler som styrker styring og\
      \ samordning på tvers. Det er derfor relevant å ha dialog rundt arbeid om for\
      \ eksempel Digitaliseringsrundskrivet, medfinansieringsordningen, livshendelser\
      \ og sektorovergripende prosjekter. \nNasjonal arkitektur har en viktig rolle\
      \ fordi den legger til rette for at digitaliseringsarbeidet ikke skal skje fragmentert,\
      \ men som en integrert og koordinert helhet. Den underbygger styringsmekanismene\
      \ ved å tilby verktøy og prinsipper for beslutninger, tekniske standarder, og\
      \ hjelper til med å balansere arkitektur lokalt, sektorielt og nasjonalt. \n"
    properties: {}
    folder_path: *id003
  id-a4062153239a4d13a9fdef8cc205c8e6:
    type: Goal
    name: Sterkere styring og samordning av digitalisering på tvers av sektorer
    documentation: "Nasjonal arkitektur er et viktig virkemiddel for å skape sterke\
      \ synergier mellom norsk og europeisk digitaliseringspolitikk. Den skal bygge\
      \ på føringer fra EU og fungerer som et rammeverk som integrerer EUs regelverk,\
      \ standarder og referansearkitekturer i norsk digitaliseringsarbeid. EU-forordninger\
      \ etablerer nasjonale funksjoner og styringsformer som også dekker Norges behov\
      \ for koordinering og styring av arkitektur. \nVed å implementere felles europeiske\
      \ standarder, sikrer nasjonal arkitektur at norske digitale tjenester kan samhandle\
      \ effektivt over landegrensene. Samtidig bør Norge bli bedre på å hente erfaringer\
      \ fra andre land og bruke internasjonale løsninger som utgangspunkt for egen\
      \ utvikling, noe som reduserer både kostnader og utviklingstid. Gjennom dette\
      \ sikrer nasjonal arkitektur en helhetlig og framtidsrettet digitalisering som\
      \ både møter norske behov og Europas digitale agenda. \n"
    properties: {}
    folder_path: *id003
  id-cbc357e78ede45e8aa565fde3b7380b5:
    type: Goal
    name: 'Vi skal ha en offentlig sektor som tilbyr bedre, mer sammenhengende digitale
      tjenester til innbyggere og næringsliv  '
    documentation: "Målet om sammenhengende tjenester til beste for bruker stiller\
      \ krav til nasjonal arkitektur.\nNasjonal arkitektur er nødvendig for å få til\
      \ samhandling og sammenhengende tjenester. Felles økosystem tilbyr ressurser\
      \ for samhandling og sammenhengende tjenester. Vi skal både tilby ressurser\
      \ som muliggjør dette, men også sette rammer som styrer offentlig sektor i retning\
      \ av sammenhengende digitale tjenester. \nNasjonal arkitektur kan også bidra\
      \ til å balansere styrkeforholdet mellom store offentlige etater og mindre statlig/kommunale.\
      \ Gjennom felles standarder, arkitekturer og retningslinjer kan vi bidra til\
      \ at det blir lettere å dele og bruke data og få til bedre samhandling.\nNasjonal\
      \ arkitektur bør bidra til utforskning av nye måter å skape sammenheng og forenkling\
      \ for innbygger og næringsliv. Sammenhengende tjenester introduserer også noen\
      \ nye utfordringer som bør avklares og nasjonal arkitektur bør foreslå hvordan\
      \ disse utfordringene adresseres. Ved å samarbeide tett med avdelingen for «Sammenhengende\
      \ tjenester og livshendelser» og jobbe behovsdrevet med ekte problemer og ekte\
      \ behov, skal vi aktivt prøve å finne løsninger på de arkitekturmessige hindringene.\
      \ \n"
    properties: {}
    folder_path: *id003
  id-56e7246019f54eec8093568bd0fb8e22:
    type: Goal
    name: Norge skal være ledende på verdiskaping med data og på datadrevet forskning
      og innovasjon
    documentation: 'For å få til datadeling må de riktige ressursene i felles økosystem
      være på plass. Det gjelder standarder, felles formater, rammeverk, åpne API-er,
      referansearkitekturer, fellesløsninger mv. Rammeverk for EUs dataområder (data
      spaces) inneholder også referansearkitekturer og standarder. Nasjonal arkitektur
      (samhandlingsarkitektur) er nødvendig for å få til datadeling.

      Data governance og master data management er nødvendig for at man skal dele
      data og bruke data, og er viktig for et velfungerende felles økosystem for digital
      samhandling. Det er pågående arbeid på flere områder innenfor dette målet som
      bør være koordinert med arbeidet med Nasjonal arkitektur

      '
    properties: {}
    folder_path: *id003
  id-90ff9c60528d4dfe93d534bd6a7bcfeb:
    type: Goal
    name: Vi skal delta i EUs satsing på dataområder der det er relevant
    documentation: Arbeidet med dataområdene i EU vil komme med referansearkitekturer
      og standarder som må innføres som en del av nasjonal arkitektur.
