  id-8810f83ff9fe44c2a3368cdef932526b:
    type: Grouping
    name: Rammeverk for digital samhandling (European Interoperability Framework)
    documentation: 'Rammeverk for digital samhandling.

      https://www.digdir.no/digital-samhandling/rammeverk-digital-samhandling/2148


      Bakgrunnsinformasjon og opprinnelse:

      EU har utviklet European Interoperability Framework (EIF), et felles rammeverk
      for digital samhandling. Målet er å fremme digital samhandling på tvers av landegrenser
      og innenfor hvert enkelt land. Norge forpliktet seg til å implementere EIF da
      vi undertegnet Tallinn-erklæringen i 2017, sammen med EU og andre EFTA-land.


      Som et resultat har Norge etablert sitt eget nasjonale rammeverk for interoperabilitet
      (NIF- National Interoperability Framework), som i dag heter "Rammeverk for digital
      samhandling". Den første versjonen ble utarbeidet som et Skate-tiltak i 2018.



      '
    properties: {}
    folder_path: &id005
    - Other
  id-e236b66b0d574a2bb97dbd79d7d38d47:
    type: Grouping
    name: Juridisk samhandlingsevne
    documentation: Juridisk samhandling skal sikre at organisasjoner som arbeider
      under ulik lovgivning kan samhandle. For at organisasjoner på tvers i forvaltningen
      kan utvikle og bruke like tjenester og funksjonalitet må det rettslige grunnlaget
      for samhandling mellom aktørene være på plass.
    properties: {}
    folder_path: *id005
  id-3fd615c0b19e4762953cd34908523dbc:
    type: Grouping
    name: Organisatorisk samhandlingsevne
    documentation: Organisatorisk samhandling handler om hvordan samhandlende virksomheter
      tilpasser tjenestekjeder/forretningsprosesser, ansvar og forventninger for å
      oppnå felles mål og fordeler. Området dekker også forventninger til å gjøre
      tjenester tilgjengelige og brukerorienterte, samt hvilke samhandlingsmodeller
      og avtaler virksomhetene etablerer knyttet til felles forvaltning.
    properties: {}
    folder_path: *id005
  id-503ab92854754702ab00164afdbf6f70:
    type: Grouping
    name: Semantisk samhandlingsevne
    documentation: Semantisk samhandlingsevne har å gjøre med betydningen av dataelementer,
      relasjonen mellom dem og formatet informasjonen utveksles på. Det deles i syntaktisk
      og semantisk aspekt. Semantisk aspekt skal sikre dataenes betydningsinnhold
      og interne relasjon, som også innebærer begrepsavklaringer som sikrer at alle
      parter forstår kommunikasjonen. Syntaktisk aspekt refererer til eksakt format
      og struktur på data som utveksles.
    properties: {}
    folder_path: *id005
  id-6c59a946ea8e4ad8903fbb1a6ffa9219:
    type: Grouping
    name: Teknisk samhandlingsevne
    documentation: Teknisk samhandlingsevne sikrer at ulike systemer kan integreres.
      Dette krever teknisk standardisering, noe som i dag blant annet blir understøttet
      av forskrift om IT-standarder i offentlig forvaltning. Området dekker forhold
      knyttet til applikasjon, data, teknologi og sikkerhet.
    properties: {}
    folder_path: *id005
  id-661cb46063c544be82d804511f5ea9f9:
    type: Grouping
    name: Styrings og forvaltning
    documentation: Styring og forvaltning av integrerbare og sammenhengende offentlige
      tjenester er det femte området, og løper på tvers av de andre samhandlingsområdene.
      Det er viktig å komme i gang med avklaringer rundt styring og forvaltning så
      tidlig som mulig i prosessen ved etablering av nye tjenester. I tillegg vil
      det være nødvendig å gå mer i dybden etter hvert.
    properties: {}
