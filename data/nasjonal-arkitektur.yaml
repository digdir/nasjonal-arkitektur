  id-199ae45b0a6c47b28b3507837647c6c8:
    type: Resource
    name: Fellesløsning
    documentation: "Fellesløsninger er tekniske komponenter eller applikasjoner som\
      \ leverer funksjonalitet og dekker behov på tvers av eller innenfor sektorer,\
      \ og/eller forvaltningsnivå. \nTekniske løsninger som utvikles én gang og brukes\
      \ av mange.\nFellesløsninger er byggeklosser som kan brukes i utviklingen av\
      \ offentlige digitale tjenester. Noen er obligatoriske å bruke, andre er anbefalte\
      \ - både for statlige virksomheter og for kommunal sektor.\n\nFellesløsning\
      \ til forretningstjenester, som er forretningsaktivitet med et spesifisert resultat\
      \ og som støtter et spesifikt forretningsmål. \nDen er brukersentert og representerer\
      \ funksjonalitet som leverer verdi til en ekstern bruker. \nBrukerorienterte\
      \ eller funksjonelle tjenester som leverer verdi, ofte på tvers av løsninger.\n\
      \nMerk:\nSelv om en tjeneste bruker teknologi, er selve \"tjenesten\" (f.eks.\
      \ eSignering eller Autentisering) det funksjonelle resultatet av en prosess\
      \ rettet mot en bruker\n\nStrategiske prinsipper for nasjonale felleskomponenter\
      \ (gammel - bør ha en felles beskrivelse av felles-\"løsninger\" i stedet)\n\
      https://www.digdir.no/media/395/download\nhttps://www.regjeringen.no/contentassets/fe3e34b866034b82b9c623c5cec39823/no/pdfs/stm201520160027000dddpdfs.pdf\n\
      \nFellesløsning vs. felles løsning:\n* Forskjellen er institusjonell. \n* Fellesløsning:\
      \  referer til nasjonale fellesløsninger, som er spesifikk tekniske komponenter\
      \ som skal kunne brukes av svært mange i offentlig sektor for å løse generiske\
      \ behov. \n* Felles løsning: Gjenbrukbar løsnning som kan benyttes av flere\
      \ og med formåk om samarbeid og stordriftsfordeler, men uten nødvendigvis å\
      \ ha status som en nasjonal komponent i økosystemet.\n* Fellestjeneste: Den\
      \ forretningsmessige eller tekniske funksjonaliteten som tilbys.\n\nSluttbrukertjenester:\
      \ Det innbyggeren eller næringslivet opplever (f.eks. \"Søke om barnehageplass\"\
      \ eller \"Levere skattemelding\"). \nStøttetjenester: Tekniske tjenester som\
      \ ikke er synlige for sluttbrukeren, men som er nødvendige for at systemene\
      \ skal snakke sammen (f.eks. gjennom et API)\n\nDe nasjonale felleskomponentene,\
      \ slik de er definert i Digital agenda:\n– Har en statlig virksomhet som forvaltningsansvarlig.\n\
      – Dekker behov på tvers av mange sektorer og/eller forvaltningsnivå.\n– Vil\
      \ være sentrale komponenter i en rekke digitale tjenester.\n– Er av stor samfunnsøkonomisk\
      \ betydning som felles mulighetsrom for digital tjenesteutvikling og gevinstrealisering\
      \ i virksomhetene.\n\n\n\n"
    properties: {}
    folder_path: *id001
