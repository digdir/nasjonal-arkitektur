  id-98df6c2b4df340c7a3a3ad32d99ca37e:
    type: Capability
    name: Datadrevet
    documentation: 'Evne til å systematisk bruke data som en strategisk ressurs for
      å skape innsikt, informere beslutninger og utvikle bedre, mer treffsikre og
      effektive tjenester.


      Etisk og ansvarlig datautnyttelse: All bruk av data skjer på en sikker, lovlig
      og etisk forsvarlig måte som ivaretar personvern og rettssikkerhet.


      Dette innebærer:

      Forvaltningen systematisk bruker data som en strategisk ressurs i prosesser,
      beslutningstaking og tjenesteutvikling for å levere bedre og mer effektive tjenester
      til innbyggere og næringsliv.

      Dette forutsetter åpenhet, deling av data, og evne til å hente ut verdi fra
      data gjennom blant annet analyse, automatisering og bruk av kunstig intelligens.'
    properties: {}
    folder_path: *id001
  id-3dbd3a9115cb4c54876490cbf02b0c58:
    type: Capability
    name: Grunndata
    documentation: 'Evne til å identifisere og formelt anerkjenne autoritative datakilder
      basert på en systematisk vurdering av deres verdi.


      Eksempler på kandidater nasjonale grunndata:

      Nøkkelregistre som er nasjonale grunndata:

      Folkeregisteret: Inneholder autoritative data om alle personer bosatt i Norge
      (identitet, bosted, familierelasjoner). Forvaltes av Skatteetaten.

      Enhetsregisteret: Inneholder autoritative data om alle norske juridiske enheter
      (bedrifter, foreninger, offentlige organer). Forvaltes av Brønnøysundregistrene.

      Matrikkelen (Eiendomsregisteret): Norges offisielle register over fast eiendom,
      bygninger og adresser. Forvaltes av Kartverket.

      Arbeidsgiver- og arbeidstakerregisteret (Aa-registeret): Inneholder data om
      arbeidsforhold i Norge. Forvaltes av NAV.


      Geografiske grunndata: Forvaltes av Kartverket.'
    properties: {}
    folder_path: *id001
  id-711390c3ddaa4b67914ccbcc2f1831aa:
    type: Capability
    name: Sanntidsdata
    documentation: 'Evne til å sikkert prosessere og distribuere kontinuerlige datastrømmer
      for å muliggjøre sanntidsinnsikt, automatisering og umiddelbar respons.


      Dette innebærer:

      * Å kunne tilby data fra sensorer, tingenes internett (IoT) og andre hendelseskilder'
    properties: {}
    folder_path: *id001
  id-db4f30a87ae84561a4058d4d264177b1:
    type: Capability
    name: Åpne data
    documentation: 'Evne til å tilgjengeliggjøre åpne data slik at den kan leses og
      tolkes av både maskiner og mennesker, og som alle kan få tilgang til, bruke
      og dele.


      Begrunnelse for relevans

      Dette er en kapabilitet som utvider verdien av offentlige data utover forvaltningens
      egne grenser og gir avkastning i hele samfunnet.


      Styrker demokrati og åpenhet: Åpne data gir innbyggere, journalister og interessegrupper
      mulighet til innsyn i forvaltningens arbeid og beslutningsgrunnlag. Dette øker
      transparensen og legger til rette for en mer informert offentlig debatt.


      Er et råstoff for næringsutvikling og innovasjon: Dette er en av de viktigste
      begrunnelsene. Offentlige data representerer en enorm, uutnyttet ressurs. Ved
      å gjøre dem fritt tilgjengelige, gir man næringslivet råmaterialet de trenger
      for å skape nye produkter, tjenester og arbeidsplasser som det offentlige aldri
      ville utviklet selv.


      Forbedrer forskning og faktabasert politikkutforming: Forskere får tilgang til
      rike datasett som kan brukes til å analysere samfunnstrender, evaluere politikk
      og løse komplekse samfunnsutfordringer.


      Gode åpne data kjennetegnes ved:

      * at de er godt dokumenterte slik at de er lette å oppdage, vurdere og bruke

      * at de kan linkes til slik at de lett kan deles og diskuteres

      *  at de er tilgjengelige i et maskinleselig, standardisert og strukturert format
      slik at de enkelt kan bearbeides

      * at de har garantier for tilgjengelighet og pålitelighet over tid, slik at
      andre kan stole på de

      * at de er sporbare tilbake til hvor de kommer fra, slik at andre kan vurdere
      pålitelighet'
    properties: {}
    folder_path: *id001
  id-ec0afaac123d4f9e83889d9022a198c3:
    type: Capability
    name: Autentisering
    documentation: Evne til å på en sikker og entydig måte verifisere den digitale
      identiteten til brukere og systemer
    properties: {}
    folder_path: *id001
  id-c3f87c86b19547359c677a333b16f03b:
    type: Capability
    name: Standardisering
    documentation: 'Evne til å identifisere, vedta, forvalte og fremme bruk av omforente
      standarder og spesifikasjoner som sikrer interoperabilitet og gjenbruk på tvers
      av sektorer og landegrenser.


      Dette innebærer:

      Harmonisering: Å sikre at nasjonale standarder er i samsvar med internasjonale
      standarder (som EU-harmoniserte standarder) for å muliggjøre samhandling over
      landegrensene.

      Livssyklusforvaltning: Å ha prosesser for å vurdere nye standarder, vedlikeholde
      eksisterende, og fase ut foreldede standarder i takt med teknologisk utvikling.

      Veiledning: Å gjøre standardene tilgjengelige og forståelige, slik at de enkelt
      kan implementeres i tjenester og løsninger.

      Etterlevelse: Å legge til rette for at fellesløsninger og virksomheter faktisk
      tar i bruk vedtatte forvaltningsstandarder i sine anskaffelser og utviklingsløp.


      '
    properties: {}
    folder_path: *id001
  id-9bc3012bcd154e27aa094ac36bf391be:
    type: Capability
    name: Proaktive tjenester
    documentation: 'Evne til å, basert på registrerte hendelser og delte data, automatisk
      identifisere en brukers behov for offentlige tjenester og proaktivt tilby relevant
      informasjon, veiledning eller starte en tjenesteprosess på vegne av brukeren.


      Brukeren blir varslet om rettigheter, plikter eller muligheter de har, før de
      selv har etterspurt det.

      Dette kan innebære:

      Hendelsesdrevet arkitektur ("Event-driven"): Å ha teknisk evne til å "lytte"
      etter endringer i autoritative datakilder (f.eks. Folkeregisteret, Enhetsregisteret)
      som signaliserer at en viktig livshendelse har inntruffet (f.eks. fødsel, dødsfall,
      flytting, fylt 18 år, registrert arbeidsledighet).


      Regelverk og logikk for relevans: Å etablere og forvalte et sett med forretningsregler
      som kobler spesifikke hendelser til et sett av rettigheter, plikter og relevante
      tjenester. For eksempel: HVIS fødsel er registrert OG mor er bosatt i kommune
      X, SÅ informer om foreldrepenger, barnetrygd og søknad om barnehageplass.


      Personalisert og kanal-uavhengig varsling: Å kunne sende ut et personalisert,
      relevant og betimelig varsel til brukeren gjennom deres foretrukne, sikre digitale
      kanal


      Initiering av forhåndsutfylte tjenester: Å ikke bare informere, men også aktivt
      hjelpe brukeren i gang. For eksempel ved å sende en lenke til et ferdig utfylt
      søknadsskjema basert på informasjonen systemet allerede har.


      Begrunnelse for relevans

      Denne kapabiliteten representerer et paradigmeskifte i offentlig tjenesteyting.


      Sikrer at innbyggere får sine rettigheter: Mange kjenner ikke til alle støtteordninger
      eller tjenester de har krav på. Proaktivitet er det mest effektive verktøyet
      for å sikre at velferdsstatens goder når frem til de som trenger dem, og reduserer
      sosial ulikhet skapt av informasjonskløfter.


      Forenkler etterlevelse av plikter: Ved å varsle i forkant om frister og plikter
      (f.eks. fornyelse av en tillatelse, innsending av en rapport), blir det enklere
      for innbyggere og næringsliv å gjøre ting riktig. Dette reduserer antall forglemmelser,
      feil og unødvendig bruk av sanksjoner.


      Bygger dyp tillit og en følelse av partnerskap: En proaktiv forvaltning oppleves
      som en partner som hjelper og støtter, snarere enn en byråkratisk motpart man
      må kjempe mot. Dette er ekstremt verdifullt for å bygge og opprettholde tilliten
      til samfunnsinstitusjonene.


      Reduserer unødvendig kontakt og saksbehandling: Ved å svare på brukernes spørsmål
      før de stiller dem, og ved å veilede dem riktig fra start, kan man dramatisk
      redusere henvendelser til kontaktsentre og saksbehandlere. Ressursene kan dermed
      frigjøres til å håndtere mer komplekse og krevende saker.


      Uten proaktivitet forblir selv de beste digitale tjenestene passive verktøy
      som krever at brukeren selv har kunnskapen, initiativet og overskuddet til å
      finne frem. Proaktivitet snur dette på hodet og gjør forvaltningen til en reell,
      hjelpende hånd i innbyggernes liv.



      '
    properties: {}
    folder_path: *id001
  id-8914d57f4f1442b1b562252a3630a686:
    type: Capability
    name: Visualisering
    documentation: "Evne til å omforme komplekse data til visuelle fremstillinger\
      \ som gjør innsikt lett tilgjengelig, forståelig og anvendbar.\n\nVisualisering\
      \ er den kapabiliteten som gjør at vi kan \"se\" historien dataene forteller.\
      \ \n\nDette innebærer:\n* Beslutningsstøtte i sanntid: Å lage oversikter (dashboards)\
      \ som oppdaterer seg selv, slik at man kan ta valg basert på hvordan situasjonen\
      \ er akkurat nå.\n* Geografisk fremstilling: Å koble data til kart for å forstå\
      \ sammenhenger mellom sted og hendelser (for eksempel smittespredning, trafikkflyt\
      \ eller andre ressursbehov).\n* Datadrevet historiefortelling: Å presentere\
      \ fakta på en måte som gjør det enkelt å kommunisere et budskap til andre.\n\
      \n\n\n\n\n"
    properties: {}
    folder_path: *id001
