  id-68ec332ee94c483e878a3a2ae903863f:
    type: Capability
    name: Testdata
    documentation: 'Evne til å generere og tilgjengeliggjøre representative og personvernsikre
      datasett.



      Dette innebærer:

      * At dataene kan benyttes til analyse- og testformål uten behov for strenge
      sikkerhetsklareringer.

      * At dataene er helt uten kobling til virkelige personer eller virksomheter.

      * Inkluderer ulike type test- og analysedata, feks. syntetiske data og anonymiserte
      data


      Denne kapabiliteten sikrer at virksomheten kan operere med datasett som speiler
      kompleksiteten og de statistiske egenskapene til reelle produksjonsdata, uten
      at dette medfører risiko for personvernet eller krav om omfattende sikkerhetsklareringer.

      Dette muliggjør effektiv systemutvikling, kvalitetssikring og innsiktsarbeid
      i lukkede miljøer.


      I en nasjonal sammenheng er denne kapabiliteten kritisk for å kunne drive tverrsektoriell
      tjenesteutvikling. Når ulike virksomheter skal samhandle, er tilgang på gode
      testdata ofte den største flaskehalsen. Ved å mestre denne kapabiliteten kan
      man teste sammenhengende tjenester uten å utveksle faktiske data mellom systemer
      i testfasen.


      Inkluderer ulike teknikker som:

      * Syntetiske data: Data generert fra bunnen av basert på statistiske modeller.

      * Anonymiserte data: Reelle data som er ugjenkallelig endret slik at identifisering
      ikke lenger er mulig.

      * Pseudonymiserte/maskerte data: Identifiserende opplysninger som er ersattet
      slik at de ikke kan identfisere en fysisk person uten bruk av tilleggsopplysninger



      '
    properties: {}
    folder_path: *id001
  id-08d657e690c046019dbf6d52b1ed4d63:
