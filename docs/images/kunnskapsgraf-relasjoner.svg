<text x="74" y="45" font-size="15" fill="#1F2A3C"><tspan font-weight="bold">Behov: </tspan>«En regnskapsfører skal hente opplysninger på vegne av en kunde – hva trengs?»</text>
<text x="74" y="73" font-size="13.5" fill="#6B7280" text-anchor="start" font-weight="normal" font-style="italic">… eller en spørring på innhold, f.eks. «Hvilke API-er bruker begrepet fullmakt?»</text>
