<text x="1040.0" y="515" font-size="12" fill="#A0A7B4" text-anchor="middle" font-weight="normal" font-style="normal">data.norge.no · katalog</text>
<text x="1040.0" y="536" font-size="15" fill="#A0A7B4" text-anchor="middle" font-weight="normal" font-style="normal">Felles datakatalog</text>
<text x="277.5" y="251.0" font-size="12" fill="#2F5597" text-anchor="middle" font-style="italic" paint-order="stroke" stroke="#F5F7FB" stroke-width="6" stroke-linejoin="round">realiseres av</text>
<text x="277.5" y="339.0" font-size="12" fill="#2F5597" text-anchor="middle" font-style="italic" paint-order="stroke" stroke="#F5F7FB" stroke-width="6" stroke-linejoin="round">omtalt i</text>
<text x="277.5" y="427.0" font-size="12" fill="#2F5597" text-anchor="middle" font-style="italic" paint-order="stroke" stroke="#F5F7FB" stroke-width="6" stroke-linejoin="round">definert i</text>
<text x="575.0" y="251.0" font-size="12" fill="#2F5597" text-anchor="middle" font-style="italic" paint-order="stroke" stroke="#F5F7FB" stroke-width="6" stroke-linejoin="round">brukes med</text>
<text x="585.0" y="408.0" font-size="12" fill="#2F5597" text-anchor="start" font-style="italic" paint-order="stroke" stroke="#F5F7FB" stroke-width="6" stroke-linejoin="round">stiller krav til</text>
<text x="885.0" y="251.0" font-size="12" fill="#2F5597" text-anchor="middle" font-style="italic" paint-order="stroke" stroke="#F5F7FB" stroke-width="6" stroke-linejoin="round">sikrer tilgang til</text>
<text x="885.0" y="339.0" font-size="12" fill="#2F5597" text-anchor="middle" font-style="italic" paint-order="stroke" stroke="#F5F7FB" stroke-width="6" stroke-linejoin="round">beskriver</text>
<text x="1048.0" y="306.0" font-size="12" fill="#2F5597" text-anchor="start" font-style="italic" paint-order="stroke" stroke="#F5F7FB" stroke-width="6" stroke-linejoin="round">leverer</text>
<rect x="96" y="160" width="432" height="34" rx="8" fill="#FFF8E1" stroke="#BF9000" stroke-width="1.3"/>
<text x="312" y="182" font-size="13" fill="#7F6000" text-anchor="middle" font-weight="bold" font-style="normal">RAG kan finne begge – men koblingen mellom dem må KI gjette</text>
<line x1="277" y1="194" x2="277" y2="236" stroke="#BF9000" stroke-width="1.3" stroke-dasharray="4 3"/>
<text x="890" y="578" font-size="13" fill="#2F5597" text-anchor="middle" font-weight="bold" font-style="normal">API, datasett og regelverk ligner ikke spørsmålet – de nås via relasjonene</text>
<line x1="600" y1="590" x2="600" y2="604" stroke="#2F5597" stroke-width="2" marker-end="url(#pB)"/>
<rect x="20" y="606" width="1160" height="66" rx="10" fill="#E8F0FA" stroke="#2F5597" stroke-width="1.5"/>
<circle cx="52" cy="639" r="16" fill="#2F5597"/>
<text x="52" y="645" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="bold" font-style="normal">3</text>
<text x="80" y="633" font-size="16" fill="#1F2A3C" text-anchor="start" font-weight="bold" font-style="normal">KI setter sammen svaret fra det relevante utsnittet av grafen</text>
<text x="80" y="656" font-size="14" fill="#6B7280" text-anchor="start" font-weight="normal" font-style="normal">Hver del av svaret peker tilbake til en node og en relasjon – svaret kan etterprøves.</text>
<rect x="20" y="690" width="570" height="116" rx="10" fill="#FFF8E1" stroke="#BF9000" stroke-width="1.5"/>
<text x="38" y="716" font-size="15.5" fill="#7F6000" text-anchor="start" font-weight="bold" font-style="normal">Tradisjonell RAG: KI må finne relasjonene selv</text>
<text x="38" y="741" font-size="14" fill="#1F2A3C" text-anchor="start" font-weight="normal" font-style="normal">Finner relevante tekster – også løsninger i ressursoversikten. Men små</text>
<text x="38" y="763" font-size="14" fill="#1F2A3C" text-anchor="start" font-weight="normal" font-style="normal">tekstbiter mister sammenhengene, og store gir upresise treff. KI må selv</text>
<text x="38" y="785" font-size="14" fill="#1F2A3C" text-anchor="start" font-weight="normal" font-style="normal">gjette hvordan bitene henger sammen – ulikt fra gang til gang.</text>
<rect x="610" y="690" width="570" height="116" rx="10" fill="#E8F0FA" stroke="#2F5597" stroke-width="1.5"/>
<text x="628" y="716" font-size="15.5" fill="#2F5597" text-anchor="start" font-weight="bold" font-style="normal">Kunnskapsgraf: relasjonene er modellert</text>
<text x="628" y="741" font-size="14" fill="#1F2A3C" text-anchor="start" font-weight="normal" font-style="normal">Koblingene er beskrevet én gang, eksplisitt og på tvers av kildene.</text>
<text x="628" y="763" font-size="14" fill="#1F2A3C" text-anchor="start" font-weight="normal" font-style="normal">KI følger dem i stedet for å gjette – også til det som ikke ligner</text>
<text x="628" y="785" font-size="14" fill="#1F2A3C" text-anchor="start" font-weight="normal" font-style="normal">spørsmålet. Samme utsnitt hver gang, og hver kobling kan etterprøves.</text>
<rect x="20" y="822" width="1160" height="54" rx="10" fill="#1F2A3C"/>
<text x="600" y="855" font-size="17" fill="#FFFFFF" text-anchor="middle" font-weight="bold" font-style="normal">Med RAG må KI finne relasjonene selv – i en kunnskapsgraf er de allerede der</text>
</svg>