<text x="1074" y="69" font-size="12.5" fill="#1F2A3C" text-anchor="start" font-weight="normal" font-style="normal">ikke relevant</text>
<rect x="20" y="108" width="1160" height="482" rx="12" fill="#F5F7FB" stroke="#C9D6EA"/>
<circle cx="46" cy="133" r="12" fill="#7F6000"/>
<text x="46" y="138" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold" font-style="normal">1</text>
<text x="66" y="139" font-size="16" fill="#7F6000"><tspan font-weight="bold">Semantisk søk</tspan><tspan font-size="13" fill="#6B7280"> – finner startpunkter ut fra mening</tspan></text>
<circle cx="452" cy="133" r="12" fill="#2F5597"/>
<text x="452" y="138" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold" font-style="normal">2</text>
<text x="472" y="139" font-size="16" fill="#2F5597"><tspan font-weight="bold">Grafnavigasjon</tspan><tspan font-size="13" fill="#6B7280"> – følger eksplisitte relasjoner på tvers av kildene</tspan></text>
<text x="1166" y="138" font-size="12" fill="#8A93A3" text-anchor="end" font-weight="normal" font-style="italic">forenklet eksempel</text>
