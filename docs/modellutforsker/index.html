ikk, juss og teknologisk beste praksis kan omsettes til forståelige og distribuerte verktøy som kan brukes av virksomheter i økosystemet. Den løser behovet for felles veiledning som gjør det enklere å forstå hvordan regelverk, prinsipper, standarder, referansearkitekturer og samhandlingsmønstre skal anvendes i praksis.\n\n### Hva det innebærer (Omfang)\n- **Juridisk (Middels vekt):** Utarbeide veiledning som forklarer hvordan relevant regelverk skal forstås og anvendes i digital samhandling, uten å erstatte formelle rettskilder eller myndighetsansvar.\n- **Organisatorisk (Høy vekt):** Etablere rutiner for å utarbeide, kvalitetssikre, godkjenne, publisere, forvalte og oppdatere veiledning i samarbeid med relevante fagmiljøer.\n- **Semantisk (Høy vekt):** Bruke omforente begreper, tydelige beskrivelser, felles maler og konsistent terminologi, slik at veiledningen forstås likt på tvers av virksomheter.\n- **Teknisk (Middels vekt):** Tilgjengeliggjøre veiledning i digitale kanaler, kataloger, repositorier eller kunnskapsbaser, med versjonering, lenking og struktur som gjør innholdet lett å finne og gjenbruke.\n\n### Bidrag til sammenhengende tjenester og felles økosystem\nKapabiliteten bidrar til sammenhengende tjenester ved å gjøre det enklere for virksomheter å bygge løsninger etter felles prinsipper, referansearkitekturer, standarder, samhandlingsmønstre og beskrivelser av beste praksis. Når veiledning er kvalitetssikret og tilgjengelig, reduseres lokale tolkninger og ulik praksis.\n\nFor det felles økosystemet gir kapabiliteten bedre etterlevelse, mer gjenbruk og raskere innføring av felles arkitektur og standarder. For sluttbrukeren betyr dette mer konsistente og sammenhengende digitale tjenester, fordi virksomhetene utvikler og forvalter løsninger etter samme kunnskapsgrunnlag.","p":{},"f":["Strategy","Kapabiliteter i NA"]},"id-ce84b9b6943f4789bca153c0ed15245a":{"id":"id-ce84b9b6943f4789bca153c0ed15245a","t":"Capability","n":"Utviklings- og kjøretidsmiljø","d":"Evne til å tilby og forvalte en felles, skalerbar teknisk plattform og en tilhørende verktøykasse med standardiserte byggeklosser, verktøy og utviklingsmiljøer som forenkler og akselererer utviklingen av digitale tjenester.\n\n### Begrunnelse (Hvorfor)\nTjenesteutvikling foregår i stor grad i sektorene og den enkelte virksomhet. Det vil allikevel være behov for å tilby felles utviklings- og kjøretidsmiljø for hele offentlig sektor eller for spesifikke domener og enkeltsektorer. Kapabiliteten løser behovet for felles teknisk plattform, standardiserte byggeklosser og verktøystøtte som forenkler og akselererer utviklingen av digitale tjenester.\n\n### Hva det innebærer (Omfang)\n- **Juridisk (Lav vekt):** Inngåelse og oppfølging av databehandleravtaler for sky- og plattformtjenester. Sikring av at kjøretidsmiljøene etterlever spesifikke krav.\n- **Organisatorisk (Høy vekt):** Konkrete arbeidsprosesser for onboarding av utviklingsteam til felles plattformer. Definering av operative roller, supportrutiner og tjenestenivåavtaler (SLA) som regulerer oppetid og plattformforvaltning.\n- **Semantisk (Ikke relevant):** Kapabiliteten handler om plattform og infrastruktur for utvikling og drift, ikke om betydningen av data.\n- **Teknisk (Svært høy vekt):** Operasjonell drift av skalerbar skyinfrastruktur, container-teknologi og automatiserte prosesser for kontinuerlig integrasjon og leveranse (CI/CD). Tilgjengeliggjøring av standardiserte verktøykasser, kodebiblioteker og felleskomponenter for applikasjonsutvikling og sanntidsovervåking.\n\n### Bidrag til sammenhengende tjenester og felles økosystem\nNår uavhengige virksomheter benytter harmoniserte verktøy og kjøretidsmiljøer, fjernes store teknologiske ulikheter i bunn. Dette gjør det vesentlig enklere å koble uavhengige applikasjoner sammen til tverrgående tjenestekjeder. For sluttbrukeren betyr dette en stabil digital reise der feil rettes raskere, og nye sammenhengende funksjoner kan rulles ut fortløpende uten avbrudd i tjenestene. Kapabiliteten styrker det felles økosystemet ved å legge til rette for gjenbruk, standardisering og mer effektiv utvikling på tvers av virksomheter.","p":{},"f":["Strategy","Kapabiliteter i NA"]},"id-c0547226c598467a942dced879d0c18b":{"id":"id-c0547226c598467a942dced879d0c18b","t":"Capability","n":"Veiledning","d":"Evne til å sikre at veiledninger for digital samhandling utarbeides, formidles og benyttes.\n\n### Begrunnelse (Hvorfor)\nKapabiliteten sikrer at virksomheter i økosystemet får veiledning på hva som er god faglig praksis, hvordan relevant regelverk bør forstås i digital samhandling, og hvilke prioriteringer som er i samsvar med vedtatt politikk. \n\n### Hva det innebærer (Omfang)\n- **Juridisk (Middels vekt):** Veiledning må forklare hvordan regelverk, føringer og krav kan anvendes i digital samhandling, uten å erstatte formelle rettskilder, regelverkstolkning eller myndighetsansvar.\n- **Organisatorisk (Høy vekt):** Det må finnes rutiner for å utarbeide, kvalitetssikre, forvalte og formidle veiledning, med tydelig angivelse av veiledningens styrke (bør benyttes eller kan benyttes).\n- **Semantisk (Høy vekt):** Beskrivelser av beste praksis, prinsipper, mønstre og referansearkitekturer må bruke omforente begreper og felles maler, slik at veiledningen forstås og anvendes likt på tvers av virksomheter.\n- **Teknisk (Middels vekt):** Veiledning må være tilgjengelig i digitale kanaler, kataloger og kunnskapsbaser med versjonering og lenking, og tekniske veiledere og referansearkitekturer må kunne brukes direkte som grunnlag for løsningsvalg.\n\n### Bidrag til sammenhengende tjenester og felles økosystem\nNår veiledningen er kvalitetssikret, lett tilgjengelig og brukes aktivt, reduseres lokale tolkninger og ulik praksis, og felles prinsipper og standarder tas raskere i bruk. For felles økosystem gir dette bedre etterlevelse og mer gjenbruk. For sluttbrukeren betyr det mer konsistente og sammenhengende digitale tjenester, fordi virksomhetene utvikler og forvalter løsninger etter samme kunnskapsgrunnlag.","p":{},"f":["Strategy","Kapabiliteter i NA"]},"id-8914d57f4f1442b1b562252a3630a686":{"id":"id-8914d57f4f1442b1b562252a3630a686","t":"Capability","n":"Visualisering","d":"Evne til å omforme komplekse data til visuelle fremstillinger som gjør innsikt lett tilgjengelig, forståelig og anvendbar.\n\n### Begrunnelse (Hvorfor)\nVisualisering er kapabiliteten som gjør at vi kan \"se\" historien dataene forteller. I et felles digitalt økosystem er dette kritisk for å drive datadrevet historiefortelling, slik at fakta presenteres på en måte som gjør det enkelt å kommunisere komplekse budskap til andre og skape felles situasjonsforståelse på tvers av virksomheter.\n\n### Hva det innebærer (Omfang)\n- **Juridisk (Middels vekt):** Personvern og risiko for reidentifisering må ivaretas når data sammenstilles og publiseres i dashboards og visualiseringer.\n- **Organisatorisk (Høy vekt):** Etablere rutiner og metoder for datadrevet historiefortelling og jevnlig oppdatering av visuelle dashboards for ledelse og saksbehandling. Sikre kompetanse hos ansatte til å tolke komplekse data, designe gode visuelle fremstillinger og bruke dashboards som beslutningsstøtte.\n- **Semantisk (Høy vekt):** Strukturere komplekse datasett, sanntidsdata og geografiske data slik at visualiseringene gir korrekt mening og kan forstås likt på tvers av virksomheter.\n- **Teknisk (Høy vekt):** Bruke verktøystøtte for dashboards som oppdaterer seg selv i sanntid, samt tekniske løsninger for geografisk fremstilling, for eksempel kartkobling, for å visualisere stedbundne hendelser.\n\n### Bidrag til sammenhengende tjenester og felles økosystem\nKapabiliteten sikrer beslutningsstøtte i sanntid, slik at aktører som samarbeider om en sammenhengende tjeneste kan ta umiddelbare og koordinerte valg basert på hvordan situasjonen i økosystemet er akkurat nå. Visualisering gjør innsikt lettere å dele mellom virksomheter, gir felles situasjonsforståelse og bidrar til at komplekse data kan brukes aktivt i styring, tjenesteutvikling og operativ oppfølging.","p":{},"f":["Strategy","Kapabiliteter i NA"]},"id-db4f30a87ae84561a4058d4d264177b1":{"id":"id-db4f30a87ae84561a4058d4d264177b1","t":"Capability","n":"Åpne data","d":"Evne til å tilgjengeliggjøre åpne data slik at de kan leses og tolkes av både maskiner og mennesker, og som alle kan få tilgang til, bruke og dele.\n\n### Begrunnelse (Hvorfor)\nKapabiliteten utvider verdien av offentlige data utover forvaltningens egne grenser og gir avkastning i hele samfunnet. Åpne data styrker demokrati og åpenhet ved å gi innbyggere, journalister og interessegrupper mulighet til innsyn i forvaltningens arbeid og beslutningsgrunnlag. Dette øker transparensen og legger til rette for en mer informert offentlig debatt.\n\nÅpne data er også et råstoff for næringsutvikling og innovasjon. Offentlige data representerer en stor ressurs som kan gi næringslivet grunnlag for å skape nye produkter, tjenester og arbeidsplasser som det offentlige ikke ville utviklet selv.\n\nKapabiliteten forbedrer forskning og faktabasert politikkutforming ved å gi forskere tilgang til rike datasett som kan brukes til å analysere samfunnstrender, evaluere politikk og løse komplekse samfunnsutfordringer.\n\n### Hva det innebærer (Omfang)\n- **Juridisk (Høy vekt):** Sikre at data kan gjøres tilgjengelig for fri bruk og viderebruk innenfor gjeldende regelverk, lisenser, personvern, taushetsplikt og krav til offentlighet.\n- **Organisatorisk (Høy vekt):** Etablere rutiner for å identifisere, prioritere, publisere, vedlikeholde og følge opp åpne datasett over tid, slik at andre kan stole på tilgjengelighet og pålitelighet.\n- **Semantisk (Høy vekt):** Sørge for at åpne data er godt dokumenterte, sporbare tilbake til kilden og beskrevet med metadata som gjør dem lette å oppdage, vurdere, forstå, dele og diskutere.\n- **Teknisk (Høy vekt):** Tilgjengeliggjøre data i maskinleselige, standardiserte og strukturerte formater som kan bearbeides av både mennesker og maskiner, og som kan lenkes til og brukes på tvers av løsninger.\n\n### Bidrag til sammenhengende tjenester og felles økosystem\nÅpne data styrker det felles økosystemet ved å gjøre offentlige data tilgjengelige som en felles ressurs for forvaltning, næringsliv, forskning, sivilsamfunn og innbyggere. Når data er godt dokumenterte, maskinleselige, sporbare og pålitelige over tid, kan de brukes som byggeklosser i nye tjenester, analyser og beslutningsgrunnlag.\n\nKapabiliteten bidrar til sammenhengende tjenester ved at aktører utenfor den opprinnelige datakilden kan bygge videre på samme informasjonsgrunnlag. Dette gir mer åpenhet, økt innovasjon, bedre faktagrunnlag og mer effektiv gjenbruk av data på tvers av virksomheter og sektorer.","p":{},"f":["Strategy","Kapabiliteter i NA"]},"id-c447ce23ba0c49a9bf0f8c8820c29234":{"id":"id-c447ce23ba0c49a9bf0f8c8820c29234","t":"Capability","n":"Meldingsutveksling","d":"Evne til å utveksle strukturert informasjon som meldinger mellom aktører, basert på avtalte prosesser, standarder, informasjonsmodeller, sikkerhetskrav og kvitterings-/avviksmekanismer.\n\n### Begrunnelse (Hvorfor)\nMeldingsutveksling gjør det mulig for virksomheter å samhandle digitalt uten at alle aktører må etablere egne punkt-til-punkt-integrasjoner. Kapabiliteten reduserer fragmentering, legger til rette for standardisert informasjonsflyt og sikrer at meldinger kan forstås, behandles og følges opp på tvers av uavhengige virksomheter. Dette er særlig viktig for sammenhengende tjenester der flere aktører inngår i samme tjenestekjede.\n\n### Hva det innebærer (Omfang)\n- **Juridisk (Høy vekt):** Sikrer at meldinger kan utveksles med nødvendig behandlingsgrunnlag, avklarte ansvar, krav til taushetsplikt, personvern, journalføring og arkivering.\n- **Organisatorisk (Svært høy vekt):** Etablerer felles samhandlingsprosesser, roller, ansvar, avtaler og forventninger mellom avsender, mottaker og eventuelle felles tjenesteeiere.\n- **Semantisk (Svært høy vekt):** Sikrer felles forståelse av meldingstyper, begreper, informasjonsmodeller, statusverdier, kvitteringer og avvik.\n- **Teknisk (Høy vekt):** Bygger på felles standarder, grensesnitt, sikkerhetsmekanismer og infrastruktur som gjør systemer i stand til å sende, motta og behandle meldinger, f.eks. en meldingsformidler.\n\n\n### Bidrag til sammenhengende tjenester og felles økosystem\nMeldingsutveksling bidrar til sammenhengende tjenester ved å sikre at nødvendig informasjon kan flyte strukturert og pålitelig mellom virksomheter i en tjenestekjede. Brukeren slipper å være bærer av informasjon mellom aktørene, og virksomhetene kan behandle saker mer helhetlig og effektivt.\nKapabiliteten styrker det felles digitale økosystemet ved å redusere behovet for særskilte integrasjoner, øke gjenbruk av standarder og legge til rette for mer forutsigbar samhandling mellom offentlige og private aktører.","p":{},"f":["Strategy","Kapabiliteter i NA"]},"id-fdd16850a7e14a44aa6eee04e7fb7933":{"id":"id-fdd16850a7e14a44aa6eee04e7fb7933","t":"Driver","n":"Data (tilgang, kvalitet, standardisering)","d":"","p":{},"f":["Motivation","Drivere og begrensninger"]},"id-f063a8707ed544e19d37cd3202144f95":{"id":"id-f063a8707ed544e19d37cd3202144f95","t":"Constraint","n":"Data (tilgang, kvalitet, standardisering)","d":"","p":{},"f":["Motivation","Drivere og begrensninger"]},"id-6ca699ff68db4d6f826a69ff874fd779":{"id":"id-6ca699ff68db4d6f826a69ff874fd779","t":"Driver","n":"Juridiske forhold","d":"Et fragmentert og komplisert regelverk knyttet til digital sikkerhet gjør at det er mange aktører som gir råd og veiledning på området. Det er et stort behov for bedre samarbeid og samordning på området, for å bedre situasjonen for virksomhetene som skal forholde seg til regelverkene, rådene og veiledningen.","p":{},"f":["Motivation","Drivere og begrensninger"]},"id-cdb5a1fd5f594567996f89eb16ebd020":{"id":"id-cdb5a1fd5f594567996f89eb16ebd020","t":"Constraint","n":"Juridiske forhold","d":"","p":{},"f":["Motivation","Drivere og begrensninger"]},"id-74c215c488604ce0b6b5f38e82beea37":{"id":"id-74c215c488604ce0b6b5f38e82beea37","t":"Driver","n":"Kapasitet","d":"","p":{},"f":["Motivation","Drivere og begrensninger"]},"id-24ce59ae322d47ae974cf7b60ab33b45":{"id":"id-24ce59ae322d47ae974cf7b60ab33b45","t":"Constraint","n":"Kapasitet","d":"","p":{},"f":["Motivation","Drivere og begrensninger"]},"id-e1cb605054454e0fa20c4ecab1828949":{"id":"id-e1cb605054454e0fa20c4ecab1828949","t":"Driver","n":"Kompetanse","d":"Ha riktig kompetanse og sikre samarbeid og samordning er det som er avgjørende for dette arbeidet.","p":{},"f":["Motivation","Drivere og begrensninger"]},"id-a1fdbf1b586e49168f5bd345eb8d5ef8":{"id":"id-a1fdbf1b586e49168f5bd345eb8d5ef8","t":"Constraint","n":"Kompetanse","d":"","p":{},"f":["Motivation","Drivere og begrensninger"]},"id-6094ffdec736482fb3bb50f0e2448f9d":{"id":"id-6094ffdec736482fb3bb50f0e2448f9d","t":"Driver","n":"Økonomiske rammer","d":"","p":{},"f":["Motivation","Drivere og begrensninger"]},"id-b52f7c7b4a5142ec9122bea10a0cab04":{"id":"id-b52f7c7b4a5142ec9122bea10a0cab04","t":"Constraint","n":"Økonomiske rammer","d":"","p":{},"f":["Motivation","Drivere og begrensninger"]},"id-f1c6e616a4744bdd92bb4618980a9ff5":{"id":"id-f1c6e616a4744bdd92bb4618980a9ff5","t":"Driver","n":"Tekniske løsninger og infrastruktur","d":"tekniske løsninger og infrastruktur må være mer samkjørt og produktstrategisk i felles retning for et felles økosystem","p":{},"f":["Motivation","Drivere og begrensninger"]},"id-9b0a9570968543b9801adac1a26b9561":{"id":"id-9b0a9570968543b9801adac1a26b9561","t":"Constraint","n":"Tekniske løsninger og infrastruktur","d":"","p":{},"f":["Motivation","Drivere og begrensninger"]},"id-4bd51b22f8894f87b3ce4bf869e2a912":{"id":"id-4bd51b22f8894f87b3ce4bf869e2a912","t":"Driver","n":"Samarbeid og samordning","d":"For å lykkes med arbeidet med finansieringsmodeller er samarbeid og samordning helt sentralt.","p":{},"f":["Motivation","Drivere og begrensninger"]},"id-f3680e1c37814287acc93c4b4404e7a7":{"id":"id-f3680e1c37814287acc93c4b4404e7a7","t":"Constraint","n":"Samarbeid og samordning","d":"","p":{},"f":["Motivation","Drivere og begrensninger"]},"id-897fd3d0f5fd4c2891e824a371d5e69b":{"id":"id-897fd3d0f5fd4c2891e824a371d5e69b","t":"Goal","n":"Et velfungerende felles digitalt økosystem for samhandling og tjenesteutvikling i offentlig sektor","d":"Offentlig sektor må øke digitaliseringstakten. Skal vi kunne utnytte de mulighetene teknologien gir, og bidra til en mer effektiv og bærekraftig digital utvikling, trenger vi en nasjonal arkitektur for samhandling. Arkitekturen bør beskrive nødvendige ressurser for samhandling, som fellesløsninger, infrastruktur for deling av data og standarder, og standardiserte grensesnitt (API-er). Gjennom en nasjonal arkitektur tydeliggjøres sammenhenger og ansvar, og det blir enklere å identifisere behov for tiltak.\n\nRegjeringen vil sikre sterkere styring og samordning av digitaliseringen på tvers av sektorer og forvaltningsnivåer. Nasjonal arkitektur er et av flere viktige virkemidler for å realisere målet og beskriver blant annet nødvendige ressurser for digital samhandling - inkludert fellesløsninger, infrastruktur for datautveksling og felles standarder. Ved å tydeliggjøre sammenhenger, ansvar og tiltak blir det enklere å identifisere behov og koordinere innsatsen på tvers av sektorer og forvaltningsnivåer. Utvikling, forvaltning og prioritering av nasjonal arkitektur bidrar til å gjøre digitaliseringen robust, skalerbar og målrettet, samtidig som det reduserer unødvendig dobbeltarbeid og forenkler brukeropplevelsen. \nSammen med teamet som jobber med Nasjonalt veikart vil vi aktivt bidra opp under målet ved at vi styrker nasjonal arkitekturstyring og lager kunnskapsgrunnlag for felles prioritering. Vi vil i tillegg samarbeide med andre team som arbeider med organisatoriske, økonomiske og juridiske virkemidler som styrker styring og samordning på tvers. Det er derfor relevant å ha dialog rundt arbeid om for eksempel Digitaliseringsrundskrivet, medfinansieringsordningen, livshendelser og sektorovergripende prosjekter. \nNasjonal arkitektur har en viktig rolle fordi den legger til rette for at digitaliseringsarbeidet ikke skal skje fragmentert, men som en integrert og koordinert helhet. Den underbygger styringsmekanismene ved å tilby verktøy og prinsipper for beslutninger, tekniske standarder, og hjelper til med å balansere arkitektur lokalt, sektorielt og nasjonalt.","p":{},"f":["Motivation","Relevante mål fra Digitaliseringsstrategien"]},"id-9f2593113134463ea6863703c308b251":{"id":"id-9f2593113134463ea6863703c308b251","t":"Goal","n":"Få på plass en nasjonal infrastruktur for kunstig intelligens (KI)","d":"","p":{},"f":["Motivation","Relevante mål fra Digitaliseringsstrategien"]},"id-56e7246019f54eec8093568bd0fb8e22":{"id":"id-56e7246019f54eec8093568bd0fb8e22","t":"Goal","n":"Norge skal være ledende på verdiskaping med data og på datadrevet forskning og innovasjon","d":"For å få til datadeling må de riktige ressursene i felles økosystem være på plass. Det gjelder standarder, felles formater, rammeverk, åpne API-er, referansearkitekturer, fellesløsninger mv. Rammeverk for EUs dataområder (data spaces) inneholder også referansearkitekturer og standarder. Nasjonal arkitektur (samhandlingsarkitektur) er nødvendig for å få til datadeling.\nData governance og master data management er nødvendig for at man skal dele data og bruke data, og er viktig for et velfungerende felles økosystem for digital samhandling. Det er pågående arbeid på flere områder innenfor dette målet som bør være koordinert med arbeidet med Nasjonal arkitektur","p":{},"f":["Motivation","Relevante mål fra Digitaliseringsstrategien"]},"id-89e255a238d346a4901424f0059e6345":{"id":"id-89e255a238d346a4901424f0059e6345","t":"Goal","n":"Næringslivets konkurranseevne styrkes gjennom innovativ bruk av data og digitalisering.","d":"Evnen til å tilrettelegge for at det nasjonale økosystemet fremmer et omstillingsdyktig og innovativt næringsliv. \n\nDette innebærer:\n- rammebetingelser, insentiver og samarbeidsformer som gjør det attraktivt og forutsigbart for private aktører å bygge tjenester oppå nasjonale fellesløsninger og data\n\nHvorfor er dette viktig?\n- Offentlige data som råstoff: Åpne og tilgjengelige data er en ressurs som næringslivet trenger for å skape produkter forvaltningen selv ikke ville utviklet.\n- Styrket konkurransekraft: Ved å gjøre offentlige fellesløsninger tilgjengelige for private aktører, økes mulighetene for innovasjon i næringslivet.\n\nI Digitaliseringsstrategien er det et mål at:\n-  Regjeringen vil frem mot 2030 legge til rette for at næringslivets konkurranseevne styrkes gjennom innovativ bruk av data og digitalisering. Oppstartsbedrifter skal ha gode rammevilkår. Vi skal sørge for at digitalisering og utnyttelse av data forsterker våre fortrinn i viktige bransjer, slik som helse, energi, havbruk og andre maritime næringer.","p":{},"f":["Motivation","Relevante mål fra Digitaliseringsstrategien"]},"id-bf3fa917baad486d9865b9627199a2d4":{"id":"id-bf3fa917baad486d9865b9627199a2d4","t":"Goal","n":"Næringslivet skal ha gode rammevilkår for å utvikle og bruke KI. Offentlig sektor skal anvende KI for å utvikle bedre tjenester og løse oppgaver mer effektivt","d":"","p":{},"f":["Motivation","Relevante mål fra Digitaliseringsstrategien"]},"id-cbc357e78ede45e8aa565fde3b7380b5":{"id":"id-cbc357e78ede45e8aa565fde3b7380b5","t":"Goal","n":"Vi skal ha en offentlig sektor som tilbyr bedre, mer sammenhengende digitale tjenester til innbyggere og næringsliv","d":"Målet om sammenhengende tjenester til beste for bruker stiller krav til nasjonal arkitektur.\nNasjonal arkitektur er nødvendig for å få til samhandling og sammenhengende tjenester. Felles økosystem tilbyr ressurser for samhandling og sammenhengende tjenester. Vi skal både tilby ressurser som muliggjør dette, men også sette rammer som styrer offentlig sektor i retning av sammenhengende digitale tjenester. \nNasjonal arkitektur kan også bidra til å balansere styrkeforholdet mellom store offentlige etater og mindre statlig/kommunale. Gjennom felles standarder, arkitekturer og retningslinjer kan vi bidra til at det blir lettere å dele og bruke data og få til bedre samhandling.\nNasjonal arkitektur bør bidra til utforskning av nye måter å skape sammenheng og forenkling for innbygger og næringsliv. Sammenhengende tjenester introduserer også noen nye utfordringer som bør avklares og nasjonal arkitektur bør foreslå hvordan disse utfordringene adresseres. Ved å samarbeide tett med avdelingen for «Sammenhengende tjenester og livshendelser» og jobbe behovsdrevet med ekte problemer og ekte behov, skal vi aktivt prøve å finne løsninger på de arkitekturmessige hindringene.","p":{},"f":["Motivation","Relevante mål fra Digitaliseringsstrategien"]},"id-90ff9c60528d4dfe93d534bd6a7bcfeb":{"id":"id-90ff9c60528d4dfe93d534bd6a7bcfeb","t":"Goal","n":"Vi skal delta i EUs satsing på dataområder der det er relevant","d":"Arbeidet med dataområdene i EU vil komme med referansearkitekturer og standarder som må innføres som en del av nasjonal arkitektur.","p":{},"f":["Motivation","Relevante mål fra Digitaliseringsstrategien"]},"id-9622546accfc43d28a38cebdecf8818a":{"id":"id-9622546accfc43d28a38cebdecf8818a","t":"Goal","n":"Sørge for at alle har et tilbud om en elektronisk identitet","d":"","p":{},"f":["Motivation","Relevante mål fra Digitaliseringsstrategien"]},"id-a4062153239a4d13a9fdef8cc205c8e6":{"id":"id-a4062153239a4d13a9fdef8cc205c8e6","t":"Goal","n":"Sterkere styring og samordning av digitalisering på tvers av sektorer","d":"Nasjonal arkitektur er et viktig virkemiddel for å skape sterke synergier mellom norsk og europeisk digitaliseringspolitikk. Den skal bygge på føringer fra EU og fungerer som et rammeverk som integrerer EUs regelverk, standarder og referansearkitekturer i norsk digitaliseringsarbeid. EU-forordninger etablerer nasjonale funksjoner og styringsformer som også dekker Norges behov for koordinering og styring av arkitektur. \nVed å implementere felles europeiske standarder, sikrer nasjonal arkitektur at norske digitale tjenester kan samhandle effektivt over landegrensene. Samtidig bør Norge bli bedre på å hente erfaringer fra andre land og bruke internasjonale løsninger som utgangspunkt for egen utvikling, noe som reduserer både kostnader og utviklingstid. Gjennom dette sikrer nasjonal arkitektur en helhetlig og framtidsrettet digitalisering som både møter norske behov og Europas digitale agenda.","p":{},"f":["Motivation","Relevante mål fra Digitaliseringsstrategien"]},"id-0cf363c3f2ff4fa3a34bda7a610e6f70":{"id":"id-0cf363c3f2ff4fa3a34bda7a610e6f70","t":"Outcome","n":"Effektmål","d":"De konkrete resultatene av å bruke kapabilitetene. Kapabiliteter beskriver hva økosystemet må kunne gjøre for å oppnå effekter.\nTiltak bidrar positivt til å nå effektmål.\n\nSe på dybdeindikatorene fra nullpunktsmåling:\nhttps://www.digdir.no/rikets-digitale-tilstand/nullpunktmaling-digitaliseringsstrategien-fremtidens-digitale-norge/7416\nF.eks:\n* https://www.digdir.no/rikets-digitale-tilstand/sorge-en-sikker-og-fremtidsrettet-digital-infrastruktur-kap-32/7429\n* https://www.digdir.no/rikets-digitale-tilstand/forsterke-styring-og-samordning-i-offentlig-sektor-kap-31/7428","p":{},"f":["Motivation"]},"id-534850df1c7b48e2a2e7cc966ece233f":{"id":"id-534850df1c7b48e2a2e7cc966ece233f","t":"Goal","n":"Strategiske mål","d":"Målene fra Digitaliseringsstrategien.","p":{},"f":["Motivation"]},"id-46a97f13294345f89decd549d4269848":{"id":"id-46a97f13294345f89decd549d4269848","t":"Principle","n":"Prinsipper Nasjonal Arkitektur","d":"https://www.digdir.no/digital-samhandling/overordnede-arkitekturprinsipper/1065","p":{},"f":["Motivation"]},"id-d4632a56bcf04c768517303bf05c2882":{"id":"id-d4632a56bcf04c768517303bf05c2882","t":"Goal","n":"Innovasjon og næringsutvikling","d":"","p":{},"f":["Motivation"]},"id-04fef6c083b449dba91c876ae2e3715f":{"id":"id-04fef6c083b449dba91c876ae2e3715f","t":"Principle","n":"Prinsipp","d":"En overordnet og veiledende regel eller retningslinje som er ment å være varig og styrende for alle relevante beslutninger. \nPrinsipper er generelle regler og retningslinjer, ment å være varige og sjelden endres, som informerer og støtter måten en organisasjon går i gang med å oppfylle sitt oppdrag.\nSe overordnete arkitekturprinsipper: https://www.digdir.no/digital-samhandling/overordnede-arkitekturprinsipper/1065\n\nEksempel: \"Data skal kun lagres én gang\".\n\nEU ELAP: Det europeiske biblioteket for arkitekturprinsipper (ELAP) etablerer prinsipper og rammeverk for å sikre interoperabilitet på europeisk nivå , inkludert det europeiske interoperabilitetsrammeverket (EIF), EU-lovgivning, tilgjengelighet, «Once Only» og mer. Dette biblioteket er et kvalitetssikringsverktøy som også etablerer krav og forretningsprosesser for å muliggjøre interoperabilitet mellom digitale offentlige tjenester.\nSe:  https://joinup.ec.europa.eu/collection/common-assessment-method-standards-and-specifications-camss/solution/elap\n\nTogaf definisjon og beste-praksis beskrivelse og definisjon av Arkitekturprinsipper:\nhttps://pubs.opengroup.org/architecture/togaf9-doc/arch/chap20.html","p":{},"f":["Motivation"]},"id-d7a27706ca3240468e16d88afbcd4a3e":{"id":"id-d7a27706ca3240468e16d88afbcd4a3e","t":"Assessment","n":"Dekningsgradsvurdering","d":"Identifiserer svakheter og dekningsgrad i dagens arkitektur, vurdert opp mot mål, effektmål, behov og ønsket situasjon.\n\nAssessment brukes til å dokumentere hvor godt kapabiliteter og ressurser dekker et bestemt behov, et bestemt effektmål eller en ønsket fremtidig tilstand. Vurderingen gir grunnlag for å identifisere gap, prioritere tiltak og vurdere om økosystemet har nødvendige evner og byggeklosser for å nå ønskede effekter.\n\nVurderingsegenskaper kan være forskjellig utifra hva man skal måle opp mot, f.eks. ulike behov eller mål:\n- realiseringsgrad: [1-5]\n- begrunnelse:[...]\n- dato: [...]\n- vurdertAv: [...] \n- vurderingskontekst: [...]. f.eks. \"Nasjonal vurdering\", \"prosjekt A\",...\n\n### Hva som vurderes\nEn assessment kan brukes til å vurdere både kapabiliteter og ressurser.\nFor kapabiliteter vurderes hvor godt evnen er dekket i dagens situasjon sammenlignet med ønsket nivå. Dette kan for eksempel uttrykkes som:\n- målverdi\n- dagens verdi\n- gap mellom dagens verdi og målverdi\n- modenhet\n- begrunnelse for vurderingen\n\nFor ressurser vurderes hvor godt en konkret ressurs realiserer eller understøtter én eller flere kapabiliteter, behov eller effektmål. Dekningsgrad bør derfor vurderes i kontekst, ikke som én global score for ressursen.\nEksempel: Fellesløsningen `Maskinporten` kan ha ulik dekningsgrad avhengig av hvilken kapabilitet eller hvilket effektmål den vurderes mot:\n\n- Dekningsgrad for kapabilitet `Tilgangsstyring`: `[1-5]`\n- Dekningsgrad for kapabilitet `Representasjon`: `[1-5]`\n- Dekningsgrad for effektmål `Sømløs system-til-system-samhandling`: `[1-5]`\n\nDette gjør det mulig å vise at samme ressurs kan være godt egnet for ett behov, men ha lavere dekningsgrad for et annet.\n\n### Gap og modenhet\nGap beregnes som avstanden mellom dagens verdi og ønsket målverdi.\n- **Rødt (Gap > 2):** Kapabiliteter eller ressurser der avstanden mellom nåsituasjon og mål er kritisk stor. Her bør tiltak prioriteres.\n- **Gult (Gap = 1):** Kapabiliteter eller ressurser som er på vei mot ønsket nivå, men som krever vedlikehold, oppfølging eller mindre forbedringer.\n- **Grønt (Gap = 0):** Kapabiliteten eller ressursen har nådd ønsket målverdi.\n\nMåling av kapabilitetsmodenhet hjelper med å synliggjøre gapet mellom nåsituasjon (`as-is`) og ønsket fremtidig situasjon (`to-be`). Dette gir grunnlag for å prioritere hvor innsatsen bør settes inn.\n\nModenheten til en kapabilitet vurderes blant annet basert på tilstanden til de underliggende ressursene som realiserer eller understøtter kapabiliteten.\n\n### Ressurser og måling\nRessurser kan vurderes med indikatorer som viser hvor godt de understøtter kapabiliteter og effektmål.\nAktuelle indikatorer kan være:\n- **Dekningsgrad (1-5):** I hvilken grad ressursen faktisk er tilgjengelig, moden og egnet til å støtte en bestemt kapabilitet, et behov eller et effektmål.\n- **Funksjonell egnethet (Functional Fit):** Hvor godt ressursen støtter behovet, prosessen eller tjenesten den skal bidra til.\n- **Teknisk egnethet (Technical Fit):** Hvor moderne, stabil, sikker og teknisk egnet ressursen er.\n- **Livssyklusstatus:** Om ressursen er i aktiv bruk, under innføring, under utfasing eller ved slutten av livsløpet.\n\nEksempler på livssyklusstatus:\n- 'Operativ'\n- 'Utfasing'\n- 'Avsluttet'\n\nAssessment kan også brukes til å lage heatmaps som viser dekningsgrad, egnethet, modenhet og gap på tvers av kapabiliteter, ressurser, domener eller effektmål.\n\n### POTI-basert ressursvurdering metode\nPOTI kan brukes som analysemodell for å vurdere ressursenes rolle og tilstand.\n\nPOTI står for:\n- **Prosess:** Arbeidsflyter, rutiner og prosedyrer som ressursen understøtter eller påvirker.\n- **Organisasjon:** Roller, ansvar, kompetanse, styring, samhandling og kapasitet knyttet til ressursen.\n- **Teknologi:** Systemer, applikasjoner, infrastruktur, grensesnitt og tekniske løsninger som ressursen består av eller bygger på.\n- **Informasjon:** Data, metadata, informasjonsmodeller, datakvalitet, tilgjengelighet og informasjonsflyt som ressursen forvalter eller gjør mulig.\n\nPOTI brukes ikke som erstatning for ressurskategoriene i Nasjonal arkitektur. Ressurser kan fortsatt kategoriseres som for eksempel gjenbrukbare løsninger, standarder og veiledning, samhandlingsarenaer og organisering, eller økonomiske og juridiske rammer og virkemidler.\n\nPOTI brukes som et analyseperspektiv på tvers av disse kategoriene. En ressurs kan vurderes ut fra om den primært påvirker prosesser, organisering, teknologi eller informasjon. Mange ressurser vil berøre flere POTI-dimensjoner samtidig.\n\n### Hvorfor bruke POTI i vurderingen\nPOTI gjør det mulig å analysere om ressursene samlet sett er tilstrekkelige for å realisere en kapabilitet.\nEn kapabilitet kan for eksempel ha god teknologistøtte, men likevel lav samlet dekningsgrad dersom prosesser, organisering, kompetanse eller informasjonsgrunnlag mangler. På samme måte kan en ressurs være teknisk moden, men ha lav funksjonell egnethet dersom den ikke støtter arbeidsprosessene eller behovene godt nok.\n\nPOTI er særlig nyttig når man skal:\n- forstå nåsituasjon og ønsket fremtidig situasjon\n- identifisere styrker, svakheter og forbedringsområder\n- vurdere om organisasjonen er rigget for å gjennomføre strategien\n- prioritere tiltak for å lukke gap\n- analysere konsekvenser av digital transformasjon, omorganisering eller innføring av nye teknologiske løsninger\n\n### Eksempler på vurderingsspørsmål\nFor **prosess** kan vurderingen stille spørsmål som:\n- Hvilke arbeidsflyter, rutiner og prosedyrer understøttes av ressursen?\n- Er prosessene dokumenterte og etterlevd?\n- Bidrar ressursen til mer effektiv og sammenhengende oppgaveløsning?\n\nFor **organisasjon** kan vurderingen stille spørsmål som:\n- Er roller og ansvar tydelig definert?\n- Finnes nødvendig kompetanse og kapasitet?\n- Er organisasjonen rigget for å forvalte og bruke ressursen?\n\nFor **teknologi** kan vurderingen stille spørsmål som:\n- Hvilke verktøy, systemer eller tekniske løsninger er i bruk?\n- Er løsningene integrerte, brukervennlige, sikre og skalerbare?\n- Hvor godt støtter teknologien automatisering, samarbeid eller datadrevne beslutninger?\n- Finnes det teknisk gjeld eller avhengigheter som påvirker egnetheten?\n\nFor **informasjon** kan vurderingen stille spørsmål som:\n- Er informasjonen nøyaktig, tilgjengelig og forståelig?\n- Hvordan deles, gjenbrukes og analyseres data på tvers?\n- Er datakvaliteten tilstrekkelig?\n- Er datasett, begreper, informasjonsmodeller eller API-er registrert i relevante kataloger, for eksempel Felles datakatalog?\n- Er virksomheten i tilstrekkelig grad i orden i eget hus?\n\n### Sammenheng med mål, prinsipper og tiltak\nEn kapabilitet kan bidra til å realisere både mål, effektmål og prinsipper. Den viser hvordan en organisasjon, et domene eller det nasjonale økosystemet faktisk implementerer, oppfyller eller tolker hensikten bak et mål eller prinsipp i praksis.\n\nAssessment gjør det mulig å vurdere om kapabilitetene og ressursene har tilstrekkelig dekningsgrad til å nå ønskede effekter. Dersom vurderingen avdekker gap, kan konkrete tiltak prioriteres for å styrke kapabiliteter, forbedre ressurser eller redusere avstanden mellom dagens situasjon og ønsket situasjon.\n\n### Se også\nDe konkrete resultatene av å bruke kapabilitetene kan vurderes i sammenheng med indikatorer og dybdemålinger fra Digitaliseringsstrategien.\n\nSe evt. på dybdeindikatorene fra nullpunktsmåling:\nhttps://www.digdir.no/rikets-digitale-tilstand/nullpunktmaling-digitaliseringsstrategien-fremtidens-digitale-norge/7416\n\nEksempler:\n- https://www.digdir.no/rikets-digitale-tilstand/sorge-en-sikker-og-fremtidsrettet-digital-infrastruktur-kap-32/7429\n- https://www.digdir.no/rikets-digitale-tilstand/forsterke-styring-og-samordning-i-offentlig-sektor-kap-31/7428","p":{},"f":["Motivation"]},"id-63eeffd71e92467281f421c58bac305f":{"id":"id-63eeffd71e92467281f421c58bac305f","t":"Driver","n":"Drivere","d":"\"Drivere\" er den grunnleggende motivasjonen eller årsaken til at en endring settes i gang.\n\nDrivarar og hindringar må sjåast i samanheng. Dei viktigaste hindringane er økonomiske rammer og kapasitet. \nEi styrking her vil vere blant dei viktigaste drivarane for å oppnå resultat og realisere gevinstar av teknisk infrastruktur og data, knytt til handheving av eit stadig meir omfattande regelverk.","p":{},"f":["Motivation"]},"id-87d27b24cab34a089853e52f3512c376":{"id":"id-87d27b24cab34a089853e52f3512c376","t":"Constraint","n":"Hindringer","d":"Hindringer: Hva stopper eller begrenser oss?","p":{},"f":["Motivation"]},"id-707202a7db214363817d403344afb867":{"id":"id-707202a7db214363817d403344afb867","t":"Principle","n":"NSM","d":"","p":{},"f":["Motivation"]},"id-94f7473fb4184e3b94bb92c35186b88f":{"id":"id-94f7473fb4184e3b94bb92c35186b88f","t":"Principle","n":"P1: Ta utgangspunkt i brukernes behov","d":"Offentlige tjenester skal bygge på brukernes behov og perspektiver og kunne brukes av alle, uavhengig av alder og funksjonsevne. Brukerne forventer brukervennlige og sammenhengende tjenester, noe som krever samordnede arbeidsprosesser på tvers av sektorer, mellom offentlig og privat sektor og over landegrenser.\n\nBegrunnelse: Brukerne får et enklere møte med forvaltningen, opplever tjenestene som helhetlige og sammenhengende, og får ivaretatt sine rettigheter og plikter.\n\nKjennetegn ved etterlevelse:\n- Løsningen er utformet ut fra brukernes behov.\n- Prosessene er bygd på tvers av virksomheter og sektorer, slik at brukeren møter sammenhengende tjenester.\n- Krav og regelverk for universell utforming følges, også i fagsystemer og saksbehandlingsverktøy.\n- Kommunikasjonen med brukerne bruker klart språk.\n- Egnede metoder, som tjenestedesign, prosessmodellering og brukertesting med bred representasjon, er brukt for å avdekke behov og sammenhenger, også behov brukerne ikke selv etterspør.\n\nKilde: Overordnede arkitekturprinsipper Digdir.\nhttps://www.digdir.no/digital-samhandling/prinsipp-1-ta-utgangspunkt-i-brukernes-behov/1055","p":{},"f":["Motivation"]},"id-dbfcb14c3e024a40b6cb71138311abc0":{"id":"id-dbfcb14c3e024a40b6cb71138311abc0","t":"Principle","n":"P2: Ta arkitekturbeslutninger på rett nivå","d":"Arkitektur er en utviklings- og styringsoppgave som påvirker virksomhetens kostnader og gevinster. Arkitekturbeslutninger bør tas så nær oppgaveløsningen og brukernes behov som mulig, men enkelte beslutninger må løftes for å sikre samhandling med andre og ivareta felles mål for digitalisering i offentlig sektor.\n\nBegrunnelse: Gir balanse mellom effektiv, brukernær oppgaveløsning og samhandlingsevne internt, på tvers av offentlig sektor og mellom offentlige og private virksomheter.\n\nKjennetegn ved etterlevelse – løsningen (ansvarsplassering og styringsnivå):\n- Ansvar og beslutninger er plassert så nær oppgaveløsningen som hensiktsmessig, mens det som påvirker samhandling med andre er løftet til riktig nivå.\n- Løsningen følger nasjonale og sektorielle krav og føringer og målene for digitalisering av offentlig sektor.\n- Designet er vurdert mot relevante nasjonale og europeiske tjenester.\n\nKjennetegn ved etterlevelse – prosessen (hvem beslutter):\n- Det er klart hvem som tar arkitekturbeslutningene, og på hvilket nivå.\n- Arkitekturstyring er en integrert del av virksomhetens styring.\n\nKilde: Overordnede arkitekturprinsipper Digdir.\nhttps://www.digdir.no/digital-samhandling/prinsipp-2-ta-arkitekturbeslutninger-pa-rett-niva/1056","p":{},"f":["Motivation"]},"id-7d62a886cdc14d20a5b361cf68da5754":{"id":"id-7d62a886cdc14d20a5b361cf68da5754","t":"Principle","n":"P3: Bidra til digitaliseringsvennlige regelverk","d":"Regelverk setter rammene for offentlig oppgaveløsning og må videreutvikles i takt med nye muligheter og utfordringer. Arkitekturarbeidet kan avdekke juridiske barrierer for samhandling og digitalisering og bidra til at lov- og forskriftsendringer settes i gang.\n\nBegrunnelse: Digitaliseringsvennlige regelverk er en forutsetning for effektive arbeidsprosesser og sammenhengende tjenester, og kan gjøre automatisering av oppgaveløsningen mulig.\n\nKjennetegn ved etterlevelse:\n- Handlingsrommet i eksisterende regelverk er undersøkt og brukt.\n- Behov for lov- eller forskriftsendringer er spilt inn til ansvarlig departement.\n- Jurister, teknologer og fagsiden samarbeider i regel- og IT-utviklingsarbeidet.\n- Digdir er informert om eller rådført om regelverk som hindrer digitalisering.\n\nKilde: Overordnede arkitekturprinsipper Digdir.\nhttps://www.digdir.no/digital-samhandling/prinsipp-3-bidra-til-digitaliseringsvennlige-regelverk/1057","p":{},"f":["Motivation"]},"id-a27833cb9e324549916a528f31481dce":{"id":"id-a27833cb9e324549916a528f31481dce","t":"Principle","n":"P4: Del og gjenbruk data","d":"Virksomheter skal legge til rette for deling og gjenbruk av data. Data er en fellesressurs som gir store gevinster for forvaltningen, innbyggere, næringsliv og frivillige organisasjoner når de deles og gjenbrukes.\n\nBegrunnelse: Deling av offentlige data gir økt kunnskap, verdiskaping, innovasjon, effektivitet og åpenhet. Det er en forutsetning for effektive arbeidsprosesser, sammenhengende tjenester og automatisering, gjør at brukerne slipper å oppgi informasjon det offentlige allerede har (kun én gang), og kan gi bedre datakvalitet.\n\nKjennetegn ved etterlevelse:\n- Relevante data gjenbrukes, og egne data legges til rette for deling, når tjenester etableres eller videreutvikles.\n- Data hentes fra autoritative kilder; kopier brukes bare der det er nødvendig og holdes oppdatert.\n- Data tilbys i tråd med regjeringens retningslinjer for tilgjengeliggjøring av offentlige data.\n- Datasett, API-er, begreper og informasjonsmodeller er beskrevet i Felles datakatalog.\n- Data er ikke låst i systemspesifikke formater, og egne data forvaltes etter Rammeverk for informasjonsforvaltning.\n\nKilde: Overordnede arkitekturprinsipper Digdir.\nhttps://www.digdir.no/digital-samhandling/prinsipp-4-del-og-gjenbruk-data/1061","p":{},"f":["Motivation"]},"id-5b6ec861e2d246ce90c99ea282d35610":{"id":"id-5b6ec861e2d246ce90c99ea282d35610","t":"Principle","n":"P7: Sørg for tillit til oppgaveløsningen","d":"Innbyggere, næringsliv og frivillige organisasjoner skal kunne stole på at offentlige virksomheter løser oppgavene sine godt og sikkert. Det forutsetter at regelverket etterleves, at rettssikkerhet, effektivitet, informasjonssikkerhet og personvern ivaretas, og at forvaltningen er så åpen og gjennomsiktig som mulig om regler, prosesser, data, tjenester og vedtak.\n\nBegrunnelse: Tillit er en forutsetning for at brukerne velger de digitale offentlige tjenestene. Rettssikkerhet, effektivitet, personvern, informasjonssikkerhet, åpenhet og gjennomsiktighet er viktige bidrag til denne tilliten.\n\nKjennetegn ved etterlevelse:\n- Rettssikkerhet, effektivitet, informasjonssikkerhet og personvern er vektlagt og veid mot hverandre i valget mellom arkitekturalternativer.\n- Personvern og informasjonssikkerhet ivaretas i alle utviklingsfaser og gjennom hele livsløpet, med styring og kontroll som sikrer dette.\n- Datatilsynets prinsipper og anbefalinger for personvern følges.\n- Beslutninger og vedtak er klart formulert, sporbare og etterprøvbare.\n- Saksbehandling og vedtak dokumenteres i tråd med krav til arkiv og samfunnsdokumentasjon i et langtidsperspektiv.\n\nKilde: Overordnede arkitekturprinsipper Digdir.\nhttps://www.digdir.no/digital-samhandling/prinsipp-7-sorg-tillit-til-oppgavelosningen/1064","p":{},"f":["Motivation"]},"id-d0918d8701a4408b93a9ab278ecbb85e":{"id":"id-d0918d8701a4408b93a9ab278ecbb85e","t":"Principle","n":"P5: Del og gjenbruk løsninger","d":"Deling og gjenbruk av løsninger omfatter arkitekturprodukter, løsningskomponenter og tjenester, på nasjonalt, sektorielt og virksomhetsnivå.\n\nBegrunnelse: Deling og gjenbruk fremmer samhandlingsevne, innovasjon og effektivitet, og bidrar til harmonisering, informasjonssikkerhet og personvern. Virksomhetene kan da konsentrere seg om å digitalisere kjernevirksomheten i stedet for å løse utfordringer som allerede er løst.\n\nKjennetegn ved etterlevelse:\n- Eksisterende og planlagte løsninger som kan gjenbrukes, er kartlagt.\n- Fellesløsninger og felleskomponenter brukes der de er egnet for formålet.\n- Markeds- og skyløsninger er vurdert før egenutvikling, og bindinger til enkeltleverandører er vurdert.\n- Arkitekturen gir endrings- og vedlikeholdsevne over tid, blant annet gjennom løse koplinger, modularisering, standardiserte tjenestekontrakter og redusert kompleksitet og teknisk gjeld.\n- Egne løsninger som kan være nyttige for andre, er gjort kjent og tilbudt for gjenbruk, og forbedringsinnspill gis til forvalterne av løsninger som brukes.\n\nKilde: Overordnede arkitekturprinsipper Digdir.\nhttps://www.digdir.no/digital-samhandling/prinsipp-5-del-og-gjenbruk-losninger/1062","p":{},"f":["Motivation"]},"id-0007ec16e9a1406d9f6aabd1f975d993":{"id":"id-0007ec16e9a1406d9f6aabd1f975d993","t":"Principle","n":"P6: Lag digitale løsninger som støtter samhandling","d":"Digitale løsninger skal utvikles slik at de kan samhandle med andre løsninger i offentlig og privat sektor. Det krever juridisk, organisatorisk, semantisk og teknisk samhandlingsevne, blant annet standardisering, avtaler og felles begrepsapparat.\n\nBegrunnelse: Samhandlingsvennlige løsninger er en forutsetning for sammenhengende tjenester og tverrgående prosesser, realisert på en fleksibel og kostnadseffektiv måte.\n\nKjennetegn ved etterlevelse:\n- Løsningen er utformet for samspill med andre løsninger, både ved egenutvikling og ved anskaffelse.\n- Obligatoriske standarder i forskrift om IT-standarder i offentlig forvaltning følges, og ellers brukes anbefalte eller andre åpne standarder.\n- Norsk arkitekturrammeverk for samhandling er brukt når tjenesten skal inngå i samhandling med andre virksomheter.\n- Det finnes avtaler mellom samhandlingspartene om informasjonssikkerhet, personvern, tjenestekvalitet og samhandlingsevne.\n- Informasjonsutvekslingen har ytelse som gjør at brukerne opplever tjenestene som oppdaterte, og løsningen kan skalere ved endret bruk.\n\nKilde: Overordnede arkitekturprinsipper Digdir.\nhttps://www.digdir.no/digital-samhandling/prinsipp-6-lag-digitale-losninger-som-stotter-samhandling/1063","p":{},"f":["Motivation"]},"id-74e15ee821794ae09cd9f7f7a38f32aa":{"id":"id-74e15ee821794ae09cd9f7f7a38f32aa","t":"Principle","n":"FAIR","d":"","p":{},"f":["Motivation"]},"id-66f38bffcd9f48d796a041a9a292d6ed":{"id":"id-66f38bffcd9f48d796a041a9a292d6ed","t":"Gap","n":"Gap","d":"Definerer den spesifikke mangelen (assosiert med analyse av dekningsgrad Nasjonal arkitektur)","p":{},"f":["Implementation & Migration"]},"id-ac4c391b696f493da64833de20f7df9c":{"id":"id-ac4c391b696f493da64833de20f7df9c","t":"Plateau","n":"Nåværende situasjon","d":"","p":{},"f":["Implementation & Migration"]},"id-0d355bfbd31e4a188766733761ede0ba":{"id":"id-0d355bfbd31e4a188766733761ede0ba","t":"Plateau","n":"Ønsket situasjon","d":"","p":{},"f":["Implementation & Migration"]},"id-8810f83ff9fe44c2a3368cdef932526b":{"id":"id-8810f83ff9fe44c2a3368cdef932526b","t":"Grouping","n":"Rammeverk for digital samhandling (European Interoperability Framework)","d":"Rammeverk for digital samhandling.\nhttps://www.digdir.no/digital-samhandling/rammeverk-digital-samhandling/2148\n\nBakgrunnsinformasjon og opprinnelse:\nEU har utviklet European Interoperability Framework (EIF), et felles rammeverk for digital samhandling. Målet er å fremme digital samhandling på tvers av landegrenser og innenfor hvert enkelt land. Norge forpliktet seg til å implementere EIF da vi undertegnet Tallinn-erklæringen i 2017, sammen med EU og andre EFTA-land.\n\nSom et resultat har Norge etablert sitt eget nasjonale rammeverk for interoperabilitet (NIF- National Interoperability Framework), som i dag heter \"Rammeverk for digital samhandling\". Den første versjonen ble utarbeidet som et Skate-tiltak i 2018.","p":{},"f":["Other"]},"id-e236b66b0d574a2bb97dbd79d7d38d47":{"id":"id-e236b66b0d574a2bb97dbd79d7d38d47","t":"Grouping","n":"Juridisk samhandlingsevne","d":"Juridisk samhandling skal sikre at organisasjoner som arbeider under ulik lovgivning kan samhandle. For at organisasjoner på tvers i forvaltningen kan utvikle og bruke like tjenester og funksjonalitet må det rettslige grunnlaget for samhandling mellom aktørene være på plass.","p":{},"f":["Other"]},"id-3fd615c0b19e4762953cd34908523dbc":{"id":"id-3fd615c0b19e4762953cd34908523dbc","t":"Grouping","n":"Organisatorisk samhandlingsevne","d":"Organisatorisk samhandling handler om hvordan samhandlende virksomheter tilpasser tjenestekjeder/forretningsprosesser, ansvar og forventninger for å oppnå felles mål og fordeler. Området dekker også forventninger til å gjøre tjenester tilgjengelige og brukerorienterte, samt hvilke samhandlingsmodeller og avtaler virksomhetene etablerer knyttet til felles forvaltning.","p":{},"f":["Other"]},"id-503ab92854754702ab00164afdbf6f70":{"id":"id-503ab92854754702ab00164afdbf6f70","t":"Grouping","n":"Semantisk samhandlingsevne","d":"Semantisk samhandlingsevne har å gjøre med betydningen av dataelementer, relasjonen mellom dem og formatet informasjonen utveksles på. Det deles i syntaktisk og semantisk aspekt. Semantisk aspekt skal sikre dataenes betydningsinnhold og interne relasjon, som også innebærer begrepsavklaringer som sikrer at alle parter forstår kommunikasjonen. Syntaktisk aspekt refererer til eksakt format og struktur på data som utveksles.","p":{},"f":["Other"]},"id-6c59a946ea8e4ad8903fbb1a6ffa9219":{"id":"id-6c59a946ea8e4ad8903fbb1a6ffa9219","t":"Grouping","n":"Teknisk samhandlingsevne","d":"Teknisk samhandlingsevne sikrer at ulike systemer kan integreres. Dette krever teknisk standardisering, noe som i dag blant annet blir understøttet av forskrift om IT-standarder i offentlig forvaltning. Området dekker forhold knyttet til applikasjon, data, teknologi og sikkerhet.","p":{},"f":["Other"]},"id-661cb46063c544be82d804511f5ea9f9":{"id":"id-661cb46063c544be82d804511f5ea9f9","t":"Grouping","n":"Styring og forvaltning","d":"Styring og forvaltning av integrerbare og sammenhengende offentlige tjenester er det femte området, og løper på tvers av de andre samhandlingsområdene. Det er viktig å komme i gang med avklaringer rundt styring og forvaltning så tidlig som mulig i prosessen ved etablering av nye tjenester. I tillegg vil det være nødvendig å gå mer i dybden etter hvert.","p":{},"f":["Other"]},"id-374db9b5a8cf46ddb5e7f4e6672460d6":{"id":"id-374db9b5a8cf46ddb5e7f4e6672460d6","t":"Grouping","n":"Domene","d":"Et domene er et avgrenset område i felles økosystem der flere aktører, behov, regler, data, prosesser, kapabiliteter og ressurser henger sammen rundt et felles formål.\n\nEt domene kan være en sektor, virksomhet, kommunal sektor, livshendelse, fagområde, samhandlingsområde, EU-initiativ eller et datarom.\n\nDomenet kan beskrive egne spesialiseringer, behov, kapabiliteter, ressurser, tiltak og mål, som kan kobles til relevante generiske kapabiliteter og konkrete ressurser i Nasjonal arkitektur. På den måten kan lokale og domenespesifikke arkitekturer utvikles videre uten at Nasjonal arkitektur må modellere alle detaljer. Et domene knytter seg til Nasjonal arkitektur og konkretiserer den i egen kontekst og anvendelse. \n\nKnytningen til Nasjonal arkitektur går primært via domenekapabilitet til nasjonal kapabilitet.\n\nEt domene kan være:\n\n- en sektor, for eksempel helse, transport, justis eller utdanning\n- en virksomhet, for eksempel NAV, Skatteetaten eller Brønnøysundregistrene\n- kommunal sektor, for eksempel KS Digital / kommunalt økosystem\n- et fagområde, for eksempel informasjonsforvaltning eller informasjonssikkerhet\n- en livshendelse eller tjenestekjede","p":{},"f":["Other"]},"id-3c14c3595df64671b23817284cc1ff02":{"id":"id-3c14c3595df64671b23817284cc1ff02","t":"Grouping","n":"Nasjonal arkitektur","d":"Nasjonal arkitektur beskriver det generiske og tverrgående nivået i felles økosystem for digital samhandling.\n\nGruppen viser hvilke begreper som hører til Nasjonal arkitektur som felles rammeverk.","p":{},"f":["Other"]},"id-e3f6bfa044574121a50a0df37751dd32":{"id":"id-e3f6bfa044574121a50a0df37751dd32","t":"Grouping","n":"Styring, rammer og samarbeid","d":"","p":{},"f":["Other"]},"id-cc737b0bd6ef4f3d8ca332a5aacb6c81":{"id":"id-cc737b0bd6ef4f3d8ca332a5aacb6c81","t":"Grouping","n":"Data og informasjon","d":"","p":{},"f":["Other"]},"id-09bad257f69747f9808ad42219d70a6f":{"id":"id-09bad257f69747f9808ad42219d70a6f","t":"Grouping", eper nasjonal arkitektur bruker, og hvordan de henger sammen. Den er grunnmuren som gjør kapabilitetskartet til et verktøy for analyse og styring, og ikke bare en oversikt.\n\nNasjonal arkitektur beskriver det generelle og tverrgående nivået i felles økosystem. Den skal ikke beskrive alle detaljer i alle sektorer, virksomheter, fagområder eller europeiske initiativer. I stedet gir den et felles språk, en felles struktur og et felles sett av kapabiliteter og ressurstyper som andre domener kan knytte seg til.\n\nEt domene kan være en sektor, en virksomhet, kommunal sektor, et fagområde, et EU data space eller et annet europeisk område. Domenet kan beskrive egne spesialiseringer, behov, kapabiliteter, ressurser, tiltak og mål, men bør koble disse til relevante generiske kapabiliteter og ressurser i Nasjonal arkitektur. På den måten kan lokale og domenespesifikke arkitekturer utvikles videre uten at Nasjonal arkitektur må modellere alle detaljer.\n\nRelasjonen mellom Nasjonal arkitektur og domener viser derfor både gjenbruk og spesialisering.\nNasjonal arkitektur gir felles rammer for samhandling og beskriver det generelle, tverrgående og normerende nivåe, mens domenene konkretiserer hvordan rammene realiseres i sin kontekst. Dette gjør det mulig å sammenligne behov, avdekke gap, prioritere tiltak og vurdere modenhet på tvers av domener, samtidig som hvert domene beholder nødvendig handlingsrom.","nodes":[{"id":"id-50564a5708fd40088512d194654c5be8","e":"id-3c14c3595df64671b23817284cc1ff02","x":372.0,"y":360.0,"w":456.0,"h":421.0,"dp":0,"par":null},{"id":"id-9e637bc2c34e433c9c899ee74f73835e","e":"id-eb6f01d0d0ef4230b7a5c9c73c3842c5","x":420.0,"y":384.0,"w":349.0,"h":85.0,"dp":1,"par":"id-50564a5708fd40088512d194654c5be8"},{"id":"id-42c8ee19a2b34f0ea8ef493a3edc7f56","e":"id-9860d11ff3fd40a5b541b8f929ed305f","x":420.0,"y":504.0,"w":349.0,"h":265.0,"dp":1,"par":"id-50564a5708fd40088512d194654c5be8"},{"id":"id-99e7f597f2cc4639a9e2dd3d9fb7b895","e":"id-456429d236544c28b3d7257 function inline(s){
  s = esc(s);
  s = s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  s = s.replace(/(https?:\/\/[^\s<)]+[^\s<).,;:])/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
  return s;
}
function md(src){
  if (!src) return '';
  const blocks = src.replace(/\r/g,'').split(/\n\s*\n/);
  let html = '';
  for (const b of blocks){
    const lines = b.split('\n'); let para = [], list = [];
    const flushP = () => { if (para.length){ html += '<p>'+para.map(inline).join('<br>')+'</p>'; para=[]; } };
    const flushL = () => { if (list.length){ html += '<ul>'+list.map(l=>'<li>'+inline(l)+'</li>').join('')+'</ul>'; list=[]; } };
    for (const raw of lines){
      const l = raw.trim(); if (!l) continue;
      const m = l.match(/^(?:[-*•]|\d+[.)])\s+(.*)$/);
      const h = l.match(/^#{1,6}\s+(.*)$/);
      if (h){ flushP(); flushL(); html += '<h4>'+inline(h[1])+'</h4>'; }
      else if (m){ flushP(); list.push(m[1]); }
      else { flushL(); para.push(l); }
    }
    flushP(); flushL();
  }
  return html;
}

  const subGoals = mainGoal ? (OUT[mainGoal.id]||[]).filter(r=>r.t==='Influence').map(r=>r.g) : [];

  const btn = id => `<button data-go="${id}">${esc(E[id].n)}</button>`;
  let h = `<p class="intro">Motivasjonssiden av modellen: hvilke mål fra Digitaliseringsstrategien Nasjonal arkitektur bidrar til, hvilke prinsipper hovedkapabilitetene realiserer, og hvilke drivere og hindringer som påvirker arbeidet.</p><div class="mgrid">`;
  // Mål
  h += `<div class="mcol"><h2>Mål fra Digitaliseringsstrategien</h2><p>Det overordnede målet påvirker de øvrige strategimålene.</p>`;

    h += `<div class="card"><button class="ebtn" data-go="${g.id}">${esc(g.n)}</button> ${tbadge(g.id)}
      ${realizers(g.id).length?`<div class="via">Realiseres av</div><div class="mini">${realizers(g.id).map(btn).join('')}</div>`:''}</div>`;
  });

  // Prinsipper
  const prs = Object.values(E).filter(e=>e.t==='Principle').sort((a,b)=>{ const pa=/^P\d/.test(a.n), pb=/^P\d/.test(b.n); return (pb-pa) || a.n.localeCompare(b.n,'nb',{numeric:true}); });

  h += `</div>`;

  const drv = Object.values(E).filter(e=>e.t==='Driver'), con = Object.values(E).filter(e=>e.t==='Constraint');

  topics.forEach(t => { const d = drv.find(e=>e.n===t && e.f.includes('Drivere og begrensninger')), c = con.find(e=>e.n===t && e.f.includes('Drivere og begrensninger'));

let graph = null;
function edgeMarkers(defs, prefix){

  mk('tri','M1,1 L13,7 L1,13 Z',14,14,13,7,'h');
  mk('arr','M1,1 L11,6 L1,11',12,12,11,6,'h');
  mk('dia','M1,6 L8,1 L15,6 L8,11 Z',16,12,1,6,'h');
  mk('diaf','M1,6 L8,1 L15,6 L8,11 Z',16,12,1,6,'');
}
function markerFor(t, prefix){
  return {Realization:[null,'tri'],Specialization:[null,'tri'],Influence:[null,'arr'],Serving:[null,'arr'],Aggregation:['dia',null],Composition:['diaf',null],Association:[null,null]}[t].map(m=>m?`url(#${prefix}${m})`:null);
}
function wrapLabel(s){
  const words = s.split(/\s+/), lines = [''];
  for (const w of words){
    const cur = lines[lines.length-1];
    if (cur && (cur+' '+w).length > 20){ if (lines.length===2){ lines[1] = (lines[1]+' '+w); break; } lines.push(w); }
    else lines[lines.length-1] = cur ? cur+' '+w : w;
  }
  if (lines[1] && lines[1].length > 20) lines[1] = lines[1].slice(0,19)+'…';
  return lines;
}
const nodeCls = id => LEVEL[id] ? 'f-l'+LEVEL[id] : (layerOf(id)==='strat' ? 'f-s0' : 'f-'+layerOf(id));
function initGraph(){
  const top = L1[0];
  const layers = {strat:true,mot:false,impl:true,other:true};
  const relOn = Object.fromEntries(Object.keys(REL_NO).map(k=>[k,true]));

  const expanded = new Set([top]);
  const nodes = Object.values(E).map(e => {
    const L = LEVEL[e.id], lines = wrapLabel(e.n);
    const r = L===1 ? 24 : L===2 ? 14 : L===3 ? 9 : 7 + Math.sqrt(deg(e.id))*1.6;
    const lw = Math.max(...lines.map(l=>l.length)) * (L===1 ? 7.2 : 6);

  });
  const nmap = Object.fromEntries(nodes.map(n=>[n.id,n]));
  nmap[top].x = 0; nmap[top].y = 0; nmap[top].fx = 0; nmap[top].fy = 0;
  const allLinks = Object.values(R).map(r => ({id:r.id, r, source:nmap[r.s], target:nmap[r.g]}));
  const NB = {}; nodes.forEach(n => { const s = new Set(); (OUT[n.id]||[]).forEach(r=>s.add(r.g)); (IN[n.id]||[]).forEach(r=>s.add(r.s)); NB[n.id] = s; });
  const layerOk = id => layers[layerOf(id)];

  const bar = $('#gbar');

      <button class="btn" id="gcollapse" title="Skjul naboene som ble vist da du åpnet det valgte elementet">Skjul naboene til valgt</button>

    <div class="grp"><span class="lbl">Lag</span>${Object.keys(layers).map(l=>`<button class="tog L-${l}" aria-pressed="${layers[l]}" data-l="${l}"><i></i>${LAYER_NO[l]}</button>`).join('')}</div>
    <div class="grp"><span class="lbl">Relasjoner</span>${Object.keys(REL_NO).filter(t => Object.values(R).some(r => r.t===t)).map(t=>`<button class="tog" aria-pressed="true" data-r="${t}">${REL_NO[t][2]} (${Object.values(R).filter(r => r.t===t).length})</button>`).join('')}</div>
    <div class="grp legend"><span class="lbl">Kapabiliteter</span><span><i class="lg f-l1"></i>Nivå 1</span><span><i class="lg f-l2"></i>Nivå 2</span><span><i class="lg f-l3"></i>Nivå 3</span><span><i class="lg f-s0"></i>Øvrig strategi</span></div>`;

  const svg = d3.select('#gsvg');
  const defs = svg.append('defs'); edgeMarkers(defs,'g-');
  const root = svg.append('g');
  const eg = root.append('g'), ng = root.append('g');
  let gn = ng.selectAll('g.gnode'), edges = eg.selectAll('path');

  const nearTop = id => !LEVEL[id] && NB[top].has(id);
  const ringR = id => LEVEL[id]===1 ? 0 : LEVEL[id]===2 ? 210 : LEVEL[id]===3 ? 400 : nearTop(id) ? 100 : 560;
  const sim = d3.forceSimulation().alphaDecay(.04)
    .force('link', d3.forceLink().distance(l => (LEVEL[l.r.s] && LEVEL[l.r.g]) ? 120 : (l.r.s===top || l.r.g===top) ? 70 : 160).strength(.35))
    .force('charge', d3.forceManyBody().strength(-260).distanceMax(700))
    .force('radial', d3.forceRadial(d => ringR(d.id), 0, 0).strength(d => (LEVEL[d.id] || nearTop(d.id)) ? .32 : .05))
    .force('collide', d3.forceCollide(d => d.cr).iterations(3).strength(1))
    .on('tick', () => { draw(); if (pendingFit){ if (sim.alpha() < .03){ pendingFit = false; fit(); } else fit(.12); } });

  function computeVisible(){
    const v = new Set([top]);
    if (state.sel && E[state.sel]) v.add(state.sel);
    if (showAll) nodes.forEach(n => { if (layerOk(n.id)) v.add(n.id); });
    expanded.forEach(x => {
      if (!(x===top || x===state.sel || layerOk(x))) return;
      v.add(x); NB[x].forEach(y => { if (layerOk(y)) v.add(y); });
    });
    return v;
  }
  const hasHidden = id => [...NB[id]].some(y => layerOk(y) && !visSet.has(y));
  function update(doFit = true){
    visSet = computeVisible();
    const vn = nodes.filter(n => visSet.has(n.id));
    vn.forEach(n => { if (n.x == null){
      const p = [...NB[n.id]].map(i=>nmap[i]).find(m => m.x != null && visSet.has(m.id)) || {x:0,y:0};
      const a = Math.random()*Math.PI*2; n.x = p.x + Math.cos(a)*60; n.y = p.y + Math.sin(a)*60; } });
    const vl = allLinks.filter(l => relOn[l.r.t] && visSet.has(l.r.s) && visSet.has(l.r.g));
    edges = eg.selectAll('path').data(vl, d=>d.id).join(enter => {
      const p = enter.append('path').attr('class', d=>'gedge d-'+d.r.t)
        .attr('marker-start', d=>markerFor(d.r.t,'g-')[0]).attr('marker-end', d=>markerFor(d.r.t,'g-')[1]);
      p.append('title').text(d => `${E[d.r.s].n} ${REL_NO[d.r.t][0]} ${E[d.r.g].n}`);
      return p; });
    gn = ng.selectAll('g.gnode').data(vn, d=>d.id).join(enter => {
      const g = enter.append('g').attr('class', d=>'gnode '+nodeCls(d.id)).attr('tabindex',0).attr('role','button').attr('aria-label', d=>E[d.id].n);
      g.each(function(d){ const s = d3.select(this);
        if (d.e.t==='Grouping') s.append('rect').attr('class','dot').attr('x',-d.r).attr('y',-d.r).attr('width',2*d.r).attr('height',2*d.r).attr('rx',2);
        else s.append('circle').attr('class','dot').attr('r', d.r); });
      const t = g.append('text').attr('text-anchor','middle');
      t.selectAll('tspan').data(d => d.lines.map((l,i)=>({l,i,d}))).join('tspan').attr('x',0).attr('y', o => o.d.r + 13 + o.i*12.5).text(o=>o.l);
      const pl = g.append('g').attr('class','plus').attr('transform', d=>`translate(${d.r*.72},${-d.r*.72})`);
      pl.append('circle').attr('r',6.5); pl.append('path').attr('d','M-3.2,0H3.2M0,-3.2V3.2');
      g.append('title').text(d => `${d.e.n} (${LEVEL[d.id] ? LEVEL_NO[LEVEL[d.id]] : TYPE_NO[d.e.t]})`);
      g.on('click', (ev,d) => { ev.stopPropagation(); select(d.id); })
       .on('keydown', (ev,d) => { if (ev.key==='Enter'||ev.key===' '){ ev.preventDefault(); select(d.id); } })
       .call(d3.drag()
         .on('start', (ev,d) => { if (!ev.active) sim.alphaTarget(.2).restart(); d.fx = d.x; d.fy = d.y; })
         .on('drag', (ev,d) => { d.fx = ev.x; d.fy = ev.y; })
         .on('end', (ev,d) => { if (!ev.active) sim.alphaTarget(0); if (d.id!==top){ d.fx = null; d.fy = null; } }));
      return g; });
    sim.nodes(vn); sim.force('link').links(vl);
    sim.alpha(.75).restart();
    pendingFit = doFit;

  function draw(){

    edges.attr('d', d => {
      const s=d.source, t=d.target, dx=t.x-s.x, dy=t.y-s.y, L=Math.hypot(dx,dy)||1;
      return `M${s.x+dx/L*(s.r+1)},${s.y+dy/L*(s.r+1)}L${t.x-dx/L*(t.r+2)},${t.y-dy/L*(t.r+2)}`; });
  }
  function style(){
    const sel = state.sel, nb = sel ? NB[sel] : null;
    gn.classed('sel', d=>d.id===sel).classed('nb', d=>nb && nb.has(d.id)).classed('faded', d=>nb && d.id!==sel && !nb.has(d.id));
    gn.select('.plus').style('display', d => hasHidden(d.id) ? null : 'none');
    edges.classed('hi', d=>sel && (d.r.s===sel || d.r.g===sel)).classed('faded', d=>sel && d.r.s!==sel && d.r.g!==sel);
    $('#gcollapse').disabled = !(sel && expanded.has(sel) && sel!==top && !showAll);
  }
  const zoom = d3.zoom().scaleExtent([.12,4]).on('zoom', ev => root.attr('transform', ev.transform));
  svg.call(zoom).on('dblclick.zoom', null);
  function fit(step){
    const el = svg.node(), W = el.clientWidth||800, H = el.clientHeight||600;
    const ns = nodes.filter(n => visSet.has(n.id) && n.x != null); if (!ns.length || !W) return;

    else svg.transition().duration(400).call(zoom.transform, d3.zoomIdentity.translate(tx, ty).scale(k));
  }
  const sameSet = (a,b) => a.size===b.size && [...a].every(x=>b.has(x));

  bar.querySelectorAll('[data-l]').forEach(b => b.onclick = () => { layers[b.dataset.l] = !layers[b.dataset.l]; b.setAttribute('aria-pressed', layers[b.dataset.l]); update(); });
  bar.querySelectorAll('[data-r]').forEach(b => b.onclick = () => { relOn[b.dataset.r] = !relOn[b.dataset.r]; b.setAttribute('aria-pressed', relOn[b.dataset.r]); update(false); });
  $('#gall').onclick = () => { showAll = !showAll; update(); };
  $('#greset').onclick = () => { showAll = false; expanded.clear(); expanded.add(top); update(); };
  $('#gcollapse').onclick = () => { if (state.sel){ expanded.delete(state.sel); update(); } };
  $("#gfit").onclick = () => fit();

  graph = {

      if (!sameSet(nv, visSet)) update(true);
      else { style(); if (center && id){ const n = nmap[id], el = svg.node(), k = Math.max(.8, d3.zoomTransform(el).k);
        if (n && n.x != null) svg.transition().duration(450).call(zoom.transform, d3.zoomIdentity.translate(el.clientWidth/2-k*n.x, el.clientHeight/2-k*n.y).scale(k)); } }
    }
  };
  if (state.sel) expanded.add(state.sel);

let diag = null;

  const zoom = d3.zoom().scaleExtent([.1,4]).on('zoom', ev => root.attr('transform', ev.transform));
  svg.call(zoom).on('dblclick.zoom', null);
  let cur = null, bbox = null, nodeById = {};

    const isAnc = (a,b) => { let p = nodeById[b]?.par; while(p){ if (p===a) return true; p = nodeById[p]?.par; } return false; };
    const hasKids = new Set(v.nodes.map(n=>n.par).filter(Boolean));

      .append('xhtml:div').attr('class','lab').text(n=>E[n.e].n);
    g.append('text').attr('class','tp').attr('x',n=>n.x+n.w-5).attr('y',n=>n.y+n.h-5).attr('text-anchor','end').text(n => n.h>=60 && n.w>=110 ? TYPE_NO[E[n.e].t] : '');
    g.append('title').text(n=>`${E[n.e].n} (${TYPE_NO[E[n.e].t]})`);
    g.on('click', (ev,n) => { ev.stopPropagation(); select(n.e); })
     .on('keydown', (ev,n) => { if (ev.key==='Enter'||ev.key===' '){ ev.preventDefault(); select(n.e); } });
    const clip = (r, tx, ty) => { const cx=r.x+r.w/2, cy=r.y+r.h/2, dx=tx-cx, dy=ty-cy; if(!dx&&!dy) return [cx,cy]; const s=Math.min((r.w/2)/Math.abs(dx||1e-9),(r.h/2)/Math.abs(dy||1e-9)); return [cx+dx*s, cy+dy*s]; };
    const cs = v.conns.filter(c => nodeById[c.s] && nodeById[c.g] && !isAnc(c.s,c.g) && !isAnc(c.g,c.s));
    eg.selectAll('path').data(cs).join('path').attr('class', c => 'dedge d-'+(R[c.r]?.t||'Association'))
      .attr('data-s', c=>nodeById[c.s].e).attr('data-g', c=>nodeById[c.g].e)
      .attr('marker-start', c=>markerFor(R[c.r]?.t||'Association','d-')[0]).attr('marker-end', c=>markerFor(R[c.r]?.t||'Association','d-')[1])
      .attr('d', c => { const a=nodeById[c.s], b=nodeById[c.g]; const p1=clip(a,b.x+b.w/2,b.y+b.h/2), p2=clip(b,a.x+a.w/2,a.y+a.h/2); return `M${p1[0]},${p1[1]}L${p2[0]},${p2[1]}`; });
    // Dokumentasjon
    const doc = v.d ? md(v.d) : '';
    $('#ddoc').innerHTML = `<h2>${esc(v.n)}</h2>${doc ? `<details><summary>Om diagrammet</summary><div class="doc">${doc}</div></details>` : ''}`;
    $('#dlist').querySelectorAll('button').forEach(b => b.setAttribute('aria-current', +b.dataset.i===i));
    $('#dsel').value = i;
    requestAnimationFrame(() => { fit(); diag.highlight(state.sel); });
  }
  diag = {
    render,
    highlight(id, center){
      d3.selectAll('#dsvg .dn').classed('sel', function(){ return this.dataset.e===id; });
      d3.selectAll('#dsvg .dedge').classed('hi', function(){ return id && (this.dataset.s===id || this.dataset.g===id); });
      if (center && id && cur!=null){
        const n = VIEWS[cur].nodes.find(n=>n.e===id); if (!n) return;
        const el = svg.node(), W = el.clientWidth, H = el.clientHeight, k = Math.max(.9, d3.zoomTransform(el).k);
        svg.transition().duration(450).call(zoom.transform, d3.zoomIdentity.translate(W/2-k*(n.x+n.w/2), H/2-k*(n.y+n.h/2)).scale(k));
      }
    }
  };
  render(state.diagram);
}
function openDiagram(i){ state.diagram = i; if (diag) diag.render(i); }

/* ---------- Katalog ---------- */
let katMode = 'el', katType = null, katQ = '';
function renderKat(){
  const types = [...new Set(Object.values(E).map(e=>e.t))].sort((a,b)=>(TYPE_NO[a]).localeCompare(TYPE_NO[b],'nb'));
  $('#kat').innerHTML = `<p class="intro">Alt innholdet i modellen: ${Object.keys(E).length} elementer, ${Object.keys(R).length} relasjoner og ${VIEWS.length} diagrammer, ordnet etter mappestrukturen i modellen.</p>
    <div class="kbar">
      <div class="seg" role="group" aria-label="Vis"><button aria-pressed="true" data-m="el">Elementer</button><button aria-pressed="false" data-m="rel">Relasjoner</button></div>
      <input class="filter" id="kq" type="search" placeholder="Filtrer på navn eller beskrivelse" aria-label="Filtrer katalogen">
    </div>
    <div class="chips" id="ktypes" style="margin-bottom:16px"><button class="chip" aria-pressed="true" data-t="">Alle typer</button>${types.map(t=>`<button class="chip" aria-pressed="false" data-t="${t}">${TYPE_NO[t]} (${Object.values(E).filter(e=>e.t===t).length})</button>`).join('')}</div>
    <div id="klist"></div>`;
  $('#kat').querySelectorAll('[data-m]').forEach(b => b.onclick = () => { katMode = b.dataset.m; $('#kat').querySelectorAll('[data-m]').forEach(x=>x.setAttribute('aria-pressed', x===b)); listKat(); });
  $('#ktypes').querySelectorAll('.chip').forEach(b => b.onclick = () => { katType = b.dataset.t || null; $('#ktypes').querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed', x===b)); listKat(); });
  $('#kq').oninput = e => { katQ = e.target.value.trim().toLowerCase(); listKat(); };
  listKat();
}
function listKat(){
  const match = e => (!katType || e.t===katType) && (!katQ || e.n.toLowerCase().includes(katQ) || e.d.toLowerCase().includes(katQ));
  const capDef = e => (e.d||'').replace(/\r/g,'').split(/\n\s*\n/)[0].replace(/\*\*/g,'').replace(/^#+\s*/,'').replace(/\s+/g,' ').trim();
  const row = e => `<button class="row" data-go="${e.id}" data-id="${e.id}"><span class="tbc">${tbadge(e.id)}${LEVEL[e.id]?` <span class="meta">N${LEVEL[e.id]}</span>`:''}</span><span class="rname">${esc(e.n)}</span><span class="def">${e.t==='Capability' ? esc(capDef(e)) : ''}</span><span class="meta">${deg(e.id)} relasjoner</span></button>`;
  let h = '';
  if (katMode==='el'){
    const tree = {};
    Object.values(E).filter(match).forEach(e => { const top = e.f[0]||'Annet', sub = e.f.slice(1).join(' / '); ((tree[top] ||= {})[sub] ||= []).push(e); });
    const tops = ['Strategy','Motivation','Implementation & Migration','Other'].filter(t=>tree[t]).concat(Object.keys(tree).filter(t=>!['Strategy','Motivation','Implementation & Migration','Other'].includes(t)));
    for (const t of tops){
      const subs = tree[t]; const n = Object.values(subs).reduce((a,b)=>a+b.length,0);
      h += `<div class="folder"><h3>${esc(FOLDER_NO[t]||t)} <small>${n} elementer</small></h3>`;
      for (const s of Object.keys(subs).sort((a,b)=> (a===''?-1:b===''?1:a.localeCompare(b,'nb')))){
        const list = subs[s].sort((a,b) => (LEVEL[a.id]||9)-(LEVEL[b.id]||9) || a.n.localeCompare(b.n,'nb'));
        if (s) h += `<h4>${esc(s)}</h4>`;
        h += `<div class="rows">${list.map(row).join('')}</div>`;
      }
      h += `</div>`;
    }
    if (!h) h = '<p class="emptyp">Ingen elementer passer filteret. Fjern typefilteret eller endre søkeordet.</p>';
  } else {
    const rels = Object.values(R).filter(r => match(E[r.s]) || match(E[r.g]));
    const byT = {}; rels.forEach(r => (byT[r.t] ||= []).push(r));
    for (const t of Object.keys(REL_NO).filter(t=>byT[t])){
      h += `<div class="folder"><h3>${REL_NO[t][2]} <small>${byT[t].length} relasjoner</small></h3><div class="rows">` +
        byT[t].sort((a,b)=>E[a.s].n.localeCompare(E[b.s].n,'nb')||E[a.g].n.localeCompare(E[b.g].n,'nb')).map(r=>`<div class="row relrow"><button class="lk" data-go="${r.s}">${esc(E[r.s].n)}</button><span class="rt">${esc(REL_NO[t][0])}${r.n?`<br><i>${esc(r.n)}</i>`:''}</span><button class="lk" data-go="${r.g}">${esc(E[r.g].n)}</button></div>`).join('') + `</div></div>`;
    }
    if (!h) h = '<p class="emptyp">Ingen relasjoner passer filteret. Fjern typefilteret eller endre søkeordet.</p>';
  }
  $('#klist').innerHTML = h;
  markSelection();
}

/* ---------- Søk ---------- */
const q = $('#q'), res = $('#res'); let hits = [], act = 0;
function doSearch(){
  const s = q.value.trim().toLowerCase();
  if (!s){ res.classList.remove('open'); return; }
  const all = Object.values(E);
  hits = all.filter(e=>e.n.toLowerCase().includes(s)).sort((a,b)=>(a.n.toLowerCase().indexOf(s))-(b.n.toLowerCase().indexOf(s)) || a.n.length-b.n.length)
    .concat(all.filter(e=>!e.n.toLowerCase().includes(s) && e.d.toLowerCase().includes(s))).slice(0,14);
  act = 0;
  res.innerHTML = hits.length ? hits.map((e,i)=>`<button role="option" data-i="${i}" class="${i===0?'act':''}">${tbadge(e.id)}<span><b>${esc(e.n)}</b><span class="ctx">${LEVEL[e.id]?LEVEL_NO[LEVEL[e.id]]:esc(e.f.map(f=>FOLDER_NO[f]||f).join(' / '))}${e.n.toLowerCase().includes(s)?'':', treff i beskrivelsen'}</span></span></button>`).join('')
    : `<div class="empty">Ingen treff på «${esc(q.value)}». Prøv et kortere eller annet ord.</div>`;
  res.classList.add('open');
  res.querySelectorAll('button').forEach(b => b.onclick = () => pick(+b.dataset.i));
}
function pick(i){ const e = hits[i]; if (!e) return; res.classList.remove('open'); q.value=''; select(e.id,{center:true,scroll:true}); }
q.addEventListener('input', doSearch);
q.addEventListener('keydown', ev => {
  if (ev.key==='ArrowDown'||ev.key==='ArrowUp'){ ev.preventDefault(); act = Math.max(0, Math.min(hits.length-1, act + (ev.key==='ArrowDown'?1:-1))); res.querySelectorAll('button').forEach((b,i)=>b.classList.toggle('act', i===act)); }
  else if (ev.key==='Enter'){ ev.preventDefault(); pick(act); }
  else if (ev.key==='Escape'){ res.classList.remove('open'); }
});
document.addEventListener('click', ev => { if (!ev.target.closest('.search')) res.classList.remove('open'); });
document.addEventListener('keydown', ev => { if (ev.key==='/' && document.activeElement!==q && !/input|textarea|select/i.test(document.activeElement.tagName)){ ev.preventDefault(); q.focus(); } });

/* ---------- Tema ---------- */
$('#theme').onclick = () => {
  const r = document.documentElement, dark = r.dataset.theme ? r.dataset.theme==='dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  r.dataset.theme = dark ? 'light' : 'dark';
  try { localStorage.setItem('na-theme', r.dataset.theme); } catch(e){}
};
try { const t = localStorage.getItem('na-theme'); if (t) document.documentElement.dataset.theme = t; } catch(e){}

/* ---------- Fullskjerm og innebygging ---------- */
(function(){
  const fs = $('#fullscreen'), nt = $('#newtab');
  if (document.fullscreenEnabled){
    fs.hidden = false;
    fs.onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(()=>{});
    document.addEventListener('fullscreenchange', () => fs.setAttribute('aria-pressed', !!document.fullscreenElement));
  }
  let embedded = false; try { embedded = window.self !== window.top; } catch(e){ embedded = true; }
  if (embedded){ nt.hidden = false; const upd = () => nt.href = location.href; upd(); window.addEventListener('hashchange', upd); }
})();

/* ---------- Ruting ---------- */
$('#mver').textContent = `Modellversjon ${DATA.model.version}, ${Object.keys(E).length} elementer og ${Object.keys(R).length} relasjoner` + (DATA.generated ? `, generert ${DATA.generated}` : '');
function route(){
  if (ignoreHash){ ignoreHash = false; return; }
  const h = location.hash.slice(1);
  const m = h.match(/^diagram-(\d+)$/);
  if (m && VIEWS[+m[1]-1]) show('diagrammer',{diagram:+m[1]-1, noHash:true});
  else if (['kart','motivasjon','nettverk','diagrammer','katalog'].includes(h)) show(h,{noHash:true});
  else if (E[h]){ if(!inited[state.view]) show('nettverk',{noHash:true}); select(h,{scroll:true,center:true}); }
  else show('nettverk',{noHash:true});
}
window.addEventListener('hashchange', route);
route();
</script>
</body>
