<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nasjonal arkitektur: modellutforsker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
:root{
  --bg:#EEF1F5; --surface:#FFFFFF; --surface-2:#F7F8FA; --ink:#17223B; --muted:#5A6476; --rule:#D5DBE4;
  --accent:#1F4FC1; --accent-soft:#E3EAFB; --focus:#1F4FC1;
  --strat-fill:#F5DEAA; --strat-ink:#6E4600; --strat-line:#C9A660;
  --mot-fill:#D6D6FF; --mot-ink:#33338F; --mot-line:#9C9CE0;
  --impl-fill:#D8F2DA; --impl-ink:#245E2C; --impl-line:#8CC694;
  --other-fill:rgba(90,100,118,.05); --other-ink:#465063; --other-line:#8A93A3;
  --edge:#7A8496; --edge-hi:#1F4FC1; --dim:.18;
  --l1-fill:#B5650A; --l1-line:#6B3A00; --l2-fill:#E6A33A; --l2-line:#8C5800; --l3-fill:#F8E1AA; --l3-line:#B08333; --s0-fill:#E7E0D3; --s0-line:#8A7A5C;
  --shadow:0 1px 2px rgba(23,34,59,.08),0 6px 20px rgba(23,34,59,.06);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1522; --surface:#172033; --surface-2:#1C2639; --ink:#E7ECF5; --muted:#9AA5B8; --rule:#2C3850;
    --accent:#8FB0FF; --accent-soft:#22325A; --focus:#8FB0FF;
    --strat-fill:#4A3A16; --strat-ink:#F3D28C; --strat-line:#8A6C2C;
    --mot-fill:#2D2D5E; --mot-ink:#C9C9FF; --mot-line:#5A5AA6;
    --impl-fill:#1D3D24; --impl-ink:#A9E2B0; --impl-line:#3F7A49;
    --other-fill:rgba(180,190,210,.05); --other-ink:#B8C0CF; --other-line:#6B7690;
    --edge:#7D889C; --edge-hi:#8FB0FF;
    --l1-fill:#F0A23A; --l1-line:#FFD796; --l2-fill:#B07A22; --l2-line:#E9B868; --l3-fill:#4B3B17; --l3-line:#C79D4E; --s0-fill:#38342D; --s0-line:#9A8B6C;
    --l1-fill:#F0A23A; --l1-line:#FFD796; --l2-fill:#B07A22; --l2-line:#E9B868; --l3-fill:#4B3B17; --l3-line:#C79D4E; --s0-fill:#38342D; --s0-line:#9A8B6C;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1522; --surface:#172033; --surface-2:#1C2639; --ink:#E7ECF5; --muted:#9AA5B8; --rule:#2C3850;
  --accent:#8FB0FF; --accent-soft:#22325A; --focus:#8FB0FF;
  --strat-fill:#4A3A16; --strat-ink:#F3D28C; --strat-line:#8A6C2C;
  --mot-fill:#2D2D5E; --mot-ink:#C9C9FF; --mot-line:#5A5AA6;
  --impl-fill:#1D3D24; --impl-ink:#A9E2B0; --impl-line:#3F7A49;
  --other-fill:rgba(180,190,210,.05); --other-ink:#B8C0CF; --other-line:#6B7690;
  --edge:#7D889C; --edge-hi:#8FB0FF;
    --l1-fill:#F0A23A; --l1-line:#FFD796; --l2-fill:#B07A22; --l2-line:#E9B868; --l3-fill:#4B3B17; --l3-line:#C79D4E; --s0-fill:#38342D; --s0-line:#9A8B6C;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.5;display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* Topp */
.top{display:flex;align-items:center;gap:20px;padding:12px 20px;background:var(--surface);border-bottom:1px solid var(--rule);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand svg{flex:none}
.brand h1{font-size:19px;margin:0;line-height:1.15;letter-spacing:-.01em}
.brand p{margin:0;color:var(--muted);font-size:13px}
.search{position:relative;margin-left:auto;flex:1 1 280px;max-width:440px}
.search input{width:100%;padding:9px 12px 9px 34px;border:1px solid var(--rule);border-radius:8px;background:var(--surface-2);color:var(--ink);font:inherit}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.results{position:absolute;z-index:40;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1px solid var(--rule);border-radius:10px;box-shadow:var(--shadow);max-height:60vh;overflow:auto;display:none}
.results.open{display:block}
.results button{display:flex;gap:10px;align-items:baseline;width:100%;text-align:left;padding:8px 12px;border:0;background:none;cursor:pointer;border-bottom:1px solid var(--rule)}
.results button:last-child{border-bottom:0}
.results button:hover,.results button.act{background:var(--accent-soft)}
.results .ctx{display:block;color:var(--muted);font-size:12.5px}
.results .empty{padding:12px;color:var(--muted)}
.theme-btn[hidden]{display:none!important}
.theme-btn{color:var(--ink);display:inline-flex;border:1px solid var(--rule);background:var(--surface-2);border-radius:8px;padding:8px 10px;cursor:pointer;line-height:0}

.tabs{display:flex;gap:2px;padding:0 16px;background:var(--surface);border-bottom:1px solid var(--rule);overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:none;padding:11px 14px 10px;cursor:pointer;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;font-weight:700}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs button:hover{color:var(--ink)}

.shell{flex:1;display:flex;min-height:0}
main{flex:1;min-width:0;position:relative;overflow:hidden}
.view{position:absolute;inset:0;overflow:auto;display:none}
.view.on{display:block}
.view.fill{overflow:hidden}
.view.fill.on{display:flex;flex-direction:column}
.pad{padding:22px 24px 48px;max-width:1500px}

/* Typemerker */
.tb{display:inline-block;font-size:11.5px;font-weight:700;padding:1px 7px;border-radius:4px;white-space:nowrap;border:1px solid transparent;vertical-align:1px}
.L-strat{--f:var(--strat-fill);--i:var(--strat-ink);--l:var(--strat-line)}
.L-mot{--f:var(--mot-fill);--i:var(--mot-ink);--l:var(--mot-line)}
.L-impl{--f:var(--impl-fill);--i:var(--impl-ink);--l:var(--impl-line)}
.L-other{--f:var(--other-fill);--i:var(--other-ink);--l:var(--other-line)}
.tb{background:var(--f);color:var(--i);border-color:var(--l)}
.tb.L-other{border-style:dashed}

/* Kapabilitetskart */
.intro{max-width:72ch;color:var(--muted);margin:0 0 16px}
.l1{display:block;width:100%;text-align:left;background:var(--strat-fill);color:var(--strat-ink);border:1.5px solid var(--strat-line);border-radius:14px;padding:16px 20px;cursor:pointer;margin-bottom:14px}
.l1 .lv{font-size:13px;font-weight:700;opacity:.8}
.l1 .nm{display:block;font-size:26px;font-weight:700;letter-spacing:-.015em;line-height:1.15;margin:2px 0 4px}
.l1 .sub{font-size:14px;color:var(--ink);opacity:.85}
.tools{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin:4px 0 16px}
.tools .lbl{font-size:13px;color:var(--muted);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--rule);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--surface);border-color:var(--accent)}
.filter{padding:7px 10px;border:1px solid var(--rule);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;font-size:14px;min-width:220px}
.persp{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;align-items:start}
.pcol{border:1.5px dashed var(--other-line);border-radius:12px;padding:10px 10px 12px;background:var(--other-fill)}
.ptitle{display:block;width:100%;text-align:left;border:0;background:none;cursor:pointer;font-weight:700;font-size:15.5px;padding:2px 4px 8px;color:var(--other-ink)}
.ptitle small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.l2{background:var(--surface);border:1px solid var(--strat-line);border-left:5px solid var(--strat-line);border-radius:8px;margin-top:10px;transition:opacity .15s}
.l2 > button{display:block;width:100%;text-align:left;border:0;background:none;cursor:pointer;padding:9px 11px 4px;font-weight:700;font-size:15px}
.l2 > button .cnt{float:right;font-weight:400;color:var(--muted);font-size:12.5px}
.l2 .pr{padding:0 11px 4px;display:flex;flex-wrap:wrap;gap:4px}
.l2 .pr span{font-size:11px;color:var(--mot-ink);background:var(--mot-fill);border-radius:3px;padding:0 5px}
.l3s{list-style:none;margin:0;padding:4px 8px 9px;display:flex;flex-direction:column;gap:3px}
.l3s button{display:block;width:100%;text-align:left;background:var(--strat-fill);color:var(--strat-ink);border:0;border-radius:5px;padding:4px 9px;font-size:13.5px;cursor:pointer;line-height:1.3}
.l3s button:hover{filter:brightness(.97)}
.l2.dim,.l3s li.dim{opacity:var(--dim)}
.l2.hit{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.sel-ring{box-shadow:0 0 0 2.5px var(--accent)!important}

/* Motivasjon */
.mgrid{display:grid;grid-template-columns:1.1fr 1.2fr 1fr;gap:18px;align-items:start}
.mcol h2{font-size:17px;margin:0 0 4px}
.mcol > p{margin:0 0 12px;color:var(--muted);font-size:13.5px}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.ebtn{border:0;background:none;padding:0;text-align:left;cursor:pointer;font-weight:700;color:var(--ink)}
.ebtn:hover{color:var(--accent);text-decoration:underline}
.goal-main{background:var(--mot-fill);border-color:var(--mot-line)}
.goal-main .ebtn{color:var(--mot-ink);font-size:16px}
.sublist{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-direction:column;gap:6px}
.sublist li{padding-left:14px;position:relative;font-size:14px}
.sublist li::before{content:"";position:absolute;left:2px;top:.65em;width:6px;height:6px;border-radius:50%;background:var(--mot-line)}
.via{font-size:12.5px;color:var(--muted);margin-top:6px}
.mini{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.mini button{font-size:12.5px;border:1px solid var(--strat-line);background:var(--strat-fill);color:var(--strat-ink);border-radius:4px;padding:1px 7px;cursor:pointer}
.dc{width:100%;border-collapse:collapse;font-size:14px}
.dc th{text-align:left;font-size:12.5px;color:var(--muted);padding:4px 6px;border-bottom:1px solid var(--rule)}
.dc td{padding:6px;border-bottom:1px solid var(--rule);vertical-align:top}
.dc td button{border:1px solid var(--mot-line);background:var(--mot-fill);color:var(--mot-ink);border-radius:5px;padding:2px 8px;font-size:13px;cursor:pointer;text-align:left}

/* Nettverk og diagram */
.bar{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding:8px 16px;border-bottom:1px solid var(--rule);background:var(--surface)}
.bar .grp{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.bar .lbl{font-size:12.5px;color:var(--muted);font-weight:700;margin-right:2px}
.tog{border:1px solid var(--rule);background:var(--surface-2);border-radius:6px;padding:3px 9px;font-size:12.5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.tog i{width:10px;height:10px;border-radius:50%;background:var(--f,var(--edge));border:1px solid var(--l,var(--edge));display:inline-block}
.tog[aria-pressed="false"]{opacity:.45;text-decoration:line-through}
.btn{border:1px solid var(--rule);background:var(--surface);border-radius:6px;padding:4px 10px;font-size:13px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.canvas{flex:1;min-height:0;position:relative}
.canvas svg{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
.canvas svg:active{cursor:grabbing}
.hint{position:absolute;left:14px;bottom:12px;font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:3px 8px;pointer-events:none}

.gnode .dot{stroke-width:1.5;cursor:pointer}
.gnode .plus circle{fill:var(--accent);stroke:var(--surface);stroke-width:1.5}
.gnode .plus path{stroke:var(--surface);stroke-width:1.6;pointer-events:none}
.gnode .plus{pointer-events:none}
.gnode.f-l1 .dot,.lg.f-l1{fill:var(--l1-fill);background:var(--l1-fill);stroke:var(--l1-line);border-color:var(--l1-line)}
.gnode.f-l2 .dot,.lg.f-l2{fill:var(--l2-fill);background:var(--l2-fill);stroke:var(--l2-line);border-color:var(--l2-line)}
.gnode.f-l3 .dot,.lg.f-l3{fill:var(--l3-fill);background:var(--l3-fill);stroke:var(--l3-line);border-color:var(--l3-line)}
.gnode.f-s0 .dot,.lg.f-s0{fill:var(--s0-fill);background:var(--s0-fill);stroke:var(--s0-line);border-color:var(--s0-line)}
.gnode.f-l1 text{font-size:14px;font-weight:700}
.gnode.f-l2 text{font-size:11.5px;font-weight:700}
.gnode.faded{opacity:.6}
.gedge.faded{opacity:.25}
.legend span{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;margin-right:6px}
.lg{width:11px;height:11px;border-radius:50%;border:1.5px solid;display:inline-block}
.btn:disabled{opacity:.45;cursor:default}
.btn[aria-pressed="true"]{background:var(--accent);color:var(--surface);border-color:var(--accent)}
.gnode:focus:not(:focus-visible){outline:none}
.gnode text{font-size:10.5px;fill:var(--ink);pointer-events:none;paint-order:stroke;stroke:var(--bg);stroke-width:3px;stroke-linejoin:round}
.gnode.f-strat .dot{fill:var(--strat-fill);stroke:var(--strat-ink)}
.gnode.f-mot .dot{fill:var(--mot-fill);stroke:var(--mot-ink)}
.gnode.f-impl .dot{fill:var(--impl-fill);stroke:var(--impl-ink)}
.gnode.f-other .dot{fill:var(--surface);stroke:var(--other-ink);stroke-dasharray:3 2}
.gnode.sel .dot{stroke:var(--accent);stroke-width:4}
.gnode.sel text{font-weight:700}
.gnode.nb text{font-weight:700}
.gedge{stroke:var(--edge);stroke-width:1.1;fill:none;opacity:.65}
.gedge.hi{stroke:var(--edge-hi);opacity:1;stroke-width:1.8}
.dimmed{opacity:.12}
.d-Realization,.d-Influence{stroke-dasharray:5 3}
.gedge.d-Association,.dedge.d-Association{stroke-dasharray:2 4;stroke-linecap:round;stroke-width:1;opacity:.5}
.gedge.d-Association.hi,.dedge.d-Association.hi{opacity:.85;stroke-width:1.5}
.gedge.d-Association.faded{opacity:.15}
.mk{fill:var(--edge);stroke:var(--edge)}
.mk.h{fill:var(--bg)}

.dlayout{display:flex;flex:1;min-height:0}
.dlist{width:250px;flex:none;border-right:1px solid var(--rule);background:var(--surface);overflow:auto;padding:10px 8px}
.dlist button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:7px;cursor:pointer;font-size:14px;line-height:1.3}
.dlist button[aria-current="true"]{background:var(--accent-soft);font-weight:700}
.dlist button small{display:block;color:var(--muted);font-size:12px;font-weight:400}
.dmain{flex:1;min-width:0;display:flex;flex-direction:column}
.ddoc{padding:10px 16px 8px;border-bottom:1px solid var(--rule);background:var(--surface);font-size:14px;max-height:30vh;overflow:auto}
.ddoc h2{font-size:17px;margin:0 0 2px}
.ddoc details summary{cursor:pointer;color:var(--accent);font-size:13.5px}
.ddoc .doc{max-width:90ch}
.dsel{display:none}
.dn rect{stroke-width:1.2;cursor:pointer}
.dn.f-strat rect{fill:var(--strat-fill);stroke:var(--strat-ink)}
.dn.f-mot rect{fill:var(--mot-fill);stroke:var(--mot-ink)}
.dn.f-impl rect{fill:var(--impl-fill);stroke:var(--impl-ink)}
.dn.f-other rect{fill:var(--other-fill);stroke:var(--other-ink);stroke-dasharray:6 4}
.dn.sel rect{stroke:var(--accent);stroke-width:3.5}
.dn .lab{font-size:12.5px;line-height:1.2;color:var(--ink);display:flex;align-items:center;justify-content:center;text-align:center;height:100%;padding:4px 6px;overflow:hidden;pointer-events:none;font-family:inherit}
.dn.f-other .lab,.dn.cont .lab{align-items:flex-start;justify-content:flex-start;text-align:left;font-weight:700}
.dn .tp{font-size:9.5px;fill:var(--muted);pointer-events:none}
.dedge{stroke:var(--edge);stroke-width:1.2;fill:none;pointer-events:none}
.dedge.hi{stroke:var(--edge-hi);stroke-width:2.2}

/* Katalog */
.kbar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin-bottom:14px}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 12px;cursor:pointer;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--surface)}
.folder{margin-bottom:18px}
.folder h3{font-size:15px;margin:0 0 6px;display:flex;gap:8px;align-items:baseline}
.folder h3 small{color:var(--muted);font-weight:400}
.folder h4{font-size:13.5px;margin:10px 0 4px 2px;color:var(--muted)}
.rows{background:var(--surface);border:1px solid var(--rule);border-radius:10px;overflow:hidden}
.row{display:grid;grid-template-columns:120px minmax(140px,1fr) minmax(0,2.2fr) 96px;gap:6px 14px;align-items:baseline;width:100%;text-align:left;border:0;border-bottom:1px solid var(--rule);background:none;padding:7px 12px;cursor:pointer;font-size:14px}
.row:last-child{border-bottom:0}
.row:hover{background:var(--surface-2)}
.row.sel{background:var(--accent-soft)}
.row .meta{color:var(--muted);font-size:12.5px;white-space:nowrap}
.relrow{grid-template-columns:1fr 150px 1fr}
.relrow .rt{color:var(--muted);font-size:12.5px;text-align:center}
.relrow .lk{border:0;background:none;padding:0;text-align:left;cursor:pointer;color:var(--ink)}
.relrow .lk:hover{color:var(--accent);text-decoration:underline}

/* Panel */
.panel{width:430px;flex:none;border-left:1px solid var(--rule);background:var(--surface);display:none;flex-direction:column;min-height:0}
.panel.open{display:flex}
.phead{display:flex;gap:6px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--rule)}
.phead .sp{flex:1}
.iconbtn{border:1px solid var(--rule);background:var(--surface-2);border-radius:7px;padding:4px 9px;cursor:pointer;font-size:13px}
.iconbtn:disabled{opacity:.4;cursor:default}
.pbody{overflow:auto;padding:16px 18px 40px}
.pbody h2{font-size:22px;line-height:1.2;margin:8px 0 4px;letter-spacing:-.01em}
.crumb{font-size:12.5px;color:var(--muted)}
.lvl{font-size:13px;color:var(--strat-ink);font-weight:700}
.doc{font-size:14.5px;max-width:68ch}
.doc p{margin:.55em 0}
.doc ul{margin:.4em 0;padding-left:1.2em}
.doc h4{margin:1em 0 .2em;font-size:14.5px}
.nodoc{color:var(--muted);font-style:italic;font-size:14px}
.sec{margin-top:18px}
.sec h3{font-size:14px;margin:0 0 6px;padding-bottom:4px;border-bottom:1px solid var(--rule)}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.rl{list-style:none;margin:0;padding:0}
.rl li{padding:5px 0;border-bottom:1px dashed var(--rule);font-size:14px}
.rl li:last-child{border-bottom:0}
.rl .verb{color:var(--muted);font-size:12.5px;display:block}
.rl .rn{font-size:12.5px;color:var(--muted);font-style:italic}
.rl .rd{font-size:12.5px;color:var(--muted);margin-top:2px}
.props{width:100%;border-collapse:collapse;font-size:14px}
.props td{padding:4px 6px;border-bottom:1px solid var(--rule)}
.props td:first-child{color:var(--muted);width:40%}

<script>
const DATA = {"model":{"id":"id-91814cfd070848099d96b5a751963e49","name":"Nasjonal Arkitektur","version":"5.0.0"},"els":{"id-23598cee556747ef80cab10dbad84e65":{"id":"id-23598cee556747ef80cab10dbad84e65","t":"Capability","n":"Domenekapabilitet","d":"Domenekapabilitet er en konkret eller spesialisert kapabilitet innenfor et bestemt domene.\n\nEn domenekapabilitet beskriver hva et domene må kunne gjøre for å realisere egne mål, effektmål, tjenester eller samhandlingsbehov. Domenet kan være en sektor, virksomhet, kommunal sektor, fagområde, EU data space eller annet avgrenset område.\n\nDomenekapabiliteter brukes til å konkretisere Nasjonal arkitektur i en bestemt kontekst. De kan knyttes til relevante generiske kapabiliteter i Nasjonal arkitektur for å vise sporbarhet, sammenheng og gjenbruk av felles rammer. Dette gjør det mulig å sammenligne behov og gap på tvers av domener, uten at Nasjonal arkitektur må beskrive alle domenespesifikke detaljer.\n\nEn domenekapabilitet kan realiseres eller understøttes av én eller flere domeneressurser.","p":{},"f":["Strategy","Metamodell"]},"id-4157e35b43184dd7bbcb4405e7edea46":{"id":"id-4157e35b43184dd7bbcb4405e7edea46","t":"Resource","n":"Domeneressurs","d":"Domeneressurs er en konkret ressurs som finnes, forvaltes eller benyttes innenfor et bestemt domene.\n\nEn domeneressurs kan være en løsning, tjeneste, standard, datasett, informasjonsmodell, kompetansemiljø, prosess, avtale, infrastruktur eller annen byggekloss som domenet bruker for å realisere egne kapabiliteter.\n\nDomeneressurser knyttes til domenekapabiliteter for å vise hvordan domenets evner faktisk understøttes i praksis. En domeneressurs skal ikke forstås som en spesialisering av en ressurs i Nasjonal arkitektur. Knytningen til Nasjonal arkitektur skjer på kapabilitetsnivå, ved at domenekapabiliteter knyttes til generiske kapabiliteter i Nasjonal arkitektur.\n\nDette gjør at hvert domene kan beskrive sine egne konkrete ressurser uten at Nasjonal arkitektur må eie, klassifisere eller modellere alle ressurser i detalj. Nasjonal arkitektur gir det felles rammeverket, mens domenet beskriver hvilke ressurser som faktisk finnes og brukes i egen kontekst.","p":{},"f":["Strategy","Metamodell"]},"id-199ae45b0a6c47b28b3507837647c6c8":{"id":"id-199ae45b0a6c47b28b3507837647c6c8","t":"Resource","n":"Gjenbrukbare løsninger","d":"Gjenbrukbare løsninger er tekniske komponenter, applikasjoner som leverer funksjonalitet eller dataprodukter, og dekker behov på tvers av eller innenfor sektorer, og/eller forvaltningsnivå. \nEn nasjonal fellesløsning er en byggekloss som offentlige virksomheter kan dra nytte av i sine digitale tjenester. Løsningene utvikles én gang og kan deretter brukes av mange.\nDe viktigste fellesløsningene kalles nasjonale felleskomponenter: Altinn, Digital postkasse til innbyggere, Enhetsregisteret, Folkeregisteret, ID-porten, Kontakt- og reservasjonsregisteret og Matrikkelen. Noen er obligatoriske å bruke, andre er anbefalte - både for statlige virksomheter og for kommunal sektor.\n\nStrategiske prinsipper for nasjonale felleskomponenter (gammel))\nhttps://www.digdir.no/media/395/download\nhttps://www.regjeringen.no/contentassets/fe3e34b866034b82b9c623c5cec39823/no/pdfs/stm201520160027000dddpdfs.pdf\n\nFellesløsning eller felles løsning:\n* Forskjellen er institusjonell. \n* Fellesløsning:  referer til nasjonale fellesløsninger, som er spesifikk tekniske komponenter som skal kunne brukes av svært mange i offentlig sektor for å løse generiske behov. \n* Felles løsning: Gjenbrukbar løsnning som kan benyttes av flere og med formåk om samarbeid og stordriftsfordeler, men uten nødvendigvis å ha status som en nasjonal komponent i økosystemet.\n* Fellestjeneste: Den forretningsmessige eller tekniske funksjonaliteten som tilbys.\n\nSluttbrukertjenester: Det innbyggeren eller næringslivet opplever (f.eks. \"Søke om barnehageplass\" eller \"Levere skattemelding\"). \nStøttetjenester: Tekniske tjenester som ikke er synlige for sluttbrukeren, men som er nødvendige for at systemene skal snakke sammen (f.eks. gjennom et API)\n\nDe nasjonale felleskomponentene, slik de er definert i Digital agenda:\n– Har en statlig virksomhet som forvaltningsansvarlig.\n– Dekker behov på tvers av mange sektorer og/eller forvaltningsnivå.\n– Vil være sentrale komponenter i en rekke digitale tjenester.\n– Er av stor samfunnsøkonomisk betydning som felles mulighetsrom for digital tjenesteutvikling og gevinstrealisering i virksomhetene.","p":{},"f":["Strategy","Metamodell"]},"id-9860d11ff3fd40a5b541b8f929ed305f":{"id":"id-9860d11ff3fd40a5b541b8f929ed305f","t":"Resource","n":"Ressurs","d":"Ressurser er konkrete byggeklosser som realiserer ønskede kapabiliteter og løser konkrete behov.\nEn ressurs er noe økosystemet har eller kan bruke for å understøtte én eller flere kapabiliteter. Det kan være tekniske løsninger, standarder, veiledning, informasjonsmodeller, datasett, organisatoriske arenaer, kompetansemiljøer, avtaler, finansielle virkemidler eller juridiske rammer.\n\nRessurser kategoriseres etter hva slags type byggekloss de er. I Nasjonal arkitektur kan dette for eksempel være gjenbrukbare løsninger, standarder og veiledning, samhandlingsarenaer og organisering, eller økonomiske og juridiske rammer og virkemidler.","p":{"Dekningsgrad":"1-5"},"f":["Strategy","Metamodell"]},"id-f1f34cea2b2e4b5b8f8a9be88321de42":{"id":"id-f1f34cea2b2e4b5b8f8a9be88321de42","t":"Resource","n":"Standarder og veiledning","d":"Ressurser som setter regler eller gir retning.\n\nDette kan være:\nStandarder, veiledere, referansearkitekturer, metodikk\nNormeringsgrad kan være knyttet til disse virkemidlene.","p":{},"f":["Strategy","Metamodell"]},"id-a947552722064b7c93181833028cc2f1":{"id":"id-a947552722064b7c93181833028cc2f1","t":"Resource","n":"Samhandlingsarenaer og organisering","d":"Organiserte nettverk og styringsorganer for både dialog og strategisk samarbeid og samordning.\n\nEksempler:\n* Samstyringsstruktur i kommunal sektor\n* Skate\n* ASR (Arkitektur- og standardiseringsrådet)\n* Faglig arena for datadeling og informasjonsforvaltning\n* Datalandsbyen\n* Offentlig PAAS - Slack for alle i offentlig sektor","p":{},"f":["Strategy","Metamodell"]},"id-456429d236544c28b3d7257893b0dec6":{"id":"id-456429d236544c28b3d7257893b0dec6","t":"Resource","n":"Økonomiske og juridiske rammer og virkemidler","d":"Dette er økonomiske og juridiske virkemidler som muliggjør gjennomføring.\n\nRammer og virkemidler kan være ressurser som er\n* Finansielle\n* Regulative","p":{},"f":["Strategy","Metamodell"]},"id-eb6f01d0d0ef4230b7a5c9c73c3842c5":{"id":"id-eb6f01d0d0ef4230b7a5c9c73c3842c5","t":"Capability","n":"Kapabilitet","d":"En kapabilitet beskriver \"hva\" en eller flere aktører må kunne gjøre for å skape verdi, uavhengig av hvordan det gjøres. Dette er den forretningsmessige evnen til å oppnå et mål.\n\nEn kapabilitet er en grunnleggende funksjonell evne i det digitale økosystemet. Den beskriver hva som må være på plass for å oppnå ønskede mål, uavhengig av organisatoriske grenser og tekniske løsninger.\n\nI Nasjonal arkitektur brukes kapabiliteter til å beskrive hvilke evner som må være til stede i felles økosystem for å oppnå mål, effektmål, samhandling og sammenhengende tjenester. En kapabilitet beskriver behovet på et stabilt og løsningsuavhengig nivå, og skal ikke forveksles med konkrete systemer, prosjekter, tiltak eller organisatoriske enheter.\n\nDen konkrete kapabilitetsmodellen for Nasjonal arkitektur er organisert i tre nivåer:\n\n- **Nivå 1: Overordnet kapabilitet** beskriver den samlede evnen Nasjonal arkitektur skal bidra til i felles økosystem.\n- **Nivå 2: Hovedkapabilitet** beskriver brede, strategiske kapabilitetsområder som strukturerer modellen.\n- **Nivå 3: Underkapabilitet** beskriver mer konkrete og operasjonelle evner som kan vurderes, forbedres og kobles til ressurser, tiltak, gap og effektmål.\n\nAlle nivåene modelleres som ArchiMate 'Capability'. Nivåene uttrykker abstraksjonsnivå og struktur i modellen, ikke ulike metamodellelementer.\nKapabiliteter er knyttet til ressurser som realiserer eller understøtter dem. Forvaltning av kapabilitetene er en kontinuerlig strategisk prosess som gjøres i dekningsgradsvurderinger opp mot strategiske mål.\n\n## Vekting av EIF-lag\n\nHver kapabilitet vektes mot de fire samhandlingslagene i European Interoperability Framework (EIF):\n- **Juridisk:** regelverk, hjemler, avtaler og rettslige rammer\n- **Organisatorisk:** styring, ansvar, arbeidsprosesser, samarbeid og kompetanse\n- **Semantisk:** begreper, informasjonsmodeller, metadata og felles forståelse av data\n- **Teknisk:** løsninger, grensesnitt, infrastruktur og tekniske standarder\n\nVektingen uttrykker hvor mye kapabiliteten *selv* må ivareta på laget, ikke hva den forutsetter at andre kapabiliteter leverer. Et lag som i hovedsak ivaretas av en annen kapabilitet, vektes lavere her og høyere der.\n\n### Vektingsnivåer\n- **Svært høy vekt (4):** Laget er kjernen i kapabiliteten. Kapabiliteten er et primært virkemiddel på dette laget.\n- **Høy vekt (3):** Laget er en vesentlig forutsetning. Svikt her gir betydelig redusert evne.\n- **Middels vekt (2):** Laget bidrar og understøtter, men gjelder deler av kapabiliteten eller ivaretas i stor grad av andre kapabiliteter.\n- **Lav vekt (1):** Laget berører kapabiliteten indirekte eller bare i avgrensede tilfeller.\n- **Ikke relevant (0):** Laget har ingen meningsfull betydning for kapabiliteten.\n\n### Vekting på nivå 2 og nivå 3\n- Vekting på nivå 2 vurderes selvstendig ut fra kapabiliteten som helhet. Vektingen på nivå 3 er et innspill, men ikke styrende.\n- Ikke relevant brukes på nivå 2 bare når ingen underkapabiliteter har vekt på laget.\n- Avvik på to trinn eller mer mellom nivå 2 og den høyeste vekten blant underkapabilitetene på samme lag bør begrunnes i teksten for laget.\n\n### Format i dokumentasjonen\nVektingen står i seksjonen `### Hva det innebærer (Omfang)` som ett kulepunkt per lag, alltid med alle fire lagene i rekkefølgen Juridisk, Organisatorisk, Semantisk, Teknisk.","p":{},"f":["Strategy","Metamodell"]},"id-ed6c7d640e81477780c82285ae079706":{"id":"id-ed6c7d640e81477780c82285ae079706","t":"CourseOfAction","n":"Tiltak","d":"Konkrete tiltak er endringer, initiativer eller leveranser som forbedrer eller benytter kapabiliteter. Et tiltak kan virke på kapabiliteter i Nasjonal arkitektur, på kapabiliteter i et domene, eller på begge nivåer samtidig.\nOm tiltaket er nasjonalt, domenespesifikt eller tverrgående fremgår av hvilke kapabiliteter, gap, mål eller effektmål tiltaket knyttes til.\nDette gjør det mulig å vise hvordan tiltak kan bidra til nasjonale mål, lukke gap i et domene og samtidig bygge på felles kapabiliteter og ressurser i Nasjonal arkitektur.\nTiltak kan være pågående eller planlagt.\nTiltaket kan forbedre eller realisere en kapabilitet, men er også avhengig av kapabiliteter som finnes.\n\n- Tiltak forbedrer kapabiliteter slik at effektmål oppnås\n- Tiltak benytter kapabiliteter (og ressurser) slik at effekten oppnås\n- Tiltak reduserer gap.\n- Tiltak bidrar til effektmål for å vise hvilken ønsket virkning tiltaket skal bidra til\n\nEt strategisk tiltak forbedrer NA-kapabiliteter, reduserer nasjonale gap og bidrar til strategiske mål via effektmål.\nEt operasjonelt tiltak benytter NA-kapabiliteter og -ressurser, forbedrer domenekapabiliteter og bidrar til domenets effektmål.","p":{},"f":["Strategy","Metamodell"]},"id-a601bb3d7b11478185903149965f7842":{"id":"id-a601bb3d7b11478185903149965f7842","t":"Capability","n":"Anvendelse av veiledning","d":"Evne til å tolke og benytte veiledere i prosjekter og tiltak.\n\n### Begrunnelse (Hvorfor)\nKapabiliteten sikrer at veiledningsmateriell faktisk blir brukt til å forstå og anvende felles anbefalinger, prinsipper, standarder og beste praksis i egne prosjekter og tiltak. Den løser behovet for å omsette veiledning fra generell kunnskap til praktiske valg i tjenesteutvikling, arkitekturarbeid og digital samhandling.\n\n### Hva det innebærer (Omfang)\n- **Juridisk (Middels vekt):** Bruke veiledning til å forstå hvordan relevant regelverk, føringer og krav bør anvendes i konkrete prosjekter og tiltak.\n- **Organisatorisk (Høy vekt):** Innarbeide bruk av veiledere i prosjektmetodikk, beslutningsprosesser, kvalitetssikring og gevinstarbeid, slik at anbefalingene faktisk påvirker gjennomføring.\n- **Semantisk (Middels vekt):** Tolke begreper, prinsipper, modeller og beskrivelser i veiledningsmateriellet likt, slik at prosjekter legger samme forståelse til grunn.\n- **Teknisk (Middels vekt):** Bruke tekniske veiledere, referansearkitekturer, standarder og samhandlingsmønstre som grunnlag for løsningsvalg, integrasjoner og teknisk utforming.\n\n### Bidrag til sammenhengende tjenester og felles økosystem\nAnvendelse av veiledning bidrar til at prosjekter og tiltak bygger på samme kunnskapsgrunnlag og følger felles anbefalinger. Når veiledningsmateriell brukes aktivt i egne prosjekter, reduseres lokale avvik, ulik praksis og risikoen for løsninger som ikke passer inn i felles økosystem.\n\nKapabiliteten styrker sammenhengende tjenester ved å gjøre det enklere for virksomheter å utvikle løsninger som følger felles prinsipper, standarder og samhandlingsmønstre. For sluttbrukeren gir dette mer konsistente og helhetlige digitale tjenester på tvers av virksomheter.","p":{},"f":["Strategy","Kapabiliteter i NA"]},"id-dabf94e621f644ffa53ebb44dcc9ff79":{"id":"id-dabf94e621f644ffa53ebb44dcc9ff79","t":"Capability","n":"Arkitekturstyring","d":"Evne til å etablere, forvalte og styre en helhetlig nasjonal digital arkitektur som et felles, forpliktende rammeverk, for å sikre samhandling, gjenbruk og strategisk retning i et nasjonalt digitalt økosystem.\n\n### Begrunnelse (Hvorfor)\nUten felles arkitekturstyring risikerer offentlige virksomheter å utvikle løsninger, informasjonsmodeller, grensesnitt og tekniske komponenter som er optimalisert lokalt, men som ikke fungerer godt sammen nasjonalt. Dette gir fragmenterte brukeropplevelser, svakere datadeling, økt teknisk gjeld, høyere integrasjonskostnader og redusert evne til å realisere sammenhengende tjenester.\nKapabiliteten skal sikre at sentrale aktører bygger på felles arkitekturprinsipper, referansearkitekturer, standarder, begreper og byggeklosser. Den gir grunnlag for å se nasjonale digitale ressurser i sammenheng, vurdere om de dekker nåværende og fremtidige behov, og prioritere forbedringer som styrker det samlede digitale økosystemet.\nDet er også behov for å opprettholde en helhetlig og kontinuerlig oversikt over de sentrale byggeklossene/løsningene, arkitekturproduktene og ressursene i det nasjonale digitale økosystemet.\nDen gir offentlig sektor et felles språk, felles rammer og felles beslutningsgrunnlag. Det gjør det enklere å avdekke avhengigheter, prioritere felles investeringer, unngå dobbeltutvikling og sikre at nye løsninger passer inn i det nasjonale digitale økosystemet.\n\n### Hva det innebærer (Omfang)\n- **Juridisk (Middels vekt):** Oppfølging av arkitekturkrav i Digitaliseringsrundskrivet. Forankring av felles arkitekturretningslinjer i tildelingsbrev og samarbeidsavtaler. Håndtering av regulatoriske pålegg knyttet til åpne standarder.\n- **Organisatorisk (Svært høy vekt):** Etablering av nasjonale og tverrgående arkitekturråd. Definering av roller og ansvar for arkitekturstyring i store samhandlingstiltak. Å kunne evaluere nåværende modenhetsnivåer for kapabiliteter og bidra til prioritering av forbedringer.\n- **Semantisk (Høy vekt):** Forvaltning av felles metamodeller og standardiserte arkitekturbegreper. Sikring av at kapabilitetsmodeller, tjenestekataloger og referansemodeller tolkes likt av alle virksomheter.\n- **Teknisk (Høy vekt):** Praktisk bruk av felles repositorier og modelleringsverktøy (f.eks. ArchiMate). Teknisk oppfølging og etterlevelse av nasjonale referansearkitekturer for API-er, feilhåndtering og meldingsutveksling.\n\n### Bidrag til sammenhengende tjenester og felles økosystem\nKapabiliteten sikrer at de digitale byggeklossene fra ulike virksomheter faktisk passer sammen. Dette gjør det vesentlig enklere å koble sammen uavhengige tjenester. \nNasjonal arkitekturstyring bidrar til sammenhengende tjenester ved å sikre at virksomheter utvikler løsninger innenfor felles prinsipper, standarder, begreper, referansearkitekturer og byggeklosser. Kapabiliteten reduserer fragmentering, styrker gjenbruk og gjør det mulig å styre det nasjonale digitale økosystemet som en helhet.","p":{},"f":["Strategy","Kapabiliteter i NA"]},"id-ec0afaac123d4f9e83889d9022a198c3":{"id":"id-ec0afaac123d4f9e83889d9022a198c3","t":"Capability","n":"Autentisering","d":"Evne til å verifisere den digitale identiteten til brukere og systemer.\n\n### Begrunnelse (Hvorfor)\nKapabiliteten sikrer at digitale tjenester kan vite hvem eller hvilket system som forsøker å få tilgang. Den løser behovet for trygg innlogging, entydig verifisering av digital identitet og riktig sikkerhetsnivå i tjenester som inngår i felles økosystem.\n\nAutentisering skal samtidig være tilgjengelig og brukervennlig. Det innebærer å tilby sikre, tilgjengelige og moderne innloggingsmekanismer, for eksempel biometri, passordfrie løsninger, app og web, på ulike sikkerhetsnivåer.\n\n### Hva det innebærer (Omfang)\n- **Juridisk (Høy vekt):** Sikre at autentisering skjer i tråd med krav til eID, personvern, sikkerhet, sporbarhet og regelverk for digitale tillitstjenester.\n- **Organisatorisk (Høy vekt):** Etablere rutiner for å risikovurdere og tilpasse eID-nivået i samarbeid med tjenesteeiere, slik at terskelen for bruk ikke blir unødvendig høy.\n- **Semantisk (Middels vekt):** Sikre felles forståelse av begreper som digital identitet, autentiseringsnivå, eID-nivå, bruker, system, innloggingsmekanisme og tillitsnivå.\n- **Teknisk (Svært høy vekt):** Tilby sikre, tilgjengelige og moderne innloggingsmekanismer på ulike sikkerhetsnivåer, med støtte for biometri, passordfrie løsninger, app og web, samt tekniske mekanismer for token, sesjonshåndtering, logging og integrasjon mot felles autentiseringstjenester.\n\n### Bidrag til sammenhengende tjenester og felles økosystem\nAutentisering gjør det mulig å etablere tillit til hvem som bruker en digital tjeneste, enten det er en person, virksomhet eller et system. Når autentisering skjer på en sikker og standardisert måte, kan tjenester på tvers av virksomheter bygge på samme tillitsgrunnlag.\n\nKapabiliteten styrker sammenhengende tjenester ved at brukeren kan bevege seg tryggere mellom tjenester uten unødvendige innloggingsbarrierer. For det felles økosystemet gir autentisering et nødvendig grunnlag for tilgangsstyring, tilgangskontroll, representasjon, sporbarhet og sikker datadeling.","p":{},"f":["Strategy","Kapabiliteter i NA"]},"id-84629318a3b84213ac3a83bdb6a1aad9":{"id":"id-84629318a3b84213ac3a83bdb6a1aad9","t":"Capability","n":"Bruke data fra andre","d":"Evne til å gjenbruke data fra andre i egne tjenester og prosesser.\n\n### Begrunnelse (Hvorfor)\nKapabiliteten gjør at virksomheter ikke skal behøve å samle inn den samme informasjonen på nytt. Den løser problemet med dobbeltinnsamling, manuelle avklaringer og fragmenterte tjenesteløp ved å gjøre data fra andre aktører tilgjengelige for lovlig, sikker og effektiv gjenbruk i egne tjenester og prosesser.\n\n### Hva det innebærer (Omfang)\n- **Juridisk (Middels vekt):** Avklare behandlingsgrunnlag, formål, tilgangsrettigheter og eventuelle krav til taushetsplikt, personvern og viderebruk før data fra andre tas i bruk.\n- **Organisatorisk (Svært høy vekt):** Etablere rutiner for å identifisere databehov, inngå nødvendige avtaler med datatilbydere og innarbeide gjenbrukte data i egne arbeidsprosesser.\n- **Semantisk (Middels vekt):** Sikre at begreper, metadata, informasjonsmodeller og datakvalitet forstås likt, slik at data fra andre tolkes riktig i egen kontekst.\n- **Teknisk (Høy vekt):** Bruke grensesnitt basert på API, f.eks. REST, GraphQL eller andre klare, standardiserte og gjenbrukbare grensesnitt, med nødvendig autentisering, autorisering, logging og feilhåndtering.\n\n### Bidrag til sammenhengende tjenester og felles økosystem\nKapabiliteten gjør at data kan følge brukerens behov på tvers av virksomheter, i stedet for at brukeren selv må oppgi samme informasjon flere ganger. Når virksomheter kan bruke data fra andre på en kontrollert og standardisert måte, blir tjenestene mer sammenhengende, raskere og mer treffsikre. Dette styrker det felles økosystemet ved å øke gjenbruk av data, redusere dobbeltarbeid og gjøre det enklere å bygge tjenester på tvers av organisatoriske grenser.","p":{},"f":["Strategy","Kapabiliteter i NA"]},"id-98df6c2b4df340c7a3a3ad32d99ca37e":{"id":"id-98df6c2b4df340c7a3a3ad32d99ca37e","t":"Capability","n":"Datadrevet","d":"Evne til å systematisk bruke data som en strategisk ressurs for å skape innsikt, informere beslutninger og utvikle bedre, mer treffsikre og effektive tjenester.\n\n### Begrunnelse (Hvorfor)\nKapabiliteten skal sikre at forvaltningen systematisk bruker data som en strategisk ressurs i prosesser, beslutningstaking og tjenesteutvikling for å levere bedre og mer effektive tjenester til innbyggere og næringsliv. Den forutsetter åpenhet, deling av data og evne til å hente ut verdi fra data gjennom blant annet analyse, automatisering og bruk av kunstig intelligens.\n\n### Hva det innebærer (Omfang)\n- **Juridisk (Høy vekt):** Etisk og ansvarlig datautnyttelse krever at all bruk av data skjer på en sikker, lovlig og etisk forsvarlig måte som ivaretar personvern og rettssikkerhet.\n- **Organisatorisk (Høy vekt):** Virksomhetene må etablere styring, kompetanse, prosesser og ansvar som gjør data til en aktiv del av beslutninger, tjenesteutvikling og forbedringsarbeid.\n- **Semantisk (Svært høy vekt):** Felles begreper, metadata, informasjonsmodeller og datakvalitet må sikre at data kan forstås og brukes riktig på tvers av virksomheter.\n- **Teknisk (Svært høy vekt):** Analyseplattformer, automatisering, KI-verktøy, datadeling og sikker teknisk infrastruktur må gjøre det mulig å hente ut verdi fra data i praksis.\n\n### Bidrag til sammenhengende tjenester og felles økosystem\nKapabiliteten gjør det mulig å bruke data til å forstå behov, forutse hendelser og utvikle mer treffsikre tjenester på tvers av virksomheter. Når data brukes systematisk og ansvarlig, kan offentlig sektor gå fra reaktiv saksbehandling til mer proaktive, personaliserte og effektive tjenesteløp. Dette styrker det felles økosystemet ved å gjøre data til et felles grunnlag for innsikt, prioritering, automatisering og kontinuerlig forbedring.","p":{},"f":["Strategy","Kapabiliteter i NA"]},"id-d7aa97e6319a492d8a1345bcaa8e154a":{"id":"id-d7aa97e6319a492d8a1345bcaa8e154a","t":"Capability","n":"Datakilder","d":"Evne til å tilgjengeliggjøre og forvalte data som en nasjonal fellesressurs, slik at de kan oppdages, forstås og gjenbrukes på en sikker og standardisert måte.\n\n### Begrunnelse (Hvorfor)\nKapabiliteten sikrer at data kan behandles som en nasjonal fellesressurs, ikke bare som lokale informasjonsbeholdninger i enkeltvirksomheter. Den gjør det mulig å oppdage, forstå og gjenbruke data på en sikker og standardisert måte på tvers av virksomheter, sektorer og forvaltningsnivåer.\n\nKapabiliteten omfatter også å organisere og styre data innenfor definerte tematiske domener. Dette sikrer helhetlig forvaltning og strategisk utvikling av dataressurser innenfor kritiske samfunnsområder.\n\n### Hva det innebærer (Omfang)\n- **Juridisk (Høy vekt):** Overordnede rettslige rammer må sikre at datakilder kan tilgjengeliggjøres og gjenbrukes innenfor krav til personvern, taushetsplikt, sikkerhet og lovlig viderebruk.\n- **Organisatorisk (Svært høy vekt):** Felles styringsmodeller, domeneorganisering og tydelig dataansvar må sikre helhetlig forvaltning og strategisk utvikling av dataressurser.\n- **Semantisk (Svært høy vekt):** Nasjonale metadata, begreper, informasjonsmodeller og kvalitetsbeskrivelser må gjøre datakildene finnbare, forståelige og vurderbare for gjenbruk.\n- **Teknisk (Høy vekt):** Standardiserte kataloger, API-er, tilgangsmekanismer og teknisk infrastruktur må gjøre datakilder tilgjengelige på en sikker, stabil og maskinlesbar måte.\n\n### Bidrag til sammenhengende tjenester og felles økosystem\nDatakilder er et grunnlag for sammenhengende tjenester fordi de gjør relevante data tilgjengelige for gjenbruk på tvers av virksomheter. Når data kan oppdages, forstås og brukes sikkert fra autoritative eller godt forvaltede kilder, slipper brukeren å levere samme informasjon flere ganger.\n\nKapabiliteten styrker det felles økosystemet ved å gjøre data til en felles ressurs for tjenesteutvikling, analyse, automatisering og samhandling. Domeneorganisering gir bedre oversikt, ansvar og strategisk utvikling av data innenfor viktige samfunnsområder, og gjør det enklere å bygge tjenester som henger sammen på tvers av organisatoriske grenser.","p":{},"f":["Strategy","Kapabiliteter i NA"]},"id-5852d070415849fab42749cb488d984a":{"id":"id-5852d070415849fab42749cb488d984a","t":"Capability","n":"Datastyring","d":"Evne til å sikre enhetlig og ansvarlig forvaltning av dataressurser gjennom felles rammeverk, klar ansvarsplassering og systematisk kvalitetsarbeid.\n\n### Begrunnelse (Hvorfor)\nDatastyring er rammeverket av roller, ansvar, prosesser og standarder som sikrer effektiv og forsvarlig forvaltning av data som en strategisk ressurs gjennom hele livssyklusen. Kapabiliteten løser behovet for tydelig ansvar, felles praksis og systematisk kvalitetsarbeid, slik at data kan deles, forstås og brukes trygt på tvers av virksomheter.\n\n### Hva det innebærer (Omfang)\n- **Juridisk (Høy vekt):** Sikre at data forvaltes i tråd med krav til personvern, taushetsplikt, arkivering, innsyn, behandlingsgrunnlag og ansvar for datadeling.\n- **Organisatorisk (Svært høy vekt):** Etablere roller, ansvar, styringsprosesser og beslutningsstrukturer for dataeierskap, datakvalitet, tilgang, deling og livssyklusforvaltning.\n- **Semantisk (Høy vekt):** Forvalte felles begreper, metadata, kvalitetskrav, informasjonsmodeller og klassifikasjoner som sikrer at data forstås likt og kan gjenbrukes.\n- **Teknisk (Middels vekt):** Bruke kataloger, dataplattformer, tilgangsmekanismer, kvalitetsverktøy og sporbarhetsløsninger som støtter praktisk styring og kontroll av dataressurser.\n\n### Bidrag til sammenhengende tjenester og felles økosystem\nDatastyring gir grunnlaget for at data kan brukes som en pålitelig ressurs i sammenhengende tjenester. Når ansvar, kvalitet, metadata og tilgang er avklart, kan virksomheter tryggere dele og gjenbruke data i tjenestekjeder.\n\nKapabiliteten styrker det felles økosystemet ved å gjøre data mer forutsigbare, etterprøvbare og gjenbrukbare. For sluttbrukeren betyr dette bedre datakvalitet, færre feil, mindre behov for gjentatt dokumentasjon og mer helhetlige tjenester på tvers av virksomheter.","p":{},"f":["Strategy","Kapabiliteter i NA"]},"id-ad6f81e892a74590840828b6aabb270d":{"id":"id-ad6f81e892a74590840828b6aabb270d","t":"Capability","n":"Datautveksling og integrasjon","d":"Evne til å sikkert, effektivt og standardisert utveksle data mellom aktører i økosystemet.\n\n### Begrunnelse (Hvorfor)\nKapabiliteten gjør det mulig for aktører i økosystemet å utveksle data på en sikker, effektiv og standardisert måte. Den fungerer som en strategisk paraply for deling, gjenbruk, integrasjon, meldingsutveksling, hendelsesdrevet samhandling og digital lommebok. Uten denne kapabiliteten blir tjenester avhengige av manuelle prosesser, særskilte punkt-til-punkt-integrasjoner og gjentatt innsamling av informasjon.\n\n### Hva det innebærer (Omfang)\n- **Juridisk (Middels vekt):** Overordnede rettslige rammer må sikre behandlingsgrunnlag, ansvar, tilgang og etterlevelse ved datautveksling mellom selvstendige aktører.\n- **Organisatorisk (Høy vekt):** Felles samhandlingsmodeller, avtaler, roller og forvaltningsprosesser må sikre at aktørene kan dele og bruke data på en forutsigbar måte.\n- **Semantisk (Høy vekt):** Felles begreper, informasjonsmodeller, metadata og standardiserte beskrivelser må sikre at data forstås likt på tvers av virksomheter.\n- **Teknisk (Svært høy vekt):** Standardiserte API-er, meldingsutveksling, hendelsesstrømmer, sikkerhetsmekanismer og felles infrastruktur må gjøre systemer i stand til å utveksle data kontrollert og skalerbart.\n\n### Bidrag til sammenhengende tjenester og felles økosystem\nKapabiliteten gjør at data kan flyte sikkert og strukturert mellom virksomheter i en tjenestekjede. Den reduserer behovet for at brukeren selv må hente, dokumentere eller formidle informasjon mellom offentlige aktører. Når datautveksling og integrasjon skjer etter felles rammer, blir det enklere å utvikle sammenhengende tjenester, gjenbruke eksisterende data og koble uavhengige løsninger sammen i et mer effektivt felles økosystem.","p":{},"f":["Strategy","Kapabiliteter i NA"]},"id-fa54a429cbd84db09da1b2b2165fc352":{"id":"id-fa54a429cbd84db09da1b2b2165fc352","t":"Capability","n":"Dataanalyse","d":"Evne til å transformere rådata til meningsfull innsikt og bygge prediktive modeller.\n\n### Begrunnelse (Hvorfor)\nDataanalyse og spesielt bruk av KI muliggjør nye måter å jobbe på i fremtiden. Kapabiliteten gir bedre beslutningsgrunnlag ved å analysere komplekse datasett og avdekke innsikter og sammenhenger som er vanskelige for mennesker å oppdage.\n\nDataanalyse kan gi effektivisering ved å automatisere oppgaver som tidligere krevde menneskelig vurdering. Dette kan frigjøre ressurser fra rutinemessig saksbehandling til andre oppgaver.\nKapabiliteten muliggjør også mer treffsikre tjenester. Ved hjelp av dataanalyse kan man vurdere et komplekst sett av variabler for å gi innbyggere og virksomheter skreddersydde råd eller proaktive tjenester.\nKapabiliteten øker også innovasjonsevnen. Den kan brukes til å løse problemer som tidligere var vanskelige å håndtere, for eksempel analyse av medisinske bilder, overvåking av miljøendringer via satellittdata eller optimalisering av trafikkflyt i sanntid.\n\n### Hva det innebærer (Omfang)\n- **Juridisk (Høy vekt):** Etablere og følge strenge retningslinjer som sikrer at dataanalyse og KI-modeller er rettferdige, transparente, forklarbare og ikke-diskriminerende, og at bruken er i tråd med personvernregelverket.\n- **Organisatorisk (Høy vekt):** Bygge kompetanse, rutiner og ansvar for utvikling, validering, bruk og oppfølging av analyser og prediktive modeller i konkrete tjeneste- og saksbehandlingsprosesser.\n- **Semantisk (Svært høy vekt):** Sikre at rådata, treningsdata, variabler, klassifikasjoner og resultater forstås riktig, slik at modeller og analyser bygger på korrekt betydning og kontekst.\n- **Teknisk (Svært høy vekt):** Utvikle, trene og validere maskinlæringsmodeller for klassifisering, prediksjon og mønstergjenkjenning. Bruke KI-teknikker, særlig språkmodeller (NLP), til å tolke, sortere og hente ut informasjon fra ustrukturert tekst som søknader, høringsinnspill og e-poster. Etablere MLOps for produksjonssetting, overvåking og kontinuerlig forbedring av KI-modeller over tid.\n\n### Bidrag til sammenhengende tjenester og felles økosystem\nDataanalyse styrker sammenhengende tjenester ved å gjøre det mulig å bruke data på tvers til innsikt, prediksjon, automatisering og mer treffsikker oppfølging. Prediktive modeller kan forutse fremtidige hendelser, behov eller risiko, for eksempel hvilke innbyggere som har høyest risiko for å falle utenfor, eller hvor det oppstår vedlikeholdsbehov på infrastruktur.\n\nKapabiliteten bidrar til et mer effektivt felles økosystem ved å gjøre data til et aktivt beslutningsgrunnlag for tjenesteutvikling, prioritering og styring. Når aktørene kan analysere felles datagrunnlag og bruke KI på en ansvarlig måte, blir det enklere å utvikle proaktive, personaliserte og mer helhetlige tjenester for innbyggere og næringsliv.","p":{},"f":["Strategy","Kapabiliteter i NA"]},"id-efe1a2676c124eeab946802af96a1ab7":{"id":"id-efe1a2676c124eeab946802af96a1ab7","t":"Capability","n":"Dele data med andre","d":"Evne til å tilgjengeliggjøre egne data som veldokumenterte og sikre API-er, slik at andre aktører med lovlig grunnlag enkelt kan oppdage og gjenbruke dem.\n\n### Begrunnelse (Hvorfor)\nKapabiliteten gjør det mulig for andre aktører med lovlig grunnlag å oppdage, forstå og gjenbruke data i egne tjenester og prosesser. Den løser problemet med at verdifulle data forblir låst i enkeltvirksomheter, og legger til rette for at informasjon kan brukes på tvers uten unødvendige manuelle henvendelser, særskilte integrasjoner eller ny innsamling.\n\n### Hva det innebærer (Omfang)\n- **Juridisk (Middels vekt):** Avklare behandlingsgrunnlag, formål, tilgangsrettigheter, taushetsplikt og vilkår for viderebruk før data gjøres tilgjengelig for andre.\n- **Organisatorisk (Svært høy vekt):** Etablere rutiner for eierskap, forvaltning, publisering, kvalitetssikring og oppfølging av datatilbudet overfor konsumenter.\n- **Semantisk (Middels vekt):** Publisere og dokumentere dataene i Felles datakatalog, slik at de blir lette å finne, forstå og vurdere for gjenbruk.\n- **Teknisk (Høy vekt):** Etablere og forvalte sikre API-er etter nasjonale standarder, med robuste systemer for tilgangsstyring som sikrer at data kun deles med de som har lov til det, f.eks. via Maskinporten.\n\n### Bidrag til sammenhengende tjenester og felles økosystem\nKapabiliteten gjør at andre virksomheter kan bygge tjenester på data som allerede finnes, i stedet for å hente inn samme informasjon på nytt. Når data deles gjennom sikre, standardiserte og godt dokumenterte grensesnitt, kan tjenestekjeder kobles sammen på en mer forutsigbar måte. For sluttbrukeren betyr dette færre gjentakelser, mindre dokumentasjonsbyrde og mer sømløse tjenester på tvers av virksomheter. For økosystemet gir det økt gjenbruk, bedre datakvalitet og mer effektiv ressursutnyttelse.","p":{},"f":["Strategy","Kapabiliteter i NA"]},"id-697145d3768b40d39f9463667b78f749":{"id":"id-697145d3768b40d39f9463667b78f749","t":"Capability","n":"EU-standarder","d":"Evne til å forstå og ta i bruk EU-standarder i økosystemet.\n\n### Begrunnelse (Hvorfor)\nKapabiliteten sikrer at nasjonal arkitektur kan bygge på relevante europeiske standarder, spesifikasjoner og referansearkitekturer. Den løser behovet for at norske digitale tjenester kan samhandle bedre med europeiske løsninger, regelverk og dataområder, og at nasjonale valg ikke utvikles isolert fra europeisk digitaliseringspolitikk.\n\n### Hva det innebærer (Omfang)\n- **Juridisk (Høy vekt):** Avklare hvilke EU-standarder, forordninger og harmoniserte krav som er relevante for norsk forvaltning og hvordan de skal innarbeides i nasjonale rammer. NB! Harmoniserte standarder fra EU er sterkt knyttet til regulatoriske støtteverktøy.\n- **Organisatorisk (Høy vekt):** Etablere prosesser for å følge med på, vurdere, prioritere og ta i bruk relevante EU-standarder i nasjonale tiltak, veiledning og arkitekturstyring.\n- **Semantisk (Høy vekt):** Sikre at europeiske begreper, informasjonsmodeller, metadata og klassifikasjoner forstås og mappes riktig til norske begreper og nasjonale modeller.\n- **Teknisk (Høy vekt):** Ta i bruk tekniske spesifikasjoner, referansearkitekturer, API-standarder, sikkerhetskrav og interoperabilitetsprofiler fra EU der de er relevante for norske fellesløsninger og digital samhandling.\n\n### Bidrag til sammenhengende tjenester og felles økosystem\nEU-standarder bidrar til at norske digitale tjenester kan utvikles i samsvar med europeiske krav og samhandlingsmønstre. Når relevante standarder forstås og tas i bruk, blir det enklere å bygge løsninger som fungerer både nasjonalt og på tvers av landegrenser.\n\nKapabiliteten styrker det felles økosystemet ved å redusere særnorske avvik, øke gjenbruk av europeiske spesifikasjoner og gjøre nasjonal arkitektur mer robust mot endringer i europeisk regelverk og teknologiutvikling. For sluttbrukeren kan dette gi mer sømløse tjenester når rettigheter, data og digitale løsninger må fungere på tvers av sektorer og landegrenser.","p":{},"f":["Strategy","Kapabiliteter i NA"]},"id-ecdde89168314bfb94b6a6ac70a55bc7":{"id":"id-ecdde89168314bfb94b6a6ac70a55bc7","t":"Capability","n":"Finansiering","d":"Evne til å etablere, anvende og forvalte finansielle virkemidler for å styre digitalisering i tråd med nasjonale mål.\n\n### Begrunnelse (Hvorfor)\nTradisjonelle finansieringsmodeller følger i stor grad den enkelte virksomhets budsjettrammer. Dette skaper store utfordringer for tverrgående digitale tiltak. Ofte må én enkelt virksomhet ta hele utviklingskostnaden, mens gevinstene hentes ut av andre aktører eller av samfunnet som helhet. Kapabiliteten skal sikre langsiktige og forutsigbare økonomiske rammer for felles digital infrastruktur og tverrgående digitale tjenester.\n\n### Hva det innebærer (Omfang)\n- **Juridisk (Ikke relevant):** Kapabiliteten handler om finansieringsmodeller og kostnadsdeling, mens økonomiregelverket er en ytre ramme.\n- **Organisatorisk (Svært høy vekt):** Konkrete prosesser for søknad om statlig medfinansiering. Etablering av bindende avtaler om kostnadsdeling mellom samhandlende virksomheter. Utarbeidelse av forretningsmodeller og rutiner for tverrgående gevinstrealisering.\n- **Semantisk (Ikke relevant):** Kapabiliteten handler ikke om betydningen av data eller begreper.\n- **Teknisk (Ikke relevant):** Kapabiliteten handler ikke om tekniske løsninger.\n\n### Bidrag til sammenhengende tjenester og felles økosystem\nKapabiliteten bidrar til sammenhengende tjenester ved å redusere de økonomiske barrierene som ofte bremser tverrgående digitaliseringstiltak. Når finansiering av utvikling, drift, forvaltning og videreutvikling er avklart, får virksomhetene bedre forutsetninger for å samarbeide langsiktig og forpliktende.\nFinansielle virkemidler gjør det mulig å prioritere tiltak som gir størst samlet nytte, selv om gevinsten ikke realiseres hos den virksomheten som bærer kostnaden. Dette er særlig viktig for felles digital infrastruktur og tjenester som går på tvers av sektorer, forvaltningsnivåer og livshendelser.\nKapabiliteten styrker også det felles digitale økosystemet ved å legge til rette for gjenbruk, samfinansiering og mer helhetlig porteføljestyring. Den bidrar til at kritiske byggeklosser og fellesløsninger ikke svekkes av lokale budsjettprioriteringer, men forvaltes som nasjonale ressurser med langsiktig verdi.\nFor sluttbrukeren betyr dette mer stabile, helhetlige og sammenhengende tjenester, der tjenestekvaliteten i mindre grad påvirkes av interne budsjettgrenser og økonomiske ansvarsforhold i forvaltningen.","p":{},"f":["Strategy","Kapabiliteter i NA"]},"id-b99fcd8160d24e5f8ea3c17b15072f7a":{"id":"id-b99fcd8160d24e5f8ea3c17b15072f7a","t":"Capability","n":"Forvaltningsstandarder","d":"Evne til å implementere og ta i bruk nasjonale standarder, herunder forvaltningsstandarder og normerende sektorstandarder.\n\n### Begrunnelse (Hvorfor)\nKapabiliteten sikrer at virksomheter faktisk implementerer og tar i bruk nasjonale standarder i tjenester, løsninger, anskaffelser og samhandlingsprosesser. Den løser behovet for felles praksis som gjør at data, tjenester og tekniske grensesnitt fungerer sammen på tvers av offentlig sektor.\n\nKapabiliteten inkluderer også EU-harmoniserte standarder som er vedtatt i norsk forvaltning.\n\n### Hva det innebærer (Omfang)\n- **Juridisk (Middels vekt):** Etterleve krav og føringer knyttet til nasjonale forvaltningsstandarder og EU-harmoniserte standarder som er vedtatt i norsk forvaltning.\n- **Organisatorisk (Høy vekt):** Etablere rutiner for å vurdere, innføre, følge opp og dokumentere bruk av relevante standarder i prosjekter, anskaffelser og forvaltning.\n- **Semantisk (Høy vekt):** Bruke standardiserte begreper, metadata, informasjonsmodeller og beskrivelser som sikrer lik forståelse av data og tjenester på tvers av virksomheter.\n- **Teknisk (Høy vekt):** Implementere standardiserte formater, protokoller, API-spesifikasjoner, sikkerhetsmekanismer og tekniske grensesnitt som gjør løsninger interoperable og gjenbrukbare.\n\n### Bidrag til sammenhengende tjenester og felles økosystem\nForvaltningsstandarder gjør det mulig å bygge tjenester og løsninger som følger samme regler, formater og samhandlingsmønstre. Når virksomheter implementerer og bruker de samme standardene, blir det enklere å dele data, koble systemer sammen og gjenbruke løsninger på tvers av sektorer og forvaltningsnivåer.\n\nKapabiliteten styrker det felles økosystemet ved å redusere lokale avvik, særtilpasninger og kostbare integrasjoner. For sluttbrukeren betyr dette mer stabile og sammenhengende tjenester, der digitale løsninger fungerer bedre sammen uavhengig av hvilken virksomhet som leverer dem.","p":{},"f":["Strategy","Kapabiliteter i NA"]},"id-f696350f5d844a96854deadb83bc3c81":{"id":"id-f696350f5d844a96854deadb83bc3c81","t":"Capability","n":"Gjenbrukbare tjenester","d":"Evne til å utvikle og benytte tjenester som kan brukes i nye sammenhenger på tvers av offentlig forvaltning og næringsliv. \n\n### Begrunnelse (Hvorfor)\nGjenbrukbare tjenester leverer forretningsmessig verdi ved å løse funksjonelle problemer som er felles for flere virksomheter. Det er en kritisk nyanse her: Et system kan være teknisk integrerbart (ha et API) uten å være gjenbrukbart, dersom forretningslogikken er for spesifikk eller låst til én kontekst. Kapabiliteten løser problemet med at virksomheter kaster bort ressurser på å duplisere og kode den samme forretningslogikken hver for seg i isolerte siloer.\n\n### Hva det innebærer (Omfang)\n- **Juridisk (Ikke relevant):** Rammer for bruk av gjenbrukbare tjenester ivaretas i tjenesteforvaltning og avtaleverk.\n- **Organisatorisk (Svært høy vekt):** Rutiner for å identifisere generiske forretningsbehov som deles av flere aktører i økosystemet. Etablering av felles forvaltningsmodeller og insentiver som oppmuntrer virksomheter til å gjenbruke andres tjenester fremfor å bygge egne.\n- **Semantisk (Middels vekt):** Omforente definisjoner av funksjonelle tjenester og forretningsregler i felles katalog. Standardisering av tjenestetaksonomier for å sikre lik forståelse av hva en delt tjeneste faktisk utfører.\n- **Teknisk (Middels vekt):** Utvikling av modulær forretningslogikk som er frikoblet fra spesifikke, proprietære fagsystemer. Anvendelse av arkitekturmønstre som sikrer at tjenestekomponenten enkelt kan plugges inn i helt nye sammenhenger.\n\n### Bidrag til sammenhengende tjenester og felles økosystem\nNår virksomheter gjenbruker de samme funksjonelle tjenestene og forretningsreglene, harmoniseres prosessene i bakgrunnen automatisk. Dette gjør det langt enklere å sy sammen tverrgående tjenestekjeder for de prioriterte livshendelsene. For sluttbrukeren betyr dette en mer forutsigbar og gjenkjennelig digital reise, fordi forvaltningen opptrer med lik logikk og adferd uavhengig av hvilken etat brukeren samhandler med.","p":{},"f":["Strategy","Kapabiliteter i NA"]},"id-3dbd3a9115cb4c54876490cbf02b0c58":{"id":"id-3dbd3a9115cb4c54876490cbf02b0c58","t":"Capability","n":"Grunndata","d":"Evne til å identifisere og formelt anerkjenne autoritative datakilder basert på en systematisk vurdering av deres verdi.\n\n### Begrunnelse (Hvorfor)\nKapabiliteten sikrer at økosystemet har felles, autoritative datakilder som kan legges til grunn for tjenester, prosesser og beslutninger på tvers av virksomheter. Den løser problemet med at ulike aktører bruker ulike kopier, tolkninger eller kvalitetsnivåer av sentrale data, noe som kan gi feil, dobbeltarbeid og sviktende tillit i tjenestekjeder.\n\n### Hva det innebærer (Omfang)\n- **Juridisk (Høy vekt):** Avklare rettslig status, behandlingsgrunnlag, tilgangsregler, ansvar og plikter for autoritative datakilder som Folkeregisteret, Enhetsregisteret, Matrikkelen og Arbeidsgiver- og arbeidstakerregisteret.\n- **Organisatorisk (Høy vekt):** Etablere tydelig forvaltningsansvar, kvalitetsrutiner og prosesser for å identifisere, vurdere og formelt anerkjenne nasjonale grunndata.\n- **Semantisk (Svært høy vekt):** Sikre felles begreper, datadefinisjoner, metadata og informasjonsmodeller for nøkkelregistre, slik at dataene forstås likt på tvers av tjenester og sektorer.\n- **Teknisk (Høy vekt):** Tilgjengeliggjøre grunndata gjennom sikre, stabile og standardiserte grensesnitt, med mekanismer for oppdatering, logging, tilgangskontroll og sporbarhet.\n\n### Bidrag til sammenhengende tjenester og felles økosystem\nGrunndata gjør det mulig å bygge tjenester på felles autoritative opplysninger i stedet for lokale kopier eller manuell dokumentasjon. Eksempler på kandidater til nasjonale grunndata er Folkeregisteret, Enhetsregisteret, Matrikkelen, Arbeidsgiver- og arbeidstakerregisteret og geografiske grunndata forvaltet av Kartverket.\n\nNår slike datakilder er identifisert, anerkjent og gjort tilgjengelige, kan virksomheter gjenbruke samme grunnlag for identitet, virksomheter, eiendom, adresser, arbeidsforhold og geografi. For sluttbrukeren betyr dette færre krav om dokumentasjon, mindre feil og mer sammenhengende tjenester. For økosystemet gir det bedre datakvalitet, økt tillit og mer effektiv samhandling på tvers av virksomheter.","p":{},"f":["Strategy","Kapabiliteter i NA"]},"id-64811e71d98647e5a678a0a2e79ae617":{"id":"id-64811e71d98647e5a678a0a2e79ae617","t":"Capability","n":"Hendelsesdrevet","d":"Evne til å publisere og reagere på digitale hendelser og kontinuerlige datastrømmer når de inntreffer.\n\n### Begrunnelse (Hvorfor)\nHendelsesdrevet arkitektur gjør det mulig å utveksle informasjon mellom distribuerte løsninger uten komplekse og tett koblede integrasjoner. Når en relevant hendelse oppstår, kan andre tjenester reagere automatisk uten at avsender må kjenne alle mottakere eller deres interne prosesser. Dette gjør det enklere å knytte tjenester sammen i tjenestekjeder, monitorere og analysere datastrømmer, og tilby proaktive tjenester basert på hendelser og analyser.\n\n### Hva det innebærer (Omfang)\n- **Juridisk (Middels vekt):** Avklarer behandlingsgrunnlag, ansvar, formål, dataminimering og tilgang til hendelser som kan inneholde personopplysninger eller annen beskyttet informasjon.\n- **Organisatorisk (Svært høy vekt):** Etablerer roller, ansvar og rutiner for publisering, abonnement, forvaltning, endring og oppfølging av hendelser på tvers av tjenesteeiere og konsumenter.\n- **Semantisk (Høy vekt):** Sikrer felles forståelse av hendelsestyper, hendelsesnavn, tilstander, begreper, metadata og informasjonsinnhold i hendelser.\n- **Teknisk (Svært høy vekt):** Forvalter tekniske mekanismer for hendelsespublisering, abonnement, ruting, filtrering, sikkerhet, overvåking, feilhåndtering og leveransegarantier.\n\n### Bidrag til sammenhengende tjenester og felles økosystem\nHendelsesdrevet arkitektur bidrar til sammenhengende tjenester ved at virksomheter kan reagere på relevante endringer når de skjer, i stedet for å basere seg på manuelle avklaringer, periodiske oppslag eller tette integrasjoner. Dette gjør tjenestekjeder mer responsive og legger til rette for proaktive tjenester der brukeren får hjelp før vedkommende selv må ta initiativ.\nKapabiliteten styrker det felles digitale økosystemet ved å redusere avhengigheter mellom systemer og virksomheter. En hendelse kan publiseres én gang og brukes av flere aktører, uten at avsender må bygge egne integrasjoner mot hver enkelt mottaker. Dette gir bedre skalerbarhet, mer gjenbruk og større fleksibilitet i utviklingen av nye digitale tjenester.\nHendelsesdrevet samhandling gjør det også enklere å analysere data- og hendelsesstrømmer på tvers av løsninger, for eksempel innen IoT, sensordata, saksbehandling, varsling og automatisert oppfølging. Dermed kan offentlig sektor utvikle mer dynamiske, datadrevne og brukerorienterte tjenester.","p":{},"f":["Strategy","Kapabiliteter i NA"]},"id-4b66bbf964834654b5f0c61e955b91b1":{"id":"id-4b66bbf964834654b5f0c61e955b91b1","t":"Capability","n":"Identifisering","d":"Evne til å fastslå og registrere identiteter (personer, virksomheter eller systemer) entydig, gjennom pålitelige metoder og kilder.\n\n### Begrunnelse (Hvorfor)\nKapabiliteten sikrer at personer, virksomheter og systemer kan fastslås og registreres entydig gjennom pålitelige metoder og kilder. Dette gjør at identitetene senere kan gjenkjennes og skilles fra andre, uavhengig av kontekst.\n\nKapabiliteten legger til rette for sikker tilgangskontroll, sporbarhet og tillit i digitale tjenester. Den omfatter håndtering av digitale identiteter gjennom hele livsløpet, fra opprettelse og endring til avvikling.\n\nKapabiliteten inkluderer også evnen til å identifisere utenlandske brukere og sårbare grupper som mangler ordinært fødsels- eller D-nummer.\n\n### Hva det innebærer (Omfang)\n- **Juridisk (Høy vekt):** Sikre at identiteter etableres og brukes i tråd med regelverk for identitet, personvern, eID, representasjon, tilgang og behandling av person- og virksomhetsopplysninger.\n- **Organisatorisk (Høy vekt):** Etablere rutiner for registrering, kvalitetssikring, endring, samordning og avvikling av identiteter gjennom hele livsløpet.\n- **Semantisk (Høy vekt):** Sikre felles forståelse av identitet, identifikatorer, person, virksomhet, system, fødselsnummer, D-nummer og andre identitetsattributter.\n- **Teknisk (Høy vekt):** Bruke autoritative kilder, identifikatorer, registre og tekniske mekanismer som gjør det mulig å fastslå, slå opp, validere og gjenkjenne identiteter på tvers av tjenester og systemer.\n\n### Bidrag til sammenhengende tjenester og felles økosystem\nIdentifisering gjør det mulig å vite hvem eller hva en digital tjeneste samhandler med. Når personer, virksomheter og systemer kan identifiseres entydig og gjenkjennes på tvers av kontekster, blir det enklere å tilby sikre og sammenhengende tjenester.\n\nKapabiliteten styrker det felles økosystemet ved å legge grunnlaget for autentisering, tilgangsstyring, representasjon, sporbarhet og tillit. For sluttbrukeren betyr dette at tjenester kan kjenne igjen riktig bruker, håndtere riktige roller og gi mer presis, trygg og sammenhengende oppfølging på tvers av virksomheter.","p":{},"f":["Strategy","Kapabiliteter i NA"]},"id-5c6c20d50b6a4b168524901372f0ca6e":{"id":"id-5c6c20d50b6a4b168524901372f0ca6e","t":"Capability","n":"Informasjonsarkitektur","d":"Evne til å strukturere og modellere informasjon på en standardisert måte, slik at data og innformasjon blir finnbart, forståelig og gjenbrukbart for både mennesker og maskiner på tvers av hele økosystemet.\n\n### Begrunnelse (Hvorfor)\nKapabiliteten sikrer at informasjon kan beskrives, struktureres og modelleres på en måte som gjør den forståelig og gjenbrukbar på tvers av virksomheter, systemer og tjenestekjeder. Den løser problemet med at data og innhold ofte blir låst til lokale begreper, formater og systemforståelser.\n\nInformasjonsarkitektur innebærer arkitekturbeskrivelse gjennom et sett av krav, prinsipper og modeller som er nødvendig for fleksibel deling og utveksling av informasjon for å oppnå endringsdyktighet.\n\n### Hva det innebærer (Omfang)\n- **Juridisk (Middels vekt):** Informasjonsarkitekturen må støtte krav til personvern, taushetsplikt, arkivering, innsyn og etterlevelse ved deling og gjenbruk av informasjon.\n- **Organisatorisk (Høy vekt):** Etablere roller, ansvar og arbeidsprosesser for å utvikle, forvalte og bruke felles informasjonsmodeller, begrepsmodeller og metadata på tvers av virksomheter.\n- **Semantisk (Svært høy vekt):** Strukturere begreper, informasjonsmodeller, datadefinisjoner, relasjoner og metadata slik at informasjon kan forstås likt av både mennesker og maskiner.\n- **Teknisk (Høy vekt):** Bruke standardiserte modellformater, kataloger, API-beskrivelser og maskinlesbare metadata som gjør informasjon finnbart, delbart og integrerbart i digitale tjenester.\n\n### Bidrag til sammenhengende tjenester og felles økosystem\nInformasjonsarkitektur gjør det mulig å dele og gjenbruke informasjon på tvers uten at betydning, struktur og kontekst går tapt. Når data og innhold er modellert og beskrevet på en standardisert måte, blir det enklere å koble sammen tjenester, bygge felles datagrunnlag og automatisere informasjonsflyt.\n\nKapabiliteten styrker det felles økosystemet ved å gi virksomhetene et felles grunnlag for datadeling, tjenesteutvikling, analyse og styring. For sluttbrukeren betyr dette mer sammenhengende tjenester, færre misforståelser og mindre behov for å forklare eller dokumentere samme informasjon flere ganger.","p":{},"f":["Strategy","Kapabiliteter i NA"]},"id-896e4c1434604caa891b94bcce964720":{"id":"id-896e4c1434604caa891b94bcce964720","t":"Capability","n":"Informasjonsforvaltning","d":"Evne til å ha et felles rammeverk og styringsmodell for informasjonsforvaltning, slik at offentlige virksomheter kan utveksle og dele data og beskrivelser. \n\n### Begrunnelse (Hvorfor)\nKapabiliteten sikrer at offentlige virksomheter kan utveksle og dele data og beskrivelser innenfor et felles rammeverk og en felles styringsmodell. Den løser behovet for enhetlig praksis for hvordan informasjon beskrives, forvaltes, kvalitetssikres og gjøres tilgjengelig på tvers av virksomheter.\n\n### Hva det innebærer (Omfang)\n- **Juridisk (Middels vekt):** Informasjonsforvaltningen må støtte etterlevelse av krav til personvern, taushetsplikt, arkivering, innsyn, behandlingsgrunnlag og lovlig deling av data.\n- **Organisatorisk (Svært høy vekt):** Etablere felles rammeverk, styringsmodell, roller, ansvar og prosesser for forvaltning av data, begreper, informasjonsmodeller og metadata.\n- **Semantisk (Svært høy vekt):** Sikre felles beskrivelser, begreper, metadata, informasjonsmodeller og kvalitetskrav, slik at data og beskrivelser kan forstås og gjenbrukes på tvers.\n- **Teknisk (Høy vekt):** Bruke kataloger, modellverktøy, dataplattformer, API-beskrivelser og maskinlesbare metadata som gjør informasjon finnbart, delbart og teknisk tilgjengelig.\n\n### Bidrag til sammenhengende tjenester og felles økosystem\nInformasjonsforvaltning gir grunnlaget for at virksomheter kan dele og bruke data med felles forståelse av innhold, kvalitet og ansvar. Når data, begreper og beskrivelser forvaltes etter felles rammer, blir det enklere å bygge tjenester som henger sammen på tvers av virksomheter.\n\nKapabiliteten styrker det felles økosystemet ved å gjøre informasjon finnbar, forståelig, pålitelig og gjenbrukbart. For sluttbrukeren betyr dette mindre behov for å oppgi samme informasjon flere ganger, færre feil og mer helhetlige digitale tjenester.","p":{},"f":["Strategy","Kapabiliteter i NA"]},"id-48c9873ae59341a49c2dca27379fab55":{"id":"id-48c9873ae59341a49c2dca27379fab55","t":"Capability","n":"Informasjonssikkerhet","d":"Evne til å ha tilstrekkelig sikkerhet i tjenester og løsninger som benyttes i felles økosystem. \n\n### Begrunnelse (Hvorfor)\nKapabiliteten sikrer at tjenester og løsninger i felles økosystem har et tilstrekkelig sikkerhetsnivå til å beskytte informasjon, opprettholde tillit og muliggjøre trygg digital samhandling. Den er sterkt knyttet til kapabiliteten \"Tillit\", fordi sikkerhet er en grunnleggende forutsetning for autentisering, autorisasjon, datadeling, sporbarhet og sammenhengende tjenester.\n\n### Hva det innebærer (Omfang)\n- **Juridisk (Høy vekt):** Overordnede krav til informasjonssikkerhet, personvern, taushetsplikt, internkontroll og risikostyring må sikre at tjenester og løsninger etterlever gjeldende regelverk.\n- **Organisatorisk (Høy vekt):** Felles styring, roller, ansvar, risikovurderinger og sikkerhetsprosesser må sikre at aktørene i økosystemet håndterer sikkerhet på en koordinert og etterprøvbar måte.\n- **Semantisk (Middels vekt):** Felles begreper for risiko, sikkerhetsnivå, beskyttelsesbehov, trusler, sårbarheter og sikkerhetstiltak må sikre lik forståelse på tvers av virksomheter.\n- **Teknisk (Høy vekt):** Felles sikkerhetsarkitektur, tilgangsmekanismer, kryptering, logging, overvåking, hendelseshåndtering og tekniske sikkerhetstiltak må beskytte tjenester og løsninger i økosystemet.\n\n### Bidrag til sammenhengende tjenester og felles økosystem\nInformasjonssikkerhet gjør det mulig å koble tjenester, data og løsninger sammen uten å svekke konfidensialitet, integritet eller tilgjengelighet. Når aktørene har tillit til at informasjon håndteres sikkert, blir det enklere å dele data, bruke fellesløsninger og bygge tjenestekjeder på tvers av virksomheter.\n\nKapabiliteten styrker det felles økosystemet ved å redusere risiko, øke robusthet og etablere et felles sikkerhetsnivå for digital samhandling. For sluttbrukeren betyr dette tryggere og mer stabile tjenester, der opplysninger kan brukes på tvers uten at sikkerhet og tillit svekkes.","p":{},"f":["Strategy","Kapabiliteter i NA"]},"id-60827614648541ef8520df87fa25d100":{"id":"id-60827614648541ef8520df87fa25d100","t":"Capability","n":"Integrerbare tjenester","d":"Evne til å designe, utvikle og eksponere data og funksjonalitet som selvstendige, standardiserte og maskinlesbare tjenester (API-er), slik at de enkelt kan oppdages, forstås og integreres i nye, tverrgående prosesser og løsninger.\n\n### Begrunnelse (Hvorfor)\nTradisjonell systemutvikling låser ofte data og funksjonalitet til spesifikke brukerapplikasjoner eller lukkede fagsystemer. Dette tvinger eksterne virksomheter til å bygge kostbare, skreddersydde og tette integrasjoner for hvert nye behov. Underkapabiliteten løser problemet med fragmentert arkitektur og teknisk gjeld ved å frikoble forretningslogikk og gjøre den universelt tilgjengelig via standardiserte, pluggbare grensesnitt.\n\n### Hva det innebærer (Omfang)\n- **Juridisk (Ikke relevant):** Kapabiliteten handler om teknisk og organisatorisk integrerbarhet, mens juridiske rammer for bruk ivaretas i datautveksling og tilgangsstyring.\n- **Organisatorisk (Høy vekt):** Operasjonalisering av en robust livssyklusforvaltning for digitale tjenester. Etablering av klare rutiner for versjonering, kontinuerlig vedlikehold og forutsigbar utfasing av API-er og tjenester for å sikre varig stabilitet for konsumentene.\n- **Semantisk (Middels vekt):** Dokumentasjon og publisering av funksjonalitet i felles kataloger. Sikring av at tekniske grensesnitt og tilhørende datafelter utformes standardisert, slik at de er enkle å oppdage og tolke korrekt av eksterne utviklere.\n- **Teknisk (Svært høy vekt):** Konkret anvendelse av \"API-først\"-metodikk der det maskinlesbare grensesnittet utvikles som det primære produktet, uavhengig av spesifikke applikasjoner. Teknisk implementering av innebygd sikkerhet og kontrollert tilgangsstyring i grensesnittet, slik at data kun utveksles ved lovlig grunnlag og legitimt behov.\n\n### Bidrag til sammenhengende tjenester og felles økosystem\nNår virksomheter eksponerer sine kjernefunksjoner som integrerbare, frittstående API-er, fjernes den tekniske friksjonen mellom uavhengige systemer. Dette gjør det mulig for samarbeidende etater å hente og oppdatere nødvendig informasjon i sanntid. For sluttbrukeren betyr dette en mer sammenhengende brukerreise der forvaltningens underliggende systemgrenser blir skjult.","p":{},"f":["Strategy","Kapabiliteter i NA"]},"id-299fc063873a4f278a1d3c0ac9480467":{"id":"id-299fc063873a4f278a1d3c0ac9480467","t":"Capability","n":"Regelverk og rettslig grunnlag","d":"Evne til å utvikle, forvalte, tolke og anvende regelverk som gir rettslig grunnlag for sikker og effektiv digital samhandling.\n\n### Begrunnelse (Hvorfor)\nDigital samhandling og datadeling på tvers av uavhengige virksomheter krever en trygg og felles juridisk grunnmur. Uten denne kapabiliteten vil uklarheter rundt lovlighet, personvern og deling av opplysninger skape usikkerhet, føre til unødig lange utredningsprosesser og i verste fall stanse utviklingen av tverrgående digitale tjenester fordi aktørene ikke har avklart om de har lov til å samhandle.\n\n### Hva det innebærer (Omfa
