ng)\n- **Juridisk (Svært høy vekt):** Dette utgjør selve kjernen i kapabiliteten. Det innebærer å foreslå, koordinere og harmonisere endringer i regelverket (regelverksutvikling) samt å tilby felles, autoritative tolkninger av eksisterende regelverk (regelverkstolkning). Det sikrer at det rettslige hjemmelsgrunnlaget for deling av data er på plass og i tråd med nasjonale lover og europeiske forordninger (som GDPR og eIDAS).\n- **Organisatorisk (Høy vekt):** Etablere tverrgående samarbeidsarenaer og nettverk mellom jurister, departementer og etater for å samordne forvaltningspraksis. Dette sikrer en koordinert tilnærming til rettslige problemstillinger og fjerner silobaserte tolkninger som hindrer samhandling.\n- **Semantisk (Middels vekt):** Oversette komplekse juridiske begreper, vilkår og lovtekster til en omforent forståelse, slik at lovens intensjon tolkes likt av saksbehandlere og virksomheter i hele økosystemet.\n- **Teknisk (Lav vekt):** Underbygge prinsippet om digitaliseringsvennlig regelverk, der lover og forskrifter utformes med tanke på at rettslige regler, plikter og rettigheter senere skal kunne omsettes til maskinlesbar logikk og automatiserte saksbehandlingsprosesser.\n\n### Bidrag til sammenhengende tjenester og felles økosystem\nKapabiliteten rydder bort juridiske gråsoner og hindringer bak fasaden, slik at data lovlig kan flyte mellom uavhengige aktører i en tjenestekjede. For sluttbrukeren betyr dette en sømløs opplevelse der det offentlige kan samhandle på tvers av etater uten at brukeren selv må fungere som budbringer av attester, vedtak eller dokumentasjon.","p":{},"f":["Strategy","Kapabiliteter i NA"]},"id-ba60560a9ed64b4d87b2fd4fa6b32937":{"id":"id-ba60560a9ed64b4d87b2fd4fa6b32937","t":"Capability","n":"Nasjonal arkitektur for samhandling","d":"Evne til å sikre samhandling, gjenbruk og strategisk retning i et nasjonalt digitalt økosystem.\n\nFelles økosystem skal bidra til økt deling av data og gjenbruk av løsninger, slik at vi utnytter ressursene på en effektiv måte og skaper økte verdier for samfunnet.\nDet betyr at i felles økosystem samarbeider aktørene om å utvikle fellesløsninger som bidrar til en effektiv forvaltning med gode brukervennlige tjenester. Dette inkluderer hvordan vi styrer og forvalter løsninger og tjenester, samt hvordan vi øker samhandlingen mellom aktørene. \nMed samhandling mener vi evnen til å tilby tjenester, utveksle informasjon og ivareta både de organisatoriske, juridiske, semantiske og tekniske aspektene ved dette.","p":{},"f":["Strategy","Kapabiliteter i NA"]},"id-9ea8fbaeb19243fa971013c57c3e96f9":{"id":"id-9ea8fbaeb19243fa971013c57c3e96f9","t":"Capability","n":"Organisatorisk samhandling","d":"Evne til å tilpasse og samordne arbeidsprosesser, roller og ansvar på tvers av virksomheter, slik at de henger sammen\n\n### Begrunnelse (Hvorfor)\nNår en tjeneste går på tvers av virksomheter, oppstår det overganger der ansvar, informasjon og arbeid skal flyttes fra én aktør til en annen. Uten avklarte arbeidsprosesser blir disse overgangene manuelle, uklare eller brutte, og brukeren må selv koordinere mellom virksomhetene. Kapabiliteten løser dette ved å gjøre tverrgående arbeidsprosesser, overleveringer og ansvarsdeling eksplisitte og omforente.\n\nKapabiliteten dekker det operative arbeidet på tvers. Strategisk retning og finansiering hører til Strategisk styring, og formelle avtaler om eierskap og tjenestenivå hører til Tjenesteforvaltning.\n\n### Hva det innebærer (Omfang)\n- **Juridisk (Middels vekt):** Rettslige rammer for ansvar, saksbehandling og informasjonsdeling må være avklart når arbeidsprosesser går på tvers av virksomheter.\n- **Organisatorisk (Svært høy vekt):** Kartlegge og tilpasse tverrgående arbeidsprosesser, avklare roller og ansvar i hvert steg, og etablere rutiner for overlevering, oppfølging og håndtering av avvik mellom virksomhetene.\n- **Semantisk (Middels vekt):** Felles forståelse av roller, ansvar, prosessteg og overgangspunkter må gjøre det tydelig hvem som gjør hva på tvers av sektorer og livshendelser.\n- **Teknisk (Ikke relevant):** Kapabiliteten handler om arbeidsprosesser, roller og ansvarsdeling, ikke om tekniske løsninger.\n\n### Bidrag til sammenhengende tjenester og felles økosystem\nKapabiliteten gjør at arbeid kan flyte mellom virksomheter uten å stoppe opp i overgangene. Når hver virksomhet vet hvilket steg den har ansvar for og hvordan arbeidet overleveres, kan en tjenestekjede fungere som én sammenhengende prosess.\n\nFor sluttbrukeren betyr det at offentlig sektor kan opptre som én samordnet aktør, selv om tjenestene leveres av flere uavhengige virksomheter.","p":{},"f":["Strategy","Kapabiliteter i NA"]},"id-718d8e94a9b847a485fc6518b4f2588d":{"id":"id-718d8e94a9b847a485fc6518b4f2588d","t":"Capability","n":"Oversikt over API","d":"Evne til å understøtte datadeling og tjenesteintegrasjon ved å oppdage, forstå og koble seg til tilgjengelige data via en standardisert oversikt over maskinlesbare grensesnitt (API-er).\n\n### Begrunnelse (Hvorfor)\nKapabiliteten gjør det mulig for virksomheter å finne, forstå og ta i bruk tilgjengelige API-er for datadeling og tjenesteintegrasjon. Den løser problemet med at maskinlesbare grensesnitt ofte er spredt, ulikt dokumentert eller vanskelige å oppdage, noe som hindrer gjenbruk og fører til unødvendige spesialintegrasjoner.\n\n### Hva det innebærer (Omfang)\n- **Juridisk (Middels vekt):** API-beskrivelser må synliggjøre tilgangsvilkår, behandlingsgrunnlag, bruksbegrensninger, ansvar og eventuelle krav til avtaler eller godkjenning.\n- **Organisatorisk (Høy vekt):** Etablere rutiner for å registrere, kvalitetssikre, publisere og vedlikeholde API-beskrivelser, med tydelig ansvar hos API-eier og tjenesteeier.\n- **Semantisk (Høy vekt):** Beskrive API-er med standardiserte metadata, begreper, formål, datainnhold, endepunkter, status, versjoner og relasjoner til datasett, tjenester og hendelser.\n- **Teknisk (Svært høy vekt):** Tilgjengeliggjøre API-oversikten gjennom kataloger, søkefunksjoner og maskinlesbare spesifikasjoner, for eksempel OpenAPI, slik at utviklere og systemer kan koble seg til på en standardisert måte.\n\n### Bidrag til sammenhengende tjenester og felles økosystem\nKapabiliteten bidrar til sammenhengende tjenester ved å gjøre det enklere å finne og bruke eksisterende grensesnitt for datadeling og integrasjon. Når API-er er dokumentert og tilgjengelige i en standardisert oversikt, kan virksomheter raskere koble tjenester sammen uten å bygge nye punkt-til-punkt-integrasjoner.\n\nFor det felles økosystemet gir kapabiliteten bedre gjenbruk, lavere integrasjonskostnader og mer forutsigbar teknisk samhandling. Dette gjør det enklere å utvikle tjenester som bygger på data og funksjonalitet fra flere virksomheter, og som oppleves mer sømløse for sluttbrukeren.","p":{},"f":["Strategy","Kapabiliteter i NA"]},"id-dc38d2667240445db35f7f0f38fc1e15":{"id":"id-dc38d2667240445db35f7f0f38fc1e15","t":"Capability","n":"Oversikt over begreper","d":"Evne til å etablere en omforent begrepsforståelse ved å definere, dele og gjenbruke begreper på tvers av virksomheter, for å sikre entydig kommunikasjon og semantisk samhandlingsevne.\n\n### Begrunnelse (Hvorfor)\nKapabiliteten sikrer at virksomheter bruker og forstår sentrale begreper på samme måte når de utvikler tjenester, deler data og samhandler digitalt. Den løser problemet med at samme ord kan ha ulik betydning i ulike sektorer, systemer eller regelverk, noe som kan føre til misforståelser, feil databruk og svakere samhandling.\n\n### Hva det innebærer (Omfang)\n- **Juridisk (Middels vekt):** Avklare begreper som har rettslig betydning, slik at vilkår, rettigheter, plikter og hjemler forstås likt på tvers av virksomheter.\n- **Organisatorisk (Høy vekt):** Etablere rutiner for å definere, kvalitetssikre, publisere, forvalte og gjenbruke begreper på tvers av fagmiljøer og virksomheter.\n- **Semantisk (Svært høy vekt):** Beskrive begreper, definisjoner, relasjoner, kontekst og bruksområder på en standardisert måte som støtter felles forståelse og semantisk samhandling.\n- **Teknisk (Middels vekt):** Tilgjengeliggjøre begreper i felles kataloger og maskinlesbare formater, slik at de kan kobles til datasett, informasjonsmodeller, API-er og tjenester.\n\n### Bidrag til sammenhengende tjenester og felles økosystem\nKapabiliteten bidrar til sammenhengende tjenester ved å sikre at aktørene i en tjenestekjede forstår informasjonen de utveksler på samme måte. Når begreper er definert, delt og gjenbrukt, blir det enklere å utvikle tjenester som bygger på samme meningsinnhold på tvers av virksomheter.\n\nFor det felles økosystemet gir kapabiliteten bedre semantisk samhandling, høyere datakvalitet og mindre risiko for feilfortolkning. Dette gjør det enklere å dele data, gjenbruke informasjonsmodeller og utvikle digitale tjenester som fremstår helhetlige for sluttbrukeren.","p":{},"f":["Strategy","Kapabiliteter i NA"]},"id-3c6f94ba791a4aa298809ef3f46bdc87":{"id":"id-3c6f94ba791a4aa298809ef3f46bdc87","t":"Capability","n":"Oversikt over datasett","d":"Evne til å systematisk oppdage, vurdere og gjenbruke data på tvers av offentlig sektor gjennom en sentral, standardisert oversikt over tilgjengelige datasett.\n\n### Begrunnelse (Hvorfor)\nKapabiliteten gjør det mulig å finne, forstå og vurdere tilgjengelige datasett på tvers av offentlig sektor. Den løser problemet med at data ofte er spredt, ufullstendig dokumentert eller vanskelig å oppdage, noe som hindrer gjenbruk, datadeling og utvikling av sammenhengende tjenester.\n\n### Hva det innebærer (Omfang)\n- **Juridisk (Middels vekt):** Oversikten må synliggjøre relevante bruksbetingelser, tilgangsregler, behandlingsgrunnlag, lisenser, personvern og eventuelle begrensninger for viderebruk.\n- **Organisatorisk (Høy vekt):** Etablere rutiner for å registrere, kvalitetssikre, publisere og vedlikeholde beskrivelser av datasett, med tydelig ansvar hos dataeier og datatilbyder.\n- **Semantisk (Svært høy vekt):** Beskrive datasett med standardiserte metadata, begreper, klassifikasjoner, formål, kvalitet, oppdateringsfrekvens og relasjoner til andre datasett.\n- **Teknisk (Høy vekt):** Tilgjengeliggjøre oversikten gjennom kataloger, søkefunksjoner og maskinlesbare grensesnitt, slik at datasett kan oppdages, vurderes og kobles til relevante API-er eller nedlastingsløsninger.\n\n### Bidrag til sammenhengende tjenester og felles økosystem\nKapabiliteten bidrar til sammenhengende tjenester ved å gjøre det enklere for virksomheter å finne og gjenbruke data som allerede finnes i offentlig sektor. Når datasett er beskrevet på en standardisert måte, kan aktører raskere vurdere om dataene er relevante, lovlige og egnet for bruk i egne tjenester og prosesser.\n\nFor det felles økosystemet gir kapabiliteten bedre oversikt over tilgjengelige dataressurser, økt gjenbruk og mindre dobbeltinnsamling. Dette styrker datadeling, analyse, tjenesteutvikling og mer effektiv samhandling på tvers av virksomheter.","p":{},"f":["Strategy","Kapabiliteter i NA"]},"id-e5a55d4bacd14740a656bc896d25497a":{"id":"id-e5a55d4bacd14740a656bc896d25497a","t":"Capability","n":"Oversikt over hendelser","d":"Evne til å få oversikt over hvilke hendelser som utløser eller utløses av en tjeneste.\n\n### Begrunnelse (Hvorfor)\nKapabiliteten gjør det mulig å forstå hvilke digitale hendelser som påvirker en tjeneste, og hvilke hendelser tjenesten selv produserer. Den løser problemet med manglende oversikt over avhengigheter, triggere og konsekvenser i hendelsesdrevne tjenestekjeder.\n\n### Hva det innebærer (Omfang)\n- **Juridisk (Middels vekt):** Avklare om hendelser inneholder personopplysninger eller annen beskyttet informasjon, og synliggjøre relevante krav til behandlingsgrunnlag, tilgang, ansvar og formål.\n- **Organisatorisk (Høy vekt):** Etablere rutiner for å registrere, beskrive, forvalte og vedlikeholde oversikt over hendelser, med tydelig ansvar hos tjenesteeier og hendelsestilbyder.\n- **Semantisk (Svært høy vekt):** Beskrive hendelsestyper, hendelsesnavn, triggere, tilstander, metadata, begreper og relasjoner til tjenester på en standardisert måte.\n- **Teknisk (Høy vekt):** Tilgjengeliggjøre hendelsesoversikter i kataloger, grensesnitt eller meldingsinfrastruktur slik at systemer kan oppdage, abonnere på og reagere på relevante hendelser.\n\n### Bidrag til sammenhengende tjenester og felles økosystem\nKapabiliteten bidrar til sammenhengende tjenester ved å gjøre det tydelig hvilke hendelser som kan starte, endre eller avslutte en tjenesteprosess. Når aktørene har oversikt over hendelser og avhengigheter, blir det enklere å bygge proaktive og hendelsesdrevne tjenestekjeder på tvers av virksomheter.\n\nFor det felles økosystemet gir kapabiliteten bedre gjenbruk av hendelser, færre skjulte avhengigheter og mer forutsigbar samhandling. Dette gjør det mulig å reagere raskere på endringer og utvikle tjenester som oppleves mer sømløse for sluttbrukeren.","p":{},"f":["Strategy","Kapabiliteter i NA"]},"id-a40bf39259434db48f358cc543428c8a":{"id":"id-a40bf39259434db48f358cc543428c8a","t":"Capability","n":"Oversikt over informasjonsmodeller","d":"Evne til å gi oversikt over informasjonsmodeller for å kunne gi en felles forståelse av datastrukturer, slik at data kan tolkes korrekt og meningsfullt.\n\n### Begrunnelse (Hvorfor)\nKapabiliteten gjør det mulig å finne, forstå og gjenbruke informasjonsmodeller på tvers av virksomheter. Den løser problemet med at datastrukturer ofte beskrives lokalt, uensartet eller utilgjengelig, noe som gjør det vanskelig å tolke data korrekt i tverrgående tjenester og integrasjoner.\n\n### Hva det innebærer (Omfang)\n- **Juridisk (Middels vekt):** Informasjonsmodeller må støtte krav til behandlingsgrunnlag, personvern, taushetsplikt, arkivering og etterlevelse når modellene beskriver data som brukes i offentlige tjenester.\n- **Organisatorisk (Høy vekt):** Etablere rutiner for å registrere, kvalitetssikre, forvalte og publisere informasjonsmodeller i felles oversikter, med tydelig ansvar for modellene.\n- **Semantisk (Svært høy vekt):** Beskrive datastrukturer, begreper, relasjoner, kardinalitet, datatyper og betydning på en standardisert måte, slik at data kan tolkes korrekt og meningsfullt.\n- **Teknisk (Høy vekt):** Tilgjengeliggjøre informasjonsmodeller i maskinlesbare og standardiserte formater, gjennom kataloger, modellverktøy og grensesnitt som gjør dem søkbare og gjenbrukbare.\n\n### Bidrag til sammenhengende tjenester og felles økosystem\nKapabiliteten bidrar til sammenhengende tjenester ved å sikre at aktørene forstår datastrukturer på samme måte når informasjon deles, gjenbrukes eller integreres i tjenestekjeder. Når informasjonsmodeller er tilgjengelige og standardiserte, blir det enklere å bygge tjenester som tolker data korrekt på tvers av systemer og virksomheter.\n\nFor det felles økosystemet gir kapabiliteten bedre gjenbruk av modeller, mer presis datadeling og lavere risiko for feilfortolkning. Dette styrker semantisk samhandling og gjør det enklere å utvikle felles løsninger som bygger på samme forståelse av informasjon.","p":{},"f":["Strategy","Kapabiliteter i NA"]},"id-d9374751da7d4b36bb0b3be609ff7d28":{"id":"id-d9374751da7d4b36bb0b3be609ff7d28","t":"Capability","n":"Oversikt over tjenester","d":"Evne til å gi oversikt over og oppdage tjenester som tilbys av eller på vegne av offentlig sektor.\n\n### Begrunnelse (Hvorfor)\nKapabiliteten gjør det mulig å finne, forstå og vurdere tjenester som tilbys av eller på vegne av offentlig sektor. Den løser problemet med at tjenester ofte beskrives ulikt, ligger spredt eller er vanskelige å oppdage for innbyggere, næringsliv, virksomheter og andre tjenestekonsumenter.\n\n### Hva det innebærer (Omfang)\n- **Juridisk (Middels vekt):** Tjenestebeskrivelser må synliggjøre relevante rettigheter, plikter, vilkår, ansvar og eventuelle rettslige grunnlag knyttet til tjenesten.\n- **Organisatorisk (Høy vekt):** Etablere rutiner for å registrere, kvalitetssikre, publisere og vedlikeholde oversikt over tjenester, med tydelig ansvar for tjenesteeier og forvaltning.\n- **Semantisk (Svært høy vekt):** Beskrive tjenester med felles begreper, metadata, målgrupper, livshendelser, tjenestetyper og relasjoner til andre tjenester, slik at de kan forstås og sammenlignes på tvers.\n- **Teknisk (Middels vekt):** Tilgjengeliggjøre tjenesteoversikter i kataloger, portaler og maskinlesbare grensesnitt, slik at tjenester kan søkes opp, kobles til og gjenbrukes i digitale tjenestekjeder.\n\n### Bidrag til sammenhengende tjenester og felles økosystem\nKapabiliteten bidrar til sammenhengende tjenester ved å gjøre det lettere å se hvilke tjenester som finnes, hvem som tilbyr dem, og hvordan de henger sammen med andre tjenester. Når tjenester kan oppdages og beskrives på en standardisert måte, blir det enklere å sette dem sammen til helhetlige brukerreiser på tvers av virksomheter.\n\nFor det felles økosystemet gir kapabiliteten bedre oversikt, mer gjenbruk og mindre dobbeltutvikling. Den gjør det enklere for aktører å finne relevante tjenester, bygge videre på eksisterende tilbud og utvikle løsninger som fremstår mer helhetlige for sluttbrukeren.","p":{},"f":["Strategy","Kapabiliteter i NA"]},"id-9bc3012bcd154e27aa094ac36bf391be":{"id":"id-9bc3012bcd154e27aa094ac36bf391be","t":"Capability","n":"Proaktive tjenester","d":"Evne til å, basert på registrerte hendelser og delte data, automatisk identifisere en brukers behov for offentlige tjenester og proaktivt tilby relevant informasjon, veiledning eller starte en tjenesteprosess på vegne av brukeren.\n\n### Begrunnelse (Hvorfor)\nUten proaktivitet forblir selv de beste digitale tjenestene passive verktøy som krever at brukeren selv har kunnskapen, initiativet og overskuddet til å finne frem. Mange innbyggere og virksomheter kjenner ikke til alle støtteordninger, frister eller rettigheter de faktisk har. Kapabiliteten løser det spesifikke funksjonelle problemet med informasjonskløfter og sosial ulikhet, og fjerner unødvendig tidsbruk og saksbehandling ved å snu offentlig tjenesteyting fra passiv til aktiv.\n\n### Hva det innebærer (Omfang)\n- **Juridisk (Middels vekt):** Rettslig forankring av automatiserte forretningsregler som kobler spesifikke tjenester til rettigheter og plikter. Sikring av juridisk hjemmel for proaktiv varsling og behandling av delte data uten forutgående søknad.\n- **Organisatorisk (Svært høy vekt):** Etablering av operative rutiner for personalisert og kanal-uavhengig varsling via brukerens foretrukne digitale kanal. Utforming av nye arbeidsprosesser for å igangsette forhåndsutfylte tjenester og proaktiv veiledning som avlaster kommunikasjonssentre.\n- **Semantisk (Høy vekt):** Standardisering av logiske forretningsregler og relevanskriterier på tvers av sektorer. Harmonisering av datastrukturer og begreper knyttet til viktige tjenester for å sikre treffsikker og intelligent regelstyring.\n- **Teknisk (Svært høy vekt):** Bruk av hendelsesdrevet arkitektur for å lytte etter endringer i autoritative datakilder som Folkeregisteret og Enhetsregisteret. Implementering av tekniske integrasjoner for utsendelse av sikre, betimelige varsler og automatisert generering av forhåndsutfylte søknadsskjemaer.\n\n### Bidrag til sammenhengende tjenester og felles økosystem\nKapabiliteten bidrar til at offentlig sektor oppleves som en hjelpende hånd og en partner fremfor en byråkratisk motpart. Ved å varsle brukeren om rettigheter, plikter og muligheter før de selv har etterspurt det, bindes uavhengige etaters tjenester sammen til en flytende og uavbrutt reise. Dette sikrer at brukers rettigheter når effektivt frem, og at det blir enklere for næringsliv og innbyggere å overholde plikter. For det felles økosystemet gir dette effektivisering og frigjør ressurser fra rutinemessig saksbehandling, samtidig som det bygger samfunnstillit.","p":{},"f":["Strategy","Kapabiliteter i NA"]},"id-0209483504444508a40415aa6e3fc39c":{"id":"id-0209483504444508a40415aa6e3fc39c","t":"Capability","n":"Regelverkstolkning","d":"Evne til å tilby felles, autoritative tolkninger av relevant regelverk.\n\n### Begrunnelse (Hvorfor)\nNår flere uavhengige virksomheter skal samarbeide om å levere en sammenhengende tjeneste, oppstår det ofte usikkerhet om hvordan lovverket skal forstås. Hvis hver virksomhet gjør sine egne isolerte og silobaserte tolkninger, fører det til unødig risikoaversjon, lange utredningsprosesser og barrierer for datadeling. Denne kapabiliteten løser problemet ved å etablere en felles rettslig forutsigbarhet på tvers av organisasjonsgrensene.\n\n### Hva det innebærer (Omfang)\n- **Juridisk (Svært høy vekt):** Operasjonalisering av tverrgående lover og forordninger (som Forvaltningsloven, Offentleglova, Personopplysningsloven/GDPR og eIDAS) til konkrete, felles rettslige fortolkninger. Dette innebærer å avklare det spesifikke handlingsrommet for datadeling, gjenbruk av opplysninger og digital saksbehandling i konkrete samhandlingstiltak.\n- **Organisatorisk (Høy vekt):** Etablering av konkrete tverrgående juristnettverk, faste samarbeidsrutiner og eskaleringsprosesser for å løse tolkningsavvik mellom etater. Det omfatter også operasjonell utarbeidelse og formidling av felles veiledere som saksbehandlere i de ulike virksomhetene kan støtte seg på i hverdagen.\n- **Semantisk (Middels vekt):** Presisering og harmonisering av spesifikke juridiske kjernebegreper, rettslige vilkår og skjønnsmessige vurderinger (f.eks. nøyaktig hva som utgjør \"saklig behov\" eller \"gyldig samtykke\" i en gitt kontekst), slik at de tolkes identisk av alle parter.\n- **Teknisk (Middels vekt):** Tilgjengeliggjøring av de autoritative tolkningene og rettskildene i felles nasjonale kunnskapsbaser eller portaler (f.eks. Samarbeidsportalen), samt strukturering av tolkningene på en måte som gjør at de funksjonelt kan omsettes til maskinlesbare forretningsregler og logikk i saksbehandlingssystemene.\n\n### Bidrag til sammenhengende tjenester og felles økosystem\nKapabiliteten gir virksomhetene den nødvendige juridiske tryggheten til å koble sine prosesser og data sammen med andre aktører. For sluttbrukeren betyr dette kortere saksbehandlingstid og mer proaktive tjenester, fordi etatene bak kulissene allerede er enige om de rettslige spillereglene og slipper å stoppe opp \"stafetten\" for å utrede juss på nytt.","p":{},"f":["Strategy","Kapabiliteter i NA"]},"id-0119029984674da59dbbfdc3a8ca3e95":{"id":"id-0119029984674da59dbbfdc3a8ca3e95","t":"Capability","n":"Regelverksutvikling","d":"Evne til å foreslå og koordinere endringer i regelverket for å tilpasse det til teknologisk utvikling og nye behov.\n\n### Begrunnelse (Hvorfor)\nI arbeidet med sammenhengende digitale tjenester viser det seg ofte at det ikke er teknologien, men gårsdagens lovverk som setter rammene for hva som er mulig å få til. For å kunne tilby sømløse tjenester på tvers av sektorer må det regulatoriske rammeverket utvikle seg i takt med teknologien og samfunnets behov. Denne kapabiliteten løser problemet med fragmentert lovgivning som utilsiktet blokkerer for datadeling og digital samhandling.\n\n### Hva det innebærer (Omfang)\n- **Juridisk (Svært høy vekt):** Dette utgjør kjernen i kapabiliteten og innebærer å foreslå og koordinere endringer i regelverket for å tilpasse det til teknologisk utvikling og nye behov. Det inkluderer en systematisk tilnærming til å identifisere motstridende regelverk der harmonisering er nødvendig, og fremme endringer for å tilpasse lovverket til en digital virkelighet.\n- **Organisatorisk (Høy vekt):** Etablere tverrgående prosesser og samarbeidsarenaer mellom departementer, etater og lovgivere for å koordinere lovarbeid. Dette sikrer at endringsforslag ikke utformes i isolerte siloer, men tar høyde for tverrsektorielle behov og felles nasjonale mål.\n- **Semantisk (Middels vekt):** Sikre at juridiske begreper, definisjoner og hjemler i nye lover utformes på en måte som er entydig og harmonisert på tvers av sektorer, slik at de understøtter felles begrepsforståelse og automatisert saksbehandling.\n- **Teknisk (Lav vekt):** Legge til rette for digitaliseringsvennlig regelverk, der lover og forskrifter utformes med tanke på at de senere skal kunne omsettes til maskinlesbar logikk, kode og automatiserte forretningsregler i økosystemet.\n\n### Bidrag til sammenhengende tjenester og felles økosystem\nKapabiliteten rydder bort de juridiske hindringene og harmoniserer motstridende regelverk, slik at data lovlig kan flyte mellom uavhengige virksomheter i en tjenestekjede. Dette gjør det mulig å fjerne manuelle dokumentasjonskrav for innbyggere og næringsliv, og baner vei for helautomatiserte og proaktive brukeropplevelser.","p":{},"f":["Strategy","Kapabiliteter i NA"]},"id-b2aafe1f4c534db6b92c40b1eef605f2":{"id":"id-b2aafe1f4c534db6b92c40b1eef605f2","t":"Capability","n":"Representasjon","d":"Evne til å opptre eller utføre handlinger digitalt på vegne av andre. \n\n### Begrunnelse (Hvorfor)\nKapabiliteten gjør det mulig å etablere, validere, forvalte og dokumentere representasjonsforhold mellom en representant og en representert, slik at rettigheter og myndighet kan utøves på vegne av andre i henhold til lovverk, fullmakter eller vedtak.\n\nRepresentasjon betyr at en person eller virksomhet har rett til å handle på vegne av en annen person eller virksomhet på en slik måte at den representerte blir bundet av handlingen. Det løser behovet for trygg, sporbar og digital håndtering av slike forhold i tjenester og prosesser. Representasjon inkluderer bl.a.\n- Fullmakt (avtaleregulert representasjonsforhold), som innebærer kunne gi en viljeserklæring der den som gir fullmakt tildeler en person eller en virksomhet (fullmektigen) myndighet til å opptre eller gjøre noe på sine vegne.\n- Vergemål (lovregulert representasjonsforhold)\n- Foreldreansvar (lovregulert representasjonsforhold)\n\n### Hva det innebærer (Omfang)\n- **Juridisk (Svært høy vekt):** Håndtere representasjonsforhold som følger av lovverk, fullmakter eller vedtak, herunder fullmakt, vergemål og foreldreansvar.\n- **Organisatorisk (Høy vekt):** Etablere rutiner for å opprette, delegere, administrere, validere, dokumentere og tilbakekalle representasjonsforhold og digitale fullmakter.\n- **Semantisk (Høy vekt):** Skille tydelig mellom representant, representert, fullmektig, fullmaktsgiver, verge, foreldreansvar og andre roller, slik at myndighet og ansvar forstås likt på tvers av tjenester.\n- **Teknisk (Høy vekt):** Sikre integrasjon med autoritative kilder for representasjon, for eksempel Enhetsregisteret, vergemålsinformasjon og foreldreansvar, samt mekanismer for tilgangskontroll, sporbarhet og oversikt.\n\n### Bidrag til sammenhengende tjenester og felles økosystem\nRepresentasjon gjør det mulig for innbyggere og virksomheter å få hjelp, delegere myndighet og opptre digitalt på vegne av andre på en kontrollert måte. Dette er nødvendig i mange sammenhengende tjenester der en bruker ikke alltid handler som privatperson, men som verge, forelder, ansatt, daglig leder, regnskapsfører eller annen representant.\n\nKapabiliteten styrker det felles økosystemet ved å gi felles mekanismer for å dokumentere hvem som kan opptre på vegne av hvem. Det gir bedre sporbarhet, økt tillit og mer helhetlige tjenester der rettigheter kan utøves på tvers av virksomheter uten manuelle fullmaktsprosesser.","p":{},"f":["Strategy","Kapabiliteter i NA"]},"id-e67a4f2983ce40f9823ec34ba460055a":{"id":"id-e67a4f2983ce40f9823ec34ba460055a","t":"Capability","n":"Samarbeid","d":"Evne til å samarbeide og samhandle på tvers av virksomheter i offentlig og privat sektor.\n\n### Begrunnelse (Hvorfor)\nSammenhengende tjenester kan ikke bygges i isolasjon. Når en tjeneste krever bidrag fra flere virksomheter, må de arbeide sammen om prosesser, ansvar og forvaltning, ikke bare utveksle data. Kapabiliteten fungerer som en paraply for organisatorisk samhandling, samarbeidsarenaer og nettverk og tjenesteforvaltning. Den løser problemet med at virksomheter prioriterer interne oppgaver fremfor tverrgående brukerreiser.\n\nStrategisk styring setter retning, gir mandat og fordeler ressurser. Samarbeid handler om hvordan virksomhetene arbeider sammen innenfor disse rammene.\n\n### Hva det innebærer (Omfang)\n- **Juridisk (Høy vekt):** Samarbeidsavtaler, tjenesteavtaler og andre forpliktende rammer må gi et tydelig grunnlag for ansvarsdeling og felles forvaltning mellom virksomhetene.\n- **Organisatorisk (Svært høy vekt):** Felles arbeidsprosesser, avklarte roller og ansvar, møteplasser og forvaltningsmodeller må gjøre det mulig for virksomhetene å levere og videreutvikle tjenester sammen.\n- **Semantisk (Middels vekt):** Felles begreper og beskrivelser må sikre at samarbeidende virksomheter har samme forståelse av roller, ansvar og tjenester.\n- **Teknisk (Middels vekt):** Felles verktøy og digitale samarbeidsflater må understøtte forvaltning og samhandling på tvers av virksomheter.\n\n### Bidrag til sammenhengende tjenester og felles økosystem\nKapabiliteten bygger bro mellom organisatoriske siloer. Når virksomhetene har avklart hvem som gjør hva, hvordan arbeidet overleveres og hvem som har ansvar for helheten, kan tjenester bindes sammen til en uavbrutt reise for brukeren.\n\nFor det felles økosystemet gir dette mindre dobbeltarbeid, raskere avklaringer og tjenester som kan forvaltes og videreutvikles i fellesskap. For sluttbrukeren betyr det at forvaltningen oppleves som én samordnet aktør.","p":{},"f":["Strategy","Kapabiliteter i NA"]},"id-b4a86e2e430c472b9f74bedb7f66fd74":{"id":"id-b4a86e2e430c472b9f74bedb7f66fd74","t":"Capability","n":"Samarbeidsarenaer og nettverk","d":"Evne til å etablere, forvalte og fasilitere arenaer, nettverk og prosesser som fremmer kunnskapsdeling, dialog og samordning på tvers av virksomheter i økosystemet.\n\n### Begrunnelse (Hvorfor)\nSammenhengende tjenester kan ikke bygges i isolasjon. Aktørene i økosystemet må møtes for å dele erfaringer, løse felles utfordringer og samordne planer. Denne kapabiliteten sikrer velfungerende møteplasser som reduserer dobbeltarbeid, motvirker silotenking og gjør det mulig å koordinere utvikling på tvers av virksomheter.\n\n### Hva det innebærer (Omfang)\n- **Juridisk (Ikke relevant):** Arenaer og nettverk er frivillige samarbeidsformer uten egne juridiske forpliktelser.\n- **Organisatorisk (Svært høy vekt):** Sette opp og drifte konkrete nettverk, faggrupper og forum. Avklare roller, mandater og spilleregler for deltakelse, samt sikre at arbeidet er forankret hos ledelsen i virksomhetene.\n- **Semantisk (Middels vekt):** Bruke arenaene til å bygge felles kultur, terminologi og forståelse mellom arkitekter, jurister, utviklere og fagmiljøer fra ulike sektorer.\n- **Teknisk (Ikke relevant):** Kapabiliteten handler om møteplasser og faglige nettverk, ikke om tekniske løsninger.\n\n### Bidrag til sammenhengende tjenester og felles økosystem\nNår fagfolk møtes på tvers av organisasjoner, blir det lettere å oppdage hvor tjenester berører hverandre. Arenaene bidrar til å identifisere nye tverrgående brukerreiser, dele erfaringer og koordinere endringer i økosystemet. Dette gir bedre grunnlag for sammenhengende tjenester og gjør at virksomhetene kan utvikle løsninger som henger bedre sammen for sluttbrukeren.","p":{},"f":["Strategy","Kapabiliteter i NA"]},"id-0aa7eced8c5c460f8bc64b77bd6a16c4":{"id":"id-0aa7eced8c5c460f8bc64b77bd6a16c4","t":"Capability","n":"Sammenhengende tjenester","d":"Evne til å levere brukerorienterte digitale tjenester som fremstår som en logisk og uavbrutt prosess for brukeren, selv når den involverer og koordinerer handlinger og tjenester fra flere, uavhengige virksomheter.\n\n### Begrunnelse (Hvorfor)\nNår digitale tjenester er splittet opp mellom ulike uavhengige etater, blir brukeren ofte stående som en manuell budbringer av egne data mellom systemene. Denne underkapabiliteten løser det funksjonelle problemet med fragmenterte brukeropplevelser, brutte digitale reiser og silobaserte prosesser. Den sikrer at den bakenforliggende kompleksiteten i forvaltningen skjules helt, slik at brukeren opplever en helhetlig offentlig sektor.\n\n### Hva det innebærer (Omfang)\n- **Juridisk (Middels vekt):** Harmoniserte avklaringsprosesser under forvaltningsloven og personopplysningsloven sikrer det rettslige fundamentet for tverretatlig datadeling.\n- **Organisatorisk (Svært høy vekt):** Utforming av tverrgående arbeidsprosesser understøtter en uavbrutt og guidet reise der brukeren ledes steg-for-steg uten å måtte forholde seg til statlige eller kommunale grenser.\n- **Semantisk (Høy vekt):** Operasjonalisering av \"kun én gang\"-prinsippet sikrer at oppgitte data gjenbrukes via felles informasjonsmodeller.\n- **Teknisk (Høy vekt):** Teknisk integrasjon via standardiserte grensesnitt (API-er) og fellesløsninger sikrer at data deles og gjenbrukes.\n\n### Bidrag til sammenhengende tjenester og felles økosystem\nKapabiliteten er selve nøkkelen til at innbyggere og næringsliv skal oppleve forvaltningen som én samordnet aktør. Ved å binde uavhengige tjenester sammen til flytende kjeder, fjernes behovet for at brukeren må gjenta informasjon eller lete etter neste steg. Dette reduserer tidsbruk og feil, noe som gir et mer ressurseffektivt felles økosystem.","p":{},"f":["Strategy","Kapabiliteter i NA"]},"id-7e3d1d3396914d65a177c9d5346d6feb":{"id":"id-7e3d1d3396914d65a177c9d5346d6feb","t":"Capability","n":"Sammenstilling av data","d":"Evne til å hente, kombinere og foredle data fra ulike kilder for å skape ny innsikt, et helhetlig beslutningsgrunnlag, eller sammenhengende tjenester for brukeren.\n\n### Begrunnelse (Hvorfor)\nKapabiliteten gjør det mulig å skape ny verdi ved å kombinere data fra flere kilder. Den løser problemet med at beslutninger, analyser og tjenester ofte bygger på fragmenterte datagrunnlag som ikke gir et helhetlig bilde av brukerens situasjon, virksomhetens behov eller en tverrgående tjenestekjede.\n\n### Hva det innebærer (Omfang)\n- **Juridisk (Middels vekt):** Avklare behandlingsgrunnlag, formål, tilgangsrettigheter, dataminimering og ansvar når data fra ulike kilder kombineres.\n- **Organisatorisk (Høy vekt):** Etablere rutiner for å identifisere relevante datakilder, avklare eierskap, sikre kvalitet og bruke sammenstilte data i beslutninger, analyser og tjenesteprosesser.\n- **Semantisk (Svært høy vekt):** Harmonisere begreper, metadata, klassifikasjoner, informasjonsmodeller og datakvalitet slik at data fra ulike kilder kan tolkes korrekt samlet.\n- **Teknisk (Høy vekt):** Bruke standardiserte grensesnitt, dataplattformer, integrasjonsmønstre og behandlingsløp for å hente, koble, transformere og foredle data på en sikker og sporbar måte.\n\n### Bidrag til sammenhengende tjenester og felles økosystem\nKapabiliteten gjør det mulig å bygge tjenester og beslutningsgrunnlag på et helhetlig databilde, ikke bare på opplysninger fra én virksomhet eller ett system. Når data kan hentes, kombineres og foredles på tvers, blir det enklere å forstå brukerens situasjon, forutse behov og tilby mer treffsikre tjenester. For det felles økosystemet bidrar kapabiliteten til bedre datadrevet styring, mer gjenbruk av eksisterende data og mer sammenhengende tjenestekjeder.","p":{},"f":["Strategy","Kapabiliteter i NA"]},"id-034543e002414306a8fbecc8c9d8e496":{"id":"id-034543e002414306a8fbecc8c9d8e496","t":"Capability","n":"Samordning","d":"Evne til å harmonisere og koordinere strategisk retning, beslutninger og ressursbruk på tvers av virksomheter, for å realisere felles samfunnsmål og sammenhengende tjenester.\n\n### Begrunnelse (Hvorfor)\nFor å lykkes med sammenhengende digitale tjenester kan ikke virksomheter lenger optimalisere kun for seg selv. Kapabiliteten krever en tydelig styring eller et mandat som forplikter uavhengige aktører til å tilpasse seg hverandre, slik at offentlig sektor kan opptre koordinert og effektivt.\n\n### Hva det innebærer (Omfang)\n- **Juridisk (Middels vekt):** Koordinere at juss og forvaltningspraksis i ulike virksomheter gjøres kompatible, og at nødvendig hjemmelsgrunnlag for deling av data avklares på tvers (f.eks. mellom Skatteetaten og NAV).\n- **Organisatorisk (Svært høy vekt):** Etablere mandat, felles beslutningsarenaer og tydelig ansvarsfordeling som forplikter samhandlende virksomheter til felles arbeidsprosesser, prioriteringer og ressursbruk i tjenestekjeder.\n- **Semantisk (Middels vekt):** Sørge for at virksomhetene forplikter seg til omforente begreper og en felles forståelse av hva dataene betyr (f.eks. at «ansatt» betyr det samme i to ulike systemer), slik at maskiner kan forstå hverandre.\n- **Teknisk (Middels vekt):** Sørge for at felles standarder og nasjonale fellesløsninger blir valgt og tatt i bruk, fremfor at virksomheter bygger egne, proprietære løsninger.\n\n### Bidrag til sammenhengende tjenester og felles økosystem\nSamordning kobler strategi, arkitektur, beslutninger og ressurser på tvers, slik at offentlig sektor kan levere helhetlige tjenester rundt brukerens behov.","p":{},"f":["Strategy","Kapabiliteter i NA"]},"id-809f454dc4024d56ab54079252fdfe29":{"id":"id-809f454dc4024d56ab54079252fdfe29","t":"Capability","n":"Samtykke","d":"Evne til å akseptere, godkjenne eller gi tillatelse til at en handling kan foretas på vegne av seg selv eller andre, der det foreligger et representasjonsforhold.\n\n### Begrunnelse (Hvorfor)\nKapabiliteten gjør det mulig å innhente, administrere og dokumentere gyldige, frivillige og informerte samtykker fra personer, både for behandling og deling av deres opplysninger og for andre handlinger som berører dem. Den sikrer at samtykker kan gis, spores og enkelt trekkes tilbake.\n\nEt samtykke er en aktiv, frivillig og informert viljeserklæring fra en person som gir en annen part tillatelse til å utføre en bestemt handling som berører dem eller deres data. Samtykke er i utgangspunktet ikke en formell form for representasjon, men det kan oppstå situasjoner der en representant må gi et samtykke på vegne av den de representerer.\nEksempler:\n- Jeg gir noen lov til å gjøre noe overfor meg eller med mine data. Handlingen er rettet mot meg selv eller min sfære.\n- Jeg gir Altinn (tjenesteyter) lov til å hente mine skattedata. Altinn handler ikke på mine vegne, de utfører en handling jeg har gitt dem tillatelse til.\n\nDet kan oppstå situasjoner der en representant må gi et samtykke på vegne av den de representerer.\nEksempel: En verge (representant) gir samtykke til en medisinsk behandling for et barn (den representerte).\nI dette tilfellet ser vi hvordan konseptene virker sammen: Vergen utøver sin representasjonsrett til å avgi et samtykke på vegne av barnet. Men selve samtykket og representasjonen er fortsatt to distinkte juridiske handlinger.\n\n### Hva det innebærer (Omfang)\n- **Juridisk (Svært høy vekt):** Sikre at samtykker er gyldige, frivillige, informerte, dokumenterte og mulige å trekke tilbake, i tråd med personvernregelverket og relevante regler for representasjon.\n- **Organisatorisk (Høy vekt):** Etablere rutiner for innhenting, administrasjon, kontroll, tilbaketrekking og dokumentasjon av samtykker i tjenesteprosesser.\n- **Semantisk (Høy vekt):** Skille tydelig mellom samtykke, representasjon, fullmakt, tillatelse og godkjenning, slik at aktørene forstår hvilken juridisk handling som faktisk utføres.\n- **Teknisk (Høy vekt):** Tilby mekanismer for digital innhenting, lagring, validering, logging, oppslag og tilbaketrekking av samtykker, med sporbarhet og kobling til relevante tjenester, data og representasjonsforhold.\n\n### Bidrag til sammenhengende tjenester og felles økosystem\nSamtykke gjør det mulig å dele og bruke opplysninger på en kontrollert måte når brukeren selv gir tillatelse til en handling som berører dem eller deres data. For eksempel kan en person gi en tjenesteyter lov til å hente skattedata uten at tjenesteyteren handler på personens vegne.\n\nKapabiliteten styrker sammenhengende tjenester ved å gjøre det mulig å dokumentere og etterprøve at data brukes med riktig tillatelse. Den støtter også situasjoner der en representant, for eksempel en verge, gir samtykke på vegne av den representerte. For det felles økosystemet gir dette bedre tillit, sporbarhet og mer forutsigbar samhandling på tvers av virksomheter.","p":{},"f":["Strategy","Kapabiliteter i NA"]},"id-711390c3ddaa4b67914ccbcc2f1831aa":{"id":"id-711390c3ddaa4b67914ccbcc2f1831aa","t":"Capability","n":"Sanntidsdata","d":"Evne til å sikkert prosessere og distribuere kontinuerlige datastrømmer for å muliggjøre sanntidsinnsikt, automatisering og umiddelbar respons.\n\n### Begrunnelse (Hvorfor)\nKapabiliteten gjør det mulig å bruke data mens de oppstår, ikke først etter at de er samlet inn, lagret og analysert i etterkant. Den løser behovet for umiddelbar innsikt, automatisering og rask respons i tjenester og prosesser som er avhengige av kontinuerlige datastrømmer fra sensorer, tingenes internett (IoT) og andre hendelseskilder.\n\n### Hva det innebærer (Omfang)\n- **Juridisk (Middels vekt):** Avklare behandlingsgrunnlag, formål, tilgang, lagringstid og ansvar når sanntidsdata inneholder personopplysninger, sikkerhetskritisk informasjon eller andre beskyttede data.\n- **Organisatorisk (Høy vekt):** Etablere rutiner for overvåking, varsling, hendelseshåndtering og operativ oppfølging når sanntidsdata brukes i tjenester, beslutninger og automatiserte prosesser.\n- **Semantisk (Høy vekt):** Sikre felles forståelse av datastrømmer, måleverdier, hendelser, tidsstempler, lokasjon, kvalitet og metadata, slik at sanntidsdata tolkes korrekt på tvers av systemer og virksomheter.\n- **Teknisk (Svært høy vekt):** Tilby data fra sensorer, tingenes internett (IoT) og andre hendelseskilder gjennom skalerbar infrastruktur for strømming, prosessering, filtrering, sikker distribusjon, overvåking og feilhåndtering.\n\n### Bidrag til sammenhengende tjenester og felles økosystem\nSanntidsdata gjør det mulig å reagere på endringer idet de skjer. Det gir grunnlag for automatiserte varsler, dynamisk ressursstyring, løpende situasjonsforståelse og tjenester som tilpasser seg brukerens eller samfunnets behov i øyeblikket.\n\nKapabiliteten styrker sammenhengende tjenester ved at flere aktører kan bygge på samme oppdaterte situasjonsbilde. For sluttbrukeren kan dette gi raskere respons, mer presis veiledning og tjenester som oppleves mer relevante og proaktive. For det felles økosystemet gir det bedre datadrevet styring, mer effektiv samhandling og økt evne til å håndtere hendelser på tvers av virksomheter.","p":{},"f":["Strategy","Kapabiliteter i NA"]},"id-f5214c3db8de4738ab03abb7b7e553ed":{"id":"id-f5214c3db8de4738ab03abb7b7e553ed","t":"Capability","n":"Signering","d":"Evne til å signere dokumenter eller transaksjoner på en juridisk bindende måte.\n\n### Begrunnelse (Hvorfor)\nKapabiliteten sikrer at digitale signaturer er juridisk gyldige, ikke bare i dag, men også i fremtiden. Den løser behovet for å binde en person eller virksomhet rettslig til et dokument eller en transaksjon på en måte som kan dokumenteres og etterprøves over tid.\n\nSignering gir juridisk forpliktelse ved at en person eller virksomhet bindes til et dokument eller en transaksjon på rettslig grunnlag. Kapabiliteten skal også sikre langvarig bevisverdi, slik at det i ettertid kan bevises at signaturen var gyldig da den ble avlagt, selv om for eksempel personens eID-sertifikat senere har utløpt.\n\n### Hva det innebærer (Omfang)\n- **Juridisk (Svært høy vekt):** Sikre juridisk bindende signering av dokumenter og transaksjoner i tråd med relevant regelverk, inkludert eIDAS-krav til elektroniske signaturer og signeringsnære tillitstjenester.\n- **Organisatorisk (Middels vekt):** Etablere rutiner for bruk, forvaltning og kontroll av elektronisk signering i tjenesteprosesser, inkludert ansvar for dokumentasjon, arkivering og etterprøvbarhet.\n- **Semantisk (Middels vekt):** Sikre felles forståelse av begreper som signatur, juridisk forpliktelse, kvalifisert tidsstempling, sertifikat, uavviselighet og langsiktig bevisverdi.\n- **Teknisk (Høy vekt):** Forvalte fellesløsninger for elektronisk signatur, inkludert kvalifisert tidsstempling, sertifikathåndtering og mekanismer for Long-Term Validation (LTV). Systemet må låse signaturen med et offisielt tidsstempel slik at gyldighet kan dokumenteres også etter at sertifikater er utløpt eller trukket tilbake.\n\n### Bidrag til sammenhengende tjenester og felles økosystem\nSignering gjør det mulig å gjennomføre rettslig bindende handlinger digitalt på tvers av virksomheter og tjenestekjeder. Når dokumenter og transaksjoner kan signeres med langvarig bevisverdi, kan tjenester fullføres digitalt uten papirbaserte prosesser eller manuell etterkontroll.\n\nKapabiliteten styrker det felles økosystemet ved å gi felles mekanismer for uavviselighet, sporbarhet og juridisk bevisverdi. For sluttbrukeren betyr dette tryggere og mer effektive digitale tjenester der avtaler, søknader, vedtak og andre rettslige handlinger kan gjennomføres sømløst på tvers av offentlige og private aktører.","p":{},"f":["Strategy","Kapabiliteter i NA"]},"id-34d3d64b3afe4327a29ee6c2f7f74dff":{"id":"id-34d3d64b3afe4327a29ee6c2f7f74dff","t":"Capability","n":"Sikring av informasjonsflyt og datautveksling","d":"Evne til å sikre at informasjon som utveksles mellom virksomheter er beskyttet mot innsyn og manipulering, og at dataflyten er kontrollert gjennom nødvendige tekniske og organisatoriske tiltak.\n\nDette innebærer:\n* Det offentlige skal kunne garantere at dataene er trygge når de sendes fra ett system til et annet.\n* Konfidensialitet: Informasjonen krypteres og sikres slik at uvedkommende ikke kan lese dataene. \n* Integritet: Det brukes tekniske mekanismer som oppdager og hindrer at dataene blir endret, slettet eller manipulert på veien fra avsender til mottaker.\n* Trafikkstyring: Virksomhetene har kontroll på nøyaktig hvor dataene sendes, hvem som har lov til å motta dem\n\n### Begrunnelse (Hvorfor)\nKapabiliteten sikrer at det offentlige kan garantere at dataene er trygge når de sendes fra ett system til et annet. Den løser behovet for kontrollert og sikker informasjonsflyt mellom virksomheter, slik at data ikke blir lest, endret, slettet eller manipulert av uvedkommende under utveksling.\n\nKapabiliteten er nødvendig for å opprettholde tillit til digital samhandling, særlig når informasjon deles på tvers av virksomheter, sektorer og tjenestekjeder.\n\n### Hva det innebærer (Omfang)\n- **Juridisk (Høy vekt):** Sikre at informasjonsutveksling skjer i tråd med krav til personvern, taushetsplikt, informasjonssikkerhet, behandlingsgrunnlag, ansvar og lovlig deling av data.\n- **Organisatorisk (Høy vekt):** Etablere rutiner, ansvar og kontrollmekanismer for sikker dataflyt, inkludert avklaringer om hvem som kan sende, motta og behandle informasjon.\n- **Semantisk (Middels vekt):** Bruke klassifisering, metadata og felles forståelse av beskyttelsesbehov, slik at aktørene vet hvilke sikkerhetskrav som gjelder for informasjonen som utveksles.\n- **Teknisk (Svært høy vekt):** Sikre konfidensialitet gjennom kryptering og beskyttelse mot uautorisert innsyn. Sikre integritet gjennom tekniske mekanismer som oppdager og hindrer at data blir endret, slettet eller manipulert på vei fra avsender til mottaker. Sikre trafikkstyring slik at virksomhetene har kontroll på hvor data sendes og hvem som har lov til å motta dem.\n\n### Bidrag til sammenhengende tjenester og felles økosystem\nSikring av informasjonsflyt og datautveksling gjør det mulig å dele data på tvers av virksomheter uten å svekke konfidensialitet, integritet eller kontroll. Når informasjon kan utveksles trygt, kan flere aktører inngå i samme tjenestekjede og bruke hverandres data med nødvendig tillit.\n\nKapabiliteten styrker det felles økosystemet ved å redusere risiko ved datadeling og gjøre sikker samhandling mer forutsigbar. For sluttbrukeren betyr dette tryggere og mer sammenhengende tjenester, der opplysninger kan flyte mellom relevante aktører uten at brukeren selv må bære informasjonen mellom dem.","p":{},"f":["Strategy","Kapabiliteter i NA"]},"id-1be148b57796458993c3f7f5f24815ca":{"id":"id-1be148b57796458993c3f7f5f24815ca","t":"Capability","n":"Sluttbrukertjenester","d":"Evne til å tilby en sammenhengende digital brukeropplevelse gjennom et økosystem av standardiserte og integrerbare tjenester.\n\n### Begrunnelse (Hvorfor)\nKapabiliteten sikrer at innbyggere, næringsliv og andre sluttbrukere møter offentlige digitale tjenester som en helhetlig brukeropplevelse, selv om tjenestene leveres av flere uavhengige virksomheter. Den fungerer som en strategisk paraply for brukerorienterte, sammenhengende og proaktive tjenester som bygger på felles data, integrerbare tjenester og standardiserte samhandlingsmønstre.\n\n### Hva det innebærer (Omfang)\n- **Juridisk (Middels vekt):** Overordnede rammer for rettigheter, plikter, personvern, universell utforming og digital kommunikasjon må sikre at sluttbrukertjenester kan tilbys trygt og lovlig på tvers av virksomheter.\n- **Organisatorisk (Svært høy vekt):** Felles styring, tjenesteeierskap, brukerorienterte arbeidsprosesser og tverrgående ansvar må sikre at tjenestene oppleves helhetlige fra brukerens ståsted.\n- **Semantisk (Høy vekt):** Felles begreper, tjenestebeskrivelser, informasjonsmodeller og brukerrettet språk må sikre at innhold og veiledning forstås likt på tvers av tjenestene.\n- **Teknisk (Høy vekt):** Standardiserte og integrerbare tjenester, API-er, fellesløsninger og sikre digitale kanaler må gjøre det mulig å bygge en sammenhengende brukeropplevelse på tvers av systemer.\n\n### Bidrag til sammenhengende tjenester og felles økosystem\nKapabiliteten gjør sluttbrukerens behov til utgangspunktet for hvordan tjenester settes sammen i økosystemet. Når offentlige tjenester bygger på standardiserte og integrerbare byggeklosser, kan brukeren få en mer sømløs reise der informasjon, veiledning og handlinger henger sammen på tvers av virksomheter. Dette styrker det felles økosystemet ved å fremme gjenbruk, redusere fragmentering og gjøre det enklere å utvikle tjenester som oppleves som én samlet offentlig sektor.","p":{},"f":["Strategy","Kapabiliteter i NA"]},"id-2dfe07b3eae740b9a292e0a4a42d22db":{"id":"id-2dfe07b3eae740b9a292e0a4a42d22db","t":"Capability","n":"Sporbarhet og innsyn","d":"Evne til å dokumentere og logge opplysninger for bruk i innsyn, forvaltning og kontroll av tillitstjenester.\n\n### Begrunnelse (Hvorfor)\nKapabiliteten sikrer at opplysninger, digitale hendelser og transaksjoner kan dokumenteres, logges og etterprøves for å støtte innsyn, kontroll og juridisk etterrettelighet. Den løser behovet for at innbyggere, virksomheter og kontrollorganer kan se hvem som gjorde hva, når det skjedde, og at tillitstjenestene ble brukt på riktig måte.\n\n### Hva det innebærer (Omfang)\n- **Juridisk (Høy vekt):** Sikre juridisk etterprøvbarhet, innsyn, dokumentasjon og kontroll i tråd med krav til personvern, arkivering, sporbarhet, bevisverdi og ansvarlig bruk av tillitstjenester.\n- **Organisatorisk (Høy vekt):** Etablere rutiner for logging, kontroll, revisjon, innsynshåndtering og oppfølging av avvik i bruk av opplysninger, digitale hendelser og transaksjoner.\n- **Semantisk (Middels vekt):** Sikre felles forståelse av logghendelser, transaksjoner, oppslag, aktører, tidspunkt, formål og behandlingskontekst, slik at sporbarheten kan tolkes korrekt.\n- **Teknisk (Svært høy vekt):** Etablere uforanderlige transaksjonslogger der alle hendelser, oppslag og transaksjoner loggføres automatisk på en måte som hindrer sletting eller manipulering i ettertid.\n\n### Bidrag til sammenhengende tjenester og felles økosystem\nSporbarhet og innsyn gir tillit til at data, rettigheter og tillitstjenester brukes korrekt på tvers av virksomheter. Når bruk av opplysninger og digitale handlinger kan dokumenteres og etterprøves, blir det tryggere å koble tjenester sammen i felles tjenestekjeder.\n\nKapabiliteten styrker det felles økosystemet ved å gjøre samhandling mer transparent, kontrollerbar og etterrettelig. For sluttbrukeren betyr dette bedre innsyn i egne data og handlinger, og større trygghet for at digitale tjenester brukes i tråd med regelverk, formål og forventninger.","p":{},"f":["Strategy","Kapabiliteter i NA"]},"id-c3f87c86b19547359c677a333b16f03b":{"id":"id-c3f87c86b19547359c677a333b16f03b","t":"Capability","n":"Standardisering","d":"Evne til å identifisere, vedta, forvalte og fremme bruk av omforente standarder og spesifikasjoner som sikrer interoperabilitet og gjenbruk på tvers av sektorer og landegrenser.\n\n### Begrunnelse (Hvorfor)\nKapabiliteten sikrer at virksomheter i økosystemet bygger tjenester, løsninger og informasjonsutveksling på omforente standarder og spesifikasjoner. Den reduserer lokale avvik, særtilpasninger og teknisk fragmentering, og gjør det mulig å oppnå interoperabilitet og gjenbruk på tvers av sektorer og landegrenser.\n\n### Hva det innebærer (Omfang)\n- **Juridisk (Middels vekt):** Nasjonale føringer, forskrifter og EU-harmoniserte standarder må gi forutsigbare rammer for hvilke standarder som skal eller bør brukes.\n- **Organisatorisk (Svært høy vekt):** Livssyklusforvaltning må sikre prosesser for å vurdere nye standarder, vedlikeholde eksisterende og fase ut foreldede standarder i takt med teknologisk utvikling.\n- **Semantisk (Høy vekt):** Harmonisering må sikre at nasjonale standarder er i samsvar med internasjonale standarder, slik at begreper, data og tjenester kan forstås på tvers.\n- **Teknisk (Høy vekt):** Standarder og spesifikasjoner må gjøre det mulig å bygge tekniske grensesnitt, formater og løsninger som fungerer sammen og kan gjenbrukes.\n\n### Bidrag til sammenhengende tjenester og felles økosystem\nStandardisering gjør det enklere å utvikle tjenester og løsninger som passer sammen på tvers av virksomheter, sektorer og landegrenser. Veiledning gjør standardene tilgjengelige og forståelige, slik at de enklere kan implementeres i tjenester og løsninger.\n\nKapabiliteten styrker det felles økosystemet ved å legge til rette for etterlevelse, slik at fellesløsninger og virksomheter faktisk tar i bruk vedtatte forvaltningsstandarder i anskaffelser og utviklingsløp. For sluttbrukeren betyr dette mer stabile, forutsigbare og sammenhengende tjenester, der digitale løsninger følger samme samhandlingsmønstre og lettere kan kobles sammen.","p":{},"f":["Strategy","Kapabiliteter i NA"]},"id-682d96a51e604ed2a00e1f4824023bab":{"id":"id-682d96a51e604ed2a00e1f4824023bab","t":"Capability","n":"Strategisk styring","d":"Evne til å sette retning for nasjonal arkitektur og realisere strategiske mål.\n\n### Begrunnelse (Hvorfor)\nDigitalisering på tvers av sektorer krever felles koordinering og en overordnet retning. Uten strategisk styring blir offentlige tiltak fragmenterte, silobaserte og suboptimalt koordinert. Denne hovedkapabiliteten fungerer som en felles paraply for finansiering, samordning og nasjonal arkitekturstyring. Den sikrer sterkere styring for å realisere nasjonale mål. Den løser problemet med at uavhengige virksomheter optimaliserer for seg selv fremfor tverrgående helhet.\n\n### Hva det innebærer (Omfang)\n- **Juridisk (Middels vekt):** Overordnede regulatoriske rammeverk, nasjonale digitaliseringsstrategier og føringer som forplikter aktører til samhandling.\n- **Organisatorisk (Svært høy vekt):** Etablering av overordnede nasjonale styringsmodeller (governance), samstyringsstrukturer, finansieringsordninger og tverrgående porteføljestyring.\n- **Semantisk (Middels vekt):** Harmonisering av strategiske mål, felles prinsipper og nasjonale referansemodeller for en omforent forståelse i økosystemet.\n- **Teknisk (Middels vekt):** Overordnet plattformstrategi og nasjonale veikart som sikrer en produktstrategisk retning for felles teknologisk infrastruktur.\n\n### Bidrag til sammenhengende tjenester og felles økosystem\nKapabiliteten samordner strategiske beslutninger og ressursbruk på tvers av uavhengige virksomheter og forvaltningsnivåer. Den sikrer at nasjonale fellesløsninger, standarder og investeringer trekker i samme retning. Dette gir det nødvendige mandatet for å utvikle og binde sammen digitale tjenestekjeder. For sluttbrukeren betyr dette en koordinert offentlig sektor som tilbyr en helhetlig og sømløs brukeropplevelse.","p":{},"f":["Strategy","Kapabiliteter i NA"]},"id-980043f78fa94eec8ecf46338a5b9c6b":{"id":"id-980043f78fa94eec8ecf46338a5b9c6b","t":"Capability","n":"Styringssystem","d":"Evne til å evaluere, forbedre, fornye styringssystem for informasjonssikkerhet.\n\n### Begrunnelse (Hvorfor)\nKapabiliteten sikrer at virksomheten systematisk vurderer hvordan det nåværende sikkerhetsstyringssystemet fungerer, identifiserer forbedringsområder og tilpasser eller oppdaterer systemet for å møte nye trusler, sårbarheter og endringer i virksomhetens behov eller omgivelser.\n\nDen løser behovet for kontinuerlig forbedring av informasjonssikkerheten, slik at sikkerhetstiltak ikke blir statiske, utdaterte eller utilstrekkelige i møte med endringer i risiko, teknologi, regelverk og tjenestekjeder.\n\n### Hva det innebærer (Omfang)\n- **Juridisk (Høy vekt):** Sikre at styringssystemet understøtter etterlevelse av krav til informasjonssikkerhet, personvern, internkontroll, risikostyring, dokumentasjon og ansvar.\n- **Organisatorisk (Svært høy vekt):** Gjennomføre regelmessige risikovurderinger, kontrollere om sikkerhetstiltak er effektive og implementere tiltak for å lukke identifiserte sikkerhetsgap.\n- **Semantisk (Middels vekt):** Sikre felles forståelse av risiko, trusler, sårbarheter, sikkerhetstiltak, avvik, kontrollmål og modenhetsnivå, slik at vurderinger og rapportering kan sammenlignes på tvers.\n- **Teknisk (Høy vekt):** Bruke verktøy og mekanismer for risikoregistrering, avvikshåndtering, kontrolloppfølging, måling av sikkerhetstilstand, dokumentasjon og overvåking av tekniske sikkerhetstiltak.\n\n### Bidrag til sammenhengende tjenester og felles økosystem\nEt velfungerende styringssystem for informasjonssikkerhet gir virksomheter bedre kontroll på risiko og sikkerhetstiltak når de inngår i felles tjenestekjeder. Når sikkerhet vurderes, forbedres og dokumenteres systematisk, blir det tryggere å dele data, bruke fellesløsninger og koble tjenester sammen på tvers av virksomheter.\n\nKapabiliteten styrker det felles økosystemet ved å øke tilliten til at aktørene håndterer informasjonssikkerhet på en strukturert og etterprøvbar måte. For sluttbrukeren betyr dette tryggere og mer stabile digitale tjenester, der informasjon beskyttes også når den flyter mellom flere aktører.","p":{},"f":["Strategy","Kapabiliteter i NA"]},"id-68ec332ee94c483e878a3a2ae903863f":{"id":"id-68ec332ee94c483e878a3a2ae903863f","t":"Capability","n":"Testdata","d":"Evne til å generere og tilgjengeliggjøre representative og personvernsikre datasett.\n\n### Begrunnelse (Hvorfor)\nKapabiliteten sikrer at virksomheter kan operere med datasett som speiler kompleksiteten og de statistiske egenskapene til reelle produksjonsdata, uten at dette medfører risiko for personvernet eller krav om omfattende sikkerhetsklareringer. Dette muliggjør effektiv systemutvikling, kvalitetssikring og innsiktsarbeid i lukkede miljøer.\n\nI en nasjonal sammenheng er kapabiliteten kritisk for å kunne drive tverrsektoriell tjenesteutvikling. Når ulike virksomheter skal samhandle, er tilgang på gode testdata ofte en stor flaskehals. Ved å mestre denne kapabiliteten kan man teste sammenhengende tjenester uten å utveksle faktiske data mellom systemer i testfasen.\n\n### Hva det innebærer (Omfang)\n- **Juridisk (Høy vekt):** Sikre at testdata kan brukes til analyse- og testformål uten å eksponere reelle personer eller virksomheter, og at anonymisering, pseudonymisering og maskering skjer i tråd med personvernregelverket.\n- **Organisatorisk (Høy vekt):** Etablere rutiner for å bestille, produsere, kvalitetssikre, tilgjengeliggjøre og forvalte representative testdatasett for utviklings-, test- og analysemiljøer.\n- **Semantisk (Høy vekt):** Sikre at testdata speiler relevante begreper, relasjoner, statistiske egenskaper og variasjon i reelle produksjonsdata, slik at tjenestekjeder kan testes på en meningsfull måte.\n- **Teknisk (Høy vekt):** Generere og tilgjengeliggjøre ulike typer test- og analysedata, for eksempel syntetiske data, anonymiserte data og pseudonymiserte eller maskerte data. Dette krever sikre testmiljøer, verktøy for datagenerering og mekanismer som hindrer kobling til virkelige personer eller virksomheter.\n\n### Bidrag til sammenhengende tjenester og felles økosystem\nTestdata gjør det mulig å utvikle, kvalitetssikre og teste sammenhengende tjenester på tvers av virksomheter uten å bruke faktiske produksjonsdata. Dette reduserer personvernrisiko, senker terskelen for samarbeid og gjør det enklere å teste informasjonsflyt, integrasjoner og tjenestekjeder før de settes i produksjon.\n\nKapabiliteten styrker det felles økosystemet ved å gi virksomheter et tryggere og mer effektivt grunnlag for felles utvikling, analyse og kvalitetssikring. Når representative og personvernsikre datasett er tilgjengelige, kan aktørene avdekke feil tidligere, teste samhandling mer realistisk og levere mer robuste tjenester til sluttbrukeren.","p":{},"f":["Strategy","Kapabiliteter i NA"]},"id-a8a1eb0181f04006ba7d3b5ab2fa9ca8":{"id":"id-a8a1eb0181f04006ba7d3b5ab2fa9ca8","t":"Capability","n":"Tilgangskontroll","d":"Evne til å kontrollere at en bruker har rettighet til å benytte angitt ressurs eller tjeneste på vegne av andre eller seg selv.\n\n### Begrunnelse (Hvorfor)\nTilgangskontroll er den operative og tekniske evnen til å verifisere og håndheve en brukers rettigheter i sanntid når de forsøker å utføre en handling. Kapabiliteten løser behovet for å sikre at bare brukere, representanter, virksomheter eller systemer med gyldig rettighet får benytte en angitt ressurs eller tjeneste.\n\nTilgangskontroll er den tekniske håndhevelsen av tilgangsstyringen. Tilgangsstyring er forutsetningen for god tilgangskontroll.\n\n### Hva det innebærer (Omfang)\n- **Juridisk (Høy vekt):** Håndheve rettigheter, fullmakter, roller og tilgangsgrunnlag i tråd med gjeldende regelverk, avtaler, behandlingsgrunnlag og krav til personvern og taushetsplikt.\n- **Organisatorisk (Høy vekt):** Etablere rutiner for tilgangsforespørsler, godkjenning, kontroll, revisjon og tilbakekalling av tilganger, samt avklare ansvar mellom tjenesteeier, ressursforvalter og tilgangsforvalter.\n- **Semantisk (Middels vekt):** Sikre felles forståelse av begreper som bruker, ressurs, tjeneste, rettighet, rolle, representasjon, delegasjon og kontekst.\n- **Teknisk (Svært høy vekt):** Verifisere og håndheve rettigheter i sanntid gjennom autorisasjonsmekanismer, policyregler, tokenvalidering, logging, sporbarhet og integrasjon med felles mekanismer for identitet, representasjon og tilgangsstyring.\n\n### Bidrag til sammenhengende tjenester og felles økosystem\nTilgangskontroll gjør det mulig å dele data og funksjonalitet på tvers uten å miste kontroll over hvem som kan gjøre hva. Når rettigheter håndheves konsekvent i sanntid, kan virksomheter tilby tjenester og API-er til andre aktører på en trygg og forutsigbar måte.\n\nKapabiliteten styrker sammenhengende tjenester ved å sikre at brukeren, representanten eller systemet får riktig tilgang i riktig kontekst, uavhengig av hvilken virksomhet som eier ressursen. For sluttbrukeren gir dette tryggere, mer sømløse tjenester der tilganger fungerer på tvers av tjenestekjeder uten unødvendige manuelle kontroller.","p":{},"f":["Strategy","Kapabiliteter i NA"]},"id-b440252bc3de42dea8468be54e54b1fa":{"id":"id-b440252bc3de42dea8468be54e54b1fa","t":"Capability","n":"Tilgangsstyring","d":"Evne til å styre og gi tilgang til hvem som har rettighet til å benytte en ressurs (tjeneste, system, API, opplysning) på vegne av seg selv, andre personer eller virksomheter.\n\n### Begrunnelse (Hvorfor)\nKapabiliteten omfatter hele livssyklusen til en rettighet. Den sikrer at personer, virksomheter og systemer får riktig tilgang til riktige ressurser, og at tilgangene kan defineres, delegeres, forvaltes, kontrolleres og trekkes tilbake.\n\nTilgangsstyring er autorisering. Den er forutsetningen for god tilgangskontroll og gjør det mulig å styre hvem som har rett til å benytte en ressurs, tjeneste, system, API eller opplysning på vegne av seg selv, andre personer eller virksomheter.\n\n### Hva det innebærer (Omfang)\n- **Juridisk (Høy vekt):** Sikre at rettigheter, roller, fullmakter, representasjon og tilgangsgrunnlag følger regelverk, avtaler, behandlingsgrunnlag og krav til personvern og taushetsplikt.\n- **Organisatorisk (Høy vekt):** Etablere prosesser for å definere roller, delegere tilgang, forvalte representasjon, opprettholde oversikt, revidere tilganger og trekke dem tilbake ved behov.\n- **Semantisk (Middels vekt):** Sikre felles forståelse av roller, rettigheter, delegasjon, representasjon, kontekst og tilgang til ressurser på individnivå, virksomhetsnivå og systemnivå.\n- **Teknisk (Svært høy vekt):** Omfatte styring og kontroll av tilganger basert på roller, rettigheter og kontekst, for eksempel om bruker opptrer som privatperson eller ansatt. Dette dekker også system-til-system-samhandling gjennom nasjonale fellesmekanismer for API-sikring og tokenforvaltning, for eksempel Maskinporten.\n\n### Bidrag til sammenhengende tjenester og felles økosystem\nTilgangsstyring gjør det mulig å dele data, tjenester og API-er på tvers av virksomheter uten å miste kontroll over hvem som har rett til hva. Når roller, rettigheter og representasjon kan styres på en felles og etterprøvbar måte, kan flere aktører samhandle tryggere i samme tjenestekjede.\n\nKapabiliteten styrker det felles økosystemet ved å gi felles mekanismer for autorisering på tvers av personer, virksomheter og systemer. For sluttbrukeren betyr dette at tjenester kan fungere sømløst på tvers av virksomheter, samtidig som tilganger er korrekte, sporbare og mulige å trekke tilbake.","p":{},"f":["Strategy","Kapabiliteter i NA"]},"id-d503cf06faa1417b8acd4b26a5c0741e":{"id":"id-d503cf06faa1417b8acd4b26a5c0741e","t":"Capability","n":"Digital tillit","d":"Evne til å tilby tillitstjenester som muliggjører autentisering og autorisasjon på tvers av tjenestekjeder, og støtte en distribuert arkitektur og føderering mellom ulike domener og tjeneste.\n\n### Begrunnelse (Hvorfor)\nKapabiliteten gir et felles tillitsgrunnlag for digital samhandling på tvers av virksomheter, domener og tjenestekjeder. Den fungerer som en strategisk paraply for identifisering, autentisering, tilgangsstyring, tilgangskontroll, representasjon, samtykke, signering, sporbarhet og innsyn.\n\nUten felles tillitstjenester må hver virksomhet etablere egne mekanismer for identitet, autorisasjon og sporbarhet. Det gir fragmenterte løsninger, svakere sikkerhet, lavere gjenbruk og mer krevende integrasjon mellom tjenester.\n\n### Hva det innebærer (Omfang)\n- **Juridisk (Høy vekt):** Overordnede rettslige rammer for eID, autorisasjon, representasjon, samtykke, signering, personvern og digitale tillitstjenester må sikre at samhandling kan skje lovlig og etterprøvbart.\n- **Organisatorisk (Høy vekt):** Felles forvaltningsmodeller, roller, ansvar og avtaler må sikre at tillitstjenester kan brukes og videreutvikles på tvers av virksomheter og sektorer.\n- **Semantisk (Middels vekt):** Felles begreper for identitet, rettighet, representasjon, samtykke, tillitsnivå, autentisering og autorisasjon må sikre lik forståelse i økosystemet.\n- **Teknisk (Svært høy vekt):** Fødererte tillitstjenester, felles autentiserings- og autorisasjonsmekanismer, tokenforvaltning, logging, signering og sporbarhet må gjøre det mulig å etablere tillit på tvers av distribuerte tjenester.\n\n### Bidrag til sammenhengende tjenester og felles økosystem\nTillit gjør det mulig å koble tjenester sammen på tvers av virksomheter uten at hver aktør må etablere egne løsninger for identitet, tilgang, representasjon og sporbarhet. Når tillitstjenester fungerer på tvers, kan brukere og systemer bevege seg tryggere gjennom en tjenestekjede der rettigheter, fullmakter og handlinger kan verifiseres.\n\nKapabiliteten styrker det felles økosystemet ved å gi felles mekanismer for sikker samhandling, juridisk etterprøvbarhet og teknisk føderering mellom domener. For sluttbrukeren betyr dette mer sømløse, sikre og tillitvekkende tjenester der offentlige og private aktører kan samhandle uten at brukeren må håndtere kompleksiteten bak.","p":{},"f":["Strategy","Kapabiliteter i NA"]},"id-379e167f7b9c4fbea9c6969425ba7f6c":{"id":"id-379e167f7b9c4fbea9c6969425ba7f6c","t":"Capability","n":"Tjenestedesign","d":"Evne til å sette brukerens behov, livssituasjon og helhetlige reise som utgangspunkt for utvikling av sammenhengende tjenester.\n\n### Begrunnelse (Hvorfor)\nDigitale tjenester utvikles ofte basert på den enkelte virksomhets interne struktur og systemer fremfor brukernes faktiske hverdag. Dette skaper fragmenterte opplevelser der brukeren selv må koordinere kontakten med ulike offentlige etater. Kapabiliteten løser problemet med digitalt utenforskap og silobaserte tjenester ved å sikre at innsikt om brukerens adferd og utfordringer styrer utviklingen.\n\n### Hva det innebærer (Omfang)\n- **Juridisk (Middels vekt):** Sikring av rettighetene til sårbare grupper i tråd med Likestillings- og diskrimineringsloven. Etterlevelse av forskrift om universell utforming av IKT-løsninger (WCAG-standarden) for å hindre diskriminering.\n- **Organisatorisk (Svært høy vekt):** Systematisk innhenting av brukerinnsikt for å kartlegge tverrsektorielle brukerreiser som dekker hele behovet fra start til slutt. Etablering av samarbeidsrutiner på tvers av forvaltningsnivåer for å fjerne manuelle steg i brukerreisen og motvirke digitalt utenforskap.\n- **Semantisk (Middels vekt):** Harmonisering av brukernes naturlige språk og terminologi med forvaltningens interne fagbegreper. Sikring av at tjenestebeskrivelser, skjemaer og veiledninger utformes slik at innholdet er umiddelbart forståelig for innbyggere og næringsliv.\n- **Teknisk (Ikke relevant):** Kapabiliteten handler om brukerinnsikt og design av tjenesteforløp, mens teknisk realisering ivaretas i andre kapabiliteter under Tjenesteutvikling.\n\n### Bidrag til sammenhengende tjenester og felles økosystem\nKapabiliteten gjør at komplekse prosesser bak fasaden skjules for brukeren, slik at opplevelsen fremstår som én uavbrutt og guidet reise. Ved å designe tjenester på tvers av organisatoriske grenser slipper innbyggeren å oppgi samme informasjon flere ganger eller strande i \"døde ender\". Sluttbrukeren opplever i stedet en helhetlig offentlig sektor som proaktivt støtter dem i deres gitte livssituasjon.","p":{},"f":["Strategy","Kapabiliteter i NA"]},"id-3f59d920995e4d488e56f61356dcf97a":{"id":"id-3f59d920995e4d488e56f61356dcf97a","t":"Capability","n":"Tjenesteforvaltning","d":"Evne til å forvalte tjenester som leveres i samhandling mellom flere virksomheter, med tydelig eierskap, avtalefestet ansvar og styring gjennom hele livsløpet.\n\n### Begrunnelse (Hvorfor)\nNår tjenester settes sammen av bidrag fra flere virksomheter, oppstår nye styrings- og forvaltningsutfordringer. Det må være klart hvem som eier tjenesten, hvem som har ansvar når noe feiler, og hvordan den kan endres eller fases ut uten at andre aktører rammes. Uten en slik evne har ingen ansvar for at tjenestekjeden fungerer fra ende til ende, selv om hver virksomhet forvalter sin egen del.\n\nKapabiliteten skiller seg fra Integrerbare tjenester, som dekker livssyklusen til enkelte API-er og byggeklosser, og fra Organisatorisk samhandling, som dekker arbeidsprosessene på tvers. Tjenesteforvaltning dekker eierskapet, avtalene og forvaltningen av tjenesten som helhet.\n\n### Hva det innebærer (Omfang)\n- **Juridisk (Høy vekt):** Inngåelse av formelle avtaler mellom virksomhetene, inkludert samforståelsesmemorandum, som sikrer rettslig forankring og gjensidig forpliktelse.\n- **Organisatorisk (Svært høy vekt):** Etablere eierskap, roller og ansvar for hele tjenestekjeden fra ende til ende, avtalefeste tjenestenivå (SLA), og ha rutiner for endring, versjonering, brukerstøtte, driftsvarsling og utfasing.\n- **Semantisk (Ikke relevant):** Kapabiliteten handler om eierskap, drift og livssyklus for tjenester, mens tjenestebeskrivelser ivaretas av Oversikt over tjenester.\n- **Teknisk (Middels vekt):** Operasjonalisering og oppfølging av tjenestenivåavtaler gjennom teknisk måling og felles monitorering av tjenestekjedene.\n\n### Bidrag til sammenhengende tjenester og felles økosystem\nKapabiliteten plasserer ansvaret for at tjenesten og tjenestekjeden fungerer fra ende til ende, gjennom hele livsløpet. Ved å avklare spilleregler, roller, ansvar og økonomi på forhånd unngår man at digitale samhandlingstiltak stopper opp i interne prioriteringer.\n\nFor sluttbrukeren betyr dette en mer stabil og forutsigbar leveranse, der offentlig og privat sektor kan fremstå som én samordnet aktør.","p":{},"f":["Strategy","Kapabiliteter i NA"]},"id-825b1ea1217b4eedb6caae165aeb8e41":{"id":"id-825b1ea1217b4eedb6caae165aeb8e41","t":"Capability","n":"Tjenestekjeder","d":"Evne til å dynamisk sette sammen, koordinere og automatisere flyten av informasjon og prosesser på tvers av uavhengige, integrerbare tjenester for å levere en komplett ende-til-ende-tjeneste for brukeren.\n\n### Begrunnelse (Hvorfor)\nSelv om enkeltvirksomheter tilbyr digitale tjenester med gode tekniske grensesnitt, mangler det ofte en tverrgående koordinering og automatisering av informasjonsflyten mellom dem. Dette fører til at prosesser stopper opp, krever manuelle overganger og hindrer sanntidsrespons. Underkapabiliteten løser det spesifikke funksjonelle problemet med rigide integrasjoner ved å muliggjøre en løst koblet, dynamisk og automatisert sammensetning av tjenester på tvers av uavhengige virksomheter.\n\n### Hva det innebærer (Omfang)\n- **Juridisk (Middels vekt):** Operasjonalisering av tverrgående samarbeidsavtaler og rettslige rammer sikrer lovlig automatisert informasjonsflyt mellom selvstendige tjenesteeiere.\n- **Organisatorisk (Svært høy vekt):** Avtalefesting av operasjonelt ansvar (SLA) og etablering av tverrgående arbeidsprosesser definerer stegene i tjenestekjeden.\n- **Semantisk (Høy vekt):** Anvendelse av spesifikke informasjonsmodeller og standardiserte dataformater sikrer korrekt tolking av data som utveksles mellom tjenestene.\n- **Teknisk (Svært høy vekt):** Implementering av tekniske grensesnitt (API-er) og hendelsesdrevet arkitektur kobler distribuerte løsninger sammen uten tette koblinger.\n\n### Bidrag til sammenhengende tjenester og felles økosystem\nKapabiliteten fungerer som selve motoren som knytter uavhengige og distribuerte applikasjoner sammen til en komplett ende-til-ende-tjeneste for brukeren. Ved å bruke hendelsesdrevet arkitektur kan systemene publisere og reagere på digitale hendelser i tilnærmet sanntid. Dette fjerner behovet for komplekse og sårbare punkt-til-punkt-integrasjoner, noe som skaper et langt mer fleksibelt, robust og skalerbart felles økosystem. For sluttbrukeren betyr dette en fullstendig automatisert opplevelse uten unødige forsinkelser eller manuelle avbrudd i den digitale reisen.","p":{},"f":["Strategy","Kapabiliteter i NA"]},"id-cd3b6a8989a448a2b4dfbf430a41bad4":{"id":"id-cd3b6a8989a448a2b4dfbf430a41bad4","t":"Capability","n":"Tjenesteutvikling","d":"Evne til å utvikle sammenhengende digitale tjenester.\n\n### Begrunnelse (Hvorfor)\nOffentlig og privat sektor må øke digitaliseringstakten for å løse felles samfunnsutfordringer og unngå fragmenterte løsninger. Denne hovedkapabiliteten eksisterer som en strategisk paraply for å styrke den felles prosess- og kompetanseevnen på tvers av økosystemet. Den løser problemet med silobasert og isolert systemutvikling ved å samordne innsatsen rundt helhetlig metodikk, design, koding og samarbeid.\n\n### Hva det innebærer (Omfang)\n- **Juridisk (Middels vekt):** Krav til personvern, universell utforming og innebygd regelverksetterlevelse må ivaretas tidlig i utviklingen av tjenester.\n- **Organisatorisk (Svært høy vekt):** Felles smidige metodikker, brukerorienterte designdrevne prosesser og tverrgående samarbeidsmodeller sikrer helhetlig produktutvikling.\n- **Semantisk (Middels vekt):** Nasjonale referansemodeller og omforent begrepsforståelse legges systematisk til grunn under modellering av nye tjenestegrensesnitt.\n- **Teknisk (Høy vekt):** Overordnede plattformstrategier for standardiserte byggeklosser, integrerbare API-er og felles kjøretidsmiljøer sikrer teknologisk samsvar.\n\n### Bidrag til sammenhengende tjenester og felles økosystem\nHovedkapabiliteten gir det strategiske fundamentet som kreves for at uavhengige virksomheter skal kunne bygge løsninger som fungerer sømløst sammen. Ved å harmonisere kompetansen innen design, koding og gjenbruk på et overordnet nivå, elimineres metodiske ulikheter før utviklingen starter. For sluttbrukeren betyr dette at nye tverrgående tjenestekjeder kan etableres raskere, slik at de oppleves helhetlig og uavbrutt.","p":{},"f":["Strategy","Kapabiliteter i NA"]},"id-08d657e690c046019dbf6d52b1ed4d63":{"id":"id-08d657e690c046019dbf6d52b1ed4d63","t":"Capability","n":"Ustrukturerte data","d":"Evne til å tilgjengeliggjøre og forvalte data som ikke er påført en forhåndsdefinert struktur.\n\n### Begrunnelse (Hvorfor)\nKapabiliteten gjør det mulig å lagre, organisere, finne, forstå og bruke data som ikke passer i tradisjonelle strukturer. Dette gjelder for eksempel fritekst-dokumenter, e-poster, bilder, lydopptak, video og råe loggfiler.\n\nUstrukturerte data er ofte i sin opprinnelige form. Kapabiliteten løser behovet for å gjøre slike data tilgjengelige og forvaltbare, slik at de kan brukes til innsikt, saksbehandling, automatisering, analyse og utvikling av mer sammenhengende tjenester.\n\n### Hva det innebærer (Omfang)\n- **Juridisk (Høy vekt):** Avklare behandlingsgrunnlag, lagringstid, tilgang, taushetsplikt, personvern og arkivkrav når ustrukturerte data inneholder personopplysninger, saksinformasjon eller annen beskyttet informasjon.\n- **Organisatorisk (Høy vekt):** Etablere rutiner for innsamling, klassifisering, kvalitetssikring, tilgangsstyring, bevaring, sletting og bruk av ustrukturerte data i arbeidsprosesser.\n- **Semantisk (Høy vekt):** Bruke metadata, klassifikasjoner, emneord, begreper og kontekstbeskrivelser som gjør ustrukturerte data finnbare, forståelige og gjenbrukbare.\n- **Teknisk (Høy vekt):** Tilby kapasitet til å lagre, indeksere, søke i og prosessere ustrukturerte data som fritekst-dokumenter, e-poster, bilder, lydopptak, video og råe loggfiler. Dette krever sikre lagringsløsninger, søketeknologi, tilgangskontroll og verktøy for analyse og maskinell behandling.\n\n### Bidrag til sammenhengende tjenester og felles økosystem\nUstrukturerte data gjør det mulig å utnytte informasjon som ellers ville blitt liggende utilgjengelig i dokumenter, e-poster, logger, bilder eller andre frie formater. Når slike data kan forvaltes, beskrives og brukes på en sikker og strukturert måte, får virksomhetene et rikere grunnlag for saksbehandling, analyse og tjenesteutvikling.\n\nKapabiliteten styrker sammenhengende tjenester ved å gjøre relevant informasjon lettere å finne og bruke på tvers av prosesser og virksomheter. For sluttbrukeren kan dette gi bedre veiledning, raskere behandling og mer helhetlig oppfølging. For det felles økosystemet gir det bedre kunnskapsutnyttelse og økt verdi fra data som tidligere var vanskelig å dele og gjenbruke.","p":{},"f":["Strategy","Kapabiliteter i NA"]},"id-0bfa29018e7144578b2184e70414b7e8":{"id":"id-0bfa29018e7144578b2184e70414b7e8","t":"Capability","n":"Utvikling og formidling av veiledning","d":"Evne til å utarbeide, kvalitetssikre og tilgjengeliggjøre veiledning.\n\n### Begrunnelse (Hvorfor)\nKapabiliteten sikrer at polit
