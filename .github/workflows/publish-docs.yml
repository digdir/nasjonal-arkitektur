name: Publish Documentation to GitHub Pages
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          pip install -r scripts/requirements.txt
          
      - name: Convert ArchiMate to YAML
        run: python scripts/convert_archimate_to_yaml.py "model/Nasjonal Arkitektur kapabilitetsmodell-2026-05-20.archimate" data/nasjonal-arkitektur.yaml
        
      - name: Generate Markdown Docs
        run: python scripts/generate_docs.py
        
      - name: Copy raw data files for download
        run: |
          cp data/nasjonal-arkitektur.yaml docs/
          cp "model/Nasjonal Arkitektur kapabilitetsmodell-2026-05-20.archimate" "docs/Nasjonal Arkitektur kapabilitetsmodell.archimate"
          
      - name: Configure Git Credentials
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
      - name: Deploy to GitHub Pages
        run: mkdocs gh-deploy --force
